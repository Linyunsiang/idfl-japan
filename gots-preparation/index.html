engagement in employment or dismissal therefrom.`,ja:"「家庭責任を有する労働者は、雇用に従事すること、または解雇されることに関する差別から保護される。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!36"},{id:"GOTS7-4.4.6.1",standard:"GOTS",version:"7.0",clause:"4.4.6.1",allClauses:["4.4.6.1","4.4.6.2","4.4.6.3"],crossRefs:["GRS4.0 B2.3.a"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"FREEDOM OF ASSOCIATION AND EFFECTIVE RECOGNITION OF THE RIGHT TO COLLECTIVE BARGAINING",ja:"結社の自由と団体交渉権の効果的な認識"},text:{en:"Workers have the right to join or form trade unions or workers’ associations of their own choosing and to bargain collectively, without prior authorization from Certified Organizations’ management. Certified Organizations shall not interfere with, obstruct or prevent such legitimate activities. Workers shall also have the right to join workers associations of their own choosing. Certified Organizations shall not interfere with, obstruct or prevent such legitimate activities nor create an atmosphere that is hostile to the formation of unions and workers’ association.",ja:"労働者は、自ら選択した労働組合や労働者団体に参加または結成し、事前の認可を受けることなく団体交渉を行う権利を有します。認証された組織は、そのような正当な活動に干渉したり、妨害したり、阻止してはなりません。労働者は、自ら選択した労働者団体に参加する権利も持っています。認証された組織は、そのような正当な活動に干渉したり、妨害したり、阻止してはならず、組合や労働者団体の結成に対して敵対的な雰囲気を作り出してはなりません。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!17"},{id:"GOTS7-4.4.6.4",standard:"GOTS",version:"7.0",clause:"4.4.6.4",allClauses:["4.4.6.4"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"FREEDOM OF ASSOCIATION AND EFFECTIVE RECOGNITION OF THE RIGHT TO COLLECTIVE BARGAINING",ja:"結社の自由と団体交渉権の効果的な認識"},text:{en:`The Certified Entity shall provide time and space to Workers and their representatives to
organise and engage in collective bargaining.`,ja:"被認証事業者は、労働者及びその代表者に対し、以下を行うための時間と場所を提供する ものとする。組織化し、団体交渉に従事する。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!18"},{id:"GOTS7-4.4.6.5",standard:"GOTS",version:"7.0",clause:"4.4.6.5",allClauses:["4.4.6.5","4.4.6.10"],crossRefs:["GRS4.0 B2.3b"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"FREEDOM OF ASSOCIATION AND EFFECTIVE RECOGNITION OF THE RIGHT TO COLLECTIVE BARGAINING",ja:"結社の自由と団体交渉権の効果的な認識"},text:{en:`Where the right to freedom of association and collective bargaining is restricted or prohibited under law, Certified Organizations shall not hinder alternative forms of independent and free workers representation and negotiation, in accordance with international labor standards.

If there is no trade union on site, the employer shall not deny time and resources for workers to elect representatives. Elected representatives shall have access to workers and employer’s representative on a regular basis.`,ja:`自由な結社の権利や団体交渉が法律により制限または禁止されている場合、認証された組織は、国際労働基準に従って、独立した自由な労働者の代表や交渉の代替形態を妨げてはなりません。

現場に労働組合がない場合、雇用者は労働者が代表者を選出するための時間と資源を提供することを拒否してはなりません。選出された代表者は、定期的に労働者および雇用者の代表者にアクセスする権利を有します。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!19"},{id:"GOTS7-4.4.6.6",standard:"GOTS",version:"7.0",clause:"4.4.6.6",allClauses:["4.4.6.6"],crossRefs:["GRS4.0 B2.3d"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"FREEDOM OF ASSOCIATION AND EFFECTIVE RECOGNITION OF THE RIGHT TO COLLECTIVE BARGAINING",ja:"結社の自由と団体交渉権の効果的な認識"},text:{en:`Certified Organizations shall give worker representatives access to the workplace in order to carry out their representative functions, in accordance with international labor standards.

Workers’ representatives have the right to carry out their representative functions free of any act prejudicial to
them or threat thereof, including dismissal, intimidation, discrimination, or reprisal. The Certified Entity shall not affect or threaten any such prejudicial act, including dismissal, intimidation, discrimination, harassment, or reprisal against Workers for their union membership or activities.`,ja:`認証された組織は、労働者の代表者がその代表機能を遂行できるよう、国際労働基準に従って職場へのアクセスを提供しなければなりません。

労働者の代表者は、解雇、威圧、差別、または報復を含む、いかなる不利益な行為やその脅威を受けることなく、その代表機能を自由に遂行する権利を有します。認証された組織は、労働者の組合への加入や活動に対して、解雇、威圧、差別、嫌がらせ、または報復を含む、不利益な行為を行ったり、脅したりしてはなりません。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!23"},{id:"GOTS7-4.4.6.7",standard:"GOTS",version:"7.0",clause:"4.4.6.7",allClauses:["4.4.6.7"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"FREEDOM OF ASSOCIATION AND EFFECTIVE RECOGNITION OF THE RIGHT TO COLLECTIVE BARGAINING",ja:"結社の自由と団体交渉権の効果的な認識"},text:{en:"Each category of employees can be represented by elected representative(s) of the corresponding category of employees.",ja:"各カテゴリーの従業員を代表するのは、該当するカテゴリーの従業員から選出された代表者である。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!22"},{id:"GOTS7-4.4.6.8",standard:"GOTS",version:"7.0",clause:"4.4.6.8",allClauses:["4.4.6.8"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"FREEDOM OF ASSOCIATION AND EFFECTIVE RECOGNITION OF THE RIGHT TO COLLECTIVE BARGAINING",ja:"結社の自由と団体交渉権の効果的な認識"},text:{en:"Collective bargaining agreements shall be respected.",ja:"労働協約は尊重されなければならない。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!20"},{id:"GOTS7-4.4.6.9",standard:"GOTS",version:"7.0",clause:"4.4.6.9",allClauses:["4.4.6.9"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"FREEDOM OF ASSOCIATION AND EFFECTIVE RECOGNITION OF THE RIGHT TO COLLECTIVE BARGAINING",ja:"結社の自由と団体交渉権の効果的な認識"},text:{en:`Certified Entity shall display (for example, on a notice board) and communicate (for example,
in employment contracts) about Workers’ right to freedom of association and collective
bargaining.`,ja:`「被認証事業者は、労働者の結社の自由及び労働協約の権利について、(例えば掲示板に)表示し、 (例えば雇用契約に)伝達しなければならない、
労働者の結社の自由および団体交渉の権利について、表示(掲示板など)および伝達(雇用契約書な ど)しなければならない。
について、表示(掲示板など)および伝達(雇用契約書など)しなければならない。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!21"},{id:"GOTS7-4.4.7.1",standard:"GOTS",version:"7.0",clause:"4.4.7.1",allClauses:["4.4.7.1","4.4.7.2","4.4.7.3"],crossRefs:["GRS4.0 B2.5a"],category:"ohs",topics:["ohs_related","employee_related","social_related"],track:"social",level:"Major (Ma)",section:{en:"HEALTH AND SAFETY / OHS",ja:"健康と安全 / OHS(労働安全衛生)"},text:{en:`Certified Organizations shall provide safe and clean conditions in all work and residential facilities and shall establish and follow a clear set of procedures regulating occupational health and safety. Emergency procedures shall be clearly displayed and understandable to all workers, and hazards shall be clearly marked.

Employers shall provide training and make safety signs available in the local language and the language(s) spoken by their workforce.

A safe and hygienic working environment shall be provided, bearing in mind the prevailing knowledge of the industry and of any specific hazards. Vulnerable individuals such as - but not limited to - young workers, new and expecting mothers and persons with disabilities, shall receive special protection.`,ja:`認証された組織は、すべての作業および居住施設において安全で清潔な環境を提供し、職業の健康と安全を規制する明確な手続きを確立し、遵守しなければなりません。緊急手続きは明確に表示され、すべての労働者に理解できるものでなければなりません。また、危険箇所は明確に表示される必要があります。

雇用者は、労働者が使用する言語および現地の言語で、安全標識を提供し、訓練を実施しなければなりません。

安全で衛生的な作業環境を提供し、業界の現状の知識および特定の危険を考慮しなければなりません。若年労働者、新入社員、妊娠中または授乳中の母親、障害者などの脆弱な個人には特別な保護が与えられるべきです。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:15,label:"GOTS管理システム/生産マニュアル",hint:""}],refDocs:["設備、建物点検記録 (例:消防設備点検結果報告書)","防火・避難訓練記録"],sourceRow:"SOCIAL EVAL（GOTS）!38"},{id:"GOTS7-4.4.7.4",standard:"GOTS",version:"7.0",clause:"4.4.7.4",allClauses:["4.4.7.4"],crossRefs:[],category:"ohs",topics:["ohs_related","employee_related","social_related"],track:"social",level:"Major (Ma)",section:{en:"HEALTH AND SAFETY / OHS",ja:"健康と安全 / OHS(労働安全衛生)"},text:{en:`The Certified Entity shall take appropriate steps and implement systems to prevent accidents,
injuries and illnesses associated with or occurring in the course of work by minimising, so far
as is reasonably practicable, the causes of hazards inherent in the working environment and
following the hierarchy of controls. The Certified Entity shall provide appropriate personal
protective equipment to the Workers (including Homeworkers) at no cost to such Workers,
and it shall assure that Workers use such equipment whenever necessary`,ja:"被認証事業者は、作業環境に内在する危険の原因を合理的に実行可能な限り最小化し、管理の階層に従うことで、業務に関連する、または業務中に発生する事故、傷害、疾病を防止するための適切な措置を講じ、システムを導入するものとする。被認証事業者は、適切な個人用保護具を労働者(ホームワーカーを含む)に無償で提供し、 必要な場合はいつでも労働者が当該保護具を使用することを保証するものとする。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:15,label:"GOTS管理システム/生産マニュアル",hint:""}],refDocs:["労働安全衛生管理規定","現地監査により確認"],sourceRow:"SOCIAL EVAL（GOTS）!39"},{id:"GOTS7-4.4.7.5",standard:"GOTS",version:"7.0",clause:"4.4.7.5",allClauses:["4.4.7.5"],crossRefs:["GRS4.0 B2.5c"],category:"ohs",topics:["ohs_related","employee_related","social_related"],track:"social",level:"Major (Ma)",section:{en:"HEALTH AND SAFETY / OHS",ja:"健康と安全 / OHS(労働安全衛生)"},text:{en:"Certified Organizations shall provide access to adequate medical assistance and facilities. This shall include appropriate first aid (trained staff, adequate equipment and supplies) provided on-site. Management shall have procedures in place to give workers access to medical assistance in case of emergency. Management shall respect national law on medical assistance and first aid. In case of a work-related accident the employer should be responsible to ensure that the worker gets medical assistance; this may mean insurance to cover potential costs.",ja:"認証された組織は、適切な医療支援および施設へのアクセスを提供しなければなりません。これには、現場で提供される適切な応急処置(訓練を受けたスタッフ、十分な設備と資材)が含まれます。経営陣は、緊急時に労働者が医療支援を受けられるよう手続きを整備しなければなりません。経営陣は、医療支援および応急処置に関する国内法を遵守しなければなりません。作業に関連する事故が発生した場合、雇用者は労働者が医療支援を受けられるように責任を負うべきです。これには、潜在的な費用をカバーする保険が含まれる場合があります。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:15,label:"GOTS管理システム/生産マニュアル",hint:""}],refDocs:["労働安全衛生管理規定","医療扶助 (救急箱、医務室、産業医)"],sourceRow:"SOCIAL EVAL（GOTS）!41"},{id:"GOTS7-4.4.7.6",standard:"GOTS",version:"7.0",clause:"4.4.7.6",allClauses:["4.4.7.6"],crossRefs:["GRS4.0 B2.5i"],category:"ohs",topics:["ohs_related","employee_related","social_related"],track:"social",level:"Major (Ma)",section:{en:"HEALTH AND SAFETY / OHS",ja:"健康と安全 / OHS(労働安全衛生)"},text:{en:`Certified Organizations shall undertake sufficient training of workers and management in waste management, handling and disposal of chemicals and other dangerous materials.

For all chemical substances and preparations used the corresponding Material Safety Data Sheet (SDS) shall be maintained and it shall be assured that the applicable health and safety measures for handling and storing these chemicals are implemented.`,ja:`認証された組織は、廃棄物管理、化学物質やその他の危険物の取り扱いおよび処分に関して、労働者および管理者に十分なトレーニングを実施しなければなりません。

使用されるすべての化学物質および調整剤について、対応する材料安全データシート(SDS)を保持し、これらの化学物質の取り扱いや保管に関する適用される健康および安全対策が実施されていることを確認しなければなりません。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["健康診断表"],sourceRow:"SOCIAL EVAL（GOTS）!46"},{id:"GOTS7-4.4.7.7",standard:"GOTS",version:"7.0",clause:"4.4.7.7",allClauses:["4.4.7.7"],crossRefs:[],category:"ohs",topics:["ohs_related","employee_related","social_related"],track:"social",level:"Major (Ma)",section:{en:"HEALTH AND SAFETY / OHS",ja:"健康と安全 / OHS(労働安全衛生)"},text:{en:"The Certified Entity shall take all appropriate measures within its sphere of influence to ensure the stability and safety of the equipment and buildings used, including accommodation to Workers, where provided, as well as protect against any foreseeable emergency. Workers shall be able to exit the premises in case of imminent danger without seeking permission.",ja:"被認証事業者は、その影響力の及ぶ範囲内において、使用する設備及び建物の安定性及び安 全性を確保するためのあらゆる適切な措置を講じるものとし、労働者への宿泊施設が提供され ている場合はその宿泊施設も含め、予見可能なあらゆる緊急事態から保護するものとする。労働者は、差し迫った危険がある場合、許可を求めることなく施設から退出できるものとする。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:15,label:"GOTS管理システム/生産マニュアル",hint:""}],refDocs:["避難訓練、防災訓練記録"],sourceRow:"SOCIAL EVAL（GOTS）!47"},{id:"GOTS7-4.4.7.8",standard:"GOTS",version:"7.0",clause:"4.4.7.8",allClauses:["4.4.7.8"],crossRefs:[],category:"ohs",topics:["ohs_related","employee_related","social_related"],track:"social",level:"Major (Ma)",section:{en:"HEALTH AND SAFETY / OHS",ja:"健康と安全 / OHS(労働安全衛生)"},text:{en:"The Certified Entity shall demonstrate compliance with local fire safety regulations, including the provision of required firefighting equipment.",ja:"被認証事業者は、必要な消防設備の設置を含め、地域の火災安全規制への準拠を証明するものとする。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:15,label:"GOTS管理システム/生産マニュアル",hint:""}],refDocs:["避難訓練、防災訓練記録"],sourceRow:"SOCIAL EVAL（GOTS）!48"},{id:"GOTS7-4.4.7.9",standard:"GOTS",version:"7.0",clause:"4.4.7.9",allClauses:["4.4.7.9"],crossRefs:[],category:"ohs",topics:["ohs_related","employee_related","social_related"],track:"social",level:"Major (Ma)",section:{en:"HEALTH AND SAFETY / OHS",ja:"健康と安全 / OHS(労働安全衛生)"},text:{en:"The Certified Entity shall make available unrestricted, thus unlocked and unobstructed, access to clearly marked emergency exits and escape routes. Certified Entity shall install and maintain functioning fire alarms on every floor or working area.",ja:"被認証事業者は、明確に表示された非常口および避難経路に、無制限、すなわち無施錠で妨げなくアクセス できるようにするものとする。被認証事業者は、各階または作業区域に機能する火災報知器を設置し、維持するものとする。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:15,label:"GOTS管理システム/生産マニュアル",hint:""}],refDocs:["避難訓練、防災訓練記録"],sourceRow:"SOCIAL EVAL（GOTS）!49"},{id:"GOTS7-4.4.7.10",standard:"GOTS",version:"7.0",clause:"4.4.7.10",allClauses:["4.4.7.10"],crossRefs:[],category:"ohs",topics:["ohs_related","employee_related","social_related"],track:"social",level:"Major (Ma)",section:{en:"HEALTH AND SAFETY / OHS",ja:"健康と安全 / OHS(労働安全衛生)"},text:{en:"The Certified Entity shall provide training and make safety signs available in the local language and the language(s) spoken by their workforce. The Certified Entity may additionally use pictograms for the safety signs. Workers shall be involved as per the lawdefined mechanisms in the discussions related to occupational health and safety",ja:"被認証事業者は、現地語および労働者が使用する言語で、研修を提供し、安全標識を利用できるようにするものとする。認証取得事業者は、安全標識にピクトグラムを使用することができる。労働者は、労働安全衛生に関する協議に、法律で規定された仕組みに従って参加するものとする。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:15,label:"GOTS管理システム/生産マニュアル",hint:""}],refDocs:["労働安全衛生管理規定"],sourceRow:"SOCIAL EVAL（GOTS）!50"},{id:"GOTS7-4.4.7.11",standard:"GOTS",version:"7.0",clause:"4.4.7.11",allClauses:["4.4.7.11"],crossRefs:["GRS4.0 B2.5g"],category:"ohs",topics:["ohs_related","employee_related","social_related"],track:"social",level:"Major (Ma)",section:{en:"HEALTH AND SAFETY / OHS",ja:"健康と安全 / OHS(労働安全衛生)"},text:{en:`Certified Organizations shall provide regular and recorded health and safety training to workers and management, and such training shall be repeated for all new or reassigned workers and management. Relevant training will depend on the operations and level of risk to health and safety.

Workers (including homeworkers) and staff shall receive regular and recorded health and safety training including fire prevention training and evacuation drills (as relevant), and such training shall be repeated for new or reassigned workers.`,ja:`認証された組織は、労働者および管理者に対して定期的で記録された健康および安全に関するトレーニングを提供し、新規または再配置された労働者および管理者にはそのトレーニングを繰り返し行わなければなりません。関連するトレーニングは、業務内容や健康および安全に対するリスクのレベルに応じて決定されます。

労働者(ホームワーカーを含む)およびスタッフは、定期的で記録された健康および安全に関するトレーニングを受ける必要があり、これには火災予防訓練や避難訓練(関連する場合)が含まれます。また、新規または再配置された労働者には、これらのトレーニングを繰り返し行う必要があります。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["現地監査により確認"],sourceRow:"SOCIAL EVAL（GOTS）!45"},{id:"GOTS7-4.4.7.12",standard:"GOTS",version:"7.0",clause:"4.4.7.12",allClauses:["4.4.7.12"],crossRefs:[],category:"ohs",topics:["ohs_related","employee_related","social_related"],track:"social",level:"Major (Ma)",section:{en:"HEALTH AND SAFETY / OHS",ja:"健康と安全 / OHS(労働安全衛生)"},text:{en:"If the facility employs homeworkers, it shall take effective actions to ensure that such homeworkers are given a level of protection equivalent to that given to the workers working at the facility.",ja:"施設が在宅ワーカーを雇用している場合、その在宅ワーカーに、施設で働く労働者と同等の保護レベルが与えられるよう、効果的な措置を講じなければならない。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:"雇用保険、労災保険などの加入確認"},{slot:15,label:"GOTS管理システム/生産マニュアル",hint:"避難訓練、防災訓練記録"}],refDocs:["雇用保険、労災保険などの加入確認","避難訓練、防災訓練記録"],sourceRow:"SOCIAL EVAL（GOTS）!51"},{id:"GOTS7-4.4.7.13",standard:"GOTS",version:"7.0",clause:"4.4.7.13",allClauses:["4.4.7.13"],crossRefs:["GRS4.0 B2.5d"],category:"ohs",topics:["ohs_related","employee_related","social_related"],track:"social",level:"Major (Ma)",section:{en:"HEALTH AND SAFETY / OHS",ja:"健康と安全 / OHS(労働安全衛生)"},text:{en:"Certified Organizations shall provide all workers with access to clean toilet facilities and to drinkable water and, if applicable, sanitary facilities for food preparation and storage.",ja:"認証された組織は、すべての労働者に清潔なトイレ施設、飲料水へのアクセスを提供し、必要に応じて食事の準備および保存のための衛生的な施設も提供しなければなりません。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["現地監査により確認"],sourceRow:"SOCIAL EVAL（GOTS）!42"},{id:"GOTS7-4.4.7.14",standard:"GOTS",version:"7.0",clause:"4.4.7.14",allClauses:["4.4.7.14"],crossRefs:["GRS4.0 B2.5e"],category:"ohs",topics:["ohs_related","employee_related","social_related"],track:"social",level:"Major (Ma)",section:{en:"HEALTH AND SAFETY / OHS",ja:"健康と安全 / OHS(労働安全衛生)"},text:{en:`Accommodation, where provided, shall be clean, safe, and meet the basic needs of the
Workers.`,ja:"提供される宿泊施設は、清潔で安全であり、労働者の基本的なニーズを満たすものでなければなりません。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["現地監査により確認"],sourceRow:"SOCIAL EVAL（GOTS）!43"},{id:"GOTS7-4.4.7.15",standard:"GOTS",version:"7.0",clause:"4.4.7.15",allClauses:["4.4.7.15"],crossRefs:["GRS4.0 B2.5f"],category:"ohs",topics:["ohs_related","employee_related","social_related"],track:"social",level:"Major (Ma)",section:{en:"HEALTH AND SAFETY / OHS",ja:"健康と安全 / OHS(労働安全衛生)"},text:{en:"Certified Organizations shall assign the responsibility for health and safety to a senior management representative",ja:"認証された組織は、健康と安全に対する責任を上級管理職の代表者に割り当てる必要があります。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["現地監査により確認"],sourceRow:"SOCIAL EVAL（GOTS）!44"},{id:"GOTS7-4.4.8.1",standard:"GOTS",version:"7.0",clause:"4.4.8.1",allClauses:["4.4.8.1"],crossRefs:["GRS4.0 B2.6d"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"WAGES, BENEFITS AND TERMS OF EMPLOYMENT",ja:"賃金、福利厚生および雇用条件"},text:{en:"All Workers shall be provided with written and understandable information about their employment conditions compliant with national legal requirements and including remuneration, wages and social benefits legally granted before they enter employment.",ja:"すべての労働者には、雇用条件に関する書面で理解可能な情報が提供されなければなりません。これは、国家の法的要件に準拠し、賃金、報酬、法的に付与される社会的福利厚生を含むものであり、雇用に入る前に提供される必要があります。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","打刻記録","給与明細"],sourceRow:"SOCIAL EVAL（GOTS）!58"},{id:"GOTS7-4.4.8.2",standard:"GOTS",version:"7.0",clause:"4.4.8.2",allClauses:["4.4.8.2"],crossRefs:["GRS4.0 B2.6a"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"WAGES, BENEFITS AND TERMS OF EMPLOYMENT",ja:"賃金、福利厚生および雇用条件"},text:{en:"Work performed shall be on the basis of a recognized employment relationship established in compliance with national legislation and practice and international labor standards; whichever affords the greater protection.",ja:"行われる作業は、国内の法律および慣行、ならびに国際労働基準に準拠した認められた雇用関係に基づかなければならず、どちらがより大きな保護を提供するかに従います。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","打刻記録","給与明細"],sourceRow:"SOCIAL EVAL（GOTS）!53"},{id:"GOTS7-4.4.8.3",standard:"GOTS",version:"7.0",clause:"4.4.8.3",allClauses:["4.4.8.3"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"WAGES, BENEFITS AND TERMS OF EMPLOYMENT",ja:"賃金、福利厚生および雇用条件"},text:{en:`For specified work paid at ‘piece rate’ (regardless of whether it is undertaken at the employer's Facility or at home), the rate of remuneration shall be comparable to that received by a Worker doing similar work on an hourly basis in the Facility of the Certified Entity. If
there is no such Worker, then the remuneration in another Facility in the same field of activity and region concerned can be used as a benchmark by the Certified Entity. Additionally, in any case, the wage of such piece rate Workers must not be less than national legal standards or negotiated wage or industry benchmark standards, whichever is higher.`,ja:`出来高払い」で支払われる特定業務(雇用主の施設または自宅のいずれで行われるかを問 わない)については、報酬率は、被認証事業体の施設において同様の業務を時間給ベースで 行っている労働者が受け取る報酬率と同等でなければならない。そのような労働者が
そのような労働者がいない場合は、当該活動分野および地域の他の施設における報酬を、被認証事業体によるベンチマークとして使用することができる。さらに、いかなる場合においても、当該出来高払賃金労働者の賃金は、国内法基準または 交渉賃金もしくは業界ベンチマーク基準のいずれか高い方を下回ってはならない。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","打刻記録(監査当日ピックアップ)","給与明細(監査当日ピックアップ)"],sourceRow:"SOCIAL EVAL（GOTS）!62"},{id:"GOTS7-4.4.8.4",standard:"GOTS",version:"7.0",clause:"4.4.8.4",allClauses:["4.4.8.4"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"WAGES, BENEFITS AND TERMS OF EMPLOYMENT",ja:"賃金、福利厚生および雇用条件"},text:{en:"Remuneration shall be paid regularly (at least monthly) and promptly. Workers shall be informed about the particulars of their remuneration for the pay period concerned each time that they are paid.",ja:"報酬は、定期的(少なくとも毎月)に、かつ速やかに支払われなければならない。労働者は、報酬が支払われる都度、当該給与期間の報酬の詳細について知らされていなければならない。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","打刻記録","給与明細"],sourceRow:"SOCIAL EVAL（GOTS）!54"},{id:"GOTS7-4.4.8.5",standard:"GOTS",version:"7.0",clause:"4.4.8.5",allClauses:["4.4.8.5"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"WAGES, BENEFITS AND TERMS OF EMPLOYMENT",ja:"賃金、福利厚生および雇用条件"},text:{en:`Workers shall receive remuneration directly in their hand/bank account or in a manner convenient to Workers. Wherever possible, efforts and priority must be given to digital payment. Any digital form of wages is permitted only under the conditions and to the extent
prescribed by law or fixed by collective bargaining agreements.`,ja:`「労働者は、手元/銀行口座に直接、または労働者にとって都合のよい方法で報酬を受け取ら なければならない。可能な限り、デジタル支払いに努力し、優先されなければならない。賃金のデジタル形式は、法律または労働協約で定められた条件と範囲でのみ許可される。
いかなるデジタル形式の賃金も、法律または団体協約で定められた条件と範囲内でのみ許可される。」`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!57"},{id:"GOTS7-4.4.8.6",standard:"GOTS",version:"7.0",clause:"4.4.8.6",allClauses:["4.4.8.6"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"WAGES, BENEFITS AND TERMS OF EMPLOYMENT",ja:"賃金、福利厚生および雇用条件"},text:{en:"Withholding of remuneration for payment as a lump sum at the end of a term of employment or training is prohibited.",ja:"雇用期間や研修が終わるまで、給与をまとめて支払うために給料を後回しにすることは禁止されています。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!56"},{id:"GOTS7-4.4.8.7",standard:"GOTS",version:"7.0",clause:"4.4.8.7",allClauses:["4.4.8.7"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"WAGES, BENEFITS AND TERMS OF EMPLOYMENT",ja:"賃金、福利厚生および雇用条件"},text:{en:`Any deductions from remuneration are permitted only under the conditions and to the extent prescribed by law or fixed by collective agreement, whichever affords greater protection. In case of deductions, Workers must have the relevant information regarding the grounds for
such deductions communicated to them in advance.`,ja:"「報酬からの控除は、法律または労働協約のいずれか保護が厚い方に規定された条件と範囲でのみ認めら れる。控除が行われる場合、労働者は、当該控除の根拠に関する関連情報を事前に通知されなければならない。」"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","打刻記録(監査当日ピックアップ)","給与明細(監査当日ピックアップ)","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!60"},{id:"GOTS7-4.4.8.8",standard:"GOTS",version:"7.0",clause:"4.4.8.8",allClauses:["4.4.8.8"],crossRefs:["GRS4.0 B2.6g"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"WAGES, BENEFITS AND TERMS OF EMPLOYMENT",ja:"賃金、福利厚生および雇用条件"},text:{en:`Certified Organizations shall always compensate all workers for all overtime at a premium rate, as required by law and, where applicable, by contractual agreement.

(GOTS) Premium rate shall not be less than one and one-quarter times the regular rate. Equivalent leisure time may also be provided as compensation for overtime, if permitted by local regulations.`,ja:`認証された組織は、すべての労働者に対して、法令および該当する場合には契約に基づき、すべての時間外労働に対してプレミアムレートで賃金を支払わなければなりません。
(GOTS) プレミアムレートは、通常のレートの1.25倍以上でなければなりません。現地の規則が許可する場合には、時間外労働に対する補償として相応の休暇時間を提供することもできます。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","打刻記録(監査当日ピックアップ)","給与明細(監査当日ピックアップ)"],sourceRow:"SOCIAL EVAL（GOTS）!61"},{id:"GOTS7-4.4.8.9",standard:"GOTS",version:"7.0",clause:"4.4.8.9",allClauses:["4.4.8.9"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"WAGES, BENEFITS AND TERMS OF EMPLOYMENT",ja:"賃金、福利厚生および雇用条件"},text:{en:"Certified Entities shall calculate 'Living Wages' for their respective operations. Furthermore, they shall compare Living Wages data with their remuneration data and calculate the 'Wage Gap' for their workers.",ja:"認証事業者は、それぞれの事業について「生活賃金」を計算しなければならない。さらに、生活賃金データと自社の報酬データを比較し、労働者の「賃金格差」を算出しなければならない。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","生活賃金の計算","打刻記録(監査当日ピックアップ)","給与明細(監査当日ピックアップ)"],sourceRow:"SOCIAL EVAL（GOTS）!63"},{id:"GOTS7-4.4.8.10",standard:"GOTS",version:"7.0",clause:"4.4.8.10",allClauses:["4.4.8.10"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"WAGES, BENEFITS AND TERMS OF EMPLOYMENT",ja:"賃金、福利厚生および雇用条件"},text:{en:"The Certified Entity shall develop a plan to cover the Wage Gap and pay the Living Wage to its Workers.",ja:"被認証事業体は、賃金格差をカバーし、労働者に生活賃金を支払う計画を策定しなければならな い。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","生活賃金の計算","打刻記録(監査当日ピックアップ)","給与明細(監査当日ピックアップ)"],sourceRow:"SOCIAL EVAL（GOTS）!64"},{id:"GOTS7-4.4.9.1",standard:"GOTS",version:"7.0",clause:"4.4.9.1",allClauses:["4.4.9.1"],crossRefs:["GRS4.0 B2.7a"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"WORKING HOURS",ja:"労働時間"},text:{en:`Certified Organizations shall set working hours that comply with national laws or benchmark industry standards or relevant international standards, whichever affords greater protection to ensure the health, safety and welfare of workers.

In any event and at a minimum, the working hours at the Certified Entity shall comply with ILO international framework including the general principles in this sub-section.`,ja:`認証された組織は、労働者の健康、安全、福祉を確保するために、国の法律、業界のベンチマーク基準、または関連する国際基準のいずれか、より大きな保護を提供する基準に準拠した労働時間を設定しなければなりません。

いずれにせよ、認証された組織の労働時間は、ILOの国際基準およびこのサブセクションの一般原則に準拠しなければなりません。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["打刻記録(監査当日ピックアップ)","有給休暇使用記録"],sourceRow:"SOCIAL EVAL（GOTS）!66"},{id:"GOTS7-4.4.9.2",standard:"GOTS",version:"7.0",clause:"4.4.9.2",allClauses:["4.4.9.2"],crossRefs:["GRS4.0 B2.7b"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"WORKING HOURS",ja:"労働時間"},text:{en:"Workers shall not be required to work in excess of 8 hours a day or 48 hours per week on a regular basis (excluding overtime), shall have the right to have rest breaks on every working day and shall be provided with at least 24 consecutive hours of rest within every 7-day period on average.",ja:"労働者は、通常、1日8時間または週48時間を超えて働くことを要求されず(残業を除く)、毎日の労働において休憩を取る権利を有し、平均して7日間の期間内に少なくとも24時間連続した休息を提供されなければなりません。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["打刻記録(監査当日ピックアップ)","有給休暇使用記録"],sourceRow:"SOCIAL EVAL（GOTS）!67"},{id:"GOTS7-4.4.9.3",standard:"GOTS",version:"7.0",clause:"4.4.9.3",allClauses:["4.4.9.3"],crossRefs:["GRS4.0 B2.7c"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"WORKING HOURS",ja:"労働時間"},text:{en:`Overtime shall be voluntary, shall not exceed 12 hours per week, shall not be demanded on a
regular basis and shall not represent a significantly higher likelihood of occupational hazards.`,ja:"残業は自発的であり、週に12時間を超えてはならず、通常の業務において要求されることはなく、職業上の危険が高まることはあってはなりません。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["打刻記録(監査当日ピックアップ)","有給休暇使用記録"],sourceRow:"SOCIAL EVAL（GOTS）!68"},{id:"GOTS7-4.4.10.1",standard:"GOTS",version:"7.0",clause:"4.4.10.1",allClauses:["4.4.10.1"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"NO PRECARIOUS EMPLOYMENT IS PROVIDED",ja:""},text:{en:"To every extent possible, work performed shall be on the basis of recognised employment relationships established through and in compliance with national law and practice, and international labour standards, whichever affords greater protection.",ja:"可能な限り、実施される労働は、国内法および慣行、ならびに国際労働基準のうち、より大きな保護を与える方を通じて確立され、遵守される、承認された雇用関係に基づいていなければならない。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["労働契約書"],sourceRow:"SOCIAL EVAL（GOTS）!70"},{id:"GOTS7-4.4.10.2",standard:"GOTS",version:"7.0",clause:"4.4.10.2",allClauses:["4.4.10.2"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"NO PRECARIOUS EMPLOYMENT IS PROVIDED",ja:""},text:{en:"Obligations to employees under labour or social security laws and regulations arising from the regular employment relationship shall not be avoided through the use of labour-only contracting, subcontracting, or home-working arrangements, nor through apprenticeship schemes where there is no real intent to impart skills or provide regular employment, nor through seasonality or contingency work when used to undermine workers’ protection. Nor shall any such obligations be avoided through the excessive use of fixed-term contracts of employment.",ja:"正規雇用関係から生じる労働法や社会保障法に基づく従業員への義務は、労働者のみの請負、下請け、在宅勤務の取り決め、技能の付与や正規雇用を提供する真の意図がない見習い制度、労働者の保護を損なうために利用される季節労働や臨時労働の利用によって回避してはならない。また、有期雇用契約を過度に使用することによっても、このような義務を回避してはならない。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["労働契約書"],sourceRow:"SOCIAL EVAL（GOTS）!71"},{id:"GOTS7-4.4.11.1",standard:"GOTS",version:"7.0",clause:"4.4.11.1",allClauses:["4.4.11.1"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"MIGRANT WORKERS",ja:""},text:{en:"Equality in treatment shall be provided to Migrant Workers as compared to local Workers who work at the Certified Entity’s Facilities. This includes remunerations, conditions of work and terms of employment and other provisions of GOTS Human Rights and Social Criteria.",ja:"移民労働者に対しては、認証事業者の施設で働く現地労働者と比較して平等な待遇を提供するも のとする。これには、報酬、労働条件、雇用条件、および GOTS 人権・社会的基準のその他の規定が含まれる。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["労働契約書","打刻記録(監査当日ピックアップ)","給与明細(監査当日ピックアップ)","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!73"},{id:"GOTS7-4.4.11.2",standard:"GOTS",version:"7.0",clause:"4.4.11.2",allClauses:["4.4.11.2"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"MIGRANT WORKERS",ja:""},text:{en:"The Certified Entity shall not deprive Migrant Workers access to their travel documents",ja:"被認証事業者は、移民労働者パスポートの代理管理することができません。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!74"},{id:"GOTS7-4.4.11.3",standard:"GOTS",version:"7.0",clause:"4.4.11.3",allClauses:["4.4.11.3"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"MIGRANT WORKERS",ja:""},text:{en:"Migrant Workers shall be provided with a written employment contract - in a language that the Worker understands- with clear information about the terms and conditions of employment including as applicable, duration and hours of employment, deductions, benefits (such as leave and insurance), housing, food, and transportation.",ja:"移民労働者は、該当する場合、雇用期間および時間、控除、手当(休暇および保険な ど)、住居、食事、交通手段など、雇用条件に関する明確な情報を記載した書面による雇用 契約書(労働者が理解できる言語で)を提供されなければならない。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!75"},{id:"GOTS7-4.4.11.4",standard:"GOTS",version:"7.0",clause:"4.4.11.4",allClauses:["4.4.11.4"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"MIGRANT WORKERS",ja:""},text:{en:"If food, accommodation, transportation, or other services are provided, they shall be provided at a rate not higher than the market rate.",ja:"食費、宿泊費、交通費、その他の役務が提供される場合、相場より高くない料金で提供されるものとする。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!76"},{id:"GOTS7-4.4.12.1",standard:"GOTS",version:"7.0",clause:"4.4.12.1",allClauses:["4.4.12.1"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"HOMEWORKERS",ja:""},text:{en:"The Certified Entity shall endeavour to ensure equality of treatment between Homeworkers and Workers working at the Facility, taking into account the special characteristics of homework and, where appropriate, conditions applicable to the same or a similar type of work carried out at the Certified Entity’s Facility.",ja:"被認証事業者は、ホームワークの特別な特徴、および適切な場合には、被認証事業者の施設 で実施される同一または類似の種類の業務に適用される条件を考慮して、ホームワーカーと施設 で働く労働者との間の待遇の平等を確保するよう努めるものとする。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["労働契約書","打刻記録(監査当日ピックアップ)","給与明細(監査当日ピックアップ)","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!78"},{id:"GOTS7-4.4.13.1",standard:"GOTS",version:"7.0",clause:"4.4.13.1",allClauses:["4.4.13.1"],crossRefs:[],category:"complaint",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"SOCIAL COMPLIANCE MANAGEMENT",ja:""},text:{en:`The Certified Entity shall ensure the foregoing criteria are not avoided or their purpose
defeated by way of informal employment modalities, including misuse of apprenticeship
schemes; seasonal work; subcontracting, or recruitment or employment agencies.`,ja:`「被認証事業者は、前述の基準が回避されたり、実習生制度の悪用を含む非正規雇用の方法によってその目的が達成されないようにしなければならない。
被認証事業者は、徒弟制度の悪用、季節労働、下請け、または人材紹介会社や雇用 代行会社を含む非正規雇用の方法によって、前述の基準が回避されたり、その目的が達成され
徒弟制度、季節労働、下請け、または人材紹介会社や職業紹介会社の悪用など、 非正規雇用の方法によって、前述の基準が回避されたり、目的が達成されないことを確 認しなければならない。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["労働契約書","打刻記録(監査当日ピックアップ)","給与明細(監査当日ピックアップ)","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!80"},{id:"GOTS7-4.4.13.2",standard:"GOTS",version:"7.0",clause:"4.4.13.2",allClauses:["4.4.13.2"],crossRefs:[],category:"complaint",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"SOCIAL COMPLIANCE MANAGEMENT",ja:""},text:{en:`The Certified Entity shall inform its Workers about the contents of their employment contract,
GOTS Human Rights and Social Criteria and any other related information provided by GOTS
in the applicable local language(s).`,ja:`「認証事業者は、労働者に雇用契約の内容を通知するものとする、
認証事業者は、労働者に雇用契約の内容、GOTS 人権・社会的基準及び GOTS が提供するその他の関連情報を、該当する現地語で通知するものとする。
が提供するその他の関連情報を、該当する現地言語で労働者に通知すること。」`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["労働契約書","打刻記録(監査当日ピックアップ)","給与明細(監査当日ピックアップ)","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!81"},{id:"GOTS7-4.4.13.3",standard:"GOTS",version:"7.0",clause:"4.4.13.3",allClauses:["4.4.13.3"],crossRefs:[],category:"complaint",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"SOCIAL COMPLIANCE MANAGEMENT",ja:""},text:{en:"Maintaining records of the name, age, working hours and the wages paid for each worker.",ja:"各労働者の氏名、年齢、労働時間、および支払われた賃金の記録を保持する。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["労働契約書","打刻記録(監査当日ピックアップ)","給与明細(監査当日ピックアップ)","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!82"},{id:"GOTS7-4.4.13.4",standard:"GOTS",version:"7.0",clause:"4.4.13.4",allClauses:["4.4.13.4"],crossRefs:[],category:"complaint",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"SOCIAL COMPLIANCE MANAGEMENT",ja:""},text:{en:`The Certified Entity shall allow Workers to nominate a representative for social accountability
that can provide feedback to the management regarding the implementation status of and
compliance with GOTS Human Rights and Social Criteria.`,ja:`「被認証事業者は、社会的説明責任に関する代表者の指名を労働者に認めなければならない。
GOTS人権・社会的基準の実施状況および遵守状況について、経営陣にフィードバックを提供することができる。
GOTS 人権・社会的基準の実施状況および遵守状況について、経営陣にフィードバックを提供することができる。」`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["内部通報制度","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!83"},{id:"GOTS7-4.4.13.5",standard:"GOTS",version:"7.0",clause:"4.4.13.5",allClauses:["4.4.13.5"],crossRefs:[],category:"complaint",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"SOCIAL COMPLIANCE MANAGEMENT",ja:""},text:{en:`The Certified Entity shall establish a functional and effective complaint mechanism in relation
to GOTS Human Rights and Social Criteria. The Certified Entity shall record and investigate
complaints from Workers or third parties related to the adherence to GOTS Human Rights
and Social Criteria and maintain records about any necessary corrective measures arising
from them.`,ja:`「認証事業者は、GOTS 人権・社会的基準に関する機能的かつ効果的な苦情処理体制を確立するものとする。
認証取得事業者は、GOTS 人権・社会的基準に関連して、機能的で効果的な苦情処理メカニズムを確立するものとする。認証取得事業者は、GOTS 人権及び社会的基準の遵守に関する労働者又は第三者からの苦情を記録し、調査するものとする。
認証事業者は、GOTS 人権・社会的基準の遵守に関連する労働者または第三者からの苦情を記録し、 調査するものとする。
認証事業者は、GOTS 人権・社会的基準の遵守に関連する労働者または第三者からの苦情を記録・調査し、それらに起因する必要な是正措置に関する記録を保持すること。
記録を保持すること。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["内部通報制度","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!84"},{id:"GOTS7-4.4.13.6",standard:"GOTS",version:"7.0",clause:"4.4.13.6",allClauses:["4.4.13.6"],crossRefs:[],category:"complaint",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"SOCIAL COMPLIANCE MANAGEMENT",ja:""},text:{en:`Upon request, Certified Entity shall provide information about complaint records to their
Certified Buyers should complaints possibly be related to the business practices of such

Under the scope of this section, Textile Personal Care Products are grouped as follows:

GROUP I:
Topical Productions: Cottonwool, sanitary towels, bandages, nappies, gauze cotton tissue (Gamgee), island dressings, wound strips, sticking plasters, gauze dressings etc. 

GROUP II
- Physically Invasive Products: Tampons, cotton buds, dental roll etc.
- Clinically Invasive Products: Surgical swabs, gauze swabs etc.

GOTS v7.0 6.1.1 Table 14 - Grouping of Textile Personal Care Products`,ja:`範囲
このセクションの範囲内で、テキスタイルパーソナルケア製品は以下のようにグループ化されます:

グループ I:
外用製品:コットンウール、生理用ナプキン、包帯、おむつ、ガーゼコットンティッシュ(ガンジー)、アイランドドレッシング、創傷ストリップ、絆創膏、ガーゼドレッシングなど。

グループ II
物理的侵入製品:タンポン、コットンバッド、デンタルロールなど。
臨床的侵入製品:手術用スワブ、ガーゼスワブなど。

a. All fibres used shall be Totally Chlorine Free (TCF).
b. Non-woven and absorbent materials shall be composed of 100% certified organic fibres.
c. Synthetic fibre components are not permitted for group II products unless the use of other
fibre materials is required to meet legal, medical regulations and does not exceed 5% of
the content (if labelled as organic) or 30% (if labelled as ‘made with x% organic
materials’).`,ja:`繊維材料の構成要素
a. 使用されるすべての繊維は、完全に塩素を含まない(TCF)ものでなければなりません。
b. 不織布および吸収性材料は、100%の認証済み有機繊維で構成されなければなりません。
c. 合成繊維の成分は、グループII製品においては、法律や医療規制を満たすために他の繊維材料の使用が必要な場合を除き、許可されません。この場合、含有量は有機とラベル付けされた場合は5%を超えず、「(x%)の有機材料を使用」とラベル付けされた場合は30%を超えてはなりません。`},companyTypes:["brand","knitting_sewing","spinning","trading"],conditionalFor:["brand","knitting_sewing","spinning","trading"],systemUpload:[{slot:9,label:"製品仕様の詳細 - IDFL監査人に要求に応じて記入する必要があります。",hint:""}],refDocs:["グループI製品該当の場合"],sourceRow:"GOTS v7.0 EVAL!140"},{id:"GOTS7-6.1.2.2",standard:"GOTS",version:"7.0",clause:"6.1.2.2",allClauses:["6.1.2.2"],crossRefs:[],category:"product",topics:["special_product_related"],track:"main",level:"Major (Ma)",section:{en:"6.1.2 SPECIFIC INPUT CRITERIA FOR MATERIAL AND INPUTS FOR GROUP I & GROUP II PRODUCTS",ja:"6.1.2 グループIおよびグループII製品のための材料および投入物に関する具体的要件"},text:{en:`Super Absorbing Polymers (SAPs)
a. SAPs shall be made from non-GMO renewable raw materials (ADM-type).
b. SAPs may as a maximum, contain 5% by weight of water-soluble extracts.`,ja:`スーパーロス吸収ポリマー(SAPs)
a. SAPは非GMOの再生可能原材料(ADMタイプ)から製造されなければなりません。
b. SAPには、最大で重量の5%の水溶性抽出物を含むことができます。`},companyTypes:["brand","farm","knitting_sewing","trading"],conditionalFor:["brand","farm","knitting_sewing","trading"],systemUpload:[],refDocs:["グループI製品該当の場合"],sourceRow:"GOTS v7.0 EVAL!141"},{id:"GOTS7-6.1.2.3",standard:"GOTS",version:"7.0",clause:"6.1.2.3",allClauses:["6.1.2.3"],crossRefs:[],category:"product",topics:["special_product_related"],track:"main",level:"Major (Ma)",section:{en:"6.1.2 SPECIFIC INPUT CRITERIA FOR MATERIAL AND INPUTS FOR GROUP I & GROUP II PRODUCTS",ja:"6.1.2 グループIおよびグループII製品のための材料および投入物に関する具体的要件"},text:{en:`Barrier Films
a. Except for wound contact layers, barrier films shall be composed of biodegradable

b. All raw materials used shall be non-GMO.`,ja:`透明バリアフィルム
a. 創傷接触層を除いて、透明バリアフィルムは生分解性ポリマーで構成されなければなりません。
b. 使用されるすべての原材料は非GMOでなければなりません。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],systemUpload:[],refDocs:["グループI製品該当の場合"],sourceRow:"GOTS v7.0 EVAL!142"},{id:"GOTS7-6.1.2.4",standard:"GOTS",version:"7.0",clause:"6.1.2.4",allClauses:["6.1.2.4"],crossRefs:[],category:"product",topics:["special_product_related"],track:"main",level:"Major (Ma)",section:{en:"6.1.2 SPECIFIC INPUT CRITERIA FOR MATERIAL AND INPUTS FOR GROUP I & GROUP II PRODUCTS",ja:"6.1.2 グループIおよびグループII製品のための材料および投入物に関する具体的要件"},text:{en:`Specific Criteria for Tampons
a. Only paper or cardboard tampon applicators are permitted. Additionally, applicator

fibres are allowed.`,ja:`タンポンに関する具体的基準
a. タンポンのアプリケーターには、紙または段ボール製のもののみが許可されます。さらに、アプリケーターの材料はセクション5.2.8の化学残留物の要件を満たさなければなりません。

サイシングは使用してはなりません。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],systemUpload:[{slot:9,label:"製品仕様の詳細 - IDFL監査人に要求に応じて記入する必要があります。",hint:""}],refDocs:["グループII製品該当の場合"],sourceRow:"GOTS v7.0 EVAL!145"},{id:"GOTS7-6.1.3.2",standard:"GOTS",version:"7.0",clause:"6.1.3.2",allClauses:["6.1.3.2"],crossRefs:[],category:"product",topics:["special_product_related"],track:"main",level:"Major (Ma)",section:{en:"6.1.3 SPECIFIC INPUT CRITERIA FOR GROUP II PRODUCTS",ja:"6.1.3 グループII製品のための具体的投入物基準"},text:{en:`Colourants
a. The use of colourants is allowed only if their use is required to meet a mandatory legal
regulation.
b. All used colourants shall be GOTS approved. Approved Certifiers may further grant
exceptions where a clear functional purpose exists (e.g. to identify wound dressing
orientation).`,ja:`着色剤

a. Optical brightening agents (OBAs) shall not be used.`,ja:`光学的漂白剤
a. 光学的漂白剤(OBAs)は使用してはなりません。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],systemUpload:[],refDocs:["グループII製品該当の場合"],sourceRow:"GOTS v7.0 EVAL!147"},{id:"GOTS7-6.1.3.4",standard:"GOTS",version:"7.0",clause:"6.1.3.4",allClauses:["6.1.3.4"],crossRefs:[],category:"product",topics:["special_product_related"],track:"main",level:"Major (Ma)",section:{en:"6.1.3 SPECIFIC INPUT CRITERIA FOR GROUP II PRODUCTS",ja:"6.1.3 グループII製品のための具体的投入物基準"},text:{en:`Fragrances, Lotions and Lubricants
a. Any fragrances, lotions and lubricants used shall comply – besides the Input criteria of
GOTS – also with the Input criteria of the COSMOS-Standard (Cosmetics Organic and
