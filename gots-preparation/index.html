ier.contracts":["record"],"purchasing.orders":["transaction","sampling"],"purchasing.invoices":["transaction","sampling"],"purchasing.receiving":["transaction","record","sampling"],"tc.incoming":["transaction","sampling"],"tc.reconciliation":["record","sampling"],"sales.invoices":["transaction","sampling"],"sales.delivery":["transaction","record","sampling"],"tc.outgoing":["transaction","sampling"],"tc.unsureGuide":["record"],"trace.exercise":["sampling","transaction"],"trace.lotControl":["record","site","sampling"],"inventory.records":["record","site","sampling"],"inventory.stocktake":["record"],"massbalance.sheet":["record","transaction","sampling"],"massbalance.reconciliation":["record","sampling"]};var de=[{id:"GOTS7-2.1.1",standard:"GOTS",version:"7.0",clause:"2.1.1",allClauses:["2.1.1"],crossRefs:[],category:"supplier",topics:["material_input","supplier_related"],track:"main",level:"Major (Ma)",section:{en:"2.1 Allowed Organic Fibres",ja:"2.1 許可される有機繊維"},text:{en:`Approved are natural fibres that are certified 'Organic' or 'Organic in-conversion' according to
any standard approved in the IFOAM Family of Standards for the relevant scope of the
production (crop or animal production). This includes Regulation (EU) 2018/848, USDA’s
National Organic Program (NOP), APEDA’s National Programme for Organic Production
(NPOP), China Organic Standard GB/T19630.`,ja:"承認されているのは、IFOAMファミリーの基準に従って「オーガニック」または「オーガニック・イン・コンバージョン」と認証された天然繊維です。これは、関連する生産の範囲(作物生産または畜産)に対する基準として、規則 (EU) 2018/848、USDAの全国有機プログラム (NOP)、APEDAの全国有機生産プログラム (NPOP)、中国有機標準GB/T19630を含みます。"},companyTypes:["farm"],conditionalFor:[],systemUpload:[{slot:2,label:"第三機関による製品の品質試験報告書",hint:"過去12ヶ月以内"}],refDocs:["(EU) 2018/848、","USDAの全国有機プログラム (NOP)、","APEDAの全国有機生産プログラム (NPOP)、","中国有機標準GB/T19630を含みます。"],sourceRow:"GOTS v7.0 EVAL!3"},{id:"GOTS7-2.1.2",standard:"GOTS",version:"7.0",clause:"2.1.2",allClauses:["2.1.2"],crossRefs:[],category:"supplier",topics:["material_input","supplier_related"],track:"main",level:"Major (Ma)",section:{en:"2.1 Allowed Organic Fibres",ja:"2.1 許可される有機繊維"},text:{en:`A recognised certifier that certifies organic fibre production shall have a valid and recognised
accreditation for the standard it certifies against. Recognised accreditations are ISO 17065
accreditation, NOP accreditation and IFOAM accreditation.`,ja:"有機繊維の生産を認証する認定機関は、認証する基準に対して有効で認められた認証を持っている必要があります。認められている認証には、ISO 17065の認証、NOPの認証、IFOAMの認証が含まれます。"},companyTypes:["farm"],conditionalFor:[],systemUpload:[],refDocs:[],sourceRow:"GOTS v7.0 EVAL!4"},{id:"GOTS7-2.1.3",standard:"GOTS",version:"7.0",clause:"2.1.3",allClauses:["2.1.3"],crossRefs:[],category:"supplier",topics:["material_input","supplier_related"],track:"main",level:"Major (Ma)",section:{en:"2.1 Allowed Organic Fibres",ja:"2.1 許可される有機繊維"},text:{en:`Certifying fibre products as 'Organic in-conversion' is only possible if the standard on which the certification of the fibre production is based permits such a certification for the fibre in question. The conversion status of fibres shall be stated as specified in Section 2.7 "GOTS Signs and Labelling Conditions"`,ja:"繊維製品を「オーガニック・イン・コンバージョン」と認証することは、繊維生産の認証が基づいている基準が対象となる繊維に対してそのような認証を許可している場合にのみ可能です。繊維の転換状況は、セクション2.7「GOTSの表示およびラベリング条件」に記載されたとおりに示すものとします。"},companyTypes:["farm"],conditionalFor:[],systemUpload:[],refDocs:[],sourceRow:"GOTS v7.0 EVAL!5"},{id:"GOTS7-2.1.4",standard:"GOTS",version:"7.0",clause:"2.1.4",allClauses:["2.1.4"],crossRefs:[],category:"supplier",topics:["material_input","supplier_related"],track:"main",level:"Major (Ma)",section:{en:"2.1 Allowed Organic Fibres",ja:"2.1 許可される有機繊維"},text:{en:"No fibres shall be used which originate from production projects with regard to which there is evidence of a persistent pattern of gross violations of the ILO core labour norms (as far as these are relevant for agriculture) and/or of animal welfare principles (i.e. Mulesing) or irrefutable evidence of a persistent pattern of land grabbing methods.",ja:"使用される繊維は、農業に関連するILOのコア労働基準の重大な違反が継続的に見られる生産プロジェクトや、動物福祉原則(例えば、ミュールジング)に関する重大な違反が継続的に見られるプロジェクト、または土地強奪手法の持続的なパターンに関する反証不可能な証拠があるプロジェクトからのものであってはなりません。"},companyTypes:["farm"],conditionalFor:[],systemUpload:[],refDocs:[],sourceRow:"GOTS v7.0 EVAL!6"},{id:"GOTS7-2.1.5",standard:"GOTS",version:"7.0",clause:"2.1.5",allClauses:["2.1.5"],crossRefs:[],category:"supplier",topics:["material_input","supplier_related"],track:"main",level:"Major (Ma)",section:{en:"2.1 Allowed Organic Fibres",ja:"2.1 許可される有機繊維"},text:{en:"The use of fibres, which originate from production projects located in high human rights risks areas, may require additional mitigation measures (for example, on-site social audits) to ensure that these production projects comply with GOTS Human Rights and Social Criteria.",ja:"人権リスクの高い地域に位置する生産プロジェクトからの繊維の使用は、これらの生産プロジェクトがGOTSの人権および社会基準に準拠していることを確保するために、追加の緩和措置(例えば、現地での社会監査)を必要とする場合があります。"},companyTypes:["farm"],conditionalFor:[],systemUpload:[],refDocs:[],sourceRow:"GOTS v7.0 EVAL!7"},{id:"GOTS7-2.5.1",standard:"GOTS",version:"7.0",clause:"2.5.1",allClauses:["2.5.1"],crossRefs:[],category:"management",topics:["management_system_related","traceability_related"],track:"main",level:"Major (Ma)",section:{en:"2.5 Record Keeping, Internal Quality Assurance",ja:"2.5 記録の保持、内部品質保証"},text:{en:`All operational procedures and practices shall be supported by effective documented control systems and records that enable to trace:
a. The origin, nature and quantities of organic and additional (raw) materials, Accessories as well as Inputs which have been received by the unit
b. The flow of goods within the unit (processing/manufacturing steps performed, recipes used and stock quantities)
c. Nature, quantities and consignees of GOTS Goods which have left the unit
d. Fibre composition of manufactured products
e. Any other information that may be required for proper inspection of the operation`,ja:`すべての運用手順および実務は、次の内容を追跡可能にする効果的な文書化された管理システムと記録によってサポートされなければなりません。 
a. ユニットが受け取った有機および追加(原材料)の材料、付属品、および投入物の出所、性質、数量 
b. ユニット内の物品の流れ(実施された処理/製造ステップ、使用されたレシピ、在庫数量) 
c. ユニットを出たGOTS商品に関する性質、数量、および宛先 
d. 製造された製品の繊維組成 
e. 操業の適切な検査に必要とされるその他の情報`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[{slot:15,label:"GOTS管理システム/生産マニュアル",hint:"GOTSの管理マニュアル"},{slot:4,label:"物質収支シート/ボリューム調整フォーム",hint:"マスバランスシート"}],refDocs:["GOTSの管理マニュアル"],sourceRow:"GOTS v7.0 EVAL!10"},{id:"GOTS7-2.5.2",standard:"GOTS",version:"7.0",clause:"2.5.2",allClauses:["2.5.2"],crossRefs:[],category:"management",topics:["management_system_related","traceability_related"],track:"main",level:"Major (Ma)",section:{en:"2.5 Record Keeping, Internal Quality Assurance",ja:"2.5 記録の保持、内部品質保証"},text:{en:"Records relevant to the audit shall be kept for at least five years.",ja:"監査に関連する記録は、少なくとも5年間保持しなければなりません。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル"],sourceRow:"GOTS v7.0 EVAL!11"},{id:"GOTS7-2.5.3",standard:"GOTS",version:"7.0",clause:"2.5.3",allClauses:["2.5.3"],crossRefs:[],category:"management",topics:["management_system_related","traceability_related"],track:"main",level:"Major (Ma)",section:{en:"2.5 Record Keeping, Internal Quality Assurance",ja:"2.5 記録の保持、内部品質保証"},text:{en:"Certified Entities purchasing unprocessed organic fibres shall receive and maintain scope certificates and transaction certificates (if applicable) from the originating producer, issued by a recognized certifier and certified in accordance with the criteria of Section 2.1 for the whole quantity purchased.",ja:"未加工の有機繊維を購入する認証された企業は、認定機関によって発行された出所生産者からの範囲証明書および取引証明書(該当する場合)を受け取り、保持する必要があります。これらは、購入した全数量に対して、セクション2.1の基準に従って認証されている必要があります。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル","マスバランスシート"],sourceRow:"GOTS v7.0 EVAL!12"},{id:"GOTS7-2.5.4",standard:"GOTS",version:"7.0",clause:"2.5.4",allClauses:["2.5.4"],crossRefs:[],category:"incoming_tc",topics:["incoming_tc_related","supplier_related","transaction_related"],track:"main",level:"Major (Ma)",section:{en:"2.5 Record Keeping, Internal Quality Assurance",ja:"2.5 記録の保持、内部品質保証"},text:{en:"Certified Entities purchasing GOTS Goods (intermediate and finished) shall receive and maintain GOTS Scope and Transaction Certificates, issued by an Approved Certifier for the whole quantity of GOTS Goods purchased, in accordance with the Policy for the Issuance of Scope Certificates and the Policy for the Issuance of Transaction Certificates",ja:"GOTS商品(中間製品および最終製品)を購入する認証された企業は、購入した全数量のGOTS商品に対して、承認された認定機関から発行されたGOTS範囲証明書および取引証明書を受け取り、保持する必要があります。これは、範囲証明書の発行に関するポリシーおよび取引証明書の発行に関するポリシーに従います。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[{slot:1,label:"GOTSの可能性のある材料/アクセサリーサプライヤのリスト",hint:""}],refDocs:["Incoming TC","サプライヤのSCライセンス"],sourceRow:"GOTS v7.0 EVAL!13"},{id:"GOTS7-2.5.5",standard:"GOTS",version:"7.0",clause:"2.5.5",allClauses:["2.5.5"],crossRefs:[],category:"internal_audit",topics:["risk_assessment_related"],track:"main",level:"Major (Ma)",section:{en:"2.5 Record Keeping, Internal Quality Assurance",ja:"2.5 記録の保持、内部品質保証"},text:{en:"Certified Entities shall have invoices, delivery notes, as well as copies of valid Letters of Approval at hand, listing all Preparations they are using in processing and manufacturing GOTS Goods as verification proof that all colourants and textile auxiliaries are used for GOTS Goods are approved.",ja:"認証された企業は、すべてのGOTS商品を処理および製造する際に使用しているすべての調整剤をリストした請求書、納品書、および有効な承認書のコピーを保管し、すべての着色剤およびテキスタイル補助剤がGOTS商品に使用されるために承認されていることを確認する証明として利用する必要があります。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[{slot:16,label:"GOTSリスク査定 -IDFLが提供するテンプレートを使用する必要があります",hint:""}],refDocs:["リスクアセスメント表","該当の場合、請求書、納品書、および有効な承認書"],sourceRow:"GOTS v7.0 EVAL!14"},{id:"GOTS7-2.5.6",standard:"GOTS",version:"7.0",clause:"2.5.6",allClauses:["2.5.6"],crossRefs:[],category:"mass_balance",topics:["mass_balance_related","traceability_related","transaction_related"],track:"main",level:"Major (Ma)",section:{en:"2.5 Record Keeping, Internal Quality Assurance",ja:"2.5 記録の保持、内部品質保証"},text:{en:`The consignee of any organic fibres and/or GOTS Goods shall check the integrity of the packaging or
container and verify the origin and nature of the certified products from the information contained in the product marking and corresponding documentation (e.g. invoice, bill of lading, lorry receipt, shipping bill, transaction certificate) upon receipt of the certified products.`,ja:"有機繊維および/またはGOTS商品を受け取った場合、受取人は包装またはコンテナの完全性を確認し、認証された製品の起源および性質を、製品の表示や関連文書(例:請求書、運送状、トラック受領書、出荷伝票、取引証明書)に含まれる情報から検証する必要があります。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[{slot:4,label:"物質収支シート/ボリューム調整フォーム",hint:""}],refDocs:["マスバランスシート","請求書、運送状、トラック受領書、出荷伝票、取引証明書など"],sourceRow:"GOTS v7.0 EVAL!15"},{id:"GOTS7-2.5.8",standard:"GOTS",version:"7.0",clause:"2.5.8",allClauses:["2.5.8"],crossRefs:[],category:"purchasing",topics:["transaction_related","purchasing_related"],track:"main",level:"Major (Ma)",section:{en:"2.5 Record Keeping, Internal Quality Assurance",ja:"2.5 記録の保持、内部品質保証"},text:{en:"Organic fibres and GOTS Goods shall clearly be identified as such on all corresponding invoices.",ja:"有機繊維およびGOTS商品は、すべての関連請求書において明確にその旨が識別されなければなりません。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[{slot:1,label:"GOTSの可能性のある材料/アクセサリーサプライヤのリスト",hint:""}],refDocs:["GOTS原料を購入した時の請求書、インボイス"],sourceRow:"GOTS v7.0 EVAL!16"},{id:"GOTS7-2.5.9",standard:"GOTS",version:"7.0",clause:"2.5.9",allClauses:["2.5.9"],crossRefs:[],category:"supplier",topics:["supplier_related"],track:"main",level:"Major (Ma)",section:{en:"2.5 Record Keeping, Internal Quality Assurance",ja:"2.5 記録の保持、内部品質保証"},text:{en:"The Certified Entity shall have a concluded contract with each Subcontractor stipulating the conditions of the relevant job work assigned and remains finally responsible for compliance with all criteria of GOTS.",ja:"認証された企業は、各下請け業者との間で、割り当てられた関連業務の条件を定めた契約を締結し、GOTSのすべての基準への遵守に最終的に責任を持ちます。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[{slot:1,label:"GOTSの可能性のある材料/アクセサリーサプライヤのリスト",hint:""}],refDocs:["サプライヤーとのGOTS契約書"],sourceRow:"GOTS v7.0 EVAL!17"},{id:"GOTS7-2.5.10",standard:"GOTS",version:"7.0",clause:"2.5.10",allClauses:["2.5.10"],crossRefs:[],category:"supplier",topics:["supplier_related"],track:"main",level:"Major (Ma)",section:{en:"2.5 Record Keeping, Internal Quality Assurance",ja:"2.5 記録の保持、内部品質保証"},text:{en:"Certified Entities shall collect, collate, and share non-commercial information related to impact measurement if and as required by GOTS.",ja:"認証された企業は、GOTSの要件に応じて、影響測定に関連する非商業的情報を収集、整理、共有する必要があります。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[{slot:1,label:"GOTSの可能性のある材料/アクセサリーサプライヤのリスト",hint:""}],refDocs:["サプライヤーとのGOTS契約書"],sourceRow:"GOTS v7.0 EVAL!18"},{id:"GOTS7-2.6.1.1",standard:"GOTS",version:"7.0",clause:"2.6.1.1",allClauses:["2.6.1.1"],crossRefs:[],category:"warehouse",topics:["warehouse_related","b2b_related","physical_handling_related"],track:"main",level:"Major (Ma)",section:{en:"2.6.1 B2B TRADE OF GOTS GOODS (PRE-RETAIL)",ja:"2.6.1 GOTS商品のB2B取引(小売前)"},text:{en:"Organic textile products shall be stored and transported in such a manner so as to prevent them from being contaminated by contact with prohibited Substances and commingling with conventional products or substitution of the contents.",ja:"有機繊維製品は、禁止物質との接触や従来製品との混合、内容物の置き換えを防ぐ方法で保管および輸送されなければなりません。"},companyTypes:["dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[{slot:15,label:"GOTS管理システム/生産マニュアル",hint:"GOTSの管理マニュアル"},{slot:4,label:"物質収支シート/ボリューム調整フォーム",hint:"請求書、運送状、トラック受領書、出荷伝票、取引証明書など"}],refDocs:["GOTSの管理マニュアル"],sourceRow:"GOTS v7.0 EVAL!22"},{id:"GOTS7-2.6.1.2",standard:"GOTS",version:"7.0",clause:"2.6.1.2",allClauses:["2.6.1.2"],crossRefs:[],category:"warehouse",topics:["warehouse_related","b2b_related","physical_handling_related"],track:"main",level:"Major (Ma)",section:{en:"2.6.1 B2B TRADE OF GOTS GOODS (PRE-RETAIL)",ja:"2.6.1 GOTS商品のB2B取引(小売前)"},text:{en:"Certified Entities shall establish a system of segregation to prevent organic fibres from being commingled or substituted with conventional fibres",ja:"認証された企業は、有機繊維が従来の繊維と混合されたり置き換えられたりしないように、分別システムを確立する必要があります。"},companyTypes:["dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル"],sourceRow:"GOTS v7.0 EVAL!23"},{id:"GOTS7-2.6.1.3",standard:"GOTS",version:"7.0",clause:"2.6.1.3",allClauses:["2.6.1.3"],crossRefs:[],category:"warehouse",topics:["warehouse_related","b2b_related","physical_handling_related"],track:"main",level:"Major (Ma)",section:{en:"2.6.1 B2B TRADE OF GOTS GOODS (PRE-RETAIL)",ja:"2.6.1 GOTS商品のB2B取引(小売前)"},text:{en:"All organic raw materials and GOTS Goods shall be clearly labelled and identified as such along the entire stages of the supply chain.",ja:"すべての有機原材料およびGOTS商品は、サプライチェーンの各段階で明確にラベル付けされ、識別される必要があります。"},companyTypes:["dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル"],sourceRow:"GOTS v7.0 EVAL!24"},{id:"GOTS7-2.6.1.4",standard:"GOTS",version:"7.0",clause:"2.6.1.4",allClauses:["2.6.1.4"],crossRefs:[],category:"warehouse",topics:["warehouse_related","b2b_related","physical_handling_related"],track:"main",level:"Major (Ma)",section:{en:"2.6.1 B2B TRADE OF GOTS GOODS (PRE-RETAIL)",ja:"2.6.1 GOTS商品のB2B取引(小売前)"},text:{en:"Transportation means and shipping documents shall be documented.",ja:"輸送手段および運送書類は記録されなければなりません。"},companyTypes:["dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル","請求書、運送状、トラック受領書、出荷伝票、取引証明書など"],sourceRow:"GOTS v7.0 EVAL!25"},{id:"GOTS7-2.6.1.5",standard:"GOTS",version:"7.0",clause:"2.6.1.5",allClauses:["2.6.1.5"],crossRefs:[],category:"warehouse",topics:["warehouse_related","b2b_related","physical_handling_related"],track:"main",level:"Major (Ma)",section:{en:"2.6.1 B2B TRADE OF GOTS GOODS (PRE-RETAIL)",ja:"2.6.1 GOTS商品のB2B取引(小売前)"},text:{en:"In cases where pesticides/biocides are mandated for use due to national or regional rules or law, they may be used in storerooms / transport, but they shall comply with the applicable international or national organic production standard. Wooden pallets used in storage and transport activities are exempt from this requirement.",ja:"国家または地域の規則や法律により農薬/殺虫剤の使用が義務付けられている場合、保管室や輸送で使用することができますが、適用される国際的または国内の有機生産基準に準拠している必要があります。保管および輸送活動に使用される木製パレットは、この要件の対象外となります。"},companyTypes:["dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル"],sourceRow:"GOTS v7.0 EVAL!26"},{id:"GOTS7-2.6.1.6",standard:"GOTS",version:"7.0",clause:"2.6.1.6",allClauses:["2.6.1.6"],crossRefs:[],category:"warehouse",topics:["warehouse_related","b2b_related","physical_handling_related"],track:"main",level:"Major (Ma)",section:{en:"2.6.1 B2B TRADE OF GOTS GOODS (PRE-RETAIL)",ja:"2.6.1 GOTS商品のB2B取引(小売前)"},text:{en:"The use of plastic packaging materials should be minimised. Synthetic packaging material shall not contain chlorinated plastics (e.g. PVC).",ja:"プラスチック包装材料の使用は最小限に抑えるべきです。合成包装材料には、塩素系プラスチック(例:PVC)を含めてはいけません。"},companyTypes:["dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル"],sourceRow:"GOTS v7.0 EVAL!27"},{id:"GOTS7-2.6.2.1",standard:"GOTS",version:"7.0",clause:"2.6.2.1",allClauses:["2.6.2.1"],crossRefs:[],category:"warehouse",topics:["warehouse_related","b2c_related","final_product_related","physical_handling_related"],track:"main",level:"Major (Ma)",section:{en:"2.6.2 B2C TRADE OF GOTS GOODS (RETAIL)",ja:"2.6.2 GOTS商品のB2C取引(小売)"},text:{en:"Final GOTS Goods with complete GOTS labelling can be stored and transported together with conventional products of similar type with positive assurance that there can be no substitution of products",ja:"最終的なGOTS商品で完全にGOTSラベリングされたものは、同様の種類の従来製品と一緒に保管および輸送することができ、製品の置き換えがないことが確実である必要があります。"},companyTypes:["brand"],conditionalFor:[],systemUpload:[{slot:15,label:"GOTS管理システム/生産マニュアル",hint:"GOTSの管理マニュアル"},{slot:17,label:"GOTS材料/製品のプロセスと保管区域のマップ/図面レイアウト",hint:"平面図"},{slot:1,label:"GOTSの可能性のある材料/アクセサリーサプライヤのリスト",hint:"契約書と宣言書"}],refDocs:["GOTSの管理マニュアル","契約書","平面図"],sourceRow:"GOTS v7.0 EVAL!29"},{id:"GOTS7-2.6.2.2",standard:"GOTS",version:"7.0",clause:"2.6.2.2",allClauses:["2.6.2.2"],crossRefs:[],category:"warehouse",topics:["warehouse_related","b2c_related","final_product_related","physical_handling_related"],track:"main",level:"Major (Ma)",section:{en:"2.6.2 B2C TRADE OF GOTS GOODS (RETAIL)",ja:"2.6.2 GOTS商品のB2C取引(小売)"},text:{en:`Single use of virgin plastic hangers is prohibited in retail packaging of GOTS Goods. Recycled plastic
hangers may be used.`,ja:"GOTS商品の小売包装においては、一度限りのバージンプラスチックハンガーの使用は禁止されています。リサイクルプラスチックハンガーは使用可能です。"},companyTypes:["brand"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル","契約書と宣言書"],sourceRow:"GOTS v7.0 EVAL!30"},{id:"GOTS7-2.6.2.3",standard:"GOTS",version:"7.0",clause:"2.6.2.3",allClauses:["2.6.2.3"],crossRefs:[],category:"warehouse",topics:["warehouse_related","b2c_related","final_product_related","physical_handling_related"],track:"main",level:"Major (Ma)",section:{en:"2.6.2 B2C TRADE OF GOTS GOODS (RETAIL)",ja:"2.6.2 GOTS商品のB2C取引(小売)"},text:{en:"The use of plastic packaging materials should be minimised. Synthetic packaging material shall not contain chlorinated plastics (e.g. PVC).",ja:"プラスチック包装材料の使用は最小限に抑えるべきです。合成包装材料には塩素系プラスチック(例:PVC)を含めてはいけません。"},companyTypes:["brand"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル","契約書と宣言書"],sourceRow:"GOTS v7.0 EVAL!31"},{id:"GOTS7-2.6.2.4",standard:"GOTS",version:"7.0",clause:"2.6.2.4",allClauses:["2.6.2.4"],crossRefs:[],category:"warehouse",topics:["warehouse_related","b2c_related","final_product_related","physical_handling_related"],track:"main",level:"Major (Ma)",section:{en:"2.6.2 B2C TRADE OF GOTS GOODS (RETAIL)",ja:"2.6.2 GOTS商品のB2C取引(小売)"},text:{en:"Bioplastic packaging produced from non-GMO biomass sources and certified/tested to be non-toxic, and biodegradable or home/industrially compostable can be used.",ja:"非GMOバイオマス源から製造され、無毒であることが認証・試験された生分解性または家庭/工業用堆肥化可能なバイオプラスチック包装を使用することができます。"},companyTypes:["brand"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル","契約書と宣言書"],sourceRow:"GOTS v7.0 EVAL!32"},{id:"GOTS7-2.6.2.5",standard:"GOTS",version:"7.0",clause:"2.6.2.5",allClauses:["2.6.2.5"],crossRefs:[],category:"warehouse",topics:["warehouse_related","b2c_related","final_product_related","physical_handling_related"],track:"main",level:"Major (Ma)",section:{en:"2.6.2 B2C TRADE OF GOTS GOODS (RETAIL)",ja:"2.6.2 GOTS商品のB2C取引(小売)"},text:{en:"Paper or cardboard used in packaging material for the retail trade of GOTS Goods (incl. labelling items such as hangtags) shall be recycled from pre- or post- consumer waste or certified according to a program that verifies compliance with sustainable forestry management principles",ja:"GOTS商品の小売業向け包装材料(ハングタグなどのラベリングアイテムを含む)に使用される紙または段ボールは、消費者の使用前または使用後の廃棄物からリサイクルされたものであるか、持続可能な森林管理の原則に準拠していることを検証するプログラムに基づいて認証されている必要があります。"},companyTypes:["brand"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル","契約書と宣言書"],sourceRow:"GOTS v7.0 EVAL!33"},{id:"GOTS7-2.6.2.6",standard:"GOTS",version:"7.0",clause:"2.6.2.6",allClauses:["2.6.2.6"],crossRefs:[],category:"warehouse",topics:["warehouse_related","b2c_related","final_product_related","physical_handling_related"],track:"main",level:"Major (Ma)",section:{en:"2.6.2 B2C TRADE OF GOTS GOODS (RETAIL)",ja:"2.6.2 GOTS商品のB2C取引(小売)"},text:{en:`Textile fibre materials used for packaging or for strings of hangtags shall meet one of the
following criteria:
a. Certified organic, see Section 2.1 and residue limit values in Section 5.2.7 or
b. Certified Organic in-conversion, see Section 2.1 and residue limit value in Section 5.2.7
c. Accepted additional fibres, see Section 3.2 (without limitation on fibre percentages), and
shall meet the residue limit values in Section 5.2.8.`,ja:`包装やハングタグの紐に使用される繊維材料は、以下のいずれかの基準を満たす必要があります。
a. 認証を受けた有機繊維(セクション2.1およびセクション5.2.7の残留限度値を参照)
b. 認証を受けた有機転換中の繊維(セクション2.1およびセクション5.2.7の残留限度値を参照)
c. 受け入れ可能な追加繊維(セクション3.2参照、繊維割合に制限なし)で、
セクション5.2.8の残留限度値を満たす必要があります。`},companyTypes:["brand"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル","契約書と宣言書"],sourceRow:"GOTS v7.0 EVAL!34"},{id:"GOTS7-2.7.2",standard:"GOTS",version:"7.0",clause:"2.7.2",allClauses:["2.7.2"],crossRefs:[],category:"labelling",topics:["label_related","brand_related"],track:"main",level:"Major (Ma)",section:{en:"2.7 GOTS Signs and Labelling Conditions",ja:"2.7 GOTSの表示およびラベリング条件"},text:{en:`Labelling products as 'Organic in-conversion' is only possible if the organic standard, on which the
certification of the fibre production is based, permits such labelling for the fibre in question.`,ja:"「オーガニック・イン・コンバージョン」として製品にラベルを貼ることは、該当する繊維の認証に基づく有機標準がそのようなラベルを許可している場合にのみ可能です。"},companyTypes:["brand"],conditionalFor:[],systemUpload:[{slot:15,label:"GOTS管理システム/生産マニュアル",hint:"GOTSの管理マニュアル、ラベルデザイン、ロゴ申請書"},{slot:1,label:"GOTSの可能性のある材料/アクセサリーサプライヤのリスト",hint:"Incoming TC"}],refDocs:["GOTSの管理マニュアル,ラベルデザイン","ロゴ申請書、Incoming TC"],sourceRow:"GOTS v7.0 EVAL!37"},{id:"GOTS7-2.7.3",standard:"GOTS",version:"7.0",clause:"2.7.3",allClauses:["2.7.3"],crossRefs:[],category:"labelling",topics:["label_related","brand_related"],track:"main",level:"Major (Ma)",section:{en:"2.7 GOTS Signs and Labelling Conditions",ja:"2.7 GOTSの表示およびラベリング条件"},text:{en:"Only textile goods (finished or intermediate) produced in compliance with GOTS by a Certified Entity and certified by an Approved Certifier may be labelled, represented, advertised, or sold as GOTS Goods.",ja:"認証された企業によってGOTSに準拠して製造され、承認された認定機関によって認証されたテキスタイル製品(完成品または中間製品)のみが、GOTS商品としてラベル付け、表現、広告、販売されることができます。"},companyTypes:["brand"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル,ラベルデザイン","ロゴ申請書、Incoming TC"],sourceRow:"GOTS v7.0 EVAL!38"},{id:"GOTS7-2.7.4",standard:"GOTS",version:"7.0",clause:"2.7.4",allClauses:["2.7.4"],crossRefs:[],category:"labelling",topics:["label_related","brand_related"],track:"main",level:"Major (Ma)",section:{en:"2.7 GOTS Signs and Labelling Conditions",ja:"2.7 GOTSの表示およびラベリング条件"},text:{en:`Application of GOTS Signs shall always contain the following specifications:
a. One of the following two label grades:
- "organic" or "Organic in-conversion"
- "made with (x%) organic materials" or "made with (x%) Organic in-conversion
materials"
b. The GOTS Logo
c. A reference to the Approved Certifier who certified the GOTS Goods
d. The license number of the Certified Entity`,ja:`GOTSの表示の適用には、常に以下の仕様が含まれる必要があります:
a. 次の2つのラベルグレードのいずれか:
-「オーガニック」または「オーガニック・イン・コンバージョン」
-「(x%)の有機材料を使用」または「(x%)の有機転換材料を使用」
b. GOTSロゴ
c. GOTS商品を認証した承認された認定機関への参照
d. 認証された企業のライセンス番号`},companyTypes:["brand"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル,ラベルデザイン","ロゴ申請書、Incoming TC"],sourceRow:"GOTS v7.0 EVAL!39"},{id:"GOTS7-2.7.5",standard:"GOTS",version:"7.0",clause:"2.7.5",allClauses:["2.7.5"],crossRefs:[],category:"labelling",topics:["label_related","brand_related"],track:"main",level:"Major (Ma)",section:{en:"2.7 GOTS Signs and Labelling Conditions",ja:"2.7 GOTSの表示およびラベリング条件"},text:{en:'"Organic" or "Organic in-conversion" label grades shall be no less than 95% (≥95%) of the fibre content of the products (excluding Accessories).',ja:"「オーガニック」または「オーガニック・イン・コンバージョン」のラベルグレードは、製品の繊維含量の95%以上(≥95%)でなければなりません(付属品は除く)。"},companyTypes:["brand"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル,ラベルデザイン","ロゴ申請書、Incoming TC"],sourceRow:"GOTS v7.0 EVAL!40"},{id:"GOTS7-2.7.6",standard:"GOTS",version:"7.0",clause:"2.7.6",allClauses:["2.7.6"],crossRefs:[],category:"labelling",topics:["label_related","brand_related"],track:"main",level:"Major (Ma)",section:{en:"2.7 GOTS Signs and Labelling Conditions",ja:"2.7 GOTSの表示およびラベリング条件"},text:{en:'"Made with (x%) organic materials" or "made with (x%) Organic in-conversion materials" label grades shall be no less than 70% (≥70%) of the fibre content of the products (excluding Accessories).',ja:"「(x%)の有機材料を使用」または「(x%)の有機転換材料を使用」のラベルグレードは、製品の繊維含量の70%以上(≥70%)でなければなりません(付属品は除く)。"},companyTypes:["brand"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル,ラベルデザイン","ロゴ申請書、Incoming TC"],sourceRow:"GOTS v7.0 EVAL!41"},{id:"GOTS7-2.7.7",standard:"GOTS",version:"7.0",clause:"2.7.7",allClauses:["2.7.7"],crossRefs:[],category:"labelling",topics:["label_related","brand_related"],track:"main",level:"Major (Ma)",section:{en:"2.7 GOTS Signs and Labelling Conditions",ja:"2.7 GOTSの表示およびラベリング条件"},text:{en:"GOTS labelling can only be applied to the product and/or packaging by a Certified Entity and shall have been approved by the Certified Entity's Approved Certifier in advance of its application.",ja:"GOTSラベルは、認証された企業のみが製品および/または包装に適用でき、適用前に認証された企業の承認された認定機関によって承認されている必要があります。"},companyTypes:["brand"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル,ラベルデザイン","ロゴ申請書、Incoming TC"],sourceRow:"GOTS v7.0 EVAL!42"},{id:"GOTS7-2.7.8",standard:"GOTS",version:"7.0",clause:"2.7.8",allClauses:["2.7.8"],crossRefs:[],category:"labelling",topics:["label_related","brand_related"],track:"main",level:"Major (Ma)",section:{en:"2.7 GOTS Signs and Labelling Conditions",ja:"2.7 GOTSの表示およびラベリング条件"},text:{en:"Labelling of GOTS Goods sold in retail is mandatory",ja:"小売で販売されるGOTS商品のラベル付けは必須です。"},companyTypes:["brand"],conditionalFor:[],systemUpload:[],refDocs:["GOTSの管理マニュアル,ラベルデザイン","ロゴ申請書、Incoming TC"],sourceRow:"GOTS v7.0 EVAL!43"},{id:"GOTS7-2.7.9",standard:"GOTS",version:"7.0",clause:"2.7.9",allClauses:["2.7.9"],crossRefs:[],category:"labelling",topics:["label_related","brand_related"],track:"main",level:"Major (Ma)",section:{en:"2.7 GOTS Signs and Labelling Conditions",ja:"2.7 GOTSの表示およびラベリング条件"},text:{en:`Labelling and advertising of GOTS Goods shall be in compliance with the current document Conditions for

:["3.2.2"],crossRefs:[],category:"product",topics:["material_input","product_registration_related"],track:"main",level:"Major (Ma)",section:{en:"3.2 Additional Fibre Materials",ja:""},text:{en:'For GOTS Goods sold, labelled, or represented as "made with (x%) organic materials" or "made with (x%) Organic in-conversion materials, up to 30% (≤30%) of the product fibre composition may be consist of “Additional Fibre Materials” provided in this Section.',ja:"「(x%)の有機材料を使用」または「(x%)の有機転換材料を使用」として販売、ラベル付け、または表現されるGOTS商品においては、製品の繊維組成の最大30%(≤30%)をこのセクションで提供される「追加繊維材料」で構成することができます。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["商品登録リスト、去年のSCライセンス(ある場合),ロゴ申請書"],sourceRow:"GOTS v7.0 EVAL!51"},{id:"GOTS7-3.2.3",standard:"GOTS",version:"7.0",clause:"3.2.3",allClauses:["3.2.3"],crossRefs:[],category:"product",topics:["material_input","product_registration_related"],track:"main",level:"Major (Ma)",section:{en:"3.2 Additional Fibre Materials",ja:""},text:{en:`Allowed and Prohibited Additional Fibres 3

追加繊維の使用は、GOTS v7.0の3.23表1:許可された追加繊維および禁止された追加繊維に準拠するものとします。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["商品登録リスト、去年のSCライセンス(ある場合),ロゴ申請書"],sourceRow:"GOTS v7.0 EVAL!52"},{id:"GOTS7-3.3.1",standard:"GOTS",version:"7.0",clause:"3.3.1",allClauses:["3.3.1"],crossRefs:[],category:"product",topics:["material_input","product_registration_related"],track:"main",level:"Major (Ma)",section:{en:"3.3 Accessories",ja:"3.3 アクセサリー"},text:{en:`Table – Allowed and Prohibited Accessories

アクセサリーの使用は、GOTS v7.0の3.3.1表2:許可されたアクセサリーおよび禁止されたアクセサリーに準拠するものとします。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[{slot:2,label:"第三機関による製品の品質試験報告書",hint:"過去12ヶ月以内"}],refDocs:["第三者機関による品質試験検査報告書"],sourceRow:"GOTS v7.0 EVAL!55"},{id:"GOTS7-4.1.1",standard:"GOTS",version:"7.0",clause:"4.1.1",allClauses:["4.1.1"],crossRefs:[],category:"management_review",topics:["due_diligence_related","management_system_related"],track:"main",level:"Major (Ma)",section:{en:"4.1 Due Diligence Management Process",ja:"4.1 デューデリジェンス管理プロセス"},text:{en:`The Certified Entity shall engage into a responsible business conduct. GOTS Chemical Input
Criteria, GOTS Environmental Criteria, GOTS Human Rights and Social Criteria, and GOTS
Governance Criteria shall be implemented through the due diligence process. This process
shall be commensurate with the risk and appropriate to a specific Certified Entity’s
circumstances and context. As provided by OECD Due Diligence Guidance for responsible
business conduct and OECD Due Diligence Guidance for Responsible Supply Chains in the
Garment and Footwear Sector the following six steps framework shall be followed by the
Certified Entity when conducting due diligence process:
i. The Certified Entity shall embed its due diligence process into its policies and
management systems,
ii. The Certified Entity shall identify actual or potential adverse impacts associated with
the Certified Entity’s operation,
iii. The Certified Entity shall cease, prevent or mitigate adverse impacts,
iv. The Certified Entity shall track implementation and results,
v. The Certified Entity shall communicate how impacts are addressed; and
vi. The Certified Entity shall enable remediation when appropriate`,ja:`認証された企業は、責任あるビジネス行動を実施するものとします。GOTS化学物質投入基準、GOTS環境基準、GOTS人権および社会基準、GOTSガバナンス基準は、デューデリジェンスプロセスを通じて実施されなければなりません。このプロセスは、リスクに応じて、特定の認証された企業の状況や文脈に適したものである必要があります。責任あるビジネス行動のためのOECDデューデリジェンスガイダンスおよび衣料品および履物業界における責任あるサプライチェーンのためのOECDデューデリジェンスガイダンスに基づき、認証された企業はデューデリジェンスプロセスを実施する際に以下の6つのステップの枠組みに従うものとします:

i. 認証された企業は、デューデリジェンスプロセスを自社の方針や管理システムに組み込むものとします。
ii. 認証された企業は、自社の事業に関連する実際または潜在的な悪影響を特定するものとします。
iii. 認証された企業は、悪影響を停止、予防または軽減するものとします。
iv. 認証された企業は、実施状況と結果を追跡するものとします。
v. 認証された企業は、どのように悪影響に対処しているかをコミュニケーションするものとします。
vi. 認証された企業は、適切な場合には救済を可能にするものとします。`},companyTypes:["brand","dyeing","farm","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則"],sourceRow:"GOTS v7.0 EVAL!59"},{id:"GOTS7-4.1.2",standard:"GOTS",version:"7.0",clause:"4.1.2",allClauses:["4.1.2"],crossRefs:[],category:"management_review",topics:["due_diligence_related","management_system_related"],track:"main",level:"Major (Ma)",section:{en:"4.1 Due Diligence Management Process",ja:"4.1 デューデリジェンス管理プロセス"},text:{en:`The requirement to conduct due diligence process applies to all GOTS Certified Entities.
Nevertheless, when assessing whether this requirement is met the size, operational context,
ownership and structure of the Certified Entity may be taken into account.`,ja:"デューデリジェンスプロセスを実施する要件は、すべてのGOTS認証企業に適用されます。ただし、この要件が満たされているかどうかを評価する際には、認証企業の規模、運営状況、所有権、構造を考慮することができます。"},companyTypes:["brand","dyeing","farm","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則"],sourceRow:"GOTS v7.0 EVAL!60"},{id:"GOTS7-4.1.3",standard:"GOTS",version:"7.0",clause:"4.1.3",allClauses:["4.1.3"],crossRefs:[],category:"management_review",topics:["due_diligence_related","management_system_related"],track:"main",level:"Major (Ma)",section:{en:"4.1 Due Diligence Management Process",ja:"4.1 デューデリジェンス管理プロセス"},text:{en:`The Certified Entity shall continuously implement due diligence so that it can show
progressive improvement over time.`,ja:"認証企業は、時間の経過とともに進歩的な改善を示すことができるよう、継続的にデューデリジェンスを実施しなければなりません。"},companyTypes:["brand","dyeing","farm","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則"],sourceRow:"GOTS v7.0 EVAL!61"},{id:"GOTS7-4.1.4",standard:"GOTS",version:"7.0",clause:"4.1.4",allClauses:["4.1.4"],crossRefs:[],category:"management_review",topics:["due_diligence_related","management_system_related"],track:"main",level:"Major (Ma)",section:{en:"4.1 Due Diligence Management Process",ja:"4.1 デューデリジェンス管理プロセス"},text:{en:`The Certified Entity shall adopt a Policy on Responsible Business Conduct that articulates
Certified Entity’s commitments to responsible business conduct in its own operations and in
its supply chain.`,ja:"認証企業は、自己の事業およびサプライチェーンにおける責任あるビジネス行動に対するコミットメントを明示した責任あるビジネス行動に関するポリシーを策定するものとします。"},companyTypes:["brand","dyeing","farm","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則"],sourceRow:"GOTS v7.0 EVAL!62"},{id:"GOTS7-4.1.5",standard:"GOTS",version:"7.0",clause:"4.1.5",allClauses:["4.1.5"],crossRefs:[],category:"management_review",topics:["due_diligence_related","management_system_related"],track:"main",level:"Major (Ma)",section:{en:"4.1 Due Diligence Management Process",ja:"4.1 デューデリジェンス管理プロセス"},text:{en:`The Certified Entity shall strengthen its management systems to conduct due diligence in
Certified Entity’s own operation and in its supply chain.`,ja:"認証企業は、自己の事業およびサプライチェーンにおいてデューデリジェンスを実施するために、管理システムを強化しなければなりません。"},companyTypes:["brand","dyeing","farm","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則"],sourceRow:"GOTS v7.0 EVAL!63"},{id:"GOTS7-4.1.6",standard:"GOTS",version:"7.0",clause:"4.1.6",allClauses:["4.1.6"],crossRefs:[],category:"management_review",topics:["due_diligence_related","management_system_related"],track:"main",level:"Major (Ma)",section:{en:"4.1 Due Diligence Management Process",ja:"4.1 デューデリジェンス管理プロセス"},text:{en:`The Certified Entity shall assign oversight and responsibility for due diligence to relevant
senior management and assign board-level responsibilities for implementing the Policy on
Responsible Business Conduct. The Certified Entity shall regularly provide the responsible
person(s) with training on all relevant topics including those related to human and labour
rights.`,ja:"認証企業は、デューデリジェンスに関する監視および責任を関連する上級管理職に割り当て、責任あるビジネス行動に関するポリシーの実施に対して取締役レベルの責任を割り当てるものとします。認証企業は、関連するすべてのトピックに関する訓練を定期的に責任者に提供しなければなりません。これには、人権および労働権に関連するトピックも含まれます。"},companyTypes:["brand","dyeing","farm","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則"],sourceRow:"GOTS v7.0 EVAL!64"},{id:"GOTS7-4.1.7",standard:"GOTS",version:"7.0",clause:"4.1.7",allClauses:["4.1.7"],crossRefs:[],category:"management_review",topics:["due_diligence_related","management_system_related"],track:"main",level:"Major (Ma)",section:{en:"4.1 Due Diligence Management Process",ja:"4.1 デューデリジェンス管理プロセス"},text:{en:"The Certified Entity shall allocate adequate support and resources to conduct due diligence process and implement the Policy on Responsible Business Conduct.",ja:"認証企業は、デューデリジェンスプロセスを実施し、責任あるビジネス行動に関するポリシーを実行するために、十分な支援とリソースを割り当てるものとします。"},companyTypes:["brand","dyeing","farm","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則"],sourceRow:"GOTS v7.0 EVAL!65"},{id:"GOTS7-4.2.1.1",standard:"GOTS",version:"7.0",clause:"4.2.1.1",allClauses:["4.2.1.1"],crossRefs:[],category:"chemical",topics:["chemical_related"],track:"main",level:"Major (Ma)",section:{en:"4.2.1 CHEMICAL MANAGEMENT",ja:"4.2.1 化学管理"},text:{en:"A Certified Entity shall only use chemicals which are assessed, approved, and explicitly listed on the GOTS Positive List and shall have copies of valid Letter of Approvals and Safety Data Sheet documents on hand listing all Preparations they are using in processing and manufacturing of GOTS Goods as verification proof that all colourants and textile auxiliaries used for GOTS Goods are approved.",ja:"認証された企業は、GOTSポジティブリストにおいて評価され、承認され、明示的にリストされた化学物質のみを使用するものとし、GOTS商品を処理および製造する際に使用するすべての調整剤をリストした有効な承認書および安全データシートのコピーを手元に保管し、すべての着色剤およびテキスタイル補助剤がGOTS商品に使用するために承認されていることの確認証明とする必要があります。"},companyTypes:["dyeing","laminating","printing","spinning"],conditionalFor:[],systemUpload:[{slot:7,label:"GOTS化学管理システム",hint:"CMS"}],refDocs:["リスクアセスメント","SDS(安全データシート)","確認証明"],sourceRow:"GOTS v7.0 EVAL!69"},{id:"GOTS7-4.2.1.2",standard:"GOTS",version:"7.0",clause:"4.2.1.2",allClauses:["4.2.1.2"],crossRefs:[],category:"chemical",topics:["chemical_related"],track:"main",level:"Major (Ma)",section:{en:"4.2.1 CHEMICAL MANAGEMENT",ja:"4.2.1 化学管理"},text:{en:"All chemical Inputs (Substances and Preparations) intended to be used to process GOTS Goods shall undergo an assessment procedure prior to approval before their usage.",ja:"GOTS商品を処理するために使用されるすべての化学投入物(物質および調整剤)は、使用前に承認手続きが行われる必要があります。"},companyTypes:["dyeing","laminating","printing","spinning"],conditionalFor:[],systemUpload:[],refDocs:["リスクアセスメント","SDS(安全データシート)","確認証明"],sourceRow:"GOTS v7.0 EVAL!70"},{id:"GOTS7-4.2.6.1",standard:"GOTS",version:"7.0",clause:"4.2.6.1",allClauses:["4.2.6.1"],crossRefs:[],category:"manufacturing",topics:["chemical_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.2.6 TEXTILE PROCESSING CRITERIA",ja:"4.2.6 テキスタイル処理基準"},text:{en:`First Processing
a. In case of organic cotton fibres, before accepting incoming fibres to the GOTS certified
supply chain, pesticide residue tests and GMO testing shall be conducted. Please refer to
the document Certification and Operating Parameters for GOTS Certified Gins.`,ja:`原料処理
a. オーガニックコットン繊維の場合、GOTS認証されたサプライチェーンに入る前に、農薬残留検査およびGMO検査を実施しなければなりません。詳細については、「GOTS認証された紡績工場の認証および運営パラメーター」文書を参照してください。`},companyTypes:["farm"],conditionalFor:[],systemUpload:[],refDocs:["GMO テストレポート","農場認証証明"],sourceRow:"GOTS v7.0 EVAL!73"},{id:"GOTS7-4.2.6.2",standard:"GOTS",version:"7.0",clause:"4.2.6.2",allClauses:["4.2.6.2"],crossRefs:[],category:"manufacturing",topics:["chemical_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.2.6 TEXTILE PROCESSING CRITERIA",ja:"4.2.6 テキスタイル処理基準"},text:{en:`Spinning
a. Allowed are additives which meet the basic requirements as set in Sections 4.2.2 and
4.2.3 only.
b. Any paraffin product used shall be fully refined with a limited value for residual oil of
0.5%.
c. Synthetic fibres which are to be dissolved at a later processing stage are prohibited to be
used.`,ja:`紡績
a. 許可される添加物は、セクション4.2.2および4.2.3に定められた基本要件を満たすもののみです。
b. 使用されるパラフィン製品は、残留油の限度値0.5%で完全に精製されている必要があります。
c. 後の処理段階で溶解される合成繊維の使用は禁止されています。`},companyTypes:["spinning"],conditionalFor:[],systemUpload:[{slot:14,label:"GOTS 材料 / 業務の流れ",hint:"生産フロー"},{slot:16,label:"GOTSリスク査定 -IDFLが提供するテンプレートを使用する必要があります",hint:"リスクアセスメント"},{slot:7,label:"GOTS化学管理システム(CMS)(SDS(安全データシート))",hint:""}],refDocs:["生産フロー","リスクアセスメント","SDS(安全データシート)","商品登録リスト"],sourceRow:"GOTS v7.0 EVAL!74"},{id:"GOTS7-4.2.6.3",standard:"GOTS",version:"7.0",clause:"4.2.6.3",allClauses:["4.2.6.3"],crossRefs:[],category:"manufacturing",topics:["chemical_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.2.6 TEXTILE PROCESSING CRITERIA",ja:"4.2.6 テキスタイル処理基準"},text:{en:`Sizing and Weaving/Knitting
a. Allowed sizing agents include starch, starch derivatives, other natural Substances and CMC (carboxymethylcellulose).
b. Synthetic sizes which meet the basic requirements as set in Sections 4.2.2 and 4.2.3 may be used for no more than 25% of the total sizing in combination with natural Substances only, based on the calculation for the amount of chemical without water.
c. In case such synthetic sizes are recycled/recovered from the wastewater of the desizing process with a ratio of >80%, they may be used without limitation in the total sizing but shall still meet the requirements as set in Sections 4.2.2 and 4.2.3.
d. Other Inputs used in the processing shall be derived from Natural Materials only.`,ja:`サイジングおよび織り/編み
a. 許可されるサイジング剤には、デンプン、デンプン誘導体、その他の天然物質およびCMC(カルボキシメチルセルロース)が含まれます。
b. セクション4.2.2および4.2.3に定められた基本要件を満たす合成サイジングは、天然物質との組み合わせで総サイジングの25%を超えない範囲で使用できます。これは、水を含まない化学物質の量に基づいて計算されます。
c. このような合成サイジングが脱サイズプロセスの廃水からリサイクル/回収され、その比率が>80%である場合、総サイジングにおいて制限なしに使用できるが、セクション4.2.2および4.2.3に定められた要件を満たす必要があります。
d. 処理に使用されるその他の投入物は、天然材料からのみ得られなければなりません。`},companyTypes:["weaving"],conditionalFor:[],systemUpload:[],refDocs:["生産フロー","リスクアセスメント","SDS(安全データシート)","商品登録リスト"],sourceRow:"GOTS v7.0 EVAL!75"},{id:"GOTS7-4.2.6.4",standard:"GOTS",version:"7.0",clause:"4.2.6.4",allClauses:["4.2.6.4"],crossRefs:[],category:"manufacturing",topics:["chemical_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.2.6 TEXTILE PROCESSING CRITERIA",ja:"4.2.6 テキスタイル処理基準"},text:{en:`Non-woven Manufacture
a. Allowed non-woven manufacturing processing includes only mechanical compaction,
webbing and entangling such as hydroentanglement.`,ja:`不織布製造
a. 許可される不織布製造プロセスには、機械的圧縮、ウェブ形成、そして水流絡み(ハイドロエンタングルメント)などが含まれます。`},companyTypes:["knitting_sewing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["生産フロー"],sourceRow:"GOTS v7.0 EVAL!76"},{id:"GOTS7-4.2.6.5",standard:"GOTS",version:"7.0",clause:"4.2.6.5",allClauses:["4.2.6.5"],crossRefs:[],category:"manufacturing",topics:["chemical_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.2.6 TEXTILE PROCESSING CRITERIA",ja:"4.2.6 テキスタイル処理基準"},text:{en:"The Pre-treatment and Other Wet Processing Stages shall comply with GOTS v7.0 4.2.6.5 Table 6: Restrictions in Pre-treatment and Wet Processing",ja:"前処理およびその他の湿式処理段階は、GOTS v7.0の4.2.6.5表6:前処理および湿式処理における制限に準拠するものとします。"},companyTypes:["dyeing","farm","printing"],conditionalFor:[],systemUpload:[],refDocs:["生産フロー","リスクアセスメント","SDS(安全データシート)","商品登録リスト"],sourceRow:"GOTS v7.0 EVAL!77"},{id:"GOTS7-4.2.6.6",standard:"GOTS",version:"7.0",clause:"4.2.6.6",allClauses:["4.2.6.6"],crossRefs:[],category:"manufacturing",topics:["chemical_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.2.6 TEXTILE PROCESSING CRITERIA",ja:"4.2.6 テキスタイル処理基準"},text:{en:"The Dyeing shall comply with GOTS v7.0 4.2.6.6 Table 7: Restrictions in Dyeing",ja:"染色は、GOTS v7.0の4.2.6.6表7:染色における制限に準拠するものとします。"},companyTypes:["dyeing","recycler"],conditionalFor:[],systemUpload:[],refDocs:["生産フロー","リスクアセスメント","SDS(安全データシート)","商品登録リスト"],sourceRow:"GOTS v7.0 EVAL!78"},{id:"GOTS7-4.2.6.7",standard:"GOTS",version:"7.0",clause:"4.2.6.7",allClauses:["4.2.6.7"],crossRefs:[],category:"manufacturing",topics:["chemical_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.2.6 TEXTILE PROCESSING CRITERIA",ja:"4.2.6 テキスタイル処理基準"},text:{en:"The Printing shall comply with GOTS v7.0 4.2.6.7 Table 8: Restrictions in Printing",ja:"印刷は、GOTS v7.0の4.2.6.7表8:印刷における制限に準拠するものとします。"},companyTypes:["printing","recycler"],conditionalFor:[],systemUpload:[],refDocs:["生産フロー","リスクアセスメント","SDS(安全データシート)","商品登録リスト"],sourceRow:"GOTS v7.0 EVAL!79"},{id:"GOTS7-4.2.6.8",standard:"GOTS",version:"7.0",clause:"4.2.6.8",allClauses:["4.2.6.8"],crossRefs:[],category:"manufacturing",topics:["chemical_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.2.6 TEXTILE PROCESSING CRITERIA",ja:"4.2.6 テキスタイル処理基準"},text:{en:"The Finishing and Manufacturing shall comply with GOTS v7.0 4.2.6.8 Table : Restrictions in Finishing and Manufacturing",ja:"仕上げおよび製造は、GOTS v7.0の4.2.6.8表:仕上げおよび製造における制限に準拠するものとします。"},companyTypes:["knitting_sewing","printing"],conditionalFor:[],systemUpload:[],refDocs:["生産フロー","リスクアセスメント","SDS(安全データシート)","商品登録リスト"],sourceRow:"GOTS v7.0 EVAL!80"},{id:"GOTS7-4.2.6.9",standard:"GOTS",version:"7.0",clause:"4.2.6.9",allClauses:["4.2.6.9"],crossRefs:[],category:"manufacturing",topics:["chemical_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.2.6 TEXTILE PROCESSING CRITERIA",ja:"4.2.6 テキスタイル処理基準"},text:{en:`General Requirement for Machine Oils
a. Machine Oils which may come in contact with GOTS Goods during processing/manufacturing stages, along the GOTS supply chain shall be Heavy Metal-Free.
b. Such Machine Oils may undergo a voluntary chemical input assessment procedure for an approval and can be listed in the GOTS Positive List.`,ja:`機械油の一般要件
a. GOTS商品が処理や製造段階で接触する可能性のある機械油は、重金属を含まないものでなければなりません。
b. そのような機械油は、承認のための任意の化学投入物評価手続きを経て、GOTSポジティブリストに掲載されることができます。`},companyTypes:["dyeing","knitting_sewing","laminating","printing","recycler","spinning","weaving"],conditionalFor:[],systemUpload:[],refDocs:["生産フロー","リスクアセスメント","SDS(安全データシート)","商品登録リスト"],sourceRow:"GOTS v7.0 EVAL!81"},{id:"GOTS7-4.3.1.1",standard:"GOTS",version:"7.0",clause:"4.3.1.1",allClauses:["4.3.1.1"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:"In addition to GOTS criteria, Certified Entities shall assure compliance with the applicable national and local legal environmental requirements applicable to their processing/manufacturing stages (including those referring to emissions to air, wastewater discharge, as well as disposal of waste and sludge).",ja:"GOTS基準に加えて、認証された企業は、処理および製造段階に適用される国内および地域の法的な環境要件(大気への排出、廃水の排出、廃棄物およびスラッジの処分に関するものを含む)を遵守することを確保しなければなりません。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[{slot:6,label:"GOTS環境管理システム",hint:"EMS"}],refDocs:["廃棄物の取り扱い/分別手順","環境保全協定","エネルギー・水消費記録、廃棄物の産出記録","GOTS 製品に関しては kg 当たりの消費のデータ","年間目標と年一回のレビュー記録","GOTS 製品に関しては kg 当たりの消費の削減目標と手順"],sourceRow:"GOTS v7.0 EVAL!86"},{id:"GOTS7-4.3.1.2",standard:"GOTS",version:"7.0",clause:"4.3.1.2",allClauses:["4.3.1.2"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`Certified Entities shall have a written environmental and chemical management policy that is
appropriate to the nature of their business. In addition, necessary procedures shall be in
place to allow monitoring and improving relevant environmental management performances in
their Facilities.`,ja:"認証された企業は、自社の事業の性質に適した書面による環境および化学管理方針を持たなければなりません。さらに、施設内で関連する環境管理のパフォーマンスを監視し、改善できるよう、必要な手順が整備されていなければなりません。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["環境管理システム"],sourceRow:"GOTS v7.0 EVAL!87"},{id:"GOTS7-4.3.1.3",standard:"GOTS",version:"7.0",clause:"4.3.1.3",allClauses:["4.3.1.3"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`The environmental and chemical management policies shall be shared with all employees.
Depending on the processing/manufacturing stages, available data and procedures shall
include:
a. Responsible person(s) for environment and chemical management related duties
b. Data on energy and water resources and their consumption per kg of textile output
c. Target goals and procedures to reduce energy and water consumption per kg of textile
d. Target goals and procedures to increase the use of renewable sources of energy
e. Data on waste and discharges per kg of textile output
f. Target goal and procedures to minimise waste and discharges
g. Procedures to follow in case of waste and pollution incidents
h. Documented staff training for topics such as conservation of resources such as water,
energy, proper handling, responsible use and correct disposal of chemicals.
i. Long-term and short-term projects for improvement`,ja:`環境および化学管理方針は、すべての従業員と共有されなければなりません。処理および製造段階に応じて、利用可能なデータおよび手順には以下が含まれる必要があります:

a. 環境および化学管理関連業務の責任者
b. エネルギーおよび水資源のデータ、並びにテキスタイル1kgあたりの消費量
c. テキスタイル1kgあたりのエネルギーおよび水の消費量を削減するための目標と手順
d. 再生可能エネルギー源の使用を増加させるための目標と手順
e. テキスタイル1kgあたりの廃棄物および排出量のデータ
f. 廃棄物および排出量を最小限に抑えるための目標と手順
g. 廃棄物および汚染事故が発生した場合の手順
h. 水やエネルギーなどの資源の保全、化学物質の適切な取り扱い、責任ある使用および適切な廃棄に関する従業員の訓練記録
i. 長期および短期の改善プロジェクト`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["廃棄物の取り扱い/分別手順","環境保全協定","エネルギー・水消費記録、廃棄物の産出記録","GOTS 製品に関しては kg 当たりの消費のデータ","年間目標と年一回のレビュー記録","GOTS 製品に関しては kg 当たりの消費の削減目標と手順"],sourceRow:"GOTS v7.0 EVAL!88"},{id:"GOTS7-4.3.1.4",standard:"GOTS",version:"7.0",clause:"4.3.1.4",allClauses:["4.3.1.4"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`Adequate inventory of GOTS-approved chemical Inputs that are used for processing GOTS
Goods shall be maintained.`,ja:"GOTS商品の処理に使用されるGOTS承認の化学投入物の適切な在庫を維持しなければなりません。"},companyTypes:["dyeing","knitting_sewing","laminating","printing","recycler","spinning","weaving"],conditionalFor:[],systemUpload:[{slot:7,label:"GOTS化学管理システム",hint:"CMS"}],refDocs:["化学品管理システム","該当の場合"],sourceRow:"GOTS v7.0 EVAL!89"},{id:"GOTS7-4.3.1.5",standard:"GOTS",version:"7.0",clause:"4.3.1.5",allClauses:["4.3.1.5"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`Wet processing units shall keep full records of chemical, energy, and water consumption as
well as wastewater treatment data, including the disposal of sludge. Certified Entities shall
continuously measure and monitor wastewater temperature, wastewater pH, sediment
quantities, and waste toxicity. There shall be provisions to recycle and/or dispose of solid
waste. On-site waste burning or uncontrolled waste landfilling shall not be undertaken.`,ja:"湿式処理ユニットは、化学物質、エネルギー、水の消費量、および廃水処理データ(スラッジの処分を含む)を完全に記録しなければなりません。認証された企業は、廃水の温度、pH、沈殿物の量、および廃棄物の毒性を継続的に測定および監視する必要があります。固形廃棄物のリサイクルおよび/または処分のための規定が必要です。現場での廃棄物焼却や無制限の廃棄物埋立は行ってはなりません。"},companyTypes:["dyeing","knitting_sewing","laminating","printing","recycler","spinning","weaving"],conditionalFor:[],systemUpload:[{slot:6,label:"GOTS環境管理システム",hint:"EMS"}],refDocs:["廃棄物の取り扱い/分別手順","汚泥の産業廃棄物処分/運搬業許可書"],sourceRow:"GOTS v7.0 EVAL!90"},{id:"GOTS7-4.3.1.6",standard:"GOTS",version:"7.0",clause:"4.3.1.6",allClauses:["4.3.1.6"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`Monitoring of noise pollution, and air pollution shall be in accordance with local legal
regulations, and periodic testing shall be carried out.`,ja:"騒音公害および大気汚染の監視は、地域の法規制に従い、定期的な検査が行われなければなりません。"},companyTypes:["dyeing","knitting_sewing","laminating","printing","recycler","spinning","weaving"],conditionalFor:[],systemUpload:[],refDocs:["騒音レポート","排気レポート"],sourceRow:"GOTS v7.0 EVAL!91"},{id:"GOTS7-4.3.1.7",standard:"GOTS",version:"7.0",clause:"4.3.1.7",allClauses:["4.3.1.7"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`Certified Entities shall define a Greenhouse Gas (GHG) Emission Management that
encompasses the identification of sources of GHG emissions, as well as monitoring,
quantifying, and setting measures to reduce GHG emissions.`,ja:"認証された企業は、温室効果ガス(GHG)排出管理を定義し、GHG排出源の特定、監視、定量化、そしてGHG排出削減措置の設定を行わなければなりません。"},companyTypes:["dyeing"],conditionalFor:[],systemUpload:[],refDocs:["排気レポート"],sourceRow:"GOTS v7.0 EVAL!92"},{id:"GOTS7-4.3.1.8",standard:"GOTS",version:"7.0",clause:"4.3.1.8",allClauses:["4.3.1.8"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`Certified Entities shall initially collect information on sources of Greenhouse Gas (GHG)
emissions of their own operations and identify means for reduction for each source.`,ja:"認証された企業は、まず自社の事業における温室効果ガス(GHG)排出源に関する情報を収集し、それぞれの排出源に対する削減手段を特定する必要があります。"},companyTypes:["dyeing"],conditionalFor:[],systemUpload:[],refDocs:["排気レポート"],sourceRow:"GOTS v7.0 EVAL!93"},{id:"GOTS7-4.3.1.9",standard:"GOTS",version:"7.0",clause:"4.3.1.9",allClauses:["4.3.1.9"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`As a long-term plan, Certified Entities should include product-related emissions and supply
chain-related emissions in their Greenhouse Gas (GHG) Emission Management.`,ja:"長期計画として、認証された企業は製品関連の排出量およびサプライチェーン関連の排出量を温室効果ガス(GHG)排出管理に含めるべきです。"},companyTypes:["dyeing"],conditionalFor:[],systemUpload:[],refDocs:["排気レポート"],sourceRow:"GOTS v7.0 EVAL!94"},{id:"GOTS7-4.3.2.1",standard:"GOTS",version:"7.0",clause:"4.3.2.1",allClauses:["4.3.2.1"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`The applicable national and local legal requirements for wastewater treatment, including limit
values with regard to pH, temperature, TOC, BOD, COD, colour removal, residues of
(chemical) pollutants and discharge routes, shall be fulfilled.`,ja:"廃水処理に関する適用される国内および地域の法的要件(pH、温度、TOC、BOD、COD、色除去、化学汚染物質の残留および排出ルートに関する限度値を含む)は遵守しなければなりません。"},companyTypes:["dyeing","knitting_sewing","laminating","printing","recycler","spinning","weaving"],conditionalFor:[],systemUpload:[{slot:6,label:"GOTS環境管理システム",hint:"EMS"}],refDocs:["排水検査レポート"],sourceRow:"GOTS v7.0 EVAL!96"},{id:"GOTS7-4.3.2.2",standard:"GOTS",version:"7.0",clause:"4.3.2.2",allClauses:["4.3.2.2"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`Certified Entity shall follow GOTS criteria or the local legal requirements, whichever is more
stringent.`,ja:"認証された企業は、GOTS基準または地域の法的要件のうち、より厳しい方を遵守しなければなりません。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:[],systemUpload:[],refDocs:["関連する営業許可書の最新版"],sourceRow:"GOTS v7.0 EVAL!97"},{id:"GOTS7-4.3.2.3",standard:"GOTS",version:"7.0",clause:"4.3.2.3",allClauses:["4.3.2.3"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`Wastewater from all wet processing units shall be treated in an appropriate internal or
external Effluent Treatment Plant (ETP) before being discharged into the environment. ETP
shall be effective, operational, and maintained all the time.`,ja:"すべての湿式処理ユニットからの廃水は、環境に排出される前に適切な内部または外部の排水処理施設(ETP)で処理されなければなりません。ETPは常に効果的で、稼働し、適切に維持されていなければなりません。"},companyTypes:["dyeing","knitting_sewing","laminating","printing","recycler","spinning","weaving"],conditionalFor:[],systemUpload:[],refDocs:["汚泥の産業廃棄物処分/運搬業許可書","汚泥のマニフェスト","排水検査レポート"],sourceRow:"GOTS v7.0 EVAL!98"},{id:"GOTS7-4.3.2.4",standard:"GOTS",version:"7.0",clause:"4.3.2.4",allClauses:["4.3.2.4"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`Wastewater analyses shall be performed and documented periodically at normal operating
capacity`,ja:"廃水の分析は通常の稼働能力において定期的に実施され、記録されなければなりません。"},companyTypes:["dyeing","laminating","printing","spinning"],conditionalFor:[],systemUpload:[],refDocs:["排水検査レポート"],sourceRow:"GOTS v7.0 EVAL!99"},{id:"GOTS7-4.3.2.5",standard:"GOTS",version:"7.0",clause:"4.3.2.5",allClauses:["4.3.2.5"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`A Certified Entity shall provide training for the operation and maintenance of ETP to the
responsible staff.`,ja:"認証された企業は、ETPの運用および保守に関する訓練を担当スタッフに提供しなければなりません。"},companyTypes:["dyeing","printing","spinning"],conditionalFor:[],systemUpload:[],refDocs:["環境マネジメントシステム","EMS 教育記録"],sourceRow:"GOTS v7.0 EVAL!100"},{id:"GOTS7-4.3.2.6",standard:"GOTS",version:"7.0",clause:"4.3.2.6",allClauses:["4.3.2.6"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`Wastewater discharges to the environment shall not exceed 20 g COD/kg of processed textile
(output). For scouring greasy wool, an exceptional limit of 45 g COD/kg applies.`,ja:"環境への廃水排出量は、処理された繊維1kgあたり20gのCODを超えてはなりません。羊毛の脱脂処理の場合、特例として45g COD/kgの限度が適用されます。"},companyTypes:["dyeing","spinning"],conditionalFor:[],systemUpload:[],refDocs:["排水検査レポート"],sourceRow:"GOTS v7.0 EVAL!101"},{id:"GOTS7-4.3.2.7",standard:"GOTS",version:"7.0",clause:"4.3.2.7",allClauses:["4.3.2.7"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`Treatment of wastewater from water retting of bast fibres shall achieve a reduction of COD
(or TOC) of at least 95% for hemp fibres and 75% for all other bast fibres.`,ja:"アサ繊維の水浸し処理による廃水処理は、アサ繊維の場合でCOD(またはTOC)を少なくとも95%、その他の靭皮繊維の場合で75%削減する必要があります。"},companyTypes:["dyeing","spinning"],conditionalFor:[],systemUpload:[],refDocs:["排水検査レポート"],sourceRow:"GOTS v7.0 EVAL!102"},{id:"GOTS7-4.3.2.8",standard:"GOTS",version:"7.0",clause:"4.3.2.8",allClauses:["4.3.2.8"],crossRefs:[],category:"environment",topics:["environment_related","processing_related"],track:"main",level:"Major (Ma)",section:{en:"4.3.1 ENVIRONMENTAL MANAGEMENT POLICY",ja:"4.3.1 環境管理方針"},text:{en:`Where legal limits for pH and temperature are not defined for wastewater discharges to
surface waters, the discharge shall have a pH between 6 and 9 (unless the pH of the
receiving water is outside this range) and a temperature of less than 35 °C (unless the
temperature of the receiving water is above this value).`,ja:"地表水への廃水排出に関するpHおよび温度の法的限度が定義されていない場合、排水のpHは6から9の間でなければなりません(ただし、受水体のpHがこの範囲外でない場合に限る)また、温度は35°C未満でなければなりません(受水体の温度がこの値を超えていない場合に限る)。"},companyTypes:["dyeing","spinning"],conditionalFor:[],systemUpload:[],refDocs:["排水検査レポート"],sourceRow:"GOTS v7.0 EVAL!103"},{id:"GOTS7-4.4.1.3",standard:"GOTS",version:"7.0",clause:"4.4.1.3",allClauses:["4.4.1.3"],crossRefs:[],category:"social",topics:["social_related","due_diligence_related"],track:"social",level:"Major (Ma)",section:{en:"",ja:""},text:{en:"The Certified Entity shall respect human rights. The Certified Entity shall avoid causing, contributing, soliciting, encouraging or supporting human rights abuse through their activities. Further, the Certified Entity shall address any adverse human rights impacts or risks thereof for which they are responsible or with which they are involved.",ja:"被認証事業者は、人権を尊重しなければならない。被認証事業者は、その活動を通じて、人権侵害を引き起こし、助長し、勧誘し、奨励し、ま たは支援することを避けるものとする。さらに、被認証事業者は、自らが責任を負い、または関与する人権への悪影響またはそのリスクに対処しなければならない。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","CSR/社会規範遵守ポリシー","行動規範","体交渉権、人権の尊重と差別禁止、ハラスメント禁止)","内部通報制度"],sourceRow:"SOCIAL EVAL（GOTS）!2"},{id:"GOTS7-4.4.2.1",standard:"GOTS",version:"7.0",clause:"4.4.2.1",allClauses:["4.4.2.1"],crossRefs:["GRS4.0 B2.1b"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"FORCED, BONDED, INDENTURED AND PRISON LABOR / EMPLOMENT IS FREELY CHOSEN",ja:"強制労働、債務労働、契約労働および刑務所労働 / 雇用は自由に選択される"},text:{en:"The use of forced or compulsory labor in all its forms, including prison labor when not in accordance with ILO Convention 29, is prohibited.",ja:"強制的または義務的な労働の使用(ILO条約29に従わない刑務所労働を含む)は禁止されています。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","CSR/社会規範遵守ポリシー","行動規範","体交渉権、人権の尊重と差別禁止、ハラスメント禁止)","内部通報制度"],sourceRow:"SOCIAL EVAL（GOTS）!5"},{id:"GOTS7-4.4.2.2",standard:"GOTS",version:"7.0",clause:"4.4.2.2",allClauses:["4.4.2.2"],crossRefs:["GRS4.0 B2.1a"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"FORCED, BONDED, INDENTURED AND PRISON LABOR / EMPLOMENT IS FREELY CHOSEN",ja:"強制労働、債務労働、契約労働および刑務所労働 / 雇用は自由に選択される"},text:{en:"All work shall be conducted on a voluntary basis, and not under threat of any penalty or sanctions.",ja:"すべての作業は自発的に行われなければならず、いかなる罰や制裁の脅威の下でも行われてはなりません。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","CSR/社会規範遵守ポリシー","行動規範","体交渉権、人権の尊重と差別禁止、ハラスメント禁止)","内部通報制度"],sourceRow:"SOCIAL EVAL（GOTS）!4"},{id:"GOTS7-4.4.2.3",standard:"GOTS",version:"7.0",clause:"4.4.2.3",allClauses:["4.4.2.3"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"FORCED, BONDED, INDENTURED AND PRISON LABOR / EMPLOMENT IS FREELY CHOSEN",ja:"強制労働、債務労働、契約労働および刑務所労働 / 雇用は自由に選択される"},text:{en:"The prohibition of forced labour includes all forms of work or service where the persons have not offered themselves voluntarily, such as servitude bonded, trafficked or indentured labour.",ja:"強制労働の禁止には、奴隷的拘束労働、人身売買労働、年季奉公労働など、自発的に申し出なかったあらゆる形態の労働や奉仕が含まれる。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","CSR/社会規範遵守ポリシー","行動規範","体交渉権、人権の尊重と差別禁止、ハラスメント禁止)","内部通報制度"],sourceRow:"SOCIAL EVAL（GOTS）!7"},{id:"GOTS7-4.4.2.4",standard:"GOTS",version:"7.0",clause:"4.4.2.4",allClauses:["4.4.2.4"],crossRefs:["GRS4.0 B2.1c"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"FORCED, BONDED, INDENTURED AND PRISON LABOR / EMPLOMENT IS FREELY CHOSEN",ja:"強制労働、債務労働、契約労働および刑務所労働 / 雇用は自由に選択される"},text:{en:`Certified Organizations shall not require workers to make deposits/financial guarantees and shall not retain identity documents (e.g.: passports, identity cards, etc.), nor withhold wages outside a legal contractual agreement.

Workers are free to leave their employer after mutually agreed notice period, as stated in employment contract.`,ja:`認証された組織は、労働者に対して保証金や財務的保証を求めることはなく、身分証明書(パスポート、身分証明書など)を保持することはできず、法的契約に基づかない賃金の差し押さえを行ってはなりません。

労働者は、雇用契約に記載された相互に合意した通知期間後に自由に雇用主を離れることができます。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","CSR/社会規範遵守ポリシー","行動規範","体交渉権、人権の尊重と差別禁止、ハラスメント禁止)","内部通報制度"],sourceRow:"SOCIAL EVAL（GOTS）!6"},{id:"GOTS7-4.4.2.5",standard:"GOTS",version:"7.0",clause:"4.4.2.5",allClauses:["4.4.2.5"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"FORCED, BONDED, INDENTURED AND PRISON LABOR / EMPLOMENT IS FREELY CHOSEN",ja:"強制労働、債務労働、契約労働および刑務所労働 / 雇用は自由に選択される"},text:{en:`The Certified Entity shall ensure that Workers are not required to pay fees or any other costs
for entering or retaining employment.`,ja:"「被認証事業体は、労働者が手数料またはその他の費用を支払う必要がないようにしなければならない。ないようにしなければならない。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","CSR/社会規範遵守ポリシー","行動規範","体交渉権、人権の尊重と差別禁止、ハラスメント禁止)","内部通報制度"],sourceRow:"SOCIAL EVAL（GOTS）!8"},{id:"GOTS7-4.4.2.6",standard:"GOTS",version:"7.0",clause:"4.4.2.6",allClauses:["4.4.2.6"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"FORCED, BONDED, INDENTURED AND PRISON LABOR / EMPLOMENT IS FREELY CHOSEN",ja:"強制労働、債務労働、契約労働および刑務所労働 / 雇用は自由に選択される"},text:{en:"Workers are not forced to use factory provided lodging or transportation.",ja:"労働者は、工場が提供する宿泊施設や交通機関の利用を強制されることはない。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","CSR/社会規範遵守ポリシー","行動規範","体交渉権、人権の尊重と差別禁止、ハラスメント禁止)","内部通報制度"],sourceRow:"SOCIAL EVAL（GOTS）!9"},{id:"GOTS7-4.4.3.1",standard:"GOTS",version:"7.0",clause:"4.4.3.1",allClauses:["4.4.3.1"],crossRefs:["GRS4.0 B2.2b"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"CHILD LABOR",ja:"児童労働"},text:{en:`Child labour, regardless of gender shall not be used.

Certified Organizations shall not recruit child labor nor exploit children in any way. If children are found to be working directly or indirectly for the Certified Organizations, the latter shall seek a sensitive and satisfactory solution that puts the best interests of the child first.`,ja:`性別にかかわらず、児童労働は使用されてはなりません。

認証された組織は、児童労働を採用したり、子どもをあらゆる形で搾取してはなりません。もし認証された組織で直接または間接的に働いている子どもが見つかった場合、組織は子どもの最善の利益を最優先に考え、敏感かつ満足のいく解決策を模索しなければなりません。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!11"},{id:"GOTS7-4.4.3.2",standard:"GOTS",version:"7.0",clause:"4.4.3.2",allClauses:["4.4.3.2"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"CHILD LABOR",ja:"児童労働"},text:{en:`If a child below minimum age appears to be employed in the Certified Entity, the Certified
Entity shall take all appropriate measures to remove the child from the workplace and to
ensure that this child gets appropriate remedy, including actively supporting access to
education`,ja:`最低年齢に満たない児童が被認証事業者に雇用されていると思われる場合、被認証事業者
被認証事業者は、当該児童を職場から排除し、当該児童が適切な救済を受けられるようにするために、あらゆる適切な措置を講じなければならない。
この児童が適切な救済を受けられるようにする。教育`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!13"},{id:"GOTS7-4.4.3.3",standard:"GOTS",version:"7.0",clause:"4.4.3.3",allClauses:["4.4.3.3"],crossRefs:["GRS4.0 B2.2c"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"CHILD LABOR",ja:"児童労働"},text:{en:"Certified Organizations shall not employ young workers under 18 years of age at night, or in conditions which compromise their health, their safety or their moral integrity, and/or which harm their physical, mental, spiritual, moral or social development.",ja:"認証された組織は、18歳未満の若年労働者を夜間に雇用したり、健康、安全、または道徳的な健全性を損なう条件下で雇用してはならず、また、身体的、精神的、精神的、道徳的または社会的な発達を害するような雇用をしてはなりません。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!12"},{id:"GOTS7-4.4.3.4",standard:"GOTS",version:"7.0",clause:"4.4.3.4",allClauses:["4.4.3.4"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"CHILD LABOR",ja:"児童労働"},text:{en:"A young worker cannot work for more than 8 hours in a day or the legal limit for young workers, whichever is lower. Overtime is prohibited and a minimum consecutive period of 12 hours’ rest as well as customary weekly rest days shall be provided.",ja:"年少労働者は、1 日に 8 時間または年少労働者の法定限度のいずれか低い方を超えて働くことはできない。時間外労働は禁止され、慣例的な週休日と同様に、最低連続 12 時間の休息が与えられなければならない。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!14"},{id:"GOTS7-4.4.3.5",standard:"GOTS",version:"7.0",clause:"4.4.3.5",allClauses:["4.4.3.5"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"CHILD LABOR",ja:"児童労働"},text:{en:`A Young Worker shall be employed in a manner that allows access to continued education or
additional educational opportunities, such as vocational or technical training.`,ja:`「若年労働者は、職業訓練や技術訓練など、継続的な教育や追加的な教育の機会を得られるような方法で雇用されなければならない。
職業訓練や技術訓練などの追加教育の機会を利用できるように雇用されなければならない。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!15"},{id:"GOTS7-4.4.4.1",standard:"GOTS",version:"7.0",clause:"4.4.4.1",allClauses:["4.4.4.1"],crossRefs:["GRS4.0 B2.4a"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"DISCRIMINATION, HARASSMENT, AND ABUSE",ja:"差別、嫌がらせ、および虐待"},text:{en:"Certified Organizations shall respect equal opportunities in terms of recruitment, compensation, access to training, promotion, termination or retirement.",ja:"認証された組織は、採用、報酬、研修へのアクセス、昇進、解雇または退職において平等な機会を尊重しなければなりません。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!25"},{id:"GOTS7-4.4.4.3",standard:"GOTS",version:"7.0",clause:"4.4.4.3",allClauses:["4.4.4.3"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"DISCRIMINATION, HARASSMENT, AND ABUSE",ja:"差別、嫌がらせ、および虐待"},text:{en:`The Certified Entity shall encourage confidential reporting of abuse or harsh treatment. The
Certified Entity shall treat all incidents seriously and promptly investigate all allegations of
discrimination, violence and harassment including sexual harassment. If a claim of
harassment or discrimination is proven, the Certified Entity shall apply disciplinary measures,
up to and including termination of employment.`,ja:`「被認証事業者は、虐待または過酷な扱いの秘密報告を奨励するものとする。被認証事業者は、すべての事件を真摯に扱い、差別、暴力、セクシャルハラスメントを含むハラスメン トのすべての申し立てを速やかに調査するものとする。ハラスメントまたは差別の申し立てが
ハラスメントまたは差別の申し立てが証明された場合、被認証事業体は、解雇を含む懲戒処 分を適用する。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!29"},{id:"GOTS7-4.4.4.5",standard:"GOTS",version:"7.0",clause:"4.4.4.5",allClauses:["4.4.4.5"],crossRefs:["GRS4.0 B2.4f"],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"DISCRIMINATION, HARASSMENT, AND ABUSE",ja:"差別、嫌がらせ、および虐待"},text:{en:`The Certified Entity shall have disciplinary procedures in place and shall make sure that they
are effectively communicated to the Workers. Information regarding disciplinary procedures
shall be explained to the Workers when they enter employment and easily accessible at the
workplace.`,ja:"認証された組織は、懲戒手続きが整備されていることを確認し、それが労働者に効果的に伝えられるようにしなければなりません。懲戒手続きに関する情報は、労働者が雇用に入る際に説明され、職場で簡単にアクセスできるようにしておく必要があります。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!28"},{id:"GOTS7-4.4.5.1",standard:"GOTS",version:"7.0",clause:"4.4.5.1",allClauses:["4.4.5.1"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"GENDER EQUALITY",ja:"ジェンダー平等"},text:{en:`The Certified Entity shall endeavour to achieve gender equality through equal, fair, and
transparent recruitment, promotion, and reward procedures and practices.`,ja:`「被認証事業体は、平等、公平、かつ透明性のある採用、昇進、および報酬の手続きと慣行 を通じて、男女平等の達成に努めるものとする。
公正かつ透明性のある採用、昇進、報酬の手順と慣行を通じて、男女平等の達成に努めなけ ればならない。」`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[{slot:11,label:"GOTS社会政策",hint:""}],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!31"},{id:"GOTS7-4.4.5.2",standard:"GOTS",version:"7.0",clause:"4.4.5.2",allClauses:["4.4.5.2"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"GENDER EQUALITY",ja:"ジェンダー平等"},text:{en:`Equal opportunities shall be provided to all individuals, regardless of their gender, gender
identity and sexual orientation, for all aspects of training and professional and personal
development.`,ja:`「性別、性自認、性的指向に関係なく、すべての個人に対し、研修と職業上の個人的な活動のすべての側面において、平等な機会が提供されなければならない。
性自認や性的指向に関係なく、研修のあらゆる側面において、また職業上および個人的な能力開発において、すべての個人に平等な機会が提供されなければならない。
を提供しなければならない。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!32"},{id:"GOTS7-4.4.5.3",standard:"GOTS",version:"7.0",clause:"4.4.5.3",allClauses:["4.4.5.3"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"GENDER EQUALITY",ja:"ジェンダー平等"},text:{en:`The Certified Entity shall protect pregnant women, mothers and their children, including their
health and safety.`,ja:"「認証機関は、妊産婦、母親及びその子供を、その健康、安全も含めて保護するものとする。を保護しなければならない。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!33"},{id:"GOTS7-4.4.5.4",standard:"GOTS",version:"7.0",clause:"4.4.5.4",allClauses:["4.4.5.4"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"GENDER EQUALITY",ja:"ジェンダー平等"},text:{en:`The Certified Entity shall prevent dismissals and career setbacks due to pregnancy or
maternity leave.`,ja:"「被認証事業体は、妊娠または出産休暇による解雇やキャリア後退を防止しなければならない。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!34"},{id:"GOTS7-4.4.5.5",standard:"GOTS",version:"7.0",clause:"4.4.5.5",allClauses:["4.4.5.5"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"GENDER EQUALITY",ja:"ジェンダー平等"},text:{en:`Women Workers shall be protected against threats of dismissal or any other employment
decision that negatively affects their employment status to prevent them from getting married
or becoming pregnant.`,ja:"「女性労働者は、結婚や妊娠を妨げる解雇の脅しや、雇用形態に悪影響を与えるその他の雇用上の決定から保護されなければならない。保護されなければならない。"},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","warehousing","weaving"],conditionalFor:[],systemUpload:[],refDocs:["就業規則","面談により確認"],sourceRow:"SOCIAL EVAL（GOTS）!35"},{id:"GOTS7-4.4.5.6",standard:"GOTS",version:"7.0",clause:"4.4.5.6",allClauses:["4.4.5.6"],crossRefs:[],category:"social",topics:["social_related","employee_related"],track:"social",level:"Major (Ma)",section:{en:"GENDER EQUALITY",ja:"ジェンダー平等"},text:{en:`Workers with family responsibilities shall be protected against discrimination with respect to
