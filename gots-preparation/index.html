"],topics:["environment_related"]},{id:"environment.targets",periodScoped:!0,category:"environment",title:{ja:"環境目標と年次レビュー記録",en:"Environmental targets and annual review",zhTW:"環境目標與年度審查紀錄"},when:N,why:{ja:"記録を取るだけでなく、削減目標を立てて年1回見直していることが求められます。目標が未達でも、理由と次の手を説明できれば問題ありません。",en:"Recording consumption is not enough — you must set reduction targets and review them annually. Missing a target is acceptable if you can explain why and what happens next.",zhTW:"僅記錄消耗量並不足夠，須訂定減量目標並每年檢討。目標未達成並非問題，惟須能說明原因及後續作法。"},prepare:{ja:["年間の削減目標（GOTS製品1kg当たり）","年次レビューの記録","目標未達の場合の分析と対策"],en:["Annual reduction targets, per kg of GOTS product","Record of the annual review","Analysis and action where a target was missed"],zhTW:["年度減量目標（以每公斤 GOTS 產品計）","年度審查紀錄","目標未達成時之分析與對策"]},auditorChecks:{ja:["目標が具体的な数値になっているかを見ます","前年の目標に対する実績を確認します"],en:["Checks the target is an actual number, not an aspiration","Compares last year's target with what was achieved"],zhTW:["確認目標為具體數值而非概略期望","比對前一年度目標與實際達成情形"]},clauses:["4.3.1.1","4.3.1.3"],topics:["environment_related"]},{id:"environment.waste",periodScoped:!0,category:"environment",title:{ja:"廃棄物の取扱・分別手順と処理記録",en:"Waste handling procedure and disposal records",zhTW:"廢棄物處理程序與處置紀錄"},when:N,why:{ja:"工場から出る廃棄物をどう分別し、誰に処理を委託しているかを示します。許可を持つ業者に委託していることが確認されます。",en:"How waste is separated and who takes it away. The auditor checks the contractor holds the right permit.",zhTW:"說明廢棄物之分類方式及委託處理之對象。稽核員將確認處理業者持有合法許可。"},prepare:{ja:["廃棄物の分別・保管手順","廃棄物処理業者の許可証の写し","マニフェスト（産業廃棄物管理票）","廃棄物の産出量記録"],en:["Waste separation and storage procedure","Copy of the disposal contractor's permit","Waste manifests","Records of waste volumes generated"],zhTW:["廢棄物分類與暫存程序","廢棄物處理業者許可證影本","廢棄物聯單","廢棄物產生量紀錄"]},auditorChecks:{ja:["マニフェストの返却状況を確認します","廃棄物置き場を実際に見て、分別状況を確認します"],en:["Checks that manifests have been returned and closed","Inspects the waste storage area for actual separation"],zhTW:["確認聯單回收與結案情形","實地查看廢棄物暫存區之分類情形"]},siteVerification:!0,clauses:["4.3.1.5","4.3.2.3"],topics:["environment_related"]},{id:"environment.wastewater",periodScoped:!0,category:"environment",title:{ja:"排水検査レポート",en:"Wastewater test reports",zhTW:"廢水檢測報告"},when:{field:"wetProcessing",eq:"yes",reason:"na.noWetProcessing"},why:{ja:"染色・洗い・仕上げなど水を使う工程がある場合、排水の水質を測定し、基準を満たしていることを示す必要があります。GOTSは自社処理・公共下水いずれの場合も確認します。",en:"Where you dye, wash or finish, wastewater quality must be measured and shown to meet limits — whether you treat it yourself or discharge to a public system.",zhTW:"若有染色、水洗或後整理等用水製程，須量測廢水水質並證明符合標準，不論係自行處理或排入公共下水道均需查核。"},prepare:{ja:["排水検査の分析結果（第三者機関）","排水基準値との比較","排水処理設備の運転記録","汚泥の処分記録とマニフェスト"],en:["Third-party wastewater analysis results","Comparison against the discharge limits","Operating records for the treatment plant","Sludge disposal records and manifests"],zhTW:["第三方廢水分析報告","與放流標準之比對","廢水處理設施之運轉紀錄","污泥處置紀錄與聯單"]},auditorChecks:{ja:["検査の頻度が規定どおりかを確認します","基準超過があった場合の対応記録を確認します","排水処理設備を実際に見ます"],en:["Checks the sampling frequency against what is required","Looks for records of what was done when a limit was exceeded","Inspects the treatment plant on site"],zhTW:["確認檢測頻率是否符合規定","查核超標時之處理紀錄","實地查看廢水處理設施"]},siteVerification:!0,clauses:["4.3.2.1","4.3.2.3","4.3.2.4","4.3.2.6","4.3.2.7","4.3.2.8"],topics:["environment_related"]},{id:"environment.permits",category:"environment",title:{ja:"営業許可・環境関連の許認可",en:"Operating and environmental permits",zhTW:"營業與環保相關許可"},when:N,why:{ja:"工場の操業に必要な許認可が、有効な状態で揃っていることを確認します。期限切れの許認可は、通常その点が指摘されます。",en:"Confirms the permits your operation legally needs are in place and current. An expired permit is normally raised as a finding.",zhTW:"確認營運所需之各項許可皆為有效狀態。許可逾期通常會被開立為不符合事項。"},prepare:{ja:["営業許可証の最新版","排水・排気・騒音に関する届出または許可","有効期限の一覧"],en:["Current operating licence","Permits or notifications for wastewater, emissions and noise","A list of expiry dates"],zhTW:["最新之營業許可證","廢水、廢氣與噪音相關之申報或許可","各項許可之有效期限一覽"]},auditorChecks:{ja:["許可の有効期限を確認します","許可の内容と実際の操業規模が一致しているかを見ます"],en:["Checks expiry dates","Compares what the permit allows with the scale of what actually happens"],zhTW:["查核許可之有效期限","比對許可內容與實際營運規模是否相符"]},clauses:["4.3.2.2"],topics:["environment_related"]},{id:"environment.emissions",periodScoped:!0,category:"environment",title:{ja:"排気・騒音の測定記録",en:"Emission and noise measurement records",zhTW:"廢氣與噪音量測紀錄"},when:N,conditionalWhen:{field:"wetProcessing",eq:"no"},why:{ja:"工程から出る排気と騒音が、法令の基準内であることを示します。該当する設備がない場合は、その旨を説明すれば足ります。",en:"Shows emissions and noise from your processes stay within legal limits. If you have no relevant equipment, saying so is enough.",zhTW:"證明製程所產生之廢氣與噪音符合法規限值。若無相關設備，說明即可。"},prepare:{ja:["排気測定の結果","騒音測定の結果","該当設備がない場合はその説明"],en:["Emission measurement results","Noise measurement results","A statement where no relevant equipment exists"],zhTW:["廢氣量測結果","噪音量測結果","若無相關設備，請提供說明"]},auditorChecks:{ja:["測定の対象設備が漏れていないかを確認します","基準値との比較を見ます"],en:["Checks no relevant source was left out of the measurement","Compares results with the limits"],zhTW:["確認量測對象未遺漏相關污染源","比對量測結果與法規限值"]},clauses:["4.3.1.6","4.3.1.7","4.3.1.8","4.3.1.9"],topics:["environment_related"]},{id:"quality.manual",category:"quality",title:{ja:"GOTS製品品質マニュアル",en:"GOTS product quality manual",zhTW:"GOTS 產品品質手冊"},systemUpload:12,why:{ja:"製品の技術品質（強度、色落ち、寸法変化など）をどう管理しているかを示します。GOTSは有機認証だけでなく、製品として使えることも求めます。",en:"How you control technical quality — strength, colour fastness, dimensional stability. GOTS asks not only that a product be organic but that it work as a product.",zhTW:"說明如何管控產品技術品質（強度、色牢度、尺寸安定性等）。GOTS 不僅要求有機性，亦要求產品具備應有之使用性能。"},prepare:{ja:["品質管理の手順書","製品ごとの品質基準","不適合品の扱い方"],en:["Written quality procedure","Quality specifications per product","How non-conforming product is handled"],zhTW:["品質管理程序書","各產品之品質規格","不合格品之處理方式"]},auditorChecks:{ja:["基準値がどこから来ているか（規格・顧客要求）を質問します","不適合品が実際にどう処理されたかを記録で確認します"],en:["Asks where the specification limits come from — standard or customer","Traces a non-conformity through to what was actually done"],zhTW:["詢問品質規格之依據來源（標準或客戶要求）","自紀錄追蹤不合格品之實際處理情形"]},clauses:["5.1.1","5.1.2","5.1.3","5.1.4"],topics:["quality_related"]},{id:"quality.technicalTest",periodScoped:!0,category:"quality",title:{ja:"第三者機関による品質試験報告書（過去12ヶ月以内）",en:"Third-party technical quality test report (last 12 months)",zhTW:"第三方品質測試報告（近 12 個月內）"},systemUpload:2,historyDependent:!0,why:{ja:"製品の技術品質を、社外の試験機関が測定した報告書です。GOTSでは、認定を受けた試験機関による報告が求められており、通常は過去12ヶ月以内のものが対象となります。自社内での測定は、この項目の証拠としては扱われません。",en:"Technical quality measured by an external laboratory. GOTS expects reports from an accredited laboratory, normally from the last 12 months. In-house measurement is not accepted as evidence for this item.",zhTW:"由外部試驗機構所出具之技術品質測試報告。GOTS 要求由具認證資格之實驗室出具，通常須為近 12 個月內之報告；公司自行量測不作為本項之佐證。"},prepare:{ja:["第三者試験機関の試験報告書","試験項目（引張強度・摩擦堅牢度・寸法変化等）","試験対象製品と実際の販売製品の対応"],en:["Test report from an external laboratory","Parameters tested: tensile strength, rubbing fastness, dimensional change","Which product was tested, and how it maps to what you sell"],zhTW:["外部試驗機構之測試報告","測試項目：拉伸強度、摩擦色牢度、尺寸變化等","受測產品與實際銷售產品之對應關係"]},auditorChecks:{ja:["報告書の日付が12ヶ月以内かを確認します","試験した製品が、実際に販売している製品を代表しているかを判断します"],en:["Checks the report is within 12 months","Judges whether the tested article genuinely represents what you sell"],zhTW:["確認報告日期在 12 個月內","判定受測產品是否確實可代表實際銷售之產品"]},clauses:["3.3.1","5.2.1","5.2.5","5.2.6.1"],topics:["quality_related","testing_related"]},{id:"quality.residueTest",periodScoped:!0,category:"quality",title:{ja:"化学残留物試験報告書（過去12ヶ月以内）",en:"Chemical residue test report (last 12 months)",zhTW:"化學殘留物測試報告（近 12 個月內）"},systemUpload:3,historyDependent:!0,conditionalWhen:{field:"doesProcessing",eq:"no"},why:{ja:"製品に禁止物質が残っていないことを、試験で確認した報告書です。加工を行わない商社の場合でも、リスク査定の結果によっては求められることがあります。",en:"Test evidence that banned substances are not present in the product. Even a trading company with no processing may be asked for this depending on the risk assessment.",zhTW:"以測試證明產品未殘留禁用物質之報告。即使為不從事加工之貿易商，仍可能依風險評估結果被要求提供。"},prepare:{ja:["残留物試験の報告書","リスク査定に基づく試験対象の選定理由","基準値との比較"],en:["Residue test report","Why those articles were selected, based on the risk assessment","Comparison with the limit values"],zhTW:["殘留物測試報告","依風險評估選定受測品項之理由","與限值之比對"]},auditorChecks:{ja:["リスク査定と試験対象の選定が整合しているかを確認します","基準超過があった場合の対応を確認します"],en:["Checks that what was tested follows from the risk assessment","Asks what happened where a limit was exceeded"],zhTW:["確認受測品項之選定與風險評估相符","查核超出限值時之後續處理"]},clauses:["5.2.1","5.2.2","5.2.5","5.2.7.1","5.2.7.2","5.2.8.1","5.2.8.2"],topics:["quality_related","testing_related"]},{id:"label.designs",category:"labelling",title:{ja:"ラベル・タグのデザイン一式",en:"Label and tag artwork",zhTW:"標籤與吊牌設計稿"},when:jt,why:{ja:"GOTSの表示には決まった書き方があります。認証機関の番号、認証グレード（Organic / Made with organic）、有機繊維の割合の表示方法が定められており、実際に使っているデザインを事前に確認します。",en:"GOTS label wording is prescribed: the certifier reference, the grade (Organic / Made with organic) and how the organic percentage is shown. The artwork you actually use is checked against those rules.",zhTW:"GOTS 標示有其規定格式：驗證機構編號、驗證等級（Organic／Made with organic）及有機纖維比例之標示方式。稽核將以實際使用之設計稿進行查核。"},prepare:{ja:["使用中のラベル・タグのデザインデータ","実際に製品に付いている現物","表示内容（認証機関名・ライセンス番号・グレード・有機繊維率）"],en:["Artwork for every label and tag in use","A physical sample as attached to the product","The declared content: certifier, licence number, grade, organic percentage"],zhTW:["所有使用中標籤與吊牌之設計檔","實際附於產品上之實體樣品","標示內容：驗證機構、授權編號、等級、有機纖維比例"]},auditorChecks:{ja:["ラベルの文言がGOTSの表示規則どおりかを1項目ずつ確認します","有機繊維率の表示と、商品登録リストの数値が一致しているかを見ます","現物のラベルとデザインデータが同じかを確認します"],en:["Checks the label wording against the GOTS labelling rules item by item","Compares the stated organic percentage with the product registration list","Checks the physical label matches the approved artwork"],zhTW:["逐項比對標籤文字與 GOTS 標示規範","比對所標示之有機纖維比例與產品登錄清單數值","確認實體標籤與核准之設計稿一致"]},siteVerification:!0,clauses:["2.7.2","2.7.3","2.7.4","2.7.5","2.7.6"],topics:["label_related"]},{id:"label.logoApproval",category:"labelling",title:{ja:"GOTSロゴの使用申請と承認記録",en:"GOTS logo application and approval",zhTW:"GOTS 標誌使用申請與核准紀錄"},when:{field:"claims",includesAny:["logo","wording"],reason:"na.noLogoUse"},why:{ja:"GOTSロゴを使用する前に、認証機関への申請と承認が必要とされています。承認を受けずに使用した場合は、通常その点が指摘されます。承認は使用媒体（タグ・ウェブ・広告）ごとに必要です。",en:"The GOTS logo has to be applied for and approved before use, and approval is needed per medium — tag, website, advertisement. Use without prior approval is normally raised as a finding.",zhTW:"使用 GOTS 標誌前須向驗證機構申請並取得核准，且須依使用媒介（吊牌、網站、廣告）分別申請。未經核准即行使用，通常會被開立為不符合事項。"},prepare:{ja:["ロゴ使用申請書の写し","認証機関からの承認記録","承認された使用媒体の一覧","承認されたデザインと実際の使用状況の対比"],en:["Copy of the logo application","Approval received from the certification body","List of media that were approved","Approved artwork against what is actually in use"],zhTW:["標誌使用申請書影本","驗證機構之核准紀錄","已核准之使用媒介清單","核准設計稿與實際使用情形之對照"]},auditorChecks:{ja:["承認されていない媒体でロゴを使用していないかを確認します","ロゴの色・比率・余白が規定どおりかを見ます"],en:["Checks the logo is not used on media that were never approved","Checks colour, proportion and clear space against the rules"],zhTW:["確認未於未經核准之媒介使用標誌","查核標誌之顏色、比例與留白是否符合規範"]},clauses:["2.7.2","2.7.7","2.7.8","2.7.9"],topics:["label_related","brand_related"]},{id:"label.retailPackaging",category:"labelling",title:{ja:"小売向け包装・ハングタグの現物",en:"Retail packaging and hangtag samples",zhTW:"零售包裝與吊牌實品"},when:{field:"claims",includesAny:["hangtag","label","packaging"],reason:"na.noRetailLabelling"},why:{ja:"一般消費者が目にする表示は、特に厳しく確認されます。デザインデータだけでなく、実際に付いている現物を用意してください。",en:"Anything a consumer sees is checked most closely. Bring the physical item, not only the artwork file.",zhTW:"消費者可見之標示查核最為嚴格，請備妥實體樣品而非僅提供設計檔案。"},prepare:{ja:["ハングタグの現物（数点）","包装材の現物","製品に付いた状態のサンプル"],en:["A few physical hangtags","Physical packaging material","A sample with everything attached as sold"],zhTW:["數件吊牌實品","包裝材料實品","如同販售狀態、標示齊備之樣品"]},auditorChecks:{ja:["現物の表示内容を、承認された内容と照合します","同じ製品の異なるロットで表示が変わっていないかを確認します"],en:["Compares the physical wording with what was approved","Checks whether the marking varies between lots of the same article"],zhTW:["比對實品標示內容與核准內容","確認同一產品不同批次之標示是否有差異"]},siteVerification:!0,clauses:["2.6.2.1","2.7.2","2.7.4"],topics:["label_related","b2c_related"]},{id:"label.packagingMaterials",category:"labelling",evidenceType:"record",title:{ja:"包装資材・ハングタグの素材要件",en:"Packaging and hangtag material requirements",zhTW:"包裝材料與吊牌材質要求"},when:{all:[{field:"salesChannel",in:["b2c","both"],reason:"na.noB2C"},{field:"sellsFinishedProduct",in:["yes","both"],reason:"na.noFinishedProduct"}]},why:{ja:"GOTSは、表示の文言だけでなく包装資材そのものにも要件があります。使い捨てのバージンプラスチック製ハンガー、塩素系プラスチック包装、ハングタグの台紙や吊り紐の素材などが対象です。デザインが承認されていても資材が要件に合っていない、という指摘は珍しくありません。",en:"GOTS regulates the packaging itself, not only the wording on it: single-use virgin plastic hangers, chlorinated plastic packaging, the paper and board used for hangtags, and even the fibre in the hangtag string. Approved artwork on non-compliant material is a common and avoidable finding.",zhTW:"GOTS 不僅規範標示文字，亦對包裝材料本身有所要求：一次性原生塑膠衣架、含氯塑膠包裝、吊牌所用紙張與紙板，乃至吊牌繩之纖維成分。設計雖已核准，材料卻不符要求，是常見且可避免之缺失。"},prepare:{ja:["使用している包装資材の一覧（材質が分かるもの）","ハンガー・ポリ袋・台紙・吊り紐の素材証明または仕様書","生分解性プラスチックを使用している場合、その適合根拠","再生紙・認証紙を使用している場合、その証明"],en:["A list of the packaging materials you use, showing what each is made of","Material specifications for hangers, poly bags, backing board and hangtag string","Where bioplastic is used, the basis on which it meets the criteria","Where recycled or certified paper is used, the evidence for it"],zhTW:["所使用包裝材料之清單（載明材質）","衣架、塑膠袋、襯板與吊牌繩之材質證明或規格書","如使用生物可分解塑膠，其符合性依據","如使用再生紙或驗證紙材，其證明文件"]},auditorChecks:{ja:["現物の包装資材を手に取り、仕様書の材質と照合します","供給元から取得した素材証明の日付と対象品番を確認します"],en:["Picks up the actual packaging and checks it against the stated specification","Checks the date and article coverage of the material evidence from your supplier"],zhTW:["取用實際包裝材料，與規格書所載材質比對","確認供應商所提供材質證明之日期與所涵蓋品號"]},siteVerification:!0,clauses:["2.6.2.2","2.6.2.3","2.6.2.4","2.6.2.5","2.6.2.6"],topics:["label_related","b2c_related","final_product_related"]},{id:"label.digitalClaims",category:"labelling",title:{ja:"ウェブサイト・ECサイトでのGOTS表示",en:"GOTS claims on website and e-commerce",zhTW:"網站與電商平台之 GOTS 宣稱"},when:{field:"claims",includesAny:["website","ecommerce"],reason:"na.noDigitalClaims"},why:{ja:"ウェブ上の表示も認証の対象です。「当社はGOTS認証を取得しています」という会社レベルの表現と、「この商品はGOTS認証品です」という製品レベルの表現では、必要な裏付けが異なります。認証範囲外の製品ページに表示が残っているケースが多く見られます。",en:'Online claims are in scope. "Our company is GOTS certified" and "this product is GOTS certified" require different backing, and claims left on pages for products outside the scope are a common finding.',zhTW:"網路上之宣稱亦屬查核範圍。「本公司已取得 GOTS 驗證」與「本產品為 GOTS 驗證產品」所需佐證不同；常見情形為驗證範圍外之產品頁面仍留有相關宣稱。"},prepare:{ja:["GOTS表示があるページのURL一覧","該当ページのスクリーンショット","各表示が認証範囲内の製品かどうかの確認","ECモールに出品している場合はその商品ページも"],en:["List of URLs carrying a GOTS claim","Screenshots of those pages","Confirmation that each claim covers an in-scope product","Marketplace listings too, if you sell through one"],zhTW:["載有 GOTS 宣稱之網頁 URL 清單","各該頁面之截圖","確認各項宣稱所指產品確在驗證範圍內","如有於電商平台銷售，請一併提供商品頁面"]},auditorChecks:{ja:["実際にサイトを開いて表示内容を確認します","認証範囲外の製品にGOTS表示が付いていないかを確認します","会社レベルと製品レベルの表現が混同されていないかを見ます"],en:["Opens the site during the audit and reads what is actually there","Looks for GOTS claims on products outside the scope","Checks that company-level and product-level claims are not blurred"],zhTW:["稽核時實際開啟網站檢視內容","查核驗證範圍外之產品是否標示 GOTS","確認公司層級與產品層級之宣稱未混用"]},clauses:["2.7.7","2.7.8","2.7.9"],topics:["label_related","brand_related"]},{id:"label.marketing",category:"labelling",title:{ja:"広告・カタログ・販促物のGOTS表示",en:"GOTS claims in advertising and marketing",zhTW:"廣告、型錄與促銷物之 GOTS 宣稱"},when:{field:"claims",includesAny:["advertising"],reason:"na.noMarketingClaims"},why:{ja:"広告表現もGOTSの承認対象です。「オーガニック」という言葉を、認証範囲を超えて使っていないかが確認されます。",en:'Advertising wording needs approval too. The check is whether "organic" is being used beyond what the certification actually covers.',zhTW:"廣告用語亦須經核准。查核重點在於「有機」一詞是否超出實際驗證範圍使用。"},prepare:{ja:["GOTS表示のある広告・カタログ・POP等の現物または画像","使用開始時期","承認記録"],en:["Physical or digital copies of advertising, catalogues and point-of-sale material carrying a claim","When each went into use","Approval records"],zhTW:["載有宣稱之廣告、型錄、POP 等實品或影像檔","各項開始使用之時點","核准紀錄"]},auditorChecks:{ja:["認証範囲外の製品が「オーガニック」として宣伝されていないかを確認します"],en:["Checks that products outside the scope are not being advertised as organic"],zhTW:["確認驗證範圍外之產品未以「有機」名義宣傳"]},clauses:["2.7.7","2.7.8","2.7.9"],topics:["label_related","brand_related"]},{id:"label.b2cRules",category:"labelling",title:{ja:"B2C（小売）向け表示要件の確認",en:"B2C retail labelling requirements",zhTW:"B2C（零售）標示要求確認"},when:{all:[{field:"salesChannel",in:["b2c","both"],reason:"na.noB2C"},{field:"sellsFinishedProduct",in:["yes","both"],reason:"na.noFinishedProduct"}]},why:{ja:"一般消費者向けに販売する場合、B2B取引よりも表示要件が厳しくなります。消費者が誤認しない表示になっているか、認証グレードが正しく示されているかが重点的に確認されます。",en:"Selling to consumers brings stricter labelling requirements than B2B. The focus is on whether the consumer could be misled and whether the certification grade is stated correctly.",zhTW:"銷售予一般消費者時，標示要求較 B2B 更為嚴格。查核重點在於標示是否可能造成消費者誤認，以及驗證等級是否正確標示。"},prepare:{ja:["小売向け製品の表示一覧","認証グレード（Organic 95%以上 / Made with organic 70%以上）の区分","消費者向け説明文の内容"],en:["List of labelling used on retail products","Grade split: Organic (95%+) vs Made with organic (70%+)","The consumer-facing explanatory text"],zhTW:["零售產品標示清單","等級區分：Organic（95% 以上）／Made with organic（70% 以上）","對消費者說明之文案內容"]},auditorChecks:{ja:["グレード表示と実際の有機繊維率を計算で照合します","消費者が誤認する表現がないかを確認します"],en:["Recalculates the organic percentage against the grade claimed","Looks for wording a consumer could reasonably misread"],zhTW:["重新計算有機纖維比例並比對所宣稱之等級","檢視是否有可能造成消費者誤解之用語"]},clauses:["2.6.2.1","2.7.2","2.7.3","2.7.4","2.7.5","2.7.6","2.7.8"],topics:["label_related","b2c_related","final_product_related"]}];var O={field:"hasEmployees",eq:"yes",reason:"na.noEmployees"},ya=[{id:"social.policy",category:"social",evidenceType:"policy",title:{ja:"GOTS社会政策",en:"GOTS social policy",zhTW:"GOTS 社會責任政策"},systemUpload:11,why:{ja:"人権の尊重、強制労働・児童労働の禁止、差別の禁止、結社の自由といったGOTSの社会的要件について、会社としての方針を示す文書です。これは出発点であり、方針の文書だけでは要件を満たしたことにはなりません。実際に運用されている記録と、従業員への周知状況が併せて確認されます。",en:"Your company's written position on the GOTS social criteria: human rights, no forced or child labour, no discrimination, freedom of association. It is the starting point only — a policy on its own does not close the requirement. Records of it operating, and evidence workers know about it, are normally reviewed alongside it.",zhTW:"就 GOTS 社會責任要求（尊重人權、禁止強迫勞動與童工、禁止歧視、結社自由等）所訂定之公司政策文件。此僅為起點，單有政策並不足以符合要求；稽核通常會一併查核實際運作紀錄，以及員工是否知悉該政策。"},prepare:{ja:["GOTS社会政策（署名・発行日入り）","従業員への周知方法（掲示・配布・説明会）","周知の実施記録"],en:["The social policy, signed and dated","How it was communicated: notice board, handout, briefing","Record that the communication happened"],zhTW:["GOTS 社會責任政策（含簽署與發行日期）","對員工之公告方式：張貼、發放、說明會","公告執行之紀錄"]},auditorChecks:{ja:["掲示板に実際に掲示されているかを現場で確認します","従業員に方針の内容を知っているか質問します","方針の内容が就業規則と矛盾していないかを読み比べます"],en:["Checks the notice board on site to see whether it is actually posted","Asks workers whether they know what it says","Reads it against the work rules for contradictions"],zhTW:["於現場確認公告欄是否確實張貼","詢問員工是否知悉政策內容","與工作規則相互對照，確認無牴觸之處"]},siteVerification:!0,interviewVerification:!0,clauses:["4.4.1.3","4.4.2.1","4.4.2.2","4.4.3.1","4.4.4.1","4.4.5.1","4.4.6.1"],topics:["social_related"]},{id:"social.codeOfConduct",category:"social",evidenceType:"policy",title:{ja:"行動規範・CSRポリシー",en:"Code of conduct / CSR policy",zhTW:"行為準則／CSR 政策"},why:{ja:"社会政策より広く、取引先や委託先を含めた行動基準を定めたものです。GOTS 7.0では、サプライチェーン全体への働きかけが求められています。",en:"Broader than the social policy: the standards of behaviour you expect of your partners and subcontractors too. GOTS 7.0 expects this to reach into the supply chain.",zhTW:"較社會責任政策更廣，涵蓋對往來廠商與委外單位之行為要求。GOTS 7.0 要求此類要求須延伸至供應鏈。"},prepare:{ja:["行動規範またはCSRポリシー","取引先への周知・同意取得の記録","違反があった場合の対応手順"],en:["Code of conduct or CSR policy","Record that partners were informed and agreed","What happens when it is breached"],zhTW:["行為準則或 CSR 政策","對往來廠商之告知與取得同意之紀錄","違反時之處理程序"]},auditorChecks:{ja:["主要取引先が実際に同意しているかを確認します"],en:["Checks that key partners have actually signed up to it"],zhTW:["確認主要往來廠商確實已同意"]},clauses:["4.4.1.3","4.5.2","4.5.3"],topics:["social_related","governance_related"]},{id:"social.workRules",category:"social",evidenceType:"policy",title:{ja:"就業規則",en:"Work rules / employee handbook",zhTW:"工作規則／員工手冊"},when:O,why:{ja:"労働時間、賃金、休暇、懲戒手続きなどの労働条件を定めた社内規則です。GOTSの社会的要件の多くは、この就業規則の内容が根拠になります。",en:"The internal rules covering hours, pay, leave and disciplinary procedure. Most GOTS social requirements are evidenced through what this document says.",zhTW:"規範工時、工資、休假與懲戒程序等勞動條件之內部規則。多數 GOTS 社會責任要求均以此文件內容為佐證依據。"},prepare:{ja:["就業規則（最新版）","労働者代表の意見書または届出の控え","従業員がいつでも閲覧できる状態にあること","懲戒手続きの規定"],en:["Current work rules","Employee representative comment or filing receipt where required","Evidence workers can access it at any time","The disciplinary procedure"],zhTW:["最新版工作規則","勞方代表意見書或報備文件（如適用）","證明員工可隨時查閱","懲戒程序之規定"]},auditorChecks:{ja:["就業規則の記載と、実際の打刻記録・給与明細が一致しているかを照合します","従業員に、就業規則をどこで見られるか質問します","懲戒手続きが従業員に伝わっているかを確認します"],en:["Compares what the rules say with actual time and pay records","Asks workers where they can read it","Checks the disciplinary procedure has been communicated"],zhTW:["比對工作規則內容與實際出勤及薪資紀錄","詢問員工可於何處查閱","確認懲戒程序已確實傳達予員工"]},interviewVerification:!0,clauses:["4.4.8.1","4.4.4.5","4.4.9.1"],topics:["social_related","employee_related"]},{id:"social.contracts",category:"social",evidenceType:"record",title:{ja:"労働契約書",en:"Employment contracts",zhTW:"勞動契約"},when:O,why:{ja:"一人ひとりの雇用条件が書面で示され、本人が理解できる言語で交付されていることが求められます。外国人労働者がいる場合は、その言語での交付が特に重視されます。",en:"Each worker must have written terms in a language they can actually read. Where you employ foreign workers, the language of the contract gets particular attention.",zhTW:"每位勞工均須取得其可閱讀語言之書面僱用條件。若僱有外籍勞工，合約語言將受特別關注。"},prepare:{ja:["労働契約書（雇用形態ごとに数件）","賃金・労働時間・休日の記載","外国人労働者がいる場合は該当言語版"],en:["Sample employment contracts, a few per employment type","Wage, working hours and rest days stated","A version in the relevant language where you employ foreign workers"],zhTW:["各僱用類型之勞動契約樣本數份","載明工資、工時與休假","如僱有外籍勞工，請提供對應語言版本"]},auditorChecks:{ja:["契約書の条件と実際の給与明細が一致しているかを照合します","従業員に契約内容を理解しているか面談で確認します"],en:["Compares contract terms with actual payslips","Asks workers in interview whether they understand their own terms"],zhTW:["比對契約條件與實際薪資單","透過面談確認勞工是否理解自身契約內容"]},sampled:!0,interviewVerification:!0,clauses:["4.4.8.1","4.4.10.1","4.4.10.2","4.4.11.1","4.4.12.1","4.4.13.1"],topics:["social_related","employee_related"]},{id:"social.timeRecords",periodScoped:!0,category:"social",evidenceType:"record",title:{ja:"打刻記録・勤怠記録",en:"Time and attendance records",zhTW:"出勤／打卡紀錄"},when:O,auditDay:!0,sampled:!0,why:{ja:"実際の労働時間を示す記録です。GOTSでは原則1日8時間・週48時間、残業は自発的で週12時間以内とされています。監査当日に監査員が期間を指定して抽出するため、すぐ取り出せる状態にしておいてください。",en:"The record of hours actually worked. GOTS expects 8 hours a day and 48 a week as the norm, with voluntary overtime capped at 12 hours a week. The auditor will name a period on the day and ask for it immediately — have it retrievable.",zhTW:"呈現實際工時之紀錄。GOTS 原則為每日 8 小時、每週 48 小時，加班須出於自願且每週不超過 12 小時。稽核當天將由稽核員指定期間並要求即時提供，請確保可立即調閱。"},prepare:{ja:["打刻記録（タイムカード・システム出力）","監査対象期間分をすぐ出せる状態","残業時間が分かる形式","休日出勤の記録"],en:["Time records: cards or system export","Covering the audit period, retrievable on the spot","A format that shows overtime clearly","Records of work on rest days"],zhTW:["出勤紀錄：打卡卡或系統匯出","稽核期間資料可即時調閱","格式須可清楚呈現加班時數","假日出勤紀錄"]},auditorChecks:{ja:["監査当日に期間と従業員を指定して抽出を求めます","打刻記録と給与明細の労働時間が一致しているかを照合します","残業が上限を超えていないか、自発的かを面談で確認します","極端に整った記録は、逆に疑われることがあります"],en:["Names a period and specific workers on the day and asks for the records","Cross-checks hours on the time record against hours paid on the payslip","Asks in interview whether overtime is genuinely voluntary","Records that look unnaturally tidy attract more scrutiny, not less"],zhTW:["稽核當天指定期間與特定員工要求調閱","比對出勤紀錄工時與薪資單所載工時","透過面談確認加班是否確實出於自願","過於整齊一致之紀錄反而可能引發進一步查核"]},interviewVerification:!0,clauses:["4.4.9.1","4.4.9.2","4.4.9.3","4.4.8.7","4.4.8.8"],topics:["social_related","employee_related"]},{id:"social.payslips",periodScoped:!0,category:"social",evidenceType:"record",title:{ja:"給与明細・賃金台帳",en:"Payslips and payroll records",zhTW:"薪資單與薪資帳冊"},when:O,auditDay:!0,sampled:!0,why:{ja:"賃金が法定最低賃金以上であること、残業に割増が支払われていること、不当な控除がないことを確認するための記録です。打刻記録と組み合わせて照合されます。",en:"Used to confirm pay is at or above the legal minimum, that overtime carries a premium, and that no unlawful deductions are made. Always cross-checked against the time records.",zhTW:"用以確認工資不低於法定基本工資、加班費依規定加給，且無不當扣款。必定與出勤紀錄交叉比對。"},prepare:{ja:["給与明細（監査当日に指定された月）","賃金台帳","控除項目の内訳と根拠","最低賃金額との比較"],en:["Payslips for the month named on the audit day","Payroll ledger","Breakdown and legal basis for every deduction","Comparison against the legal minimum wage"],zhTW:["稽核當天指定月份之薪資單","薪資帳冊","各項扣款之明細與法令依據","與法定基本工資之比對"]},auditorChecks:{ja:["打刻記録の労働時間と、支払われた賃金を計算して照合します","控除項目に法的根拠のないものがないかを確認します","従業員に、明細の内容を理解しているか質問します"],en:["Recalculates pay from the hours on the time record","Looks for deductions with no legal basis","Asks workers whether they understand their own payslip"],zhTW:["依出勤紀錄工時重新計算應付工資並比對","查核是否存在無法令依據之扣款","詢問員工是否理解自身薪資單內容"]},interviewVerification:!0,clauses:["4.4.8.2","4.4.8.4","4.4.8.5","4.4.8.6","4.4.8.7","4.4.8.8"],topics:["social_related","employee_related"]},{id:"social.livingWage",category:"social",evidenceType:"implementation",title:{ja:"生活賃金の計算と賃金格差の計画",en:"Living wage calculation and wage gap plan",zhTW:"生活工資計算與工資差距計畫"},when:O,why:{ja:"GOTS 7.0で新たに求められるようになった項目です。地域の生活賃金を算出し、自社の賃金と比較して差（賃金格差）を把握し、それを埋める計画を立てることが求められます。現時点で格差があること自体は指摘になりませんが、計算も計画もない状態は指摘になります。",en:"New in GOTS 7.0. You must calculate the living wage for your region, compare it with what you pay, identify the gap and have a plan to close it. Having a gap is not itself a finding; having neither a calculation nor a plan is.",zhTW:"GOTS 7.0 新增之要求。須計算所在地區之生活工資，與公司實際工資比較以掌握差距，並訂定弭平計畫。目前存在差距本身並非不符合事項，但若既無計算亦無計畫則構成不符合。"},prepare:{ja:["生活賃金の計算（算出根拠を含む）","自社の賃金水準との比較","賃金格差を埋める計画（期間と方法）","経営層の承認"],en:["Living wage calculation, including the basis used","Comparison with your own wage levels","A plan to close the gap, with timeframe and method","Management sign-off"],zhTW:["生活工資計算（含計算依據）","與公司工資水準之比較","弭平差距之計畫（期程與方法）","經營階層之核准"]},auditorChecks:{ja:["計算の根拠となったデータの出所を質問します","計画が具体的な期限と手段を持っているかを見ます"],en:["Asks where the data behind the calculation came from","Checks the plan has an actual deadline and mechanism"],zhTW:["詢問計算所依據資料之來源","確認計畫是否具體載明期限與作法"]},clauses:["4.4.8.9","4.4.8.10"],topics:["social_related","employee_related"]},{id:"social.leave",periodScoped:!0,category:"social",evidenceType:"record",title:{ja:"休暇・休日の取得記録",en:"Leave and rest day records",zhTW:"休假與例假紀錄"},when:O,why:{ja:"有給休暇が実際に取得できているか、週1日の休日が確保されているかを示す記録です。制度があっても取得実績がなければ、運用されていないと判断されます。",en:"Shows that paid leave is actually taken and that one rest day in seven is real. A policy with no uptake reads as a policy that does not operate.",zhTW:"證明特休確實有被使用，且每七日至少一日之休息確實落實。若制度存在但無使用紀錄，將被認定為未實際運作。"},prepare:{ja:["有給休暇の付与・取得記録","休日出勤があった場合の代休記録","法定休暇（産休・育休等）の取得記録"],en:["Records of leave granted and taken","Compensatory rest where a rest day was worked","Statutory leave records: maternity, parental"],zhTW:["特別休假給予與使用紀錄","假日出勤時之補休紀錄","法定假別（產假、育嬰假等）之使用紀錄"]},auditorChecks:{ja:["取得率が極端に低い場合、その理由を面談で確認します","7日に1日の休日が確保されているかを打刻記録から確認します"],en:["Where uptake is very low, asks why in interview","Checks the time records for one rest day in every seven"],zhTW:["若使用率極低，將透過面談了解原因","自出勤紀錄確認每七日至少有一日休息"]},interviewVerification:!0,clauses:["4.4.9.2","4.4.8.2"],topics:["social_related","employee_related"]},{id:"social.insurance",periodScoped:!0,category:"social",evidenceType:"record",title:{ja:"社会保険・労働保険の加入確認",en:"Social and labour insurance enrolment",zhTW:"社會保險與勞工保險加保證明"},when:O,why:{ja:"法定の社会保険・労災保険に従業員が加入していることを示します。在宅ワーカーやパートを含め、対象者が漏れていないかが確認されます。",en:"Evidence that workers are enrolled in the statutory insurance schemes. The check includes part-timers and homeworkers, who are the usual omission.",zhTW:"證明員工已依法加入法定社會保險與職災保險。查核範圍包含兼職與家庭代工人員，此類人員最常被遺漏。"},prepare:{ja:["社会保険・労働保険の加入者名簿","保険料納付の記録","対象外とした従業員がいる場合はその理由"],en:["List of enrolled workers","Evidence that contributions were paid","The reason for anyone excluded"],zhTW:["加保人員名冊","保費繳納紀錄","如有未納保人員，請說明原因"]},auditorChecks:{ja:["従業員名簿と加入者名簿を突き合わせ、漏れがないかを確認します"],en:["Compares the employee list with the enrolment list, looking for gaps"],zhTW:["比對員工名冊與加保名冊，確認有無遺漏"]},clauses:["4.4.7.12","4.4.8.2"],topics:["social_related","employee_related"]},{id:"social.grievanceMechanism",periodScoped:!0,category:"social",evidenceType:"implementation",title:{ja:"内部通報制度・苦情申立の仕組み",en:"Grievance and whistleblowing mechanism",zhTW:"內部申訴與檢舉機制"},why:{ja:"従業員が不利益を受けずに問題を申し出られる窓口があることを示します。GOTSでは、匿名で申し出られること、報復を受けないことが特に重視されます。使われていない制度は、機能していないと見られることがあります。",en:"A route by which a worker can raise a problem without being punished for it. GOTS pays particular attention to anonymity and to protection from retaliation. A mechanism nobody has ever used can be read as one that does not work.",zhTW:"提供員工得於不受不利對待之情況下反映問題之管道。GOTS 特別重視匿名申訴與免於報復之保障。從未被使用之機制，可能被視為未實際運作。"},prepare:{ja:["内部通報制度の規程","窓口の周知方法（掲示・カード配布等）","受け付けた申立と対応の記録","匿名で申し出る方法"],en:["Written grievance procedure","How the channel is publicised: notice, card, poster","Log of cases received and how they were handled","The route for raising something anonymously"],zhTW:["內部申訴制度規章","管道之公告方式：公告、卡片、海報等","受理案件及處理情形之紀錄","匿名反映之途徑"]},auditorChecks:{ja:["従業員に、問題があったときどこに言えばよいか質問します","申立が1件もない場合、その理由を確認します","申立者が特定されない仕組みかを確認します"],en:["Asks workers where they would go with a problem","Where there have been no cases at all, asks why","Checks whether the process actually protects the identity of the person raising it"],zhTW:["詢問員工遇到問題時應向何處反映","若完全無案件紀錄，將了解其原因","確認流程是否確實保護申訴人身分"]},interviewVerification:!0,clauses:["4.4.13.3","4.4.13.4","4.4.13.5","4.4.13.6","4.4.13.7","4.4.4.3"],topics:["social_related"]},{id:"social.workerInterview",category:"social",evidenceType:"interview",title:{ja:"従業員面談（監査当日）",en:"Worker interviews (on the audit day)",zhTW:"員工面談（稽核當天）"},when:O,auditDay:!0,interviewVerification:!0,why:{ja:"書類ではなく、監査員が従業員から直接話を聞く時間です。書類の内容と面談内容に食い違いがある場合は、書類の側がより詳しく確認されます。事前に「正しい答え」を教える行為は、通常、重大な指摘として扱われます。従業員が普段どおり答えられる状態にしておくことが基本です。",en:"Not a document — time in which the auditor talks to workers directly. Where the paperwork and the interviews disagree, it is the paperwork that gets examined more closely. Coaching workers on what to say is normally treated as a serious finding; the sound position is workers answering as they normally would.",zhTW:"此非文件，而是稽核員直接與員工談話之時段。若文件與面談內容不一致，將對文件進行更詳細之查核。事先教導員工「標準答案」通常會被視為重大不符合事項；正確作法是讓員工如實作答。"},prepare:{ja:["従業員名簿（部署・雇用形態が分かるもの）","面談用の個室またはプライバシーが保てる場所","外国人労働者がいる場合は通訳の手配","面談時間を勤務時間として扱うこと"],en:["Employee list showing department and employment type","A private room or a place where privacy can be kept","An interpreter where you employ foreign workers","Interview time counted as working time"],zhTW:["員工名冊（可辨識部門與僱用類型）","可確保隱私之獨立空間","如僱有外籍勞工，請安排通譯","面談時間應計入工作時間"]},auditorChecks:{ja:["監査員が従業員を無作為に選びます。会社側の同席はありません","労働時間、賃金、休暇、ハラスメント、通報窓口について質問します","回答が全員同じ言い回しの場合、事前指導を疑います"],en:["The auditor selects workers at random; management does not sit in","Asks about hours, pay, leave, harassment and the grievance channel","Identical phrasing from every worker suggests coaching"],zhTW:["由稽核員隨機選定員工，公司代表不會在場","詢問工時、工資、休假、騷擾及申訴管道等事項","若所有員工回答用語一致，將被懷疑事前教導"]},clauses:["4.4.2.2","4.4.3.1","4.4.6.1","4.4.8.6","4.4.11.2","4.4.11.3","4.4.11.4"],topics:["social_related","employee_related"]},{id:"social.foreignWorkers",category:"social",evidenceType:"implementation",title:{ja:"外国人労働者に関する記録",en:"Records for foreign and migrant workers",zhTW:"外籍勞工相關紀錄"},when:{all:[O,{field:"workerForeign",eq:"yes",reason:"na.noForeignWorkers"}]},why:{ja:"GOTSは、外国人労働者について特に注意深く確認します。パスポートや身分証を会社が預かっていないこと、手数料を労働者に負担させていないこと、理解できる言語で契約が交わされていることが重点です。技能実習生を受け入れている場合も同じ確認が行われます。",en:"GOTS looks especially closely at migrant workers: that the company does not hold their passports or ID, that no recruitment fees were charged to them, and that their contract is in a language they understand. The same applies to technical intern trainees.",zhTW:"GOTS 對外籍勞工之查核特別嚴謹，重點在於公司未扣留其護照或身分證件、未由勞工負擔仲介費用，且契約以其可理解之語言簽訂。技能實習生亦適用相同查核。"},prepare:{ja:["母国語または理解できる言語の労働契約書","在留資格・就労許可の確認記録","手数料・保証金を徴収していないことの確認","パスポート・身分証を本人が保管していることの確認","生活支援・相談窓口の体制"],en:["Employment contract in a language the worker understands","Records of visa and work permit checks","Confirmation that no fee or deposit was taken from the worker","Confirmation that workers keep their own passports and ID","Support and consultation arrangements"],zhTW:["以勞工可理解語言簽訂之勞動契約","居留與工作許可之查核紀錄","確認未向勞工收取費用或保證金","確認護照與身分證件由勞工本人保管","生活支援與諮詢窗口之安排"]},auditorChecks:{ja:["外国人労働者に、通訳を通じて直接面談します","パスポートを自分で持っているかを本人に確認します","来日・入社時に費用を払ったかを質問します","契約内容を理解しているかを確認します"],en:["Interviews migrant workers directly, through an interpreter","Asks the worker personally whether they hold their own passport","Asks whether they paid anything to get the job","Checks they understand their own contract"],zhTW:["透過通譯直接與外籍勞工面談","直接向勞工確認護照是否由本人保管","詢問求職過程中是否曾支付費用","確認其是否理解自身契約內容"]},interviewVerification:!0,clauses:["4.4.2.4","4.4.2.5","4.4.10.1","4.4.10.2","4.4.11.1"],topics:["social_related","employee_related"]},{id:"social.youngWorkers",category:"social",evidenceType:"implementation",title:{ja:"18歳未満の労働者に関する記録",en:"Records for workers under 18",zhTW:"未滿 18 歲勞工相關紀錄"},when:{all:[O,{field:"workerUnder18",eq:"yes",reason:"na.noYoungWorkers"}]},why:{ja:"18歳未満の労働者には、労働時間の上限、夜間労働の禁止、危険作業の禁止といった追加の保護が適用されます。GOTSでは、年齢確認の仕組みがあることも確認されます。",en:"Workers under 18 have extra protections: limits on hours, no night work, no hazardous tasks. GOTS also checks that you have a working method of verifying age.",zhTW:"未滿 18 歲之勞工適用額外保護：工時上限、禁止夜間工作、禁止從事危險作業。GOTS 亦會查核公司是否具備確實之年齡查驗機制。"},prepare:{ja:["年齢確認の記録（採用時）","18歳未満の労働者の一覧と担当業務","労働時間（1日8時間以内・時間外禁止）の記録","教育機会が確保されていることの説明"],en:["Age verification records taken at hiring","List of workers under 18 and what they do","Hours records showing 8 hours a day and no overtime","How continued education is made possible"],zhTW:["聘僱時之年齡查驗紀錄","未滿 18 歲勞工名冊及其工作內容","每日 8 小時以內且無加班之工時紀錄","說明如何確保其持續受教育之機會"]},auditorChecks:{ja:["担当業務が危険作業に該当しないかを現場で確認します","打刻記録から夜間労働・時間外労働がないかを確認します"],en:["Checks on site that the tasks are not hazardous","Reads the time records for night work or overtime"],zhTW:["於現場確認其工作內容不屬危險作業","自出勤紀錄查核有無夜間工作或加班"]},siteVerification:!0,clauses:["4.4.3.1","4.4.3.2","4.4.3.3","4.4.3.4","4.4.3.5"],topics:["social_related","employee_related"]},{id:"social.agencyWorkers",category:"social",evidenceType:"record",title:{ja:"派遣・有期契約労働者に関する記録",en:"Records for agency and temporary workers",zhTW:"派遣與定期契約勞工相關紀錄"},when:{all:[O,{any:[{field:"workerAgency",eq:"yes"},{field:"workerTemporary",eq:"yes"}],reason:"na.noAgencyWorkers"}]},why:{ja:"派遣や有期契約が、正規雇用を避けるために反復して使われていないかが確認されます。GOTSは「不安定な雇用の回避」を明示的に求めています。",en:"The check is whether temporary and agency arrangements are being used repeatedly to avoid permanent employment. GOTS explicitly asks that precarious employment be avoided.",zhTW:"查核重點在於是否重複使用派遣或定期契約以規避正式僱用。GOTS 明確要求應避免不安定僱用。"},prepare:{ja:["派遣元との契約書","有期契約の更新履歴","派遣・有期労働者の労働条件（正社員との比較）","派遣元での社会保険加入状況"],en:["Contract with the agency","Renewal history for fixed-term contracts","Terms for temporary staff compared with permanent staff","Insurance enrolment on the agency side"],zhTW:["與派遣公司之合約","定期契約之續約紀錄","派遣／定期人員與正職人員之勞動條件比較","派遣公司端之保險加保情形"]},auditorChecks:{ja:["同じ人が短期契約を何度も更新していないかを確認します","派遣労働者にも直接面談します"],en:["Looks for the same individual on repeatedly renewed short contracts","Interviews agency workers directly as well"],zhTW:["查核是否有同一人反覆續簽短期契約之情形","亦直接與派遣人員進行面談"]},interviewVerification:!0,clauses:["4.4.10.1","4.4.10.2","4.4.12.1"],topics:["social_related","employee_related"]},{id:"social.homeworkers",category:"social",evidenceType:"implementation",title:{ja:"在宅ワーカー・内職者の保護",en:"Protection for homeworkers",zhTW:"家庭代工人員之保障"},when:{all:[O,{field:"workerHomeworkers",eq:"yes",reason:"na.noHomeworkers"}]},why:{ja:"在宅で作業する人にも、工場で働く人と同等の保護が求められます。工賃の水準、安全、社会保険が確認の対象です。",en:"People working at home must receive the same level of protection as those on the factory floor. Piece rates, safety and insurance are all in scope.",zhTW:"在家作業之人員應獲得與廠內勞工同等之保障，計件工資水準、安全與保險均屬查核範圍。"},prepare:{ja:["在宅ワーカーの一覧","工賃の計算方法（工場内と同等であること）","作業内容と安全上の配慮","保険加入状況"],en:["List of homeworkers","How the piece rate is set, and how it compares with in-house rates","What they do and the safety considerations","Insurance status"],zhTW:["家庭代工人員名冊","計件工資之計算方式及與廠內之比較","作業內容與安全考量","保險加保情形"]},auditorChecks:{ja:["工賃が工場内の同等作業と比べて低くないかを計算します","在宅ワーカーにも面談することがあります"],en:["Calculates whether the rate is below the equivalent in-house rate","May interview homeworkers as well"],zhTW:["計算其工資是否低於廠內同等作業之水準","可能一併與家庭代工人員面談"]},clauses:["4.4.7.12","4.4.8.3"],topics:["social_related","employee_related"]},{id:"social.dormitory",category:"social",evidenceType:"site",title:{ja:"寮・宿舎の管理記録",en:"Dormitory and accommodation records",zhTW:"宿舍管理紀錄"},when:{all:[O,{field:"facilityDormitory",eq:"yes",reason:"na.noDormitory"}]},why:{ja:"会社が提供する宿舎は、清潔で安全であり、基本的な生活ニーズを満たす必要があります。また、入居が強制されていないことも確認されます。",en:"Company accommodation must be clean, safe and meet basic needs — and living there must not be compulsory.",zhTW:"公司提供之宿舍須清潔、安全並滿足基本生活需求，且不得強制入住。"},prepare:{ja:["宿舎の所在地と収容人数","入居規則（任意であることが分かるもの）","費用の負担方法","消防設備・避難経路の点検記録"],en:["Location and capacity of the accommodation","House rules showing residence is voluntary","How costs are handled","Fire equipment and escape route inspection records"],zhTW:["宿舍位置與可容納人數","住宿規則（可證明入住為自願）","費用負擔方式","消防設備與逃生動線之檢查紀錄"]},auditorChecks:{ja:["宿舎を実際に訪問して確認することがあります","入居者に、入居が任意かどうかを直接質問します"],en:["May visit the accommodation in person","Asks residents directly whether living there is voluntary"],zhTW:["可能實地查訪宿舍","直接詢問住宿者入住是否出於自願"]},siteVerification:!0,interviewVerification:!0,clauses:["4.4.7.14","4.4.2.6"],topics:["social_related","ohs_related"]},{id:"social.transport",category:"social",evidenceType:"implementation",title:{ja:"会社送迎の運用記録",en:"Company transport arrangements",zhTW:"公司交通接送安排"},when:{all:[O,{field:"facilityTransport",eq:"yes",reason:"na.noTransport"}]},why:{ja:"会社が提供する送迎について、利用が強制されていないこと、費用が不当に控除されていないことが確認されます。",en:"The checks are that using company transport is not compulsory and that the cost is not deducted unfairly.",zhTW:"查核重點為搭乘公司交通工具非屬強制，且相關費用未被不當扣除。"},prepare:{ja:["送迎の運用ルール","費用負担の説明","利用が任意であることの周知"],en:["How the transport is operated","How costs are handled","Evidence that use is optional"],zhTW:["交通接送之運作規則","費用負擔之說明","證明搭乘為自願之公告"]},auditorChecks:{ja:["給与明細に送迎費の控除がないかを確認します","従業員に、利用が任意かを質問します"],en:["Looks for transport deductions on the payslip","Asks workers whether use is optional"],zhTW:["檢視薪資單是否有交通費扣款","詢問員工搭乘是否為自願"]},interviewVerification:!0,clauses:["4.4.2.6"],topics:["social_related","employee_related"]},{id:"social.canteen",category:"ohs",evidenceType:"site",title:{ja:"食事施設の衛生管理",en:"Food preparation and storage hygiene",zhTW:"餐飲設施衛生管理"},when:{all:[O,{field:"facilityCanteen",eq:"yes",reason:"na.noCanteen"}]},why:{ja:"会社が食事の調理や保管の場所を提供している場合、その衛生状態が確認対象になります。食堂だけでなく、給湯室や共用の冷蔵庫も含まれます。",en:"Where the company provides somewhere to prepare or store food, its hygiene is examined. This covers not only a canteen but also shared kitchens and refrigerators.",zhTW:"若公司提供調理或存放食物之場所，其衛生狀況將納入查核，範圍不限於員工餐廳，亦包含茶水間與共用冰箱。"},prepare:{ja:["食堂・調理場の清掃記録","必要な営業許可・衛生管理者の届出（該当する場合）","飲料水の水質確認"],en:["Cleaning records for the canteen or kitchen area","Any required food hygiene permit or appointed person, where applicable","Confirmation that drinking water is potable"],zhTW:["員工餐廳或調理區之清潔紀錄","如適用，相關食品衛生許可或衛生管理人員指派","飲用水水質確認"]},auditorChecks:{ja:["調理・保管の場所を実際に見て、清潔さと分別状況を確認します","飲料水が利用できる状態かを確認します"],en:["Inspects the preparation and storage area for cleanliness and separation","Checks that drinking water is actually available"],zhTW:["實地查看調理與存放區域之清潔與區隔情形","確認飲用水確實可供取用"]},siteVerification:!0,clauses:["4.4.7.13"],topics:["ohs_related"]},{id:"social.childcare",category:"social",evidenceType:"site",title:{ja:"託児施設の運用",en:"Childcare facilities",zhTW:"托兒設施"},when:{all:[O,{field:"facilityChildcare",eq:"yes",reason:"na.noChildcare"}]},why:{ja:"会社が託児施設を提供している場合、その安全性と、利用が家庭責任を持つ従業員の不利益にならないことが確認されます。GOTS 7.0では、家庭責任を有する労働者の保護が明示されています。",en:"Where childcare is provided, its safety is examined along with whether using it puts workers with family responsibilities at any disadvantage. GOTS 7.0 explicitly protects workers with family responsibilities.",zhTW:"若公司提供托兒設施，將查核其安全性，以及使用該設施是否會使負有家庭責任之勞工受到不利對待。GOTS 7.0 明訂應保障負有家庭責任之勞工。"},prepare:{ja:["託児施設の概要（場所・定員・運営者）","安全点検の記録","利用条件と費用負担の説明"],en:["Overview of the facility: location, capacity, who runs it","Safety inspection records","Who may use it and how costs are handled"],zhTW:["托兒設施概要：地點、可容納人數、營運者","安全檢查紀錄","使用條件與費用負擔說明"]},auditorChecks:{ja:["施設の安全状況を確認します","利用している従業員に、条件や費用について質問することがあります"],en:["Checks the safety of the facility","May ask workers who use it about the conditions and cost"],zhTW:["查核設施之安全狀況","可能詢問使用之員工有關條件與費用之情形"]},siteVerification:!0,clauses:["4.4.5.3","4.4.5.6"],topics:["social_related","employee_related"]},{id:"ohs.procedure",category:"ohs",evidenceType:"policy",title:{ja:"労働安全衛生管理規程",en:"Occupational health and safety procedure",zhTW:"職業安全衛生管理規章"},when:O,systemUpload:15,why:{ja:"職場の危険をどう特定し、どう減らしているかを定めた規程です。GOTSでは、責任者を上級管理職から指名することが明示的に求められています。",en:"The written approach to identifying and reducing workplace hazards. GOTS explicitly requires that responsibility be assigned to a senior management representative.",zhTW:"訂定如何辨識並降低職場危害之規章。GOTS 明確要求須由高階管理階層代表擔任權責主管。"},prepare:{ja:["労働安全衛生管理規程","安全衛生責任者の任命（上級管理職）","危険源の特定と対策の記録","事故・ヒヤリハットの記録"],en:["Written OHS procedure","Appointment of a senior management OHS representative","Hazard identification and control records","Accident and near-miss records"],zhTW:["職業安全衛生管理規章","高階管理階層之安全衛生負責人指派","危害辨識與控制措施紀錄","事故與虛驚事件紀錄"]},auditorChecks:{ja:["特定された危険源が、現場の実態と合っているかを確認します","事故が発生した場合の対応と再発防止策を確認します"],en:["Checks the identified hazards against what is actually on the floor","Follows an accident through to the preventive action taken"],zhTW:["比對所辨識之危害與現場實際情形","追蹤事故發生後之處理及再發防止措施"]},siteVerification:!0,clauses:["4.4.7.1","4.4.7.2","4.4.7.3","4.4.7.4","4.4.7.10","4.4.7.15"],topics:["ohs_related","employee_related"]},{id:"ohs.fireSafety",periodScoped:!0,category:"ohs",evidenceType:"record",title:{ja:"消防設備の点検記録と避難訓練記録",en:"Fire safety inspection and evacuation drill records",zhTW:"消防設備檢查與消防演練紀錄"},when:O,systemUpload:15,why:{ja:"社会・安全衛生の分野で指摘が出やすい領域のひとつです。消防設備の法定点検、避難訓練の実施記録、非常口が施錠されておらず障害物がないことが確認されます。非常口の前に荷物が置かれている状態は、それだけでも指摘の対象になり得ます。",en:"One of the areas where findings arise most often in the social and safety part of the audit. Statutory fire equipment inspection, evacuation drill records, and emergency exits that are unlocked and unobstructed. Boxes stacked in front of a fire exit can be raised on its own.",zhTW:"此為社會責任與安全衛生查核中較常開立不符合事項之領域。查核項目包含消防設備法定檢查、消防演練紀錄，以及緊急出口未上鎖且無阻礙。緊急出口前堆放物品，單此一項即可能被開立不符合事項。"},prepare:{ja:["消防設備点検結果報告書（法定点検）","避難訓練の実施記録（日付・参加者）","避難経路図の掲示","非常口の状態（施錠・障害物がないこと）","消火器の点検記録"],en:["Statutory fire equipment inspection report","Evacuation drill records with dates and attendees","Posted evacuation route maps","Emergency exits unlocked and clear","Fire extinguisher inspection records"],zhTW:["消防設備檢查結果報告書（法定檢查）","消防演練紀錄（日期與參加人員）","張貼之逃生動線圖","緊急出口未上鎖且無阻礙","滅火器檢查紀錄"]},auditorChecks:{ja:["非常口を実際に開けてみます","避難経路に障害物がないかを歩いて確認します","訓練記録の参加者と実際の従業員数を比較します","消火器の設置場所と点検期限を確認します"],en:["Physically tries the emergency exits","Walks the escape routes looking for obstructions","Compares drill attendance against actual headcount","Checks extinguisher locations and inspection dates"],zhTW:["實際開啟緊急出口測試","走訪逃生動線確認有無阻礙","比對演練出席人數與實際員工數","查核滅火器設置位置與檢查期限"]},siteVerification:!0,clauses:["4.4.7.7","4.4.7.8","4.4.7.9"],topics:["ohs_related"]},{id:"ohs.healthCheck",periodScoped:!0,category:"ohs",evidenceType:"record",title:{ja:"健康診断の実施記録",en:"Health check records",zhTW:"健康檢查紀錄"},when:O,why:{ja:"法定の健康診断が実施されていることを示します。化学品を扱う工程がある場合は、特殊健康診断も対象になります。",en:"Evidence that statutory health checks are carried out. Where chemicals are handled, specialised health checks apply as well.",zhTW:"證明已實施法定健康檢查。若有接觸化學品之作業，另適用特殊健康檢查。"},prepare:{ja:["健康診断の実施記録（受診者一覧）","実施頻度が法定どおりであること","化学品取扱者の特殊健康診断"],en:["Health check records with the list of those examined","Frequency matching the legal requirement","Specialised checks for those handling chemicals"],zhTW:["健康檢查紀錄（受檢人員名冊）","檢查頻率符合法令規定","化學品作業人員之特殊健康檢查"]},auditorChecks:{ja:["従業員名簿と受診者一覧を照合し、未受診者がいないかを確認します"],en:["Compares the employee list with those examined, looking for anyone missed"],zhTW:["比對員工名冊與受檢名冊，確認有無漏檢人員"]},clauses:["4.4.7.6","4.4.7.5"],topics:["ohs_related","employee_related"]},{id:"ohs.firstAid",category:"ohs",evidenceType:"site",title:{ja:"救急・医療体制",en:"First aid and medical arrangements",zhTW:"急救與醫療照護安排"},when:O,why:{ja:"応急処置ができる体制があることを示します。救急箱の設置、訓練を受けた担当者、医療機関との連携が確認されます。",en:"Shows there is a working first aid capability: a stocked kit, someone trained to use it, and a route to medical help.",zhTW:"證明具備可運作之急救能力：備妥急救箱、有受訓人員，並有就醫管道。"},prepare:{ja:["救急箱の設置場所と中身の点検記録","応急処置の訓練を受けた担当者","産業医または提携医療機関","労災発生時の連絡体制"],en:["Location and stock check records for first aid kits","Who is trained in first aid","Occupational physician or contracted clinic","The escalation route when an injury occurs"],zhTW:["急救箱設置位置與內容物檢查紀錄","受過急救訓練之人員","職業醫學醫師或特約醫療院所","職災發生時之通報流程"]},auditorChecks:{ja:["救急箱を実際に開けて中身と使用期限を確認します","従業員に、けがをしたときどうするか質問します"],en:["Opens the first aid kit and checks contents and expiry dates","Asks workers what they would do if injured"],zhTW:["實際開啟急救箱檢視內容物與有效期限","詢問員工受傷時之處理方式"]},siteVerification:!0,interviewVerification:!0,clauses:["4.4.7.5","4.4.7.13"],topics:["ohs_related"]},{id:"ohs.siteConditions",category:"ohs",evidenceType:"site",title:{ja:"職場環境の現地確認",en:"Workplace conditions — site walkthrough",zhTW:"職場環境現場查核"},when:O,why:{ja:"書類ではなく、監査員が実際に歩いて見る項目です。トイレ、飲料水、休憩・食事の場所、照明、換気、安全標識が対象です。事前に一度、自分たちで同じ目線で見ておくことをおすすめします。",en:"Not paperwork — what the auditor sees while walking the site: toilets, drinking water, places to rest and eat, lighting, ventilation and safety signage. Worth walking it yourself first, with the same eyes.",zhTW:"此非文件項目，而是稽核員實地走訪所見：廁所、飲用水、休息與用餐空間、照明、通風及安全標示。建議事前以相同角度自行巡查一次。"},prepare:{ja:["清潔なトイレと手洗い設備","飲料水へのアクセス","休憩・食事のできる場所","安全標識（ピクトグラム付き・作業者の言語）","通路・非常口の確保"],en:["Clean toilets and washing facilities","Access to drinking water","Somewhere to rest and eat","Safety signage with pictograms, in the workers' languages","Clear walkways and exits"],zhTW:["清潔之廁所與盥洗設施","可取得飲用水","可供休息與用餐之場所","含圖示且以勞工語言標示之安全標誌","通道與出口保持暢通"]},auditorChecks:{ja:["作業場・トイレ・休憩室・倉庫を一通り歩きます","安全標識が作業者の言語で表示されているかを確認します","気づいた点をその場で写真に記録することがあります"],en:["Walks the production floor, toilets, break area and stores","Checks safety signage is in a language the workers read","May photograph what is observed on the spot"],zhTW:["走訪作業區、廁所、休息室與倉庫","確認安全標示以勞工可閱讀之語言呈現","可能於現場拍照記錄所見情形"]},siteVerification:!0,clauses:["4.4.7.13","4.4.7.10","4.4.7.1"],topics:["ohs_related"]},{id:"ohs.chemicalTraining",category:"ohs",evidenceType:"record",title:{ja:"化学物質・危険物の取扱訓練記録",en:"Chemical and hazardous material handling training",zhTW:"化學品與危險物操作訓練紀錄"},when:{all:[{any:[{field:"doesProcessing",eq:"yes"},{field:"outsources",eq:"yes"}],reason:"na.noProcessing"},{field:"chemicalUse",eq:"yes",reason:"na.noChemical"}]},why:{ja:"薬剤や危険物を扱う作業者に、取扱いと廃棄について訓練を行った記録が求められます。保護具の使用も併せて確認されます。",en:"Records of training given to anyone handling chemicals or hazardous materials, covering both use and disposal. Personal protective equipment is checked alongside.",zhTW:"須留存對操作化學品或危險物人員之訓練紀錄，內容涵蓋使用與廢棄處理，並一併查核個人防護具之使用。"},prepare:{ja:["訓練の実施記録（日付・参加者・内容）","保護具の支給記録","保護具の着用状況"],en:["Training records: date, attendees, content","PPE issue records","Evidence PPE is actually worn"],zhTW:["訓練紀錄（日期、參加人員、內容）","防護具發放紀錄","防護具實際佩戴情形之佐證"]},auditorChecks:{ja:["現場で保護具が実際に着用されているかを確認します","作業者に、薬剤の危険性について質問します"],en:["Checks on the floor whether PPE is actually being worn","Asks workers about the hazards of the chemicals they use"],zhTW:["於現場確認防護具是否確實佩戴","詢問作業人員所使用藥劑之危害性"]},siteVerification:!0,interviewVerification:!0,clauses:["4.4.7.6","4.4.7.11"],topics:["ohs_related","chemical_related"]},{id:"capa.complaintProcedure",periodScoped:!0,category:"complaint",evidenceType:"implementation",title:{ja:"苦情処理の手順と記録",en:"Complaint handling procedure and log",zhTW:"申訴處理程序與紀錄"},why:{ja:"顧客・従業員・外部から苦情を受けたときの受付、調査、回答の手順です。GOTSに関する苦情は特に、認証機関への報告が必要になる場合があります。",en:"How complaints from customers, workers or outside parties are received, investigated and answered. Complaints touching on GOTS itself may need reporting to the certification body.",zhTW:"受理、調查與回覆來自客戶、員工或外部申訴之程序。涉及 GOTS 之申訴，可能須通報驗證機構。"},prepare:{ja:["苦情処理の手順書","苦情受付台帳（発生から解決まで）","苦情がない場合はその旨の記録"],en:["Written complaint procedure","Complaint log from receipt to closure","A record stating there have been none, if that is the case"],zhTW:["申訴處理程序書","申訴受理登記表（自受理至結案）","若無申訴案件，亦應留存說明紀錄"]},auditorChecks:{ja:["苦情が実際に記録されているかを確認します","解決までの期間が妥当かを見ます"],en:["Checks complaints are genuinely being logged","Looks at how long they take to close"],zhTW:["確認申訴確實有留存紀錄","檢視結案所需時間是否合理"]},clauses:["4.4.13.3","4.4.13.4","4.5.9"],topics:["governance_related"]},{id:"capa.correctiveActions",periodScoped:!0,category:"complaint",evidenceType:"record",title:{ja:"是正処置（CAPA）の記録",en:"Corrective and preventive action (CAPA) records",zhTW:"矯正與預防措施（CAPA）紀錄"},aka:"Corrective and Preventive Action (CAPA)",why:{ja:"前回監査の指摘、内部監査の発見事項、苦情に対して、何をいつまでに直したかの記録です。原因を分析せずに「注意しました」で終わっている是正は、繰り返し指摘の原因になります。",en:'What was fixed, by when, in response to audit findings, internal audit results and complaints. A corrective action that stops at "we reminded staff" without root cause analysis is why the same finding comes back next year.',zhTW:"針對稽核不符合事項、內部稽核發現與申訴，記錄改善內容與完成期限。若矯正措施僅止於「已提醒同仁」而未分析根因，即為同一問題反覆發生之主因。"},prepare:{ja:["前回監査の指摘事項と是正記録","原因分析の内容","再発防止策と、その効果の確認","是正の完了日と確認者"],en:["Previous audit findings and the corrective records","The root cause analysis","Preventive action and how effectiveness was verified","Completion date and who verified it"],zhTW:["前次稽核不符合事項與矯正紀錄","根因分析內容","再發防止措施及其成效確認","完成日期與確認人員"]},auditorChecks:{ja:["前回の指摘が本当に解消しているかを、現場と記録の両方で確認します","同じ指摘が繰り返されていないかを見ます","原因分析が表面的でないかを質問します"],en:["Verifies previous findings are genuinely closed, on the floor as well as on paper","Looks for the same finding recurring","Challenges a root cause analysis that stops at the surface"],zhTW:["自現場與紀錄雙重確認前次不符合事項確實已改善","檢視是否有相同不符合事項重複發生","就流於表面之根因分析提出詢問"]},clauses:["4.5.4","4.5.5","4.5.6","2.5.2"],topics:["governance_related"]},{id:"capa.conductAgreement",category:"complaint",evidenceType:"record",title:{ja:"行動規範契約書（監査当日提供）",en:"Code of conduct agreement (provided on the audit day)",zhTW:"行為準則契約書（稽核當天提供）"},auditDay:!0,why:{ja:"GOTS 7.0の企業経営基準に関する項目です。汚職防止、公正な取引、利益相反の管理について、関係者が合意していることを示します。監査当日に提出する扱いです。",en:"Relates to the GOTS 7.0 governance criteria: anti-corruption, fair dealing and conflict of interest, agreed to by the people concerned. Provided on the audit day.",zhTW:"對應 GOTS 7.0 企業治理基準：反貪腐、公平交易與利益衝突管理，並取得相關人員同意。於稽核當天提供。"},prepare:{ja:["行動規範契約書（署名済み）","対象者の範囲","汚職防止に関する方針"],en:["Signed code of conduct agreement","Who it covers","Anti-corruption policy"],zhTW:["已簽署之行為準則契約書","適用對象範圍","反貪腐政策"]},auditorChecks:{ja:["署名の範囲が適切かを確認します","内容がGOTSの企業経営基準を満たしているかを読みます"],en:["Checks who has signed and whether that is the right group","Reads the content against the GOTS governance criteria"],zhTW:["確認簽署對象範圍是否適當","檢閱內容是否符合 GOTS 企業治理基準"]},clauses:["4.5.2","4.5.3","4.5.4","4.5.5","4.5.6","4.5.7","4.5.8","4.5.9","4.5.10"],topics:["governance_related"]},{id:"capa.qualityComplaints",periodScoped:!0,category:"complaint",evidenceType:"record",title:{ja:"品質不適合・顧客クレームの記録",en:"Quality non-conformity and customer complaint records",zhTW:"品質不符合與客訴紀錄"},why:{ja:"GOTS製品について品質上の問題や顧客クレームがあった場合の記録です。製品の回収や再出荷があった場合、その数量がマスバランスに反映されているかも確認されます。",en:"Records of quality problems or customer complaints on GOTS product. Where goods were recalled or reshipped, the auditor also checks those quantities appear in the mass balance.",zhTW:"記錄 GOTS 產品之品質問題或客訴。若曾發生回收或重新出貨，稽核員亦會確認相關數量是否反映於質量平衡表。"},prepare:{ja:["品質クレームの記録","不適合品の処理記録（返品・廃棄・再加工）","数量とマスバランスへの反映"],en:["Quality complaint records","What happened to non-conforming goods: returned, scrapped, reworked","Quantities and how they flow into the mass balance"],zhTW:["品質客訴紀錄","不合格品之處理紀錄：退貨、報廢、重工","數量及其於質量平衡表之反映"]},auditorChecks:{ja:["返品・廃棄した数量が在庫記録に反映されているかを確認します"],en:["Checks returned and scrapped quantities appear in the stock records"],zhTW:["確認退貨與報廢數量已反映於庫存紀錄"]},clauses:["5.1.3","5.1.4","4.5.9"],topics:["quality_related","governance_related"]}];var be=[...la,...da,...ma,...ya],In=Object.fromEntries(be.map(e=>[e.id,e]));var Ta={"company.registration":["record"],"company.scope":["record"],"company.previousSC":["record"],"company.orgChart":["policy","interview"],"management.manual":["procedure"],"management.internalQA":["procedure","record"],"management.processFlow":["procedure","site"],"management.training":["record","interview"],"product.registration":["record"],"product.specification":["record","sampling"],"product.specialProducts":["record"],"audit.riskAssessment":["procedure","record"],"audit.internalAudit":["procedure","record"],"review.dueDiligence":["policy","procedure","record"],"review.managementReview":["record"],"warehouse.layout":["procedure","site"],"warehouse.segregation":["procedure","site","interview"],"warehouse.externalList":["record"],"warehouse.externalContract":["record"],"warehouse.repackProcedure":["procedure","record","sampling"],"outsourcing.list":["record"],"outsourcing.contracts":["record"],"outsourcing.monitoring":["record","sampling"],"manufacturing.productionFlow":["procedure","site"],"manufacturing.productionRecords":["record","sampling"],"chemical.cms":["procedure","site"],"chemical.inventory":["record","site","sampling"],"chemic
