a. 使用される香料、ローションおよび潤滑剤は、GOTSの投入基準に加えて、COSMOSスタンダード(コスメティックス・オーガニックおよびナチュラルスタンダード)の投入基準にも準拠しなければなりません。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],systemUpload:[],refDocs:["グループII製品該当の場合"],sourceRow:"GOTS v7.0 EVAL!148"},{id:"GOTS7-6.2.1",standard:"GOTS",version:"7.0",clause:"6.2.1",allClauses:["6.2.1"],crossRefs:[],category:"product",topics:["special_product_related","food_contact_related"],track:"main",level:"Major (Ma)",section:{en:"6.2 Specific Requirements for Food Contact Textiles",ja:"6.2 食品接触用テキスタイルに関する具体的要件"},text:{en:`SCOPE
FCTs can potentially contaminate food or water by transferring Substances into it. All FCTs
are covered under the scope of this Section. It applies to all sectors and all stages of
manufacturing, processing, and distribution of FCTs.`,ja:`範囲
FCT(食品接触用テキスタイル)は、物質を食品や水に移行させることによって汚染する可能性があります。このセクションの範囲には、すべてのFCTが含まれます。これは、FCTの製造、処理、流通のすべてのセクターおよびすべての段階に適用されます。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],systemUpload:[],refDocs:["食品接触用テキスタイルに該当の場合"],sourceRow:"GOTS v7.0 EVAL!151"},{id:"GOTS7-6.2.1.1",standard:"GOTS",version:"7.0",clause:"6.2.1.1",allClauses:["6.2.1.1"],crossRefs:[],category:"product",topics:["special_product_related","food_contact_related"],track:"main",level:"Major (Ma)",section:{en:"6.2 Specific Requirements for Food Contact Textiles",ja:"6.2 食品接触用テキスタイルに関する具体的要件"},text:{en:`Specific material and Input criteria for Food Contact Textiles
a. All textiles used shall be Totally Chlorine Free (TCF).
b. FCTs shall be composed of 100% certified organic fibres.
c. Printing is prohibited on the food contact side of the textiles. GMP should, in particular,
ensure that chemical Substances are not transferred through the substrate.`,ja:`食品接触用テキスタイルに関する具体的材料および投入物基準
a. 使用されるすべてのテキスタイルは、完全に塩素を含まない(TCF)ものでなければなりません。
b. FCTは、100%の認証済み有機繊維で構成されなければなりません。
c. テキスタイルの食品接触面への印刷は禁じられています。GMP(適正製造基準)は、特に化学物質が基材を通じて移行しないことを確保する必要があります。`},companyTypes:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],conditionalFor:["brand","dyeing","knitting_sewing","laminating","printing","recycler","spinning","trading","weaving"],systemUpload:[],refDocs:["食品接触用テキスタイルに該当の場合"],sourceRow:"GOTS v7.0 EVAL!152"}],Ln=Object.fromEntries(de.map(e=>[e.id,e]));var fa=[{match:{topics:["chemical_related"]},when:{all:[{any:[{field:"doesProcessing",eq:"yes"},{field:"outsources",eq:"yes"}],reason:"na.noProcessing"},{field:"chemicalUse",in:["yes","outsourced"],reason:"na.noChemical"}]}},{match:{topics:["processing_related"]},when:{field:"doesProcessing",eq:"yes",reason:"na.noProcessing"}},{match:{topics:["environment_related"],exceptClauses:["4.3.1.1","4.3.1.2","4.3.1.3"]},when:{field:"doesProcessing",eq:"yes",reason:"na.noProcessing"}},{match:{topics:["physical_handling_related"]},when:{field:"physicalHandling",eq:"yes",reason:"na.noPhysicalHandling"}},{match:{topics:["warehouse_related"]},when:{field:"physicalHandling",eq:"yes",reason:"na.noPhysicalHandling"}},{match:{topics:["b2c_related"]},when:{field:"salesChannel",in:["b2c","both"],reason:"na.noB2C"}},{match:{topics:["b2b_related"]},when:{field:"salesChannel",in:["b2b","both"],reason:"na.noB2B"}},{match:{topics:["final_product_related"]},when:{field:"sellsFinishedProduct",in:["yes","both"],reason:"na.noFinishedProduct"}},{match:{topics:["label_related"]},when:{any:[{field:"usesClaims",eq:"yes"},{all:[{field:"salesChannel",in:["b2c","both"]},{field:"sellsFinishedProduct",in:["yes","both"]}]}],reason:"na.noClaims"}},{match:{topics:["incoming_tc_related"]},when:{field:"transactionFlow",includesAny:["purchase"],reason:"na.noPurchase"}},{match:{topics:["purchasing_related"]},when:{field:"transactionFlow",includesAny:["purchase"],reason:"na.noPurchase"}},{match:{topics:["outgoing_tc_related"]},when:{field:"transactionFlow",includesAny:["sell"],reason:"na.noSell"}},{match:{topics:["transaction_related"]},when:{field:"transactionFlow",includesAny:["purchase","sell"],reason:"na.noTrade"}},{match:{topics:["mass_balance_related"]},when:{field:"transactionFlow",includesAny:["purchase","sell"],reason:"na.noTrade"}},{match:{topics:["subcontractor_related"]},when:{any:[{field:"outsources",eq:"yes"},{field:"warehouse",in:["external","both"]}],reason:"na.noOutsourcing"}},{match:{topics:["employee_related"]},when:{field:"hasEmployees",eq:"yes",reason:"na.noEmployees"}},{match:{topics:["ohs_related"]},when:{field:"hasEmployees",eq:"yes",reason:"na.noEmployees"}},{match:{topics:["material_input"]},when:{any:[{field:"transactionFlow",includesAny:["purchase"]},{field:"doesProcessing",eq:"yes"}],reason:"na.noMaterialInput"}}],wa={"na.companyType":{ja:"ご回答いただいた事業形態では、この要求事項は適用されません。",en:"This requirement does not apply to the company types you declared.",zhTW:"依貴公司申報之營運型態，本要求事項不適用。"},"na.noProcessing":{ja:"貴社より、認証範囲内で加工工程を行っていないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that no processing takes place within the certified scope.",zhTW:"因貴公司表示驗證範圍內未執行加工製程，故列為不適用。"},"na.noChemical":{ja:"貴社より、認証範囲内で化学品を使用する工程を行っていないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that no chemical inputs are used within the certified scope.",zhTW:"因貴公司表示驗證範圍內未使用化學品，故列為不適用。"},"na.noWetProcessing":{ja:"貴社より、染色・プリント・洗い・仕上げなどの湿式加工を行っていないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that no wet processing (dyeing, printing, washing or finishing) is carried out.",zhTW:"因貴公司表示未執行染色、印花、水洗或後整理等濕式加工，故列為不適用。"},"na.noPhysicalHandling":{ja:"貴社より、GOTS製品を物理的に受け取り・保管していないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that it does not physically receive or store certified goods.",zhTW:"因貴公司表示未實際收受或保管驗證產品，故列為不適用。"},"na.noStorage":{ja:"貴社より、GOTS製品を保管していないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that it does not store GOTS goods.",zhTW:"因貴公司表示未保管 GOTS 產品，故列為不適用。"},"na.noExternalWarehouse":{ja:"貴社より、外部倉庫を使用していないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that no external warehouse is used.",zhTW:"因貴公司表示未使用外部倉庫，故列為不適用。"},"na.noRepacking":{ja:"貴社より、再包装・再ラベリングを行っていないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that no repacking or relabelling takes place.",zhTW:"因貴公司表示未執行重新包裝或換標作業，故列為不適用。"},"na.noOutsourcing":{ja:"貴社より、外注を行っていないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that no activity is outsourced.",zhTW:"因貴公司表示無委外作業，故列為不適用。"},"na.noEmployees":{ja:"貴社より、認証対象の事業所で働いている方（派遣・技能実習生・請負・在宅を含む）はいないとご回答いただいているため、対象外としています。働く方が一人でもいる場合は対象になります。",en:"Not applicable — you told us that no one works at the certified site, including agency, intern, contract and home workers. It applies as soon as anyone does.",zhTW:"因貴公司表示受驗證場所並無工作人員（含派遣、實習、承攬與家庭代工），故列為不適用；一旦有任何人員工作即適用。"},"na.noForeignWorkers":{ja:"貴社より、外国人労働者・技能実習生の方はいないとご回答いただいているため、対象外としています。",en:"Not applicable — you told us that no foreign or migrant workers work for the operation.",zhTW:"因貴公司表示未有外籍勞工或移工為本單位工作，故列為不適用。"},"na.noYoungWorkers":{ja:"貴社より、18歳未満の労働者がいないとご回答いただいているため、対象外としています。",en:"Not applicable — you told us that no workers below 18 years of age work for the operation.",zhTW:"因貴公司表示未有未滿 18 歲之勞工為本單位工作，故列為不適用。"},"na.noAgencyWorkers":{ja:"貴社より、派遣労働者・有期契約労働者がいないとご回答いただいているため、対象外としています。",en:"Not applicable — you told us that no agency or fixed-term workers are used.",zhTW:"因貴公司表示未使用派遣或定期契約勞工，故列為不適用。"},"na.noHomeworkers":{ja:"貴社より、認証範囲内に在宅ワーカー・内職者の方はいないとご回答いただいているため、対象外としています。",en:"Not applicable — you told us that no homeworkers work within the certified operation.",zhTW:"因貴公司表示驗證範圍內未有家庭代工人員，故列為不適用。"},"na.noDormitory":{ja:"貴社より、会社が提供する寮・宿泊施設がないとご回答いただいているため、対象外としています。",en:"Not applicable — you told us that no worker accommodation is provided.",zhTW:"因貴公司表示未提供員工住宿，故列為不適用。"},"na.noCanteen":{ja:"貴社より、食堂・調理・食品保管の設備がないとご回答いただいているため、対象外としています。",en:"Not applicable — you told us that no food preparation or storage facilities are provided.",zhTW:"因貴公司表示未提供餐飲調理或食品存放設施，故列為不適用。"},"na.noTransport":{ja:"貴社より、会社が提供する送迎がないとご回答いただいているため、対象外としています。",en:"Not applicable — you told us that no worker transportation is provided.",zhTW:"因貴公司表示未提供員工交通接送，故列為不適用。"},"na.noChildcare":{ja:"貴社より、託児施設を提供していないとご回答いただいているため、対象外としています。",en:"Not applicable — you told us that no childcare facilities are provided.",zhTW:"因貴公司表示未提供托兒設施，故列為不適用。"},"na.noClaims":{ja:"貴社より、GOTSロゴや認証表示を使用していないとご回答いただいているため、対象外としています。表示を開始する前に、必ず認証機関の承認を受けてください。",en:"Not applicable — the company stated that it does not use the GOTS logo or GOTS claims. Approval from the certification body is required before any use begins.",zhTW:"因貴公司表示未使用 GOTS 標誌或宣稱，故列為不適用。惟開始使用前，務必先取得驗證機構核准。"},"na.noLogoUse":{ja:"貴社より、GOTSロゴおよび認証文言を使用していないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that neither the GOTS logo nor GOTS wording is used.",zhTW:"因貴公司表示未使用 GOTS 標誌與相關文字宣稱，故列為不適用。"},"na.noRetailLabelling":{ja:"貴社より、ハングタグ・製品ラベル・包装表示を使用していないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that no hangtags, product labels or packaging claims are used.",zhTW:"因貴公司表示未使用吊牌、產品標籤或包裝標示，故列為不適用。"},"na.noDigitalClaims":{ja:"貴社より、ウェブサイト・ECサイトでGOTS表示を行っていないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that no GOTS claims are made online.",zhTW:"因貴公司表示未於網站或電商平台使用 GOTS 宣稱，故列為不適用。"},"na.noMarketingClaims":{ja:"貴社より、広告・販促物でGOTS表示を行っていないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that no GOTS claims are made in advertising.",zhTW:"因貴公司表示未於廣告或促銷物使用 GOTS 宣稱，故列為不適用。"},"na.noB2C":{ja:"貴社より、一般消費者向けの販売を行っていないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that it does not sell to consumers.",zhTW:"因貴公司表示未對一般消費者銷售，故列為不適用。"},"na.noB2B":{ja:"貴社より、事業者向けの販売を行っていないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that it does not sell business to business.",zhTW:"因貴公司表示未從事企業對企業之銷售，故列為不適用。"},"na.noFinishedProduct":{ja:"貴社より、完成品（最終製品）を扱っていないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that it does not handle finished consumer products.",zhTW:"因貴公司表示未處理消費性成品，故列為不適用。"},"na.noPurchase":{ja:"貴社より、GOTS認証製品の購入を行っていないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that it does not purchase GOTS certified goods.",zhTW:"因貴公司表示未採購 GOTS 驗證產品，故列為不適用。"},"na.noSell":{ja:"貴社より、GOTS認証製品の販売を行っていないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that it does not sell GOTS certified goods.",zhTW:"因貴公司表示未銷售 GOTS 驗證產品，故列為不適用。"},"na.noTrade":{ja:"貴社より、GOTS製品の売買を行っていないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that it neither buys nor sells GOTS goods.",zhTW:"因貴公司表示未進行 GOTS 產品之買賣，故列為不適用。"},"na.noInventory":{ja:"貴社より、GOTS製品の在庫を保有していないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that it holds no GOTS stock.",zhTW:"因貴公司表示未保有 GOTS 產品庫存，故列為不適用。"},"na.noMaterialInput":{ja:"貴社より、材料の購入も加工も行っていないとご回答いただいているため、対象外としています。",en:"Not applicable — the company stated that it neither purchases material nor processes it.",zhTW:"因貴公司表示既未採購材料亦未加工，故列為不適用。"},"na.tcUnderstood":{ja:"取引証明書（TC）の取扱いについて明確にご回答いただいているため、この補足説明は表示していません。",en:"Not shown — you answered the Transaction Certificate question directly, so this explanatory item is not needed.",zhTW:"因貴公司已明確回答交易證明（TC）之處理方式，故未顯示本補充說明項目。"},"na.noTcHandling":{ja:"貴社より、取引証明書（TC）の発行・受領を行っていないとご回答いただいているため、対象外としています。取引形態が変わる場合は、改めて確認が必要です。",en:"Not applicable — the company stated that it neither issues nor receives Transaction Certificates. This should be reviewed again if the transaction structure changes.",zhTW:"因貴公司表示未開立或接收交易證明（TC），故列為不適用。若交易型態變更，應重新確認。"},"na.initialOnly":{ja:"初回認証のため、前回の認証書類はまだ存在しません。",en:"Not applicable — this is an initial certification, so there is no previous certificate yet.",zhTW:"因屬初次驗證，尚無前一次之驗證文件。"},"na.generic":{ja:"現在の回答内容では、この項目は対象外としています。",en:"Not applicable based on the answers given.",zhTW:"依目前回答內容，本項目列為不適用。"}},Sa={brandOwner:{ja:"GOTS製品に付くブランドを貴社が保有または管理しているかをご確認ください。保有している場合、ラベル・ロゴ・訴求に関する準備項目が適用される可能性があります。",en:"Please confirm whether your company owns or controls the brand used on the product. If it does, label, logo and claim preparation items may apply.",zhTW:"請確認貴公司是否擁有或掌控產品上所使用之品牌。若是，標籤、標誌與宣稱相關之準備項目可能適用。"},salesChannel:{ja:"一般消費者向けの販売があるかをご確認ください。ある場合、小売向けの表示要件が追加される可能性があります。",en:"Please confirm whether any sales go directly to consumers. If they do, retail labelling requirements may be added.",zhTW:"請確認是否有直接對一般消費者之銷售。若有，可能適用零售標示要求。"},productTypes:{ja:"完成品（最終製品）を扱うかをご確認ください。扱う場合、附属品や表示に関する項目が追加される可能性があります。",en:"Please confirm whether you handle finished consumer products. If you do, accessory and labelling items may be added.",zhTW:"請確認是否處理消費性成品。若是，可能增加附屬品與標示相關項目。"},physicalHandling:{ja:"GOTS製品を実際に受け取り・保管するかをご確認ください。行う場合、分別保管・在庫・現地確認に関する項目が適用されます。",en:"Please confirm whether you physically receive or store GOTS goods. If you do, segregation, inventory and site verification items apply.",zhTW:"請確認是否實際收受或保管 GOTS 產品。若是，將適用分隔保管、庫存與現場查核項目。"},warehouse:{ja:"GOTS製品の保管場所（自社倉庫か外部倉庫か）をご確認ください。外部倉庫の場合、委託先の契約と宣言書が必要になります。",en:"Please confirm where GOTS goods are stored — your own warehouse or an external one. An external warehouse requires a contract and declaration.",zhTW:"請確認 GOTS 產品之保管地點為自有或外部倉庫。若為外部倉庫，須具備合約與聲明書。"},warehouseSegregation:{ja:"GOTS製品と非GOTS製品を同じ場所に保管しているかをご確認ください。分別方法を説明できる状態にしておく必要があります。",en:"Please confirm whether GOTS and non-GOTS goods share a storage area, and be ready to explain how they are kept apart.",zhTW:"請確認 GOTS 與非 GOTS 產品是否共用存放區域，並準備說明其分隔方式。"},warehouseOperations:{ja:"外部倉庫で再包装・再ラベリングを行っているかをご確認ください。行っている場合、作業手順と記録が確認対象になります。",en:"Please confirm whether the external warehouse repacks or relabels. If it does, the procedure and work records are examined.",zhTW:"請確認外部倉庫是否執行重新包裝或換標。若有，其作業程序與紀錄將納入查核。"},processes:{ja:"貴社より、認証範囲内で加工工程を行うかをご確認ください。行う場合、環境・化学品・品質・トレーサビリティの各項目が適用されます。",en:"Please confirm whether any processing takes place within the certified scope. If it does, environmental, chemical, quality and traceability items apply.",zhTW:"請確認驗證範圍內是否執行加工製程。若有，將適用環境、化學品、品質與可追溯性等項目。"},chemicalUse:{ja:"貴社より、認証範囲内で化学品を使用するか、外注先のみが使用するかをご確認ください。使用の有無により準備資料が大きく変わります。",en:"Please confirm whether chemicals are used within the certified scope, or only by a subcontractor. This substantially changes what to prepare.",zhTW:"請確認驗證範圍內是否使用化學品，或僅由委外廠商使用。此將大幅影響應備資料。"},outsourcing:{ja:"社外に委託している業務があるかをご確認ください。ある場合、委託先の契約と管理記録が必要になります。",en:"Please confirm whether any activity is outsourced. If it is, subcontractor contracts and monitoring records are needed.",zhTW:"請確認是否有委外作業。若有，須具備委外廠商合約與管理紀錄。"},tcHandling:{ja:"取引証明書（TC）の発行・受領についてご確認ください。実際に必要となる資料は、取引形態と認証範囲により異なります。監査前にIDFL担当者にご相談ください。",en:"Please confirm how Transaction Certificates apply to your transactions. What is actually required depends on transaction structure and certification scope — your IDFL contact can confirm this before the audit.",zhTW:"請確認交易證明（TC）於貴公司交易中之適用方式。實際所需資料依交易型態與驗證範圍而定，建議於稽核前洽詢 IDFL 窗口。"},claims:{ja:"GOTSロゴや認証表示を使用しているか、また使用媒体をご確認ください。使用する場合、事前承認が必要です。",en:"Please confirm whether GOTS logo or claims are used, and on which media. Prior approval is required before use.",zhTW:"請確認是否使用 GOTS 標誌或宣稱及其使用媒介。使用前須先取得核准。"},transactionFlow:{ja:"GOTS製品の仕入・販売・在庫保有の有無をご確認ください。取引記録とマスバランスの範囲がこれにより決まります。",en:"Please confirm whether you purchase, sell or hold stock of GOTS goods. This determines the transaction records and mass balance scope.",zhTW:"請確認是否採購、銷售或持有 GOTS 產品庫存，此將決定交易紀錄與質量平衡之範圍。"},workerForeign:{ja:"外国人労働者・技能実習生の在籍をご確認ください。在籍する場合、契約言語、身分証の保管、手数料負担に関する確認が加わります。",en:"Please confirm whether foreign or migrant workers are employed. If so, checks on contract language, identity documents and recruitment fees are added.",zhTW:"請確認是否僱用外籍勞工或移工。若有，將增加契約語言、身分證件保管與仲介費用之查核。"},workerUnder18:{ja:"18歳未満の労働者の在籍をご確認ください。在籍する場合、労働時間と作業内容に追加の保護が適用されます。",en:"Please confirm whether any workers are below 18. If so, additional protections on hours and tasks apply.",zhTW:"請確認是否有未滿 18 歲之勞工。若有，將適用工時與工作內容之額外保護規定。"},workerAgency:{ja:"人材派遣会社から供給される労働者の有無をご確認ください。",en:"Please confirm whether any workers are supplied by a labour agency.",zhTW:"請確認是否有由人力仲介供應之勞工。"},workerTemporary:{ja:"有期契約・パート・アルバイトの在籍をご確認ください。",en:"Please confirm whether temporary or fixed-term workers are employed.",zhTW:"請確認是否僱用定期契約或兼職人員。"},workerHomeworkers:{ja:"在宅ワーカー・内職者の有無をご確認ください。在籍する場合、工場内の労働者と同等の保護が求められます。",en:"Please confirm whether homeworkers are used. If so, they must receive protection equivalent to on-site workers.",zhTW:"請確認是否有家庭代工人員。若有，應提供與廠內勞工同等之保障。"},facilityDormitory:{ja:"会社が提供する寮・宿泊施設の有無をご確認ください。",en:"Please confirm whether the company provides worker accommodation.",zhTW:"請確認公司是否提供員工住宿。"},facilityCanteen:{ja:"食堂・調理・食品保管設備の有無をご確認ください。",en:"Please confirm whether food preparation or storage facilities are provided.",zhTW:"請確認是否提供餐飲調理或食品存放設施。"},facilityTransport:{ja:"会社が提供する送迎の有無をご確認ください。",en:"Please confirm whether the company provides transportation for workers.",zhTW:"請確認公司是否提供員工交通接送。"},facilityChildcare:{ja:"託児施設の有無をご確認ください。",en:"Please confirm whether childcare facilities are provided.",zhTW:"請確認是否提供托兒設施。"},hasEmployees:{ja:"認証対象の事業所に従業員がいるかをご確認ください。",en:"Please confirm whether the certified entity has employees.",zhTW:"請確認受驗證單位是否有僱用員工。"},certificationStatus:{ja:"今回の監査種別をご確認ください。",en:"Please confirm the type of audit taking place.",zhTW:"請確認本次稽核之類型。"}},Oa={"note.initialCertification":{ja:"初回認証のため、監査対象期間の記録がまだ十分に存在しない場合があります。存在する範囲で準備し、まだない部分はその旨を監査員にご説明ください。不足として扱われるものではありません。",en:"As this is an initial certification, records may not yet exist for the whole audit period. Prepare what you have and explain the rest to the auditor — it is not treated as missing.",zhTW:"因屬初次驗證，稽核期間之紀錄可能尚不完整。請就現有部分準備，其餘向稽核員說明即可，不會被視為缺漏。"},"note.specialProductsOnly":{ja:"化粧用パフ、おしぼり、食品接触用テキスタイルなどを製造・販売している場合にのみ必要です。該当がなければ「自社には該当しないと思う」を選択し、監査時にご確認ください。",en:"Only needed if you make or sell cosmetic pads, wipes, food-contact textiles or similar. If you do not, mark it accordingly and confirm at the audit.",zhTW:"僅於製造或銷售化妝棉、濕巾、食品接觸紡織品等產品時適用。若無此類產品，請標示後於稽核時確認。"},"note.tcStructureVaries":{ja:"取引証明書に関して実際に必要となる資料は、取引形態、認証範囲および取引状況により異なる場合があります。判断に迷う場合はIDFL担当者にご確認ください。",en:"The transaction evidence actually required may vary with transaction structure, certification scope and circumstances. If in doubt, confirm with your IDFL contact.",zhTW:"實際所需之交易證明可能依交易型態、驗證範圍及交易狀況而異。如有疑義，請洽詢 IDFL 窗口確認。"}};var va={"GOTS7-2.1.1":"獲准使用者為依 IFOAM 標準家族中、就相關生產範圍（作物生產或畜產）所認可之任一標準，驗證為「有機」或「轉型期有機」之天然纖維。此包括法規 (EU) 2018/848、美國農業部國家有機計畫 (NOP)、印度 APEDA 國家有機生產計畫 (NPOP) 及中國有機標準 GB/T19630。","GOTS7-2.1.2":"驗證有機纖維生產之受認可驗證機構，就其所依據之標準應持有有效且受認可之認證資格。受認可之認證包括 ISO 17065 認證、NOP 認證及 IFOAM 認證。","GOTS7-2.1.3":"僅當纖維生產驗證所依據之標準允許該項纖維標示為「轉型期有機」時，方得將纖維產品驗證為「轉型期有機」。纖維之轉型狀態應依第 2.7 節「GOTS 標示與標籤條件」之規定載明。","GOTS7-2.1.4":"不得使用來自下列生產專案之纖維：有證據顯示該專案持續嚴重違反 ILO 核心勞動基準（就其適用於農業之範圍而言），及／或持續嚴重違反動物福利原則（例如 Mulesing 割臀），或有無可辯駁之證據顯示持續存在土地掠奪之情形。","GOTS7-2.1.5":"使用來自人權高風險地區生產專案之纖維時，可能須採取額外之風險緩解措施（例如現場社會責任稽核），以確保該等生產專案符合 GOTS 人權與社會責任基準。","GOTS7-2.5.1":"所有作業程序與實務應以有效之文件化管制系統及紀錄予以支持，俾可追溯：a. 該單位所收受之有機與其他（原）材料、附屬品及投入物之來源、性質與數量；b. 貨品於該單位內之流向（所執行之加工／製造步驟、所使用之配方及庫存數量）；c. 離開該單位之 GOTS 產品之性質、數量與收貨人；d. 所製造產品之纖維組成；e. 為妥適查核該作業所需之其他任何資訊。","GOTS7-2.5.2":"與稽核相關之紀錄應至少保存五年。","GOTS7-2.5.3":"採購未經加工有機纖維之受驗證單位，應就其採購之全部數量，取得並保存由受認可驗證機構所核發、且依第 2.1 節基準完成驗證之原始生產者範圍證書及交易證明（如適用）。","GOTS7-2.5.4":"採購 GOTS 產品（半成品及成品）之受驗證單位，應依範圍證書核發政策及交易證明核發政策，就其採購之全部 GOTS 產品數量，取得並保存由核准驗證機構所核發之 GOTS 範圍證書與交易證明。","GOTS7-2.5.5":"受驗證單位應備妥發票、送貨單及有效核准函（Letter of Approval）影本，列明其於 GOTS 產品加工與製造過程中所使用之全部製劑，以佐證用於 GOTS 產品之所有著色劑與紡織助劑均已獲核准。","GOTS7-2.5.6":"任何有機纖維及／或 GOTS 產品之收貨人，於收受驗證產品時，應查核包裝或容器之完整性，並依產品標示及相應文件（例如發票、提單、貨車簽收單、出貨單、交易證明）所載資訊，查證該驗證產品之來源與性質。","GOTS7-2.5.8":"有機纖維與 GOTS 產品應於所有相應發票上清楚標示其身分。","GOTS7-2.5.9":"受驗證單位應與每一委外廠商簽訂合約，載明所委託加工作業之條件；受驗證單位對於符合 GOTS 全部基準仍負最終責任。","GOTS7-2.5.10":"受驗證單位應依 GOTS 之要求（於有要求時）蒐集、彙整並分享與影響衡量相關之非商業性資訊。","GOTS7-2.6.1.1":"有機紡織產品之儲存與運輸方式，應能防止其因接觸禁用物質而受污染、與非有機產品混雜，或內容物遭替換。","GOTS7-2.6.1.2":"受驗證單位應建立分隔制度，以防止有機纖維與非有機纖維混雜或遭替換。","GOTS7-2.6.1.3":"所有有機原料與 GOTS 產品，於供應鏈之各階段均應清楚標示並可資辨識。","GOTS7-2.6.1.4":"運輸方式與運送文件應予文件化記錄。","GOTS7-2.6.1.5":"若因國家或地區法規要求而必須使用農藥／生物殺蟲劑，得於倉庫或運輸過程中使用，惟應符合適用之國際或國家有機生產標準。儲存與運輸作業所使用之木質棧板不受本項要求限制。","GOTS7-2.6.1.6":"應盡量減少塑膠包裝材料之使用。合成包裝材料不得含有含氯塑膠（例如 PVC）。","GOTS7-2.6.2.1":"具備完整 GOTS 標示之 GOTS 成品，在可確實保證產品不致遭替換之前提下，得與同類之非驗證產品一併儲存及運輸。","GOTS7-2.6.2.2":"GOTS 產品之零售包裝禁止使用一次性原生塑膠衣架，惟得使用再生塑膠衣架。","GOTS7-2.6.2.3":"應盡量減少塑膠包裝材料之使用。合成包裝材料不得含有含氯塑膠（例如 PVC）。","GOTS7-2.6.2.4":"得使用以非基因改造生質原料製成，且經驗證／測試為無毒，並可生物分解或可家庭／工業堆肥之生質塑膠包裝。","GOTS7-2.6.2.5":"GOTS 產品零售包裝材料（含吊牌等標示物件）所使用之紙張或紙板，應為消費前或消費後廢棄物再生製成，或經可查證符合永續森林管理原則之計畫驗證。","GOTS7-2.6.2.6":"用於包裝或吊牌繫繩之紡織纖維材料，應符合下列任一基準：a. 經驗證之有機纖維，參見第 2.1 節及第 5.2.7 節之殘留限值；或 b. 經驗證之轉型期有機纖維，參見第 2.1 節及第 5.2.7 節之殘留限值；c. 可接受之其他纖維，參見第 3.2 節（纖維比例不受限制），並應符合第 5.2.8 節之殘留限值。","GOTS7-2.7.2":"僅當纖維生產驗證所依據之有機標準允許該項纖維作此標示時，方得將產品標示為「轉型期有機」。","GOTS7-2.7.3":"僅由受驗證單位依 GOTS 生產、並經核准驗證機構驗證之紡織品（成品或半成品），方得以 GOTS 產品名義標示、表述、宣傳或銷售。","GOTS7-2.7.4":"GOTS 標示之使用應一律包含下列項目：a. 下列兩種標示等級之一：「organic（有機）」或「Organic in-conversion（轉型期有機）」；或「made with (x%) organic materials」或「made with (x%) Organic in-conversion materials」；b. GOTS 標誌；c. 標明驗證該 GOTS 產品之核准驗證機構；d. 受驗證單位之授權編號。","GOTS7-2.7.5":"「organic」或「Organic in-conversion」標示等級之產品，其纖維含量（不含附屬品）應不低於 95%（≥95%）。","GOTS7-2.7.6":"「made with (x%) organic materials」或「made with (x%) Organic in-conversion materials」標示等級之產品，其纖維含量（不含附屬品）應不低於 70%（≥70%）。","GOTS7-2.7.7":"GOTS 標示僅得由受驗證單位施加於產品及／或包裝上，且應於施加前事先取得該受驗證單位之核准驗證機構核准。","GOTS7-2.7.8":"於零售通路銷售之 GOTS 產品應強制標示。","GOTS7-2.7.9":"GOTS 產品之標示與廣告宣傳，應符合現行之《GOTS 標示使用條件》文件。","GOTS7-3.1.1":"GOTS 產品僅得使用第 2.1 節所定義之經有機驗證纖維。","GOTS7-3.2.1":"以「organic」或「Organic in-conversion」名義銷售、標示或表述之 GOTS 產品，其纖維組成中最多 5%（≤5%）得由本節所列之「其他纖維材料」構成。","GOTS7-3.2.2":"以「made with (x%) organic materials」或「made with (x%) Organic in-conversion materials」名義銷售、標示或表述之 GOTS 產品，其纖維組成中最多 30%（≤30%）得由本節所列之「其他纖維材料」構成。","GOTS7-3.2.3":"允許與禁止之其他纖維：可用於產品材料組成中未驗證餘量部分之纖維材料類型（依第 3.2.1 節最多 5%，依第 3.2.2 節最多 30%）。其他纖維之使用應符合 GOTS v7.0 第 3.2.3 節表 1「允許與禁止之其他纖維」。","GOTS7-3.3.1":"附屬品材料之允許與禁止總表（適用於貼布、滾邊、扣環、鈕扣與四合扣、繩帶、緣飾、鬆緊帶與鬆緊紗、繡線、扣合系統、燙襯用膠帶、帽帶、裝飾用蕾絲、裡布、襯墊、襯料、標籤（熱轉印／背膠／洗標／GOTS）、襯布、口袋布、包縫帶、縫線、墊肩、內衣襯墊、飾邊、拉鍊、鞋底，以及其他未明列之附屬品）。附屬品所使用之全部材料，應符合第 5.2.8 節所列適用之殘留限值。附屬品之使用應符合 GOTS v7.0 第 3.3.1 節表 2「允許與禁止之附屬品」。","GOTS7-4.1.1":"受驗證單位應從事負責任之商業行為。GOTS 化學品投入基準、環境基準、人權與社會責任基準及企業治理基準，均應透過盡職調查流程予以落實。該流程應與風險程度相稱，並適合個別受驗證單位之情況與脈絡。依 OECD《負責任商業行為盡職調查指南》及《成衣與鞋類產業負責任供應鏈盡職調查指南》，受驗證單位執行盡職調查時應遵循下列六步驟架構：i. 將盡職調查流程納入其政策與管理制度；ii. 辨識與其營運相關之實際或潛在負面衝擊；iii. 停止、預防或減輕負面衝擊；iv. 追蹤執行情形與成效；v. 說明衝擊之處理方式；vi. 於適當情形下提供補救。","GOTS7-4.1.2":"執行盡職調查流程之要求適用於所有 GOTS 受驗證單位。惟評估是否符合本項要求時，得一併考量受驗證單位之規模、營運脈絡、所有權結構與組織型態。","GOTS7-4.1.3":"受驗證單位應持續執行盡職調查，俾能隨時間展現漸進之改善。","GOTS7-4.1.4":"受驗證單位應制定《負責任商業行為政策》，闡明其於自身營運及供應鏈中對負責任商業行為之承諾。","GOTS7-4.1.5":"受驗證單位應強化其管理制度，以於自身營運及供應鏈中執行盡職調查。","GOTS7-4.1.6":"受驗證單位應將盡職調查之監督與責任指派予相關高階管理人員，並就《負責任商業行為政策》之落實指派董事會層級之權責。受驗證單位應定期就所有相關主題（包括人權與勞動權相關議題）對該負責人員提供訓練。","GOTS7-4.1.7":"受驗證單位應配置足夠之支援與資源，以執行盡職調查流程並落實《負責任商業行為政策》。","GOTS7-4.2.1.1":"受驗證單位僅得使用經評估、核准並明確列於 GOTS 正面表列（Positive List）之化學品，且應備妥有效之核准函（Letter of Approval）及安全資料表（SDS）影本，列明其於 GOTS 產品加工與製造過程中所使用之全部製劑，以佐證用於 GOTS 產品之所有著色劑與紡織助劑均已獲核准。","GOTS7-4.2.1.2":"擬用於加工 GOTS 產品之所有化學品投入物（物質與製劑），於使用前應先經核准程序之評估。","GOTS7-4.2.6.1":"初階加工：a. 就有機棉纖維而言，於纖維進入 GOTS 驗證供應鏈前，應進行農藥殘留檢測及基因改造檢測。請參閱《GOTS 驗證軋棉廠之驗證與運作參數》文件。","GOTS7-4.2.6.2":"紡紗：a. 僅允許使用符合第 4.2.2 節及第 4.2.3 節基本要求之添加劑。b. 所使用之任何石蠟製品應為完全精製，殘油量限值為 0.5%。c. 禁止使用將於後續加工階段溶除之合成纖維。","GOTS7-4.2.6.3":"上漿與織造／針織：a. 允許之漿料包括澱粉、澱粉衍生物、其他天然物質及 CMC（羧甲基纖維素）。b. 符合第 4.2.2 節及第 4.2.3 節基本要求之合成漿料，僅得與天然物質併用，且以不含水之化學品用量計算，不得超過總上漿量之 25%。c. 若該等合成漿料自退漿製程廢水中以大於 80% 之比例回收再利用，則其於總上漿量中之使用不受限制，惟仍應符合第 4.2.2 節及第 4.2.3 節之要求。d. 加工過程中所使用之其他投入物，應僅得源自天然材料。","GOTS7-4.2.6.4":"不織布製造：a. 允許之不織布製造加工僅限機械壓實、成網及纏結（例如水力纏結）。","GOTS7-4.2.6.5":"前處理及其他濕式加工階段應符合 GOTS v7.0 第 4.2.6.5 節表 6「前處理與濕式加工之限制」。","GOTS7-4.2.6.6":"染色應符合 GOTS v7.0 第 4.2.6.6 節表 7「染色之限制」。","GOTS7-4.2.6.7":"印花應符合 GOTS v7.0 第 4.2.6.7 節表 8「印花之限制」。","GOTS7-4.2.6.8":"後整理與製造應符合 GOTS v7.0 第 4.2.6.8 節表「後整理與製造之限制」。","GOTS7-4.2.6.9":"機械用油之一般要求：a. 於 GOTS 供應鏈之加工／製造階段中，可能接觸 GOTS 產品之機械用油應為無重金屬。b. 該等機械用油得自願接受化學品投入物評估程序以取得核准，並列入 GOTS 正面表列。","GOTS7-4.3.1.1":"除 GOTS 基準外，受驗證單位應確保其加工／製造階段符合適用之國家及地方環保法令要求（包括空氣排放、廢水放流，以及廢棄物與污泥處置等相關規定）。","GOTS7-4.3.1.2":"受驗證單位應具備與其營運性質相符之書面環境與化學品管理政策。此外，應建立必要程序，以監督並改善其場所之相關環境管理績效。","GOTS7-4.3.1.3":"環境與化學品管理政策應向全體員工宣達。依其加工／製造階段之不同，可取得之資料與程序應包括：a. 環境與化學品管理相關職責之負責人員；b. 能源與水資源及其每公斤紡織品產出消耗量之數據；c. 降低每公斤紡織品能源與用水消耗之目標與程序；d. 提高再生能源使用比例之目標與程序；e. 每公斤紡織品產出之廢棄物與排放數據；f. 減少廢棄物與排放之目標與程序；g. 發生廢棄物與污染事件時之應變程序；h. 就水資源與能源保育、化學品之妥適操作、負責任使用及正確處置等主題之文件化員工訓練；i. 長期與短期之改善計畫。","GOTS7-4.3.1.4":"應就加工 GOTS 產品所使用之 GOTS 核准化學品投入物，維持適當之庫存清冊。","GOTS7-4.3.1.5":"濕式加工單位應完整記錄化學品、能源與用水消耗量，以及廢水處理數據（含污泥處置）。受驗證單位應持續量測並監控廢水溫度、廢水 pH 值、沉澱物數量及廢棄物毒性。應訂有固體廢棄物回收及／或處置之規定。不得於場內焚燒廢棄物或進行未受管制之廢棄物掩埋。","GOTS7-4.3.1.6":"噪音污染與空氣污染之監測應符合當地法令規定，並應定期進行檢測。","GOTS7-4.3.1.7":"受驗證單位應建立溫室氣體（GHG）排放管理制度，內容涵蓋排放源之辨識，以及溫室氣體排放之監測、量化與減量措施之訂定。","GOTS7-4.3.1.8":"受驗證單位應先蒐集其自身營運之溫室氣體（GHG）排放源資訊，並就各排放源辨識可行之減量方式。","GOTS7-4.3.1.9":"作為長期規劃，受驗證單位宜將產品相關排放及供應鏈相關排放納入其溫室氣體（GHG）排放管理制度。","GOTS7-4.3.2.1":"應符合適用之國家及地方廢水處理法令要求，包括 pH 值、溫度、TOC、BOD、COD、除色、（化學）污染物殘留及放流途徑等限值規定。","GOTS7-4.3.2.2":"受驗證單位應遵循 GOTS 基準或當地法令要求中較為嚴格者。","GOTS7-4.3.2.3":"所有濕式加工單位之廢水，於排放至環境前應經適當之場內或場外廢水處理設施（ETP）處理。ETP 應始終維持有效、正常運轉並妥善維護。","GOTS7-4.3.2.4":"應於正常運轉產能下定期執行廢水分析並留存紀錄。","GOTS7-4.3.2.5":"受驗證單位應對負責人員提供廢水處理設施（ETP）操作與維護之訓練。","GOTS7-4.3.2.6":"排放至環境之廢水，其 COD 不得超過每公斤加工紡織品（產出）20 公克。羊毛精練（去脂）作業適用 45 g COD/kg 之例外限值。","GOTS7-4.3.2.7":"韌皮纖維水浸脫膠所產生廢水之處理，其 COD（或 TOC）削減率，大麻纖維應至少達 95%，其他所有韌皮纖維應至少達 75%。","GOTS7-4.3.2.8":"若法令未就排放至地表水體之廢水訂定 pH 值與溫度限值，該放流水之 pH 值應介於 6 至 9 之間（除非受納水體之 pH 值本即超出此範圍），且溫度應低於 35°C（除非受納水體之溫度本即高於此值）。","GOTS7-4.4.1.3":"受驗證單位應尊重人權。受驗證單位應避免透過其活動造成、助長、誘使、鼓勵或支持侵害人權之情事。此外，受驗證單位應處理其應負責任或涉入其中之任何人權負面衝擊或其風險。","GOTS7-4.4.2.1":"禁止使用任何形式之強迫或強制勞動，包括不符合 ILO 第 29 號公約之監獄勞動。","GOTS7-4.4.2.2":"所有工作應基於自願進行，且不得在任何處罰或制裁之威脅下為之。","GOTS7-4.4.2.3":"強迫勞動之禁止範圍，涵蓋當事人非出於自願提供之一切形式勞務，例如債務奴役、人口販運或契約束縛之勞動。","GOTS7-4.4.2.4":"受驗證組織不得要求勞工繳納押金或財務擔保，不得扣留身分證件（例如護照、身分證等），亦不得於合法契約約定之外扣留工資。勞工於雙方合意之預告期間屆滿後（如勞動契約所載），得自由離職。","GOTS7-4.4.2.5":"受驗證單位應確保勞工無須為取得或維持僱用而支付任何費用或其他成本。","GOTS7-4.4.2.6":"不得強迫勞工使用工廠所提供之住宿或交通工具。","GOTS7-4.4.3.1":"不論性別，均不得使用童工。受驗證組織不得招募童工，亦不得以任何方式剝削兒童。若發現有兒童直接或間接為受驗證組織工作，受驗證組織應尋求以兒童最佳利益為優先之審慎且妥適之解決方案。","GOTS7-4.4.3.2":"若發現受驗證單位僱用未達最低年齡之兒童，受驗證單位應採取一切適當措施，使該兒童離開工作場所，並確保其獲得適當之補救，包括積極支持其接受教育。","GOTS7-4.4.3.3":"受驗證組織不得使未滿 18 歲之年輕勞工於夜間工作，或於危害其健康、安全或道德完整性，及／或損害其身體、心理、精神、道德或社會發展之條件下工作。","GOTS7-4.4.3.4":"年輕勞工每日工作時間不得超過 8 小時，或不得超過法令就年輕勞工所定之上限，以較低者為準。禁止加班，並應提供至少連續 12 小時之休息時間及慣例之每週例假。","GOTS7-4.4.3.5":"僱用年輕勞工之方式，應使其得以接受繼續教育或額外之教育機會，例如職業訓練或技術訓練。","GOTS7-4.4.4.1":"受驗證組織於招募、報酬、受訓機會、升遷、解僱或退休等方面，均應尊重平等機會。","GOTS7-4.4.4.3":"受驗證單位應鼓勵以保密方式通報虐待或嚴苛對待之情事。受驗證單位應嚴肅看待所有事件，並迅速調查所有關於歧視、暴力及騷擾（含性騷擾）之指控。若騷擾或歧視之申訴經查證屬實，受驗證單位應採取懲戒措施，包括至終止僱用。","GOTS7-4.4.4.5":"受驗證單位應訂有懲戒程序，並確保其有效傳達予勞工。懲戒程序之相關資訊，應於勞工到職時向其說明，並於工作場所易於取得。","GOTS7-4.4.5.1":"受驗證單位應透過平等、公正且透明之招募、升遷與獎酬程序及實務，致力達成性別平等。","GOTS7-4.4.5.2":"於訓練及專業與個人發展之各面向，應提供所有個人平等機會，不因其性別、性別認同或性傾向而有差異。","GOTS7-4.4.5.3":"受驗證單位應保護孕婦、母親及其子女，包括其健康與安全。","GOTS7-4.4.5.4":"受驗證單位應防止因懷孕或產假而導致之解僱或職涯受阻。","GOTS7-4.4.5.5":"應保護女性勞工免於因結婚或懷孕而受解僱威脅，或遭受其他對其僱用狀態產生負面影響之僱用決定。","GOTS7-4.4.5.6":"負有家庭責任之勞工，於受僱或遭解僱方面應受保護，免於受到歧視。","GOTS7-4.4.6.1":"勞工有權加入或組織其自行選擇之工會或勞工團體，並進行團體協商，無須事先取得受驗證組織管理階層之許可。受驗證組織不得干預、阻撓或妨礙該等合法活動。勞工亦有權加入其自行選擇之勞工團體。受驗證組織不得干預、阻撓或妨礙該等合法活動，亦不得營造不利於工會與勞工團體成立之氛圍。","GOTS7-4.4.6.4":"受驗證單位應提供勞工及其代表組織活動及進行團體協商所需之時間與場所。","GOTS7-4.4.6.5":"若結社自由與團體協商權受法律限制或禁止，受驗證組織不得依國際勞動基準阻礙其他形式之獨立且自由之勞工代表與協商機制。若場內無工會，雇主不得拒絕提供勞工選舉代表所需之時間與資源。經選出之代表應可定期接觸勞工及雇主代表。","GOTS7-4.4.6.6":"受驗證組織應依國際勞動基準，提供勞工代表進入工作場所以執行其代表職務之機會。勞工代表有權於不受任何不利行為或其威脅（包括解僱、恐嚇、歧視或報復）之情況下執行其代表職務。受驗證單位不得因勞工之工會身分或活動，而對其實施或威脅實施任何前述不利行為，包括解僱、恐嚇、歧視、騷擾或報復。","GOTS7-4.4.6.7":"各類別之員工得由該對應類別員工所選出之代表代表之。","GOTS7-4.4.6.8":"應尊重團體協約。","GOTS7-4.4.6.9":"受驗證單位應公告（例如於公告欄）並傳達（例如於勞動契約中）勞工之結社自由權與團體協商權。","GOTS7-4.4.7.1":"受驗證組織應於所有工作及住宿設施提供安全且清潔之環境，並應建立且遵循一套明確之職業安全衛生管理程序。緊急應變程序應清楚張貼並使全體勞工得以理解，危害亦應清楚標示。雇主應提供訓練，並以當地語言及其勞動力所使用之語言提供安全標示。應提供安全衛生之工作環境，並考量產業現行知識及任何特定危害。年輕勞工、新手與待產母親及身心障礙者等弱勢個人（不以此為限）應獲得特別保護。","GOTS7-4.4.7.4":"受驗證單位應採取適當步驟並建置制度，於合理可行範圍內依控制層級（hierarchy of controls）將工作環境固有危害之成因降至最低，以預防與工作相關或於工作過程中發生之事故、傷害與疾病。受驗證單位應免費提供勞工（含家庭代工人員）適當之個人防護具，並確保勞工於必要時確實使用。","GOTS7-4.4.7.5":"受驗證組織應提供適當之醫療協助與設施之取得管道，包括於場內提供適當之急救（受訓人員、足夠之器材與用品）。管理階層應訂有程序，使勞工於緊急情況下可獲得醫療協助。管理階層應遵守國家關於醫療協助與急救之法令。發生職業災害時，雇主應負責確保勞工獲得醫療協助；此可能包含投保以支應相關費用。","GOTS7-4.4.7.6":"受驗證組織應就廢棄物管理、化學品及其他危險物質之操作與處置，對勞工及管理人員實施充分訓練。就所使用之全部化學物質與製劑，應保存相對應之安全資料表（SDS），並確保就該等化學品之操作與儲存已落實適用之安全衛生措施。","GOTS7-4.4.7.7":"受驗證單位應於其影響範圍內採取一切適當措施，確保所使用之設備與建築物（包括所提供之勞工住宿）之穩固與安全，並防範任何可預見之緊急狀況。勞工於面臨立即危險時，應可無須申請許可即離開場所。","GOTS7-4.4.7.8":"受驗證單位應證明其符合當地消防安全法規，包括依規定配置必要之消防設備。","GOTS7-4.4.7.9":"受驗證單位應確保清楚標示之緊急出口與逃生動線可無限制通行，亦即未上鎖且無阻礙。受驗證單位應於每一樓層或工作區域裝設並維護可正常運作之火警警報系統。","GOTS7-4.4.7.10":"受驗證單位應提供訓練，並以當地語言及其勞動力所使用之語言提供安全標示。受驗證單位另得於安全標示中使用圖示。勞工應依法令所定機制參與職業安全衛生相關之討論。","GOTS7-4.4.7.11":"受驗證組織應對勞工及管理人員提供定期且留有紀錄之安全衛生訓練，並就所有新進或調職之勞工與管理人員重複實施。相關訓練內容視作業性質及安全衛生風險程度而定。勞工（含家庭代工人員）及職員應接受定期且留有紀錄之安全衛生訓練，包括防火訓練與（視情況）疏散演練，並就新進或調職勞工重複實施。","GOTS7-4.4.7.12":"若場所僱用家庭代工人員，應採取有效措施，確保該等人員獲得與場內勞工同等程度之保障。","GOTS7-4.4.7.13":"受驗證組織應提供全體勞工清潔之廁所設施與飲用水，並於適用時提供食物準備與存放之衛生設施。","GOTS7-4.4.7.14":"所提供之住宿應清潔、安全，並滿足勞工之基本需求。","GOTS7-4.4.7.15":"受驗證組織應將安全衛生之責任指派予一名高階管理階層代表。","GOTS7-4.4.8.1":"所有勞工於到職前，應獲得書面且可理解之僱用條件資訊，該資訊應符合國家法令要求，並包含報酬、工資及法定社會福利。","GOTS7-4.4.8.2":"所執行之工作應基於依國家法令與實務及國際勞動基準（以保障較優者為準）所建立之正式僱用關係。","GOTS7-4.4.8.3":"就以「計件」方式給薪之特定工作（不論係於雇主場所或於家中執行），其報酬率應與受驗證單位場所內從事類似工作並以時薪計酬之勞工所得相當。若無該等勞工，受驗證單位得以同一行業及地區另一場所之報酬作為基準。此外，該等計件勞工之工資，於任何情況下均不得低於國家法定基準、協商工資或產業基準標準中之較高者。","GOTS7-4.4.8.4":"報酬應定期（至少每月）且即時給付。勞工於每次受領報酬時，應獲知該給薪期間報酬之明細。","GOTS7-4.4.8.5":"勞工應直接以現金／匯入銀行帳戶，或以對勞工便利之方式受領報酬。應盡可能優先採行數位支付。任何形式之數位工資給付，僅得於法令規定或團體協約約定之條件與範圍內為之。","GOTS7-4.4.8.6":"禁止扣留報酬，俟僱用或訓練期間結束時再一次性給付。","GOTS7-4.4.8.7":"自報酬中扣款，僅得於法令規定或團體協約約定（以保障較優者為準）之條件與範圍內為之。如有扣款，應事先將扣款事由之相關資訊告知勞工。","GOTS7-4.4.8.8":"受驗證組織應依法令及（於適用時）契約約定，就所有加班時數一律以加給費率給付全體勞工。加給費率不得低於正常費率之 1.25 倍。若當地法規允許，亦得以等值之補休作為加班之補償。","GOTS7-4.4.8.9":"受驗證單位應就其各自營運計算「生活工資」（Living Wage）。此外，應將生活工資數據與其報酬數據進行比較，並計算其勞工之「工資差距」（Wage Gap）。","GOTS7-4.4.8.10":"受驗證單位應訂定計畫以弭平工資差距，並向其勞工給付生活工資。","GOTS7-4.4.9.1":"受驗證組織所訂之工作時間，應符合國家法令、產業基準標準或相關國際標準中對勞工健康、安全與福祉保障較優者。無論如何，受驗證單位之工作時間至少應符合 ILO 國際架構，包括本小節之一般原則。","GOTS7-4.4.9.2":"不得經常性要求勞工每日工作超過 8 小時或每週超過 48 小時（不含加班）；勞工於每一工作日均有權享有休息時間，且平均每 7 日期間內應獲得至少連續 24 小時之休息。","GOTS7-4.4.9.3":"加班應出於自願，每週不得超過 12 小時，不得經常性要求加班，且不得因而顯著提高職業危害之可能性。","GOTS7-4.4.10.1":"所執行之工作，應盡最大可能基於依國家法令與實務及國際勞動基準（以保障較優者為準）所建立之正式僱用關係。","GOTS7-4.4.10.2":"不得藉由純勞務承攬、轉包或家庭代工安排，亦不得藉由無實際傳授技能或提供正式僱用意圖之學徒制度，或以季節性、臨時性工作削弱勞工保障之方式，規避正常僱用關係下依勞動或社會保險法令對員工所負之義務。亦不得藉由過度使用定期勞動契約規避該等義務。","GOTS7-4.4.11.1":"於受驗證單位場所工作之移工，應獲得與本地勞工同等之待遇，包括報酬、工作條件、僱用條件，以及 GOTS 人權與社會責任基準之其他規定。","GOTS7-4.4.11.2":"受驗證單位不得剝奪移工取得其旅行證件之權利。","GOTS7-4.4.11.3":"應以移工可理解之語言，提供其書面勞動契約，明確載明僱用條件，包括（於適用時）僱用期間與工作時間、扣款、福利（如休假與保險）、住宿、膳食及交通等資訊。","GOTS7-4.4.11.4":"若提供膳食、住宿、交通或其他服務，其收費不得高於市場行情。","GOTS7-4.4.12.1":"受驗證單位應致力確保家庭代工人員與場內勞工之待遇平等，並考量家庭代工之特殊性質，以及（於適當時）受驗證單位場所內相同或類似工作所適用之條件。","GOTS7-4.4.13.1":"受驗證單位應確保前述各項基準，不因非正式僱用型態而遭規避或其目的落空，包括濫用學徒制度、季節性工作、轉包，或招募與人力仲介機構等方式。","GOTS7-4.4.13.2":"受驗證單位應以適用之當地語言，向其勞工說明勞動契約內容、GOTS 人權與社會責任基準，以及 GOTS 所提供之其他相關資訊。","GOTS7-4.4.13.3":"應就每一勞工保存姓名、年齡、工作時間及所給付工資之紀錄。","GOTS7-4.4.13.4":"受驗證單位應允許勞工推選社會責任代表，由其就 GOTS 人權與社會責任基準之落實情形與符合程度向管理階層提供回饋。","GOTS7-4.4.13.5":"受驗證單位應就 GOTS 人權與社會責任基準建立可運作且有效之申訴機制。受驗證單位應記錄並調查勞工或第三方就遵循 GOTS 人權與社會責任基準所提出之申訴，並保存因此所生任何必要矯正措施之紀錄。","GOTS7-4.4.13.6":"若申訴可能與受驗證買方之商業實務有關，受驗證單位應依請求向該等受驗證買方提供申訴紀錄之相關資訊。","GOTS7-4.4.13.7":"受驗證單位不得因勞工提供關於 GOTS 人權與社會責任基準之遵循情形，或其他人權、勞動權相關議題之資訊，而對其採取懲戒措施、解僱或其他形式之歧視。","GOTS7-4.4.13.8":"核准驗證機構於執行查核與稽核時，應於其風險評估中研究並考量當地與國家之情況。","GOTS7-4.5.2":"受驗證單位應制定行為準則（Code of Conduct），規範倫理行為、誠信與公平交易之原則，並禁止任何形式之貪腐或賄賂。","GOTS7-4.5.3":"受驗證單位應遵循相關之 OECD 指導綱領。","GOTS7-4.5.4":"受驗證單位不得涉入任何貪腐、勒索或侵占行為，亦不得涉入任何形式之賄賂，包括但不限於承諾、提供、給予或收受任何不當之金錢或其他利益。","GOTS7-4.5.5":"受驗證單位應就其活動、組織結構與績效保存正確資訊，並依適用法規及產業基準實務予以揭露。","GOTS7-4.5.6":"受驗證單位不得參與偽造該等資訊，亦不得於供應鏈中從事任何不實陳述之行為。","GOTS7-4.5.7":"受驗證單位蒐集、使用及以其他方式處理任何個人資料（包括其影響範圍內之勞工、商業夥伴、客戶與消費者之資料）時，應盡合理之注意義務。","GOTS7-4.5.8":"受驗證單位蒐集、使用及處理個人資料，應遵循隱私與資訊安全相關法令及法規要求。","GOTS7-4.5.9":"受驗證單位應建立匿名且無歧視之檢舉機制，確保易於使用，並提供有效措施保護檢舉人，同時確保所接獲關於貪腐或不符合事項之任何資訊均獲後續追蹤並採取必要行動。","GOTS7-4.5.10":"受驗證單位應對相關人員提供誠信規範之訓練，並告知其違反規定之罰則。","GOTS7-5.1.1":"受驗證單位應具備品質管理系統（QMS）之文件，即「產品品質手冊」。該手冊應以適當方式提供予相關人員與勞工。","GOTS7-5.1.2":"該系統應確保 GOTS 產品持續符合 GOTS 及其實施手冊所訂之技術品質參數與殘留限值。","GOTS7-5.1.3":"該系統應訂定目標、績效指標，並就投入物、半成品及成品進行品質測試。","GOTS7-5.1.4":"該系統應包含產品品質之申訴管理制度、內部稽核制度、矯正措施之文件化、事件之監控與管理、污染風險評估，以及管理階層對 QMS 之定期審查。","GOTS7-5.2.1":"受驗證單位應依風險評估執行測試，以確保符合本標準，特別是第 5.2.6 節（技術品質參數）及第 5.2.7 節、第 5.2.8 節（GOTS 產品、其他纖維材料與附屬品之殘留限值）之基準。","GOTS7-5.2.2":"所有 GOTS 產品、該等產品之組成部分及投入物，均應納入風險評估範圍。","GOTS7-5.2.5":"依 ISO/IEC 17025 取得認證，或符合 GLP 資格，且就紡織品或化學品投入物之殘留檢測具備適當經驗之實驗室，得於其認證範圍內之測試項目執行殘留檢測。","GOTS7-5.2.6.1":"依 GOTS 標示之任何最終消費產品，應符合下列技術品質參數：GOTS v7.0 第 5.2.6.1 節表 10「GOTS 產品之技術品質要求」。","GOTS7-5.2.7.1":"即使依本標準生產，紡織品仍可能帶有微量殘留物（例如因無法避免之污染所致）。","GOTS7-5.2.7.2":"下表列出 GOTS 產品之相應限值：GOTS v7.0 第 5.2.7.2 節表 11「GOTS 產品化學殘留物限值」。致敏性分散染料清單請參見《GOTS V7.0 實施手冊》第 4.2.6.6 節。","GOTS7-5.2.8.1":"用於製造 GOTS 產品之其他纖維與附屬品（分別依第 3.2 節及第 3.3 節之基準），應符合 GOTS v7.0 第 5.2.8.1 節表 12「其他纖維與附屬品之化學殘留物限值」。","GOTS7-5.2.8.2":"附屬品之附加要求列於 GOTS v7.0 第 5.2.8.2 節表 13「附屬品之附加要求」。","GOTS7-6.1.1":"適用範圍：本節所稱紡織類個人護理產品分為下列各組。第 I 組—外用產品：脫脂棉、衛生棉、繃帶、尿布、紗布棉墊（Gamgee）、島狀敷料、傷口貼、OK 繃、紗布敷料等。第 II 組—物理侵入性產品：衛生棉條、棉花棒、牙科棉捲等；臨床侵入性產品：手術棉球、紗布球等。參見 GOTS v7.0 第 6.1.1 節表 14「紡織類個人護理產品之分組」。","GOTS7-6.1.2.1":"纖維材料組成：a. 所使用之全部纖維應為完全無氯（TCF）。b. 不織布與吸收性材料應由 100% 經驗證之有機纖維構成。c. 第 II 組產品不得使用合成纖維成分，除非為符合法令或醫療法規而必須使用其他纖維材料，且其比例不超過含量之 5%（標示為 organic 時）或 30%（標示為 made with x% organic materials 時）。","GOTS7-6.1.2.2":"高吸水性聚合物（SAP）：a. SAP 應以非基因改造之可再生原料（ADM 類型）製成。b. SAP 之水溶性萃取物含量最多不得超過重量之 5%。","GOTS7-6.1.2.3":"阻隔膜：a. 除傷口接觸層外，阻隔膜應由可生物分解之聚合物構成。b. 所使用之全部原料應為非基因改造。","GOTS7-6.1.2.4":"衛生棉條之特定基準：a. 僅允許使用紙質或紙板製之導管。此外，導管材料應符合第 5.2.8 節之化學殘留物要求。b. 不得使用合成保護膜；保護膜僅允許使用 100% 有機棉纖維。","GOTS7-6.1.3.1":"上漿：a. 不得使用任何漿料。","GOTS7-6.1.3.2":"著色劑：a. 僅於為符合強制性法令規定而必須使用時，方允許使用著色劑。b. 所使用之全部著色劑應經 GOTS 核准。核准驗證機構得於存在明確功能目的時（例如用以辨識傷口敷料之方向）另行核予例外。","GOTS7-6.1.3.3":"螢光增白劑：a. 不得使用螢光增白劑（OBA）。","GOTS7-6.1.3.4":"香料、乳液與潤滑劑：a. 所使用之任何香料、乳液與潤滑劑，除應符合 GOTS 之投入物基準外，亦應符合 COSMOS 標準（有機與天然化妝品標準）之投入物基準。","GOTS7-6.2.1":"適用範圍：食品接觸紡織品（FCT）可能因物質移轉而污染食品或飲水。所有 FCT 均納入本節適用範圍，適用於 FCT 製造、加工與配銷之所有產業別及所有階段。","GOTS7-6.2.1.1":"食品接觸紡織品之特定材料與投入物基準：a. 所使用之全部紡織品應為完全無氯（TCF）。b. FCT 應由 100% 經驗證之有機纖維構成。c. 紡織品之食品接觸面禁止印花。良好製造規範（GMP）尤應確保化學物質不會透過基材發生移轉。"};var Ge={title:{ja:"トレーサビリティ事前練習",en:"Traceability Practice",zhTW:"可追溯性事前演練"},lede:{ja:"販売した取引を1件選び、仕入まで遡って書類がつながるかを確認します。",en:"Pick one sale and check that the paperwork connects all the way back to the purchase.",zhTW:"選定一筆銷售交易，確認相關文件可完整回溯至採購端。"},intro:{ja:"監査では、実際の取引をサンプルとして選定し、販売から仕入までの記録を遡って確認する場合があります。事前に1件練習しておくことで、資料の不足やつながりを確認できます。",en:"During the audit, the auditor may select an actual transaction and trace it from sale back to purchase. Practising one transaction in advance helps identify missing records or broken links.",zhTW:"稽核時可能抽樣一筆實際交易，自銷售端追溯至採購端。事前演練一筆交易，可協助確認文件缺漏或追溯鏈結是否完整。"},disclaimer:{ja:"これは貴社ご自身のための練習用シートです。IDFLがこの内容を受け取ることはなく、監査の証拠として提出するものでもありません。監査の判断は、実際の記録に基づいて行われます。",en:"This practice sheet is for your own use. IDFL does not receive it, and it is not audit evidence. The audit reaches its own conclusions from your actual records.",zhTW:"本演練表僅供貴公司自用。IDFL 不會取得其內容，亦非稽核佐證資料；稽核結論係依貴公司實際紀錄作成。"},referenceLabel:{ja:"練習に使った取引（伝票番号・出荷日など）",en:"The transaction you practised with (document number, ship date …)",zhTW:"本次演練所使用之交易（單號、出貨日期等）"},referencePlaceholder:{ja:"例：出荷No. 2026-0412 / 〇〇株式会社向け",en:"e.g. Shipment 2026-0412 — customer ABC Co.",zhTW:"例：出貨單號 2026-0412／客戶 ○○公司"},groups:[{id:"sales",label:{ja:"販売側",en:"Sales side",zhTW:"銷售端"},hint:{ja:"ここから遡り始めます",en:"Start here and work backwards",zhTW:"由此開始往回追溯"},steps:[{id:"trace.sales.order",label:{ja:"受注書・販売契約",en:"Customer order / sales order",zhTW:"客戶訂單／銷售訂單"},hint:{ja:"販売先、品番、数量、納期が分かるもの",en:"Shows the customer, article, quantity and delivery date",zhTW:"可辨識客戶、品號、數量與交期"}},{id:"trace.sales.invoice",label:{ja:"売上請求書",en:"Sales invoice",zhTW:"銷貨發票"},hint:{ja:"品名にGOTSの記載があるかを確認します",en:"Check whether GOTS appears in the item description",zhTW:"確認品名是否載明 GOTS"}},{id:"trace.sales.delivery",label:{ja:"納品書・出荷記録",en:"Delivery note / shipping record",zhTW:"送貨單／出貨紀錄"},hint:{ja:"出荷日と数量が請求書と一致しているか",en:"Do the ship date and quantity match the invoice?",zhTW:"出貨日期與數量是否與發票一致"}},{id:"trace.sales.tc",label:{ja:"Outgoing TC（該当する場合）",en:"Outgoing TC (if applicable)",zhTW:"Outgoing TC（如適用）"},optional:!0,hint:{ja:"発行している場合、この出荷が含まれているか",en:"If one was issued, does it cover this shipment?",zhTW:"若已開立，是否涵蓋本批出貨"}}]},{id:"internal",label:{ja:"社内・保管",en:"Internal and storage",zhTW:"內部與倉儲"},hint:{ja:"販売と仕入をつなぐ部分です。ここが切れていることが多くあります",en:"The link between sale and purchase — this is where the chain most often breaks",zhTW:"銷售與採購之間的連結，此處最常發生鏈結中斷"},steps:[{id:"trace.internal.stock",label:{ja:"在庫の動き（出庫記録）",en:"Inventory movement",zhTW:"庫存異動（出庫紀錄）"},hint:{ja:"この出荷分が在庫から引き落とされているか",en:"Was this shipment taken out of stock in the records?",zhTW:"本批出貨是否已自庫存扣除"}},{id:"trace.internal.lot",label:{ja:"ロット・バッチ番号",en:"Lot or batch identification",zhTW:"批號辨識"},hint:{ja:"出荷した製品と仕入れた原料を結びつける番号",en:"The number that links what you shipped to what you bought",zhTW:"可將出貨產品與所採購原料相互連結之編號"}},{id:"trace.internal.warehouse",label:{ja:"倉庫の入出庫記録",en:"Warehouse record",zhTW:"倉庫進出紀錄"},hint:{ja:"外部倉庫の場合は、委託先からの記録",en:"For an external warehouse, the record from the contractor",zhTW:"若為外部倉庫，請取得委外單位之紀錄"}},{id:"trace.internal.processing",label:{ja:"加工・外注記録（該当する場合）",en:"Processing or subcontracting record (if applicable)",zhTW:"加工或委外紀錄（如適用）"},optional:!0,hint:{ja:"投入数量と産出数量が説明できるか",en:"Can the input and output quantities be explained?",zhTW:"投入與產出數量是否可說明"}}]},{id:"purchase",label:{ja:"仕入側",en:"Purchase side",zhTW:"採購端"},hint:{ja:"ここまで遡れれば1件分の練習は完了です",en:"Reaching here completes one practice run",zhTW:"追溯至此即完成一筆演練"},steps:[{id:"trace.purchase.tc",label:{ja:"Incoming TC（該当する場合）",en:"Incoming TC (if applicable)",zhTW:"Incoming TC（如適用）"},optional:!0,hint:{ja:"受領している場合、この原料が含まれているか",en:"If one was received, does it cover this material?",zhTW:"若已收受，是否涵蓋本項原料"}},{id:"trace.purchase.invoice",label:{ja:"仕入請求書",en:"Supplier invoice",zhTW:"採購發票"},hint:{ja:"品名・数量が入荷記録と一致しているか",en:"Do the item and quantity match the receiving record?",zhTW:"品項與數量是否與收貨紀錄一致"}},{id:"trace.purchase.order",label:{ja:"発注書",en:"Purchase order",zhTW:"採購訂單"},hint:{ja:"発注
