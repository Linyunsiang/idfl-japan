hTW:"成衣／縫製廠"}},{value:"dyeing",group:"make",label:{ja:"染色工場",en:"Dyeing factory",zhTW:"染整廠"}},{value:"printing",group:"make",label:{ja:"プリント工場",en:"Printing factory",zhTW:"印花廠"}},{value:"finishing",group:"make",label:{ja:"仕上げ加工工場",en:"Finishing factory",zhTW:"後加工廠"}},{value:"laminating",group:"make",label:{ja:"ラミネート加工工場",en:"Laminating factory",zhTW:"貼合／壓層廠"}},{value:"recycler",group:"make",label:{ja:"リサイクル事業者",en:"Recycler",zhTW:"回收再生業者"}},{value:"other_processor",group:"make",label:{ja:"その他の加工業者",en:"Other processor",zhTW:"其他加工業者"}},{value:"other_manufacturer",group:"make",label:{ja:"その他の製造業者",en:"Other manufacturer",zhTW:"其他製造業者"}}]},{id:"productTypes",step:"activity",type:"multi",summaryLabel:{ja:"取扱製品",en:"Products",zhTW:"產品"},title:{ja:"貴社が扱うGOTS対象製品はどれですか？",en:"Which GOTS products does your company handle?",zhTW:"貴公司經手的 GOTS 產品屬於哪些類別？"},help:{ja:"複数選択できます。ここでの回答から、完成品を扱うかどうかを判断します。",en:"Select all that apply. We use this to work out whether you handle finished consumer products.",zhTW:"可複選。系統會依此判斷貴公司是否處理消費性成品。"},whyAsk:{ja:"完成品を扱う場合、ラベル表示や附属品に関する確認項目が追加される可能性があります。中間製品のみの場合は、それらの多くが対象外となります。",en:"Handling finished products can bring in additional checks on labelling and accessories. If you only handle intermediate goods, many of those fall away.",zhTW:"若處理成品，可能追加標示與附屬品相關查核項目；若僅處理半成品，多數該類項目將不適用。"},options:[{value:"fiber",label:{ja:"繊維・原綿",en:"Fibre",zhTW:"纖維／原料"}},{value:"yarn",label:{ja:"糸",en:"Yarn",zhTW:"紗線"}},{value:"fabric",label:{ja:"生地・織編物",en:"Fabric",zhTW:"布料"}},{value:"intermediate",label:{ja:"中間製品（半製品）",en:"Intermediate textile product",zhTW:"半成品／中間產品"},hint:{ja:"裁断品、パーツ、未仕上げ品など",en:"Cut parts, components, unfinished goods",zhTW:"裁片、部件、未完成品等"}},{value:"finished",label:{ja:"完成品（最終製品）",en:"Finished product",zhTW:"成品（最終產品）"},hint:{ja:"アパレル、寝具、タオルなど",en:"Apparel, bedding, towels and similar",zhTW:"服飾、寢具、毛巾等"}},q]},{id:"transactionFlow",step:"activity",type:"multi",summaryLabel:{ja:"取引",en:"Trade",zhTW:"交易"},title:{ja:"GOTS製品の取引について、あてはまるものをすべて選んでください。",en:"Which of these apply to how you trade GOTS goods?",zhTW:"關於 GOTS 產品的交易，請勾選所有適用項目。"},help:{ja:"この回答をもとに、仕入・販売・在庫に関する準備資料を判断します。",en:"This decides which purchasing, sales and inventory records you need.",zhTW:"系統將依此判斷採購、銷售與庫存相關的應備文件。"},whyAsk:{ja:"仕入のみ、販売のみ、在庫保有の有無によって、必要となる取引記録とマスバランスの範囲が変わります。",en:"Whether you buy, sell or hold stock changes which transaction records and which part of the mass balance apply to you.",zhTW:"是否採購、銷售或持有庫存，將影響所需之交易紀錄與質量平衡涵蓋範圍。"},options:[{value:"purchase",label:{ja:"GOTS認証製品を購入する",en:"We purchase GOTS certified goods",zhTW:"會採購 GOTS 驗證產品"}},{value:"sell",label:{ja:"GOTS認証製品を販売する",en:"We sell GOTS certified goods",zhTW:"會銷售 GOTS 驗證產品"}},{value:"inventory",label:{ja:"GOTS製品の在庫を保有する",en:"We hold GOTS stock",zhTW:"會保有 GOTS 產品庫存"}},q]},{id:"tcHandling",step:"activity",type:"single",summaryLabel:{ja:"取引証明書（TC）",en:"Transaction Certificates",zhTW:"交易證明（TC）"},title:{ja:"取引証明書（TC）の発行または受領を行っていますか？",en:"Do you issue or receive Transaction Certificates (TC)?",zhTW:"貴公司是否開立或接收交易證明（TC）？"},help:{ja:"TCは、特定の出荷についてGOTS認証製品であることを認証機関が証明する書類です。会社単位の証明であるスコープ証明書（SC）とは異なります。",en:"A Transaction Certificate is issued by a certification body for a specific shipment. It is different from a Scope Certificate, which covers a company.",zhTW:"TC 係由驗證機構針對特定出貨所核發之證明，與涵蓋整家公司的範圍證書（SC）不同。"},whyAsk:{ja:"取引証明に関して実際に必要となる資料は、取引形態や認証範囲によって異なります。まず貴社がどちら側に立つのかを確認したうえで、確認すべき資料をご案内します。",en:"The transaction evidence that actually applies depends on your transaction structure and certification scope. We first establish which side you are on, then show what to review.",zhTW:"實際適用之交易證明會依交易型態與驗證範圍而異。先確認貴公司所處之角色，再說明應確認之資料。"},options:[{value:"yes",label:{ja:"はい（発行・受領のいずれか、または両方）",en:"Yes — we issue, receive, or both",zhTW:"是（開立、接收或兩者皆有）"}},{value:"no",label:{ja:"いいえ",en:"No",zhTW:"否"}},{...W,hint:{ja:"TCに関する確認項目を残し、監査前にIDFL担当者と確認する案内を表示します",en:"We keep the TC items on your list and suggest confirming them with your IDFL contact",zhTW:"將保留 TC 相關項目，並建議於稽核前與 IDFL 窗口確認"}}]},{id:"physicalHandling",step:"activity",type:"single",summaryLabel:{ja:"現物の取扱い",en:"Physical handling",zhTW:"實體經手"},title:{ja:"貴社ではGOTS対象製品を実際に受け取り、取り扱っていますか？",en:"Does your company physically receive or handle GOTS products?",zhTW:"貴公司是否實際收受並經手 GOTS 產品？"},help:{ja:"書類上の取引のみで、現物が貴社を通らない場合は「いいえ」を選んでください。",en:'Choose "No" if the goods never physically pass through your company.',zhTW:"若貨物實際上未經過貴公司，請選擇「否」。"},whyAsk:{ja:"現物を扱う場合、保管場所の分別、ロット管理、現地確認に関する項目が対象になります。現物が通らない場合、それらの多くは対象外となります。",en:"If goods pass through you, segregation, lot control and on-site verification come into scope. If they never do, most of that falls away.",zhTW:"若實際經手貨品，將涉及分隔保管、批號管理與現場查核；若未經手，多數該類項目將不適用。"},options:[{value:"yes",label:{ja:"はい、現物を取り扱います",en:"Yes, we handle the goods",zhTW:"是，我們實際經手貨品"}},{value:"no",label:{ja:"いいえ、書類上の取引のみです",en:"No, we only trade on paper",zhTW:"否，僅進行書面交易"}},W]},{id:"salesChannel",step:"sales",type:"single",summaryLabel:{ja:"販売形態",en:"Sales channel",zhTW:"銷售通路"},title:{ja:"GOTS認証製品は、どのように販売していますか？",en:"How are the certified products sold?",zhTW:"GOTS 驗證產品是以何種方式銷售？"},help:{ja:"B2Bは事業者向け、B2Cは一般消費者向けの販売です。",en:"B2B means selling to businesses, B2C means selling to consumers.",zhTW:"B2B 指銷售給企業，B2C 指銷售給一般消費者。"},whyAsk:{ja:"最終消費者向けに販売する場合、GOTS表示、ラベル、包装、ウェブサイト等に関する確認が追加で必要になる可能性があるためです。",en:"Selling directly to consumers may trigger additional checks related to GOTS claims, labels, packaging, websites and marketing.",zhTW:"若直接向最終消費者銷售，可能需要追加確認 GOTS 聲明、標籤、包裝、網站及行銷資料。"},options:[{value:"b2b",label:{ja:"B2Bのみ（事業者向け）",en:"B2B only",zhTW:"僅 B2B（企業客戶）"}},{value:"b2c",label:{ja:"B2Cのみ（一般消費者向け）",en:"B2C only",zhTW:"僅 B2C（一般消費者）"}},{value:"both",label:{ja:"B2BとB2Cの両方",en:"Both B2B and B2C",zhTW:"B2B 與 B2C 皆有"}},W]},{id:"brandOwner",step:"sales",type:"single",summaryLabel:{ja:"ブランド",en:"Brand",zhTW:"品牌"},title:{ja:"GOTS製品に付くブランドは、貴社が保有または管理していますか？",en:"Does your company own or control the brand on the GOTS product?",zhTW:"GOTS 產品上的品牌是否由貴公司擁有或掌控？"},help:{ja:"ブランドを保有している場合、ラベル・ロゴ・広告表示に関する確認項目が追加されます。",en:"If you own the brand, additional checks on labels, logo use and marketing apply.",zhTW:"若貴公司擁有該品牌，將另外適用標籤、標誌使用與行銷宣稱的查核項目。"},whyAsk:{ja:"ブランドを保有・管理している事業者は、製品に付く表示内容や承認手続きについて責任を負う立場になりやすく、ラベル・訴求に関する準備資料が変わります。",en:"Whoever owns or controls the brand is usually the party responsible for what appears on the product and for getting it approved, which changes the label and claim evidence to prepare.",zhTW:"擁有或掌控品牌者，通常須就產品標示內容與其核准程序負責，因此標籤與宣稱相關之應備資料亦有所不同。"},options:[{value:"yes",label:{ja:"はい、自社ブランドです",en:"Yes, it is our brand",zhTW:"是，為自有品牌"}},{value:"no",label:{ja:"いいえ、他社ブランドです",en:"No, it is a third-party brand",zhTW:"否，為他人品牌"}},{value:"both",label:{ja:"自社ブランドと他社ブランドの両方",en:"Both own-brand and third-party products",zhTW:"自有品牌與他人品牌皆有"}},W]},{id:"claims",step:"sales",type:"multi",summaryLabel:{ja:"GOTS表示",en:"GOTS claims",zhTW:"GOTS 宣稱"},title:{ja:"GOTSの表示や訴求を、どこで使用（または使用予定）していますか？",en:"Where do you use — or plan to use — GOTS claims?",zhTW:"貴公司在何處使用（或計畫使用）GOTS 標示與宣稱？"},help:{ja:"GOTSロゴや「GOTS認証」という表現を使う場所をすべて選んでください。",en:'Select everywhere the GOTS logo or the words "GOTS certified" appear.',zhTW:"請勾選所有出現 GOTS 標誌或「GOTS 驗證」字樣的位置。"},whyAsk:{ja:"表示を行う媒体ごとに、事前承認や表示内容の確認が必要になる場合があります。使用していない媒体については確認項目を表示しません。",en:"Approval and wording checks can apply per medium. We do not show checks for media you do not use.",zhTW:"各使用媒介可能分別適用事前核准與內容查核。未使用之媒介將不顯示相關查核項目。"},options:[{value:"logo",label:{ja:"GOTSロゴ",en:"GOTS logo",zhTW:"GOTS 標誌"}},{value:"wording",label:{ja:"「GOTS認証」等の文言",en:"GOTS wording / certification claim",zhTW:"「GOTS 驗證」等文字宣稱"}},{value:"hangtag",label:{ja:"ハングタグ（下げ札）",en:"Hangtags",zhTW:"吊牌"}},{value:"label",label:{ja:"製品ラベル・洗濯表示",en:"Product labels",zhTW:"產品標籤"}},{value:"packaging",label:{ja:"包装・パッケージ表示",en:"Packaging claims",zhTW:"包裝標示"}},{value:"website",label:{ja:"自社ウェブサイト",en:"Website claims",zhTW:"公司網站"}},{value:"ecommerce",label:{ja:"ECサイト・通販ページ",en:"E-commerce listings",zhTW:"電商／網購頁面"}},{value:"advertising",label:{ja:"広告・カタログ・販促物",en:"Advertising and marketing material",zhTW:"廣告、型錄與促銷物"}},{value:"none",exclusive:!0,label:{ja:"GOTSの表示は使用しません",en:"We do not use GOTS claims",zhTW:"不使用 GOTS 宣稱"}},q]},{id:"processes",step:"operations",type:"multi",summaryLabel:{ja:"加工工程",en:"Processing",zhTW:"加工製程"},title:{ja:"貴社が自社で行う、または管理する加工工程はありますか？",en:"Does your company perform or control any processing?",zhTW:"貴公司是否自行執行或掌控任何加工製程？"},help:{ja:"認証範囲内で行う工程をすべて選んでください。加工を行わない場合は「加工は行わない」を選んでください。",en:'Select every process carried out within the certified scope. If none, choose "No processing".',zhTW:"請勾選驗證範圍內執行的所有製程。若無加工，請選擇「不進行加工」。"},whyAsk:{ja:"加工工程の有無は、環境管理、化学品管理、製品品質、トレーサビリティの各要件に影響します。加工を行わない場合、それらの多くは対象外となります。",en:"Processing activities affect environmental, chemical, quality and traceability requirements. Without processing, most of those fall out of scope.",zhTW:"是否有加工作業，將影響環境管理、化學品管理、產品品質與可追溯性等要求。若無加工，多數該類項目將不適用。"},options:[{value:"none",exclusive:!0,label:{ja:"加工は行わない",en:"No processing",zhTW:"不進行加工"}},{value:"spinning",label:{ja:"紡績",en:"Spinning",zhTW:"紡紗"}},{value:"knitting",label:{ja:"編立",en:"Knitting",zhTW:"針織"}},{value:"weaving",label:{ja:"製織",en:"Weaving",zhTW:"織布"}},{value:"cutting",label:{ja:"裁断",en:"Cutting",zhTW:"裁剪"}},{value:"sewing",label:{ja:"縫製",en:"Sewing",zhTW:"車縫"}},{value:"dyeing",label:{ja:"染色",en:"Dyeing",zhTW:"染色"}},{value:"printing",label:{ja:"プリント",en:"Printing",zhTW:"印花"}},{value:"washing",label:{ja:"洗い加工",en:"Washing",zhTW:"水洗加工"}},{value:"finishing",label:{ja:"仕上げ加工",en:"Finishing",zhTW:"後整理加工"}},{value:"packaging",label:{ja:"包装",en:"Packaging",zhTW:"包裝"}},{value:"repacking",label:{ja:"再包装",en:"Repacking",zhTW:"重新包裝"}},{value:"relabelling",label:{ja:"再ラベリング（ラベル貼替）",en:"Relabelling",zhTW:"重新標示／換標"}},{value:"other_process",label:{ja:"その他の加工",en:"Other processing",zhTW:"其他加工"}},q]},{id:"chemicalUse",step:"operations",type:"single",summaryLabel:{ja:"化学品",en:"Chemicals",zhTW:"化學品"},when:{any:[{field:"processes",includesNone:["none"]},{field:"outsourcing",includesNone:["none"]}],reason:"na.noProcessing"},title:{ja:"認証範囲内で化学品（染料・助剤・薬剤）を使用していますか？",en:"Are chemical inputs used within the certified operation?",zhTW:"在驗證範圍內是否使用化學品（染料、助劑、藥劑）？"},help:{ja:"洗剤、染料、糊剤、樹脂加工剤なども化学品に含まれます。",en:"Detergents, dyes, sizing agents and finishing resins all count as chemical inputs.",zhTW:"清潔劑、染料、漿料與樹脂整理劑等均屬化學品投入。"},whyAsk:{ja:"自社で使用する場合と、外注先のみが使用する場合とで、準備する資料と確認の方法が変わります。",en:"What you prepare, and how it is verified, differs between chemicals used in house and chemicals used only by a subcontractor.",zhTW:"由公司自行使用與僅由委外廠商使用，其應備資料與查證方式並不相同。"},options:[{value:"yes",label:{ja:"はい、自社で使用します",en:"Yes, in house",zhTW:"是，於公司內部使用"}},{value:"outsourced",label:{ja:"外注先のみが使用します",en:"Outsourced only",zhTW:"僅委外廠商使用"}},{value:"no",label:{ja:"いいえ、使用しません",en:"No",zhTW:"否，未使用"}},W]},{id:"warehouse",step:"operations",type:"single",summaryLabel:{ja:"保管場所",en:"Storage",zhTW:"保管地點"},when:{field:"physicalHandling",notIn:["no"],reason:"na.noPhysicalHandling"},title:{ja:"GOTS製品はどこで保管していますか？",en:"Where are GOTS products stored?",zhTW:"GOTS 產品在何處保管？"},whyAsk:{ja:"実際に製品を保管している場合、分別保管、在庫記録、現地確認に関する準備が必要になります。外部倉庫を使う場合は、その委託先も確認対象になります。",en:"Physical storage brings segregation, inventory records and on-site verification into your preparation. An external warehouse also brings the contractor into scope.",zhTW:"若實際保管產品，將涉及分隔保管、庫存紀錄與現場查核；若使用外部倉庫，該委外單位亦納入查核範圍。"},options:[{value:"own",label:{ja:"自社倉庫",en:"Own warehouse",zhTW:"自有倉庫"}},{value:"external",label:{ja:"外部倉庫（委託先）",en:"External warehouse",zhTW:"外部倉庫（委外）"}},{value:"both",label:{ja:"自社倉庫と外部倉庫の両方",en:"Both own and external",zhTW:"自有與外部倉庫皆有"}},{value:"none",label:{ja:"保管しない（直送のみ）",en:"No storage — direct shipment only",zhTW:"不保管（僅直送）"}},W]},{id:"warehouseSegregation",step:"operations",type:"single",summaryLabel:{ja:"保管の分別",en:"Segregation",zhTW:"分隔保管"},when:{field:"warehouse",in:["own","external","both",Y],reason:"na.noStorage"},title:{ja:"GOTS製品と非GOTS製品を、同じ場所に保管していますか？",en:"Are GOTS and non-GOTS goods stored in the same place?",zhTW:"GOTS 產品與非 GOTS 產品是否存放於同一處？"},help:{ja:"同じ倉庫でも、区画や表示で明確に分けていれば問題ありません。監査では実際の分別状況を確認します。",en:"Sharing a warehouse is fine as long as the areas are clearly separated and marked. The auditor will look at how this works in practice.",zhTW:"即使共用倉庫，只要區域劃分與標示清楚即可。稽核時會實地確認分隔情形。"},options:[{value:"shared",label:{ja:"同じ場所に保管している",en:"Stored together",zhTW:"存放於同一區域"}},{value:"segregated",label:{ja:"完全に分けて保管している",en:"Stored fully separately",zhTW:"完全分開存放"}},W]},{id:"warehouseOperations",step:"operations",type:"multi",summaryLabel:{ja:"外部倉庫での作業",en:"External warehouse work",zhTW:"外部倉庫作業"},when:{field:"warehouse",in:["external","both",Y],reason:"na.noExternalWarehouse"},title:{ja:"外部倉庫では、保管以外の作業を行っていますか？",en:"Does the external warehouse do anything beyond storage?",zhTW:"外部倉庫是否執行保管以外的作業？"},whyAsk:{ja:"再包装や再ラベリングは、製品の中身と表示がずれやすい作業です。行っている場合は作業手順と記録が確認対象になります。",en:"Repacking and relabelling are where what is in the box and what is on the box most easily stop matching, so the procedure and records are examined.",zhTW:"重新包裝與換標最易造成產品內容與標示不符，若有此類作業，其程序與紀錄將納入查核。"},options:[{value:"none",exclusive:!0,label:{ja:"保管のみ",en:"Storage only",zhTW:"僅保管"}},{value:"repack",label:{ja:"再包装",en:"Repacking",zhTW:"重新包裝"}},{value:"relabel",label:{ja:"再ラベリング",en:"Relabelling",zhTW:"重新標示"}},{value:"inspection",label:{ja:"検品・仕分け",en:"Inspection or sorting",zhTW:"檢品或分類"}},q]},{id:"warehouseDetails",step:"operations",type:"text",optional:!0,when:{field:"warehouse",in:["external","both"]},title:{ja:"外部倉庫の名称と所在地を教えてください。",en:"What is the name and location of the external warehouse?",zhTW:"請提供外部倉庫的名稱與所在地。"},help:{ja:"任意です。監査計画の作成に使用します。複数ある場合は改行で区切ってください。",en:"Optional — used for audit planning. List one per line if there are several.",zhTW:"選填，供稽核規劃使用。若有多處請分行填寫。"},placeholder:{ja:"例：〇〇物流株式会社　千葉県市川市…",en:"e.g. ABC Logistics Co., Ltd. — Ichikawa, Chiba",zhTW:"例：○○物流股份有限公司　新北市…"}},{id:"outsourcing",step:"operations",type:"multi",summaryLabel:{ja:"外注",en:"Outsourced",zhTW:"委外"},title:{ja:"社外に委託している業務はありますか？",en:"Do you outsource any activity?",zhTW:"是否有委外執行的作業？"},help:{ja:"GOTS対象製品に関わる委託業務をすべて選んでください。",en:"Select every outsourced activity that touches GOTS goods.",zhTW:"請勾選所有涉及 GOTS 產品的委外作業。"},whyAsk:{ja:"外注した工程も貴社の認証範囲の一部として扱われます。委託しても管理責任は貴社に残るため、契約と管理記録が確認対象になります。",en:"Outsourced steps remain part of your certified scope. Outsourcing the work does not outsource the responsibility, so contracts and monitoring records are examined.",zhTW:"委外製程仍屬貴公司驗證範圍之一部分。委外並不移轉管理責任，故合約與管理紀錄將納入查核。"},options:[{value:"none",exclusive:!0,label:{ja:"外注はしていない",en:"No outsourcing",zhTW:"無委外作業"}},{value:"processing",label:{ja:"加工工程",en:"Processing",zhTW:"加工製程"}},{value:"storage",label:{ja:"保管",en:"Storage",zhTW:"倉儲保管"}},{value:"packaging",label:{ja:"包装",en:"Packaging",zhTW:"包裝"}},{value:"relabelling",label:{ja:"再ラベリング",en:"Relabelling",zhTW:"重新標示"}},{value:"transport",label:{ja:"輸送",en:"Transport",zhTW:"運輸"}},{value:"other_outsourcing",label:{ja:"その他",en:"Other",zhTW:"其他"}},q]},{id:"subcontractorDetails",step:"operations",type:"text",optional:!0,when:{field:"outsourcing",includesAny:["processing","storage","packaging","relabelling","other_outsourcing"]},title:{ja:"主な委託先の名称と所在地を教えてください。",en:"Which subcontractors do you use?",zhTW:"請提供主要委外廠商的名稱與所在地。"},help:{ja:"任意です。委託先ごとに契約書と管理記録が必要になります。",en:"Optional. Each subcontractor needs a contract and monitoring record.",zhTW:"選填。每一家委外廠商均須具備合約與管理紀錄。"},placeholder:{ja:"例：〇〇縫製所（縫製）　岐阜県…",en:"e.g. XYZ Sewing (sewing) — Gifu, Japan",zhTW:"例：○○成衣廠（車縫）　台南市…"}},{id:"hasEmployees",step:"people",type:"single",summaryLabel:{ja:"働いている方",en:"Workers",zhTW:"工作人員"},title:{ja:"認証対象の事業所で働いている方はいますか？",en:"Does anyone work at the site covered by the certification?",zhTW:"受驗證場所是否有工作人員？"},help:{ja:"正社員に限りません。派遣、技能実習生、有期契約・パート、請負、在宅ワーカーなど、事業所のために働いている方すべてを含めてお考えください。",en:"Not only permanent employees. Include agency workers, technical interns, fixed-term and part-time staff, contractors and homeworkers — anyone working for the operation.",zhTW:"不限於正職員工。請包含派遣人員、技術實習生、定期契約與兼職人員、承攬人員及家庭代工等，所有為本單位工作之人。"},whyAsk:{ja:"GOTSの社会的要件は「Workers（働く人）」を対象としており、雇用契約の形式では判断されません。ここで「いいえ」を選ぶと、労働時間・賃金・安全衛生など多くの項目が対象外になりますので、派遣や技能実習生も含めてご確認ください。",en:'GOTS social requirements apply to "Workers", not to a particular form of employment contract. Answering "no" here removes a large part of the working-hours, wages and safety items from your list, so please include agency and intern workers before you answer.',zhTW:"GOTS 社會責任要求之對象為「Workers（工作人員）」，並非依僱傭契約形式判定。此處選「否」將使工時、工資與安全衛生等多數項目列為不適用，故請將派遣與實習人員一併納入考量後回答。"},options:[{value:"yes",label:{ja:"はい",en:"Yes",zhTW:"是"}},{value:"no",label:{ja:"いいえ（代表者・役員のみ）",en:"No — owner or directors only",zhTW:"否（僅負責人或董事）"},hint:{ja:"派遣・技能実習生・在宅ワーカーもいない場合のみお選びください",en:"Choose this only if there are also no agency, intern or home workers",zhTW:"僅於亦無派遣、實習或家庭代工人員時選擇"}},W]},{id:"workerTypes",step:"people",type:"matrix",summaryLabel:{ja:"雇用形態",en:"Worker types",zhTW:"僱用型態"},when:{field:"hasEmployees",in:["yes",Y],reason:"na.noEmployees"},scale:ia,title:{ja:"働いている方について、あてはまるものを選んでください。",en:"Which of these kinds of worker does your organisation have?",zhTW:"關於貴公司的工作人員，請選擇適用情形。"},help:{ja:"あてはまる項目があると、その分野の確認資料が追加されます。「いいえ」を選んだ項目は、理由付きで対象外として扱います。",en:'A "yes" adds evidence for that area. A "no" excludes it, with the reason recorded on your list.',zhTW:"選「是」將增加該領域之佐證資料；選「否」則列為不適用，並於清單載明理由。"},whyAsk:{ja:"GOTSの社会的要件には、特定の働き方にのみ適用されるものがあります。該当しない項目まで一律に表示しないために伺っています。",en:"Some GOTS social criteria apply only to particular working arrangements. We ask so that we do not put items on your list that cannot apply to you.",zhTW:"GOTS 部分社會責任要求僅適用於特定工作型態。詢問此項可避免將不適用之項目列入清單。"},items:[{field:"workerForeign",label:{ja:"外国人労働者・技能実習生",en:"Foreign or migrant workers",zhTW:"外籍勞工／移工"}},{field:"workerUnder18",label:{ja:"18歳未満の労働者",en:"Workers below 18 years old",zhTW:"未滿 18 歲之勞工"}},{field:"workerAgency",label:{ja:"人材派遣会社から供給される労働者",en:"Workers supplied by a labour agency",zhTW:"由人力仲介供應之勞工"}},{field:"workerTemporary",label:{ja:"有期契約・パート・アルバイト",en:"Temporary or fixed-term workers",zhTW:"定期契約／兼職人員"}},{field:"workerHomeworkers",label:{ja:"在宅ワーカー・内職者",en:"Homeworkers",zhTW:"家庭代工人員"}}]},{id:"workerFacilities",step:"people",type:"matrix",summaryLabel:{ja:"会社が提供する設備",en:"Facilities provided",zhTW:"公司提供之設施"},when:{field:"hasEmployees",in:["yes",Y],reason:"na.noEmployees"},scale:ia,title:{ja:"会社が提供している設備・サービスはありますか？",en:"Does the company provide any of these facilities?",zhTW:"公司是否提供下列設施或服務？"},help:{ja:"提供している場合、その設備に関する衛生・安全・任意利用の確認が加わります。",en:"Where a facility is provided, checks on hygiene, safety and whether use is voluntary are added.",zhTW:"若有提供，將增加該設施之衛生、安全及是否強制使用之查核。"},whyAsk:{ja:"宿舎、食事施設、送迎などは、提供している場合にのみ確認対象になります。提供していなければ対象外として明示します。",en:"Accommodation, catering and transport are only examined where they are actually provided. Where they are not, we say so explicitly.",zhTW:"宿舍、餐飲設施與交通接送僅於實際提供時納入查核；未提供者將明確列為不適用。"},items:[{field:"facilityDormitory",label:{ja:"寮・社宅などの宿泊施設",en:"Worker accommodation or dormitories",zhTW:"宿舍或員工住宿"}},{field:"facilityCanteen",label:{ja:"食堂・調理・食品保管の設備",en:"Food preparation or storage facilities",zhTW:"餐飲調理或食品存放設施"}},{field:"facilityTransport",label:{ja:"通勤用の送迎",en:"Transportation for workers",zhTW:"員工交通接送"}},{field:"facilityChildcare",label:{ja:"託児施設",en:"Childcare facilities",zhTW:"托兒設施"}}]}],sa=Object.fromEntries(ce.map(e=>[e.id,e])),oa=ce.flatMap(e=>e.type==="matrix"?e.items.map(a=>a.field):e.type==="daterange"?[`${e.id}From`,`${e.id}To`]:[e.id]);var la=[{id:"company.registration",category:"company",title:{ja:"会社概要・登記情報",en:"Company registration details",zhTW:"公司基本資料與登記文件"},why:{ja:"認証書に記載される会社名・住所・法人格が、実際の登記内容と一致しているかを確認するために使用します。ここがずれていると、発行される証明書やTCがそのまま使えなくなります。",en:"Used to confirm that the company name, address and legal entity on your certificate match your actual registration. A mismatch here makes the certificate and any TC unusable downstream.",zhTW:"用於確認驗證證書上的公司名稱、地址與法人資格是否與實際登記內容一致。若有出入，所核發的證書與 TC 將無法直接使用。"},prepare:{ja:["登記事項証明書（履歴事項全部証明書）","会社案内または事業概要","事業所・拠点の一覧（住所付き）"],en:["Certificate of company registration","Company profile or business overview","List of sites and addresses in scope"],zhTW:["公司登記證明文件（如變更事項登記表）","公司簡介或營運概要","納入範圍之場址與地址清單"]},auditorChecks:{ja:["申請書の会社名・住所と登記内容を突き合わせます","認証範囲に含める拠点がすべて申告されているかを確認します"],en:["Compares the name and address on the application with the registration","Checks that every site in scope has been declared"],zhTW:["比對申請書上的公司名稱、地址與登記內容","確認所有納入範圍的場址皆已申報"]},clauses:[],topics:[]},{id:"company.scope",category:"company",title:{ja:"GOTS認証範囲の定義",en:"Definition of the certification scope",zhTW:"GOTS 驗證範圍定義"},why:{ja:"どの製品・工程・拠点までがGOTSの対象なのかを、貴社と監査員が同じ理解で共有するための資料です。範囲が曖昧なままだと、監査当日に想定外の項目が追加されます。",en:"Makes sure you and the auditor share the same understanding of which products, processes and sites are covered. An unclear scope is the usual reason extra items appear on the audit day.",zhTW:"用以確保貴公司與稽核員對於哪些產品、製程與場址納入 GOTS 範圍具有一致認知。範圍不明確，常會在稽核當天衍生出預期外的查核項目。"},prepare:{ja:["認証を希望する製品カテゴリの一覧","認証範囲に含める工程の一覧","対象拠点（自社・外部倉庫・外注先）の一覧"],en:["List of product categories to be certified","List of processes inside the scope","List of sites: own, external warehouse, subcontractor"],zhTW:["擬申請驗證之產品類別清單","納入驗證範圍之製程清單","相關場址清單：自有、外部倉庫、委外廠商"]},auditorChecks:{ja:["申告された範囲と、現場で実際に行われている業務が一致しているかを確認します","範囲外とした工程が本当に行われていないかを現地で確認します"],en:["Compares the declared scope with what actually happens on site","Verifies on site that excluded processes really do not take place"],zhTW:["比對申報範圍與現場實際作業是否一致","於現場確認宣稱排除的製程確實未執行"]},clauses:[],topics:[]},{id:"company.previousSC",category:"company",title:{ja:"前年のスコープ証明書（SC）",en:"Previous Scope Certificate",zhTW:"前一年度範圍證書（SC）"},aka:"Scope Certificate (SC)",when:{field:"certificationStatus",in:["renewal","extension","certified"],reason:"na.initialOnly"},why:{ja:"前回の認証範囲と今回の申請内容を比較し、追加・削除された製品や工程を確認するために使用します。SCはサプライヤーが有効な認証を持つことを示す書類でもあります。",en:"Used to compare last year's scope with this application and identify what has been added or removed. An SC is also the document that proves a supplier holds valid certification.",zhTW:"用於比對前次驗證範圍與本次申請內容，確認新增或刪除的產品與製程。SC 同時也是證明供應商持有有效驗證的文件。"},prepare:{ja:["前年のスコープ証明書（SC）の写し","前回監査の指摘事項と是正記録","範囲を変更する場合はその内容と理由"],en:["Copy of last year's Scope Certificate (SC)","Previous audit findings and their corrective actions","Any scope changes, with the reason"],zhTW:["前一年度範圍證書（SC）影本","前次稽核之不符合事項與矯正紀錄","若有範圍變更，請說明內容與理由"]},auditorChecks:{ja:["前回指摘の是正が実際に定着しているかを確認します","SCの有効期限と記載製品を確認します"],en:["Checks that previous findings were genuinely closed out and have stuck","Checks the SC validity date and the products listed on it"],zhTW:["確認前次不符合事項之矯正措施是否確實落實並持續有效","查核 SC 之有效期限與所列產品"]},clauses:["2.5.4"],topics:[]},{id:"company.orgChart",category:"company",title:{ja:"組織図とGOTS責任者の任命",en:"Organisation chart and appointed GOTS manager",zhTW:"組織圖與 GOTS 負責人指派"},why:{ja:"GOTSの運用を誰が責任を持って行うのかを明確にするための資料です。担当者が特定できないと、記録があっても「運用されている」とは認められません。",en:"Shows who is actually responsible for running GOTS. Without a named person, records alone do not demonstrate that the system is operating.",zhTW:"用以明確 GOTS 運作之權責歸屬。若無指定負責人，即使有紀錄也難以證明制度確實運作。"},prepare:{ja:["組織図（GOTS担当部署が分かるもの）","GOTS責任者の任命書または職務分掌","担当者の連絡先"],en:["Organisation chart showing the GOTS function","Written appointment or job description for the GOTS manager","Contact details for the responsible person"],zhTW:["組織圖（可辨識 GOTS 權責單位）","GOTS 負責人之指派書或職務說明","負責人聯絡方式"]},auditorChecks:{ja:["任命された担当者に、GOTSの運用について直接質問します","担当者が交代した場合の引き継ぎ状況を確認します"],en:["Interviews the appointed person directly about how GOTS is run","Checks handover if the responsible person has changed"],zhTW:["直接向指派之負責人詢問 GOTS 運作情形","若負責人有異動，確認交接情形"]},clauses:["2.5.1"],topics:["management_system_related"]},{id:"management.manual",category:"management",title:{ja:"GOTS管理マニュアル",en:"GOTS management manual",zhTW:"GOTS 管理手冊"},aka:"GOTS Management Manual",systemUpload:15,why:{ja:"貴社がGOTSをどのような手順で運用しているかを、文書として説明するものです。監査ではこのマニュアルを起点に、記録が手順どおりに残っているかを確認していきます。マニュアルの記載と実際の運用が一致していない場合は、指摘につながりやすい点です。",en:"The written description of how you run GOTS. The auditor uses it as the starting point and then checks whether the records match what it says. Where the manual and daily practice do not match, a finding commonly follows.",zhTW:"以文件說明貴公司如何實際運作 GOTS。稽核員會以此手冊為起點，查核紀錄是否依程序留存。若手冊記載與實際作業不一致，常會因此開立不符合事項。"},prepare:{ja:["GOTS管理マニュアル（最新版・改訂履歴付き）","各手順の責任者が明記されていること","発行日と承認者が記載されていること"],en:["GOTS management manual, current version with revision history","A named owner for each procedure","Issue date and approver shown on the document"],zhTW:["GOTS 管理手冊（最新版並含修訂紀錄）","各項程序均載明負責人","文件載有發行日期與核准人"]},auditorChecks:{ja:["マニュアルに書かれた手順が、実際の記録として残っているかを照合します","担当者にマニュアルの内容を質問し、理解度を確認します","改訂履歴から、運用の実態に合わせて更新されているかを見ます"],en:["Traces procedures in the manual through to the actual records","Asks staff about the content to see whether it is understood, not just filed","Looks at the revision history to see whether it is kept alive"],zhTW:["將手冊所載程序逐一對照實際紀錄","詢問承辦人員手冊內容，確認其理解程度而非僅存檔","檢視修訂紀錄，確認手冊有隨實務更新"]},clauses:["2.5.1","2.5.2","2.5.3"],topics:["management_system_related"]},{id:"management.internalQA",category:"management",title:{ja:"内部品質保証の手順",en:"Internal quality assurance procedure",zhTW:"內部品質保證程序"},why:{ja:"GOTS製品が非GOTS製品と混ざったり、記録が抜けたりしないよう、社内でどう点検しているかを示します。「気をつけている」ではなく、誰がいつ何を確認するかを決めておく必要があります。",en:'Shows how you check internally that GOTS goods do not get mixed up and that records do not go missing. "We are careful" is not enough — it must say who checks what, and when.',zhTW:"說明公司內部如何查核，以避免 GOTS 產品與非 GOTS 產品混淆或紀錄遺漏。僅表示「會注意」並不足夠，須明訂由誰、於何時、查核何項。"},prepare:{ja:["内部品質保証の手順書","点検の実施記録（チェックリスト等）","不備が見つかったときの対応記録"],en:["Written internal QA procedure","Completed check records or checklists","Records of what was done when something was found"],zhTW:["內部品質保證程序書","查核執行紀錄（如檢查表）","發現異常時之處理紀錄"]},auditorChecks:{ja:["直近の点検記録を数件抽出し、実施日と担当者を確認します","見つかった不備がその後どう処理されたかを追跡します"],en:["Samples several recent check records and confirms dates and signatures","Follows a finding through to what was actually done about it"],zhTW:["抽查數筆近期查核紀錄，確認執行日期與簽核人員","追蹤所發現之異常後續實際處理情形"]},clauses:["2.5.2","2.5.3"],topics:["management_system_related"]},{id:"management.processFlow",category:"management",title:{ja:"業務フロー図（材料・製品の流れ）",en:"Material and business flow chart",zhTW:"業務流程圖（材料與產品流向）"},systemUpload:14,why:{ja:"材料が入ってから製品が出ていくまでの流れを1枚で示す図です。監査員はこの図を見て、どこで混合や取り違えのリスクがあるかを判断し、確認する場所を決めます。",en:"A single diagram of how material comes in and product goes out. The auditor reads it to decide where mixing or mix-up risk sits, and therefore what to look at.",zhTW:"以一張圖呈現材料進入至產品出貨的完整流向。稽核員依此判斷何處存在混料或誤用風險，並決定查核重點。"},prepare:{ja:["材料の入荷から出荷までの流れ図","各工程の担当者または委託先の記載","外注工程がある場合は、その位置を明示"],en:["Flow chart from incoming material to outgoing shipment","Who performs each step — in house or subcontracted","Outsourced steps clearly marked on the chart"],zhTW:["自材料進貨至產品出貨之流程圖","標示各製程之執行單位（自製或委外）","如有委外製程，應於圖上明確標示"]},auditorChecks:{ja:["図と現場の動線が一致しているかを歩いて確認します","図に描かれていない工程が行われていないかを確認します"],en:["Walks the site to see whether the flow on paper matches reality","Looks for steps happening that are not on the chart"],zhTW:["實地走訪確認流程圖與現場動線是否一致","確認是否存在流程圖上未記載之作業"]},clauses:["4.2.6.2"],topics:["management_system_related","traceability_related"]},{id:"management.training",periodScoped:!0,category:"management",title:{ja:"GOTSに関する教育・訓練記録",en:"GOTS training records",zhTW:"GOTS 教育訓練紀錄"},when:{field:"hasEmployees",eq:"yes",reason:"na.noEmployees"},why:{ja:"手順書があっても、現場の担当者が知らなければ運用されていないのと同じです。誰にいつ何を教えたかの記録が求められます。",en:"A procedure nobody on the floor knows about is not a working system. You need a record of who was trained, when, and on what.",zhTW:"即使有程序書，現場人員若不知悉，等同未實際運作。須留存受訓人員、日期與訓練內容之紀錄。"},prepare:{ja:["教育訓練の実施記録（日付・参加者・内容）","使用した教材または資料","新入社員・配置転換者への教育記録"],en:["Training records showing date, attendees and topic","The material used","Records for new starters and people who changed role"],zhTW:["教育訓練紀錄（日期、參加人員、內容）","所使用之教材或資料","新進人員與職務調動人員之訓練紀錄"]},auditorChecks:{ja:["現場の担当者に直接質問し、教育内容が理解されているかを確認します","記録上の参加者と実際の担当者が一致しているかを見ます"],en:["Asks floor staff directly to see whether the training landed","Checks that the people listed as trained are the people doing the job"],zhTW:["直接詢問現場人員，確認訓練內容是否確實被理解","確認紀錄上之受訓人員與實際執行人員是否一致"]},clauses:["2.5.1"],topics:["management_system_related"]},{id:"product.registration",category:"product",title:{ja:"商品登録リスト",en:"Product registration list",zhTW:"產品登錄清單"},systemUpload:1,why:{ja:"GOTSとして扱う製品を一覧にしたものです。この一覧に載っていない製品にGOTSの表示を使うことはできません。TCの発行対象を決める基礎にもなります。",en:"The list of products you handle as GOTS. Anything not on it cannot carry a GOTS claim, and it is the basis for deciding what a TC can cover.",zhTW:"列出作為 GOTS 處理之產品清單。未列於清單者不得使用 GOTS 標示，該清單亦為判定 TC 開立範圍之依據。"},prepare:{ja:["GOTS対象製品の一覧（品番・品名）","製品ごとの繊維構成（％）","製品ごとのGOTSグレード（Organic / Made with Organic）"],en:["List of GOTS products with article number and name","Fibre composition (%) for each product","GOTS grade per product (Organic / Made with organic)"],zhTW:["GOTS 產品清單（品號與品名）","各產品之纖維組成（％）","各產品之 GOTS 等級（Organic／Made with organic）"]},auditorChecks:{ja:["リストの製品と、実際に販売・出荷された製品を突き合わせます","繊維構成がGOTSの最低有機繊維率を満たしているかを計算で確認します"],en:["Cross-checks the list against what was actually sold and shipped","Recalculates fibre composition against the minimum organic content"],zhTW:["比對清單產品與實際銷售、出貨之產品","重新計算纖維組成，確認是否符合最低有機纖維比例"]},clauses:["3.1.1","3.2.1","3.2.2","3.2.3"],topics:["product_registration_related","material_input"]},{id:"product.specification",category:"product",title:{ja:"製品仕様の詳細",en:"Detailed product specification",zhTW:"產品規格明細"},systemUpload:9,why:{ja:"製品ごとの構成材料・附属品・加工内容を示す資料です。IDFLの監査員から様式の記入を求められる場合があります。",en:"Sets out the materials, accessories and processing for each product. The IDFL auditor may ask you to complete a specific form for this.",zhTW:"說明各產品之組成材料、附屬品與加工內容。IDFL 稽核員可能要求依指定表格填寫。"},prepare:{ja:["製品仕様書または生産指示書","附属品（ボタン・ファスナー・糸・ラベル等）の一覧","各材料の供給元"],en:["Product specification or production instruction sheet","List of accessories: buttons, zippers, sewing thread, labels","Supplier for each material"],zhTW:["產品規格書或生產指示單","附屬品清單：鈕扣、拉鍊、縫線、標籤等","各項材料之供應來源"]},auditorChecks:{ja:["実物の製品と仕様書の内容を照合します","附属品がGOTSの制限（メッキ・素材制限等）に適合しているかを確認します"],en:["Compares a physical sample against the specification","Checks accessories against the GOTS restrictions on materials and coatings"],zhTW:["以實品比對規格書內容","確認附屬品符合 GOTS 對材質與鍍層之限制"]},clauses:["3.3.1","6.1.1"],topics:["material_input"]},{id:"product.specialProducts",category:"product",title:{ja:"パーソナルケア／食品接触製品の追加仕様",en:"Specification for personal care or food-contact textiles",zhTW:"個人護理／食品接觸紡織品之附加規格"},priority:"conditional",conditionNote:"note.specialProductsOnly",why:{ja:"化粧用パフ、おしぼり、ティーバッグ用生地など、肌や食品に直接触れる製品には追加の基準が適用されます。該当製品がなければ確認は不要です。",en:"Extra criteria apply to products that touch skin or food directly — cosmetic pads, wipes, tea-bag fabric and similar. If you make none of these, nothing to do.",zhTW:"化妝棉、濕巾、茶包用布等直接接觸肌膚或食品之產品，適用額外基準。若無此類產品則無須準備。"},prepare:{ja:["該当製品の一覧（ある場合）","該当製品の材料・投入物リスト","追加試験の報告書"],en:["List of any such products","Materials and inputs used in them","Additional test reports"],zhTW:["相關產品清單（若有）","該類產品所使用之材料與投入物","額外測試報告"]},auditorChecks:{ja:["製品用途を確認し、該当区分に入るかを判断します","該当する場合、追加の投入物基準への適合を確認します"],en:["Confirms the intended use to decide whether the category applies","If it does, checks the additional input criteria"],zhTW:["確認產品用途以判定是否屬於該類別","若屬之，查核其是否符合附加投入物基準"]},clauses:["6.1.1","6.1.2.1","6.1.3.1","6.2.1"],topics:["special_product_related"]},{id:"audit.riskAssessment",category:"internal_audit",title:{ja:"GOTSリスク査定",en:"GOTS risk assessment",zhTW:"GOTS 風險評估"},systemUpload:16,why:{ja:"GOTS 7.0で明確に求められるようになった項目です。サプライヤー、輸送、保管、外注など、どこに混入や不正のリスクがあるかを自社で評価します。書式は問いません。認証機関から様式の提供を受けることもできますが、リスクの特定・評価・結論は貴社ご自身のご判断による必要があります。",en:"A requirement that GOTS 7.0 made explicit. You assess for yourself where the risk of contamination or substitution sits — suppliers, transport, storage, subcontractors. Any format is acceptable. A blank format can be requested from your certification body, but the risks identified, the ratings and the conclusions must be your own.",zhTW:"GOTS 7.0 明確化之要求。由公司自行評估供應商、運輸、保管、委外等環節之混入或替換風險。格式不拘；可向驗證機構索取空白格式，惟風險之辨識、評級與結論須由貴公司自行判斷。"},prepare:{ja:["記入済みのリスク査定（書式は自由）","リスクが高いと判断した項目への対策","見直しの実施日と担当者"],en:["Your completed risk assessment, in whatever format you use","Mitigation for anything rated high risk","Date and owner of the last review"],zhTW:["已填寫之風險評估（格式不拘）","針對高風險項目之因應措施","最近一次檢討之日期與負責人"]},auditorChecks:{ja:["実際の事業内容から見て、想定すべきリスクが漏れていないかを確認します","「リスクなし」とした判断に根拠があるかを質問します"],en:["Checks whether obvious risks for your actual business are missing",'Challenges any "no risk" rating and asks for the basis'],zhTW:["依實際營運內容確認是否遺漏應納入之風險","就評為「無風險」之項目詢問其判斷依據"]},clauses:["4.1.2","4.1.3","5.2.1","5.2.2"],topics:["risk_assessment_related"]},{id:"audit.internalAudit",periodScoped:!0,category:"internal_audit",title:{ja:"内部監査の計画と記録",en:"Internal audit plan and records",zhTW:"內部稽核計畫與紀錄"},why:{ja:"適切な内部監査を実施することで、認証監査前に課題を把握・是正し、GOTS管理システムが有効に運用されていることを示すことができます。",en:"A robust internal audit helps identify and correct issues before the certification audit and provides evidence that the GOTS management system is effectively implemented.",zhTW:"完善的內部稽核可協助公司在驗證稽核前發現並改善問題，並作為 GOTS 管理系統有效運作之證據。"},prepare:{ja:["内部監査の計画（実施時期・対象範囲）","内部監査の実施記録","発見事項と是正の記録"],en:["Internal audit plan: when, and covering what","Records of the audit actually carried out","Findings and what was done about them"],zhTW:["內部稽核計畫（執行時程與涵蓋範圍）","實際執行之稽核紀錄","發現事項與矯正紀錄"]},auditorChecks:{ja:["内部監査が形式的でないか、実際に指摘が出ているかを見ます","指摘が繰り返し発生していないかを確認します"],en:["Looks at whether the internal audit is real — does it ever find anything?","Checks whether the same finding keeps coming back"],zhTW:["檢視內部稽核是否流於形式、是否確實有提出不符合事項","確認相同不符合事項是否重複發生"]},clauses:["2.5.2"],topics:["management_system_related"]},{id:"review.dueDiligence",periodScoped:!0,category:"management_review",title:{ja:"デューデリジェンス管理プロセスの記録",en:"Due diligence management process",zhTW:"盡職調查管理流程紀錄"},why:{ja:"GOTS 7.0で新たに強化された要求です。人権・環境に関する負の影響を、自社で特定し、防止し、対処する仕組みがあるかを見ます。ポリシーを書くだけでなく、実際に何を調べ、何をしたかの記録が必要です。",en:"Strengthened in GOTS 7.0. It asks whether you have a working process to identify, prevent and address adverse human rights and environmental impacts — with records of what you actually looked at and did, not just a policy.",zhTW:"GOTS 7.0 新強化之要求。查核公司是否具備可辨識、預防並處理人權與環境負面衝擊之運作機制，且須留存實際查證與處理之紀錄，而非僅有政策文件。"},prepare:{ja:["デューデリジェンス方針","影響の特定と評価の記録","対応措置と、その効果の確認記録","経営層による承認"],en:["Due diligence policy","Records of impacts identified and assessed","Actions taken and how effectiveness was checked","Sign-off by senior management"],zhTW:["盡職調查政策","衝擊辨識與評估之紀錄","所採取之措施及其成效確認紀錄","經營階層之核准"]},auditorChecks:{ja:["特定された影響が、実際の事業内容と整合しているかを確認します","対応が「検討中」で止まっていないかを見ます"],en:["Checks the identified impacts actually fit your business",'Looks for actions that have been "under consideration" for a year'],zhTW:["確認所辨識之衝擊與實際營運內容相符","檢視是否有措施長期停留於「研議中」狀態"]},process:{title:{ja:"デューデリジェンスの8つのステップ",en:"The eight steps of due diligence",zhTW:"盡職調查的八個步驟"},note:{ja:"方針を1枚用意しただけでは、このプロセスが運用されている証拠にはなりません。各ステップについて、実際に行ったことの記録をご用意ください。",en:"A single policy document does not by itself evidence that this process operates. For each step, keep a record of what was actually done.",zhTW:"僅備妥一份政策文件，並不足以證明此流程確實運作。各步驟均請留存實際執行之紀錄。"},steps:[{label:{ja:"方針",en:"Policy",zhTW:"政策"},hint:{ja:"責任ある企業行動に関する方針を定め、経営層が承認する",en:"A responsible business conduct policy, approved by senior management",zhTW:"訂定負責任商業行為政策並經經營階層核准"}},{label:{ja:"リスクの特定",en:"Risk identification",zhTW:"風險辨識"},hint:{ja:"自社の事業とサプライチェーンで、人権・環境への影響が起こりうる箇所を洗い出す",en:"Identify where human rights and environmental impacts could arise, in your own operations and supply chain",zhTW:"辨識自身營運與供應鏈中可能發生人權與環境衝擊之環節"}},{label:{ja:"リスクの評価",en:"Risk assessment",zhTW:"風險評估"},hint:{ja:"特定した影響の深刻さと発生可能性を評価し、優先順位を決める",en:"Assess severity and likelihood, and set priorities",zhTW:"評估其嚴重性與發生可能性並排定優先順序"}},{label:{ja:"予防・軽減",en:"Prevention and mitigation",zhTW:"預防與減緩"},hint:{ja:"優先度の高い項目について、具体的な対策を実施する",en:"Take concrete action on the priorities identified",zhTW:"就高優先項目採取具體措施"}},{label:{ja:"モニタリング",en:"Monitoring",zhTW:"監督追蹤"},hint:{ja:"対策が実施されているか、効果が出ているかを追跡する",en:"Track whether the action was carried out and whether it worked",zhTW:"追蹤措施是否執行及其成效"}},{label:{ja:"是正処置",en:"Corrective action",zhTW:"矯正措施"},hint:{ja:"効果が不十分な場合や問題が再発した場合の対応を記録する",en:"Record what happens where the action was not enough, or the issue recurred",zhTW:"記錄成效不足或問題再發時之處理"}},{label:{ja:"情報開示・苦情処理",en:"Communication and grievance",zhTW:"溝通與申訴"},hint:{ja:"取り組み内容を伝え、外部・従業員からの申立てを受け付ける仕組みを持つ",en:"Communicate what is being done, and provide a route for workers and outside parties to raise concerns",zhTW:"對外說明作法，並提供勞工與外部人士反映意見之管道"}},{label:{ja:"記録・証拠",en:"Evidence and records",zhTW:"證據與紀錄"},hint:{ja:"上記の各ステップについて、日付と担当者の分かる記録を残す",en:"Keep dated records with named owners for each of the steps above",zhTW:"就上述各步驟留存載明日期與負責人之紀錄"}}]},clauses:["4.1.1","4.1.2","4.1.3","4.1.4","4.1.5","4.1.6","4.1.7"],topics:["due_diligence_related"]},{id:"review.managementReview",periodScoped:!0,category:"management_review",title:{ja:"マネジメントレビュー記録",en:"Management review record",zhTW:"管理階層審查紀錄"},why:{ja:"経営層がGOTSの運用状況を確認し、改善を決めた記録です。現場任せではなく、会社として管理していることを示します。",en:"Evidence that senior management looked at how GOTS is running and decided what to improve — showing this is a company system, not one person's side job.",zhTW:"經營階層檢視 GOTS 運作情形並決定改善事項之紀錄，用以證明係公司制度而非個別人員之額外工作。"},prepare:{ja:["マネジメントレビューの議事録（年1回以上）","検討した内容（内部監査結果・苦情・是正状況等）","決定した改善事項と担当・期限"],en:["Minutes of the review, at least annually","What was reviewed: internal audit results, complaints, corrective actions","Improvements decided, with owner and deadline"],zhTW:["管理審查會議紀錄（至少每年一次）","審查內容：內部稽核結果、申訴、矯正措施執行情形等","所決議之改善事項及其負責人與期限"]},auditorChecks:{ja:["前回のレビューで決めた改善が実行されているかを確認します","経営層が実際に参加しているかを出席者から確認します"],en:["Checks whether last review's decisions were actually carried out","Checks the attendee list for genuine senior participation"],zhTW:["確認前次審查所決議之改善事項是否確實執行","由出席名單確認經營階層是否實際參與"]},clauses:["4.1.1","2.5.2"],topics:["management_system_related","due_diligence_related"]}];var E={field:"transactionFlow",includesAny:["purchase"],reason:"na.noPurchase"},ae={field:"transactionFlow",includesAny:["sell"],reason:"na.noSell"},ca={field:"transactionFlow",includesAny:["inventory"],reason:"na.noInventory"},da=[{id:"supplier.list",category:"supplier",title:{ja:"GOTS材料・サプライヤーリスト",en:"GOTS material and supplier list",zhTW:"GOTS 材料與供應商清單"},systemUpload:1,when:E,why:{ja:"GOTS製品や附属品をどこから仕入れているかを一覧にしたものです。監査員はこのリストから数社を抽出し、その会社が本当に有効なGOTS認証を持っているかを確認します。",en:"The list of where your GOTS materials and accessories come from. The auditor picks a few suppliers from it and checks whether they really hold valid GOTS certification.",zhTW:"列出 GOTS 材料與附屬品之採購來源。稽核員將自清單中抽選數家供應商，查證其是否確實持有有效之 GOTS 驗證。"},prepare:{ja:["サプライヤー一覧（会社名・所在地・供給品目）","各社のGOTSライセンス番号","認証機関名と有効期限"],en:["Supplier list: company, location, what they supply","GOTS licence number for each","Certifier name and validity date"],zhTW:["供應商清單（公司名稱、所在地、供應品項）","各供應商之 GOTS 授權編號","驗證機構名稱與有效期限"]},auditorChecks:{ja:["数社を抽出し、GOTS公開データベースで認証状況を照会します","リストにない仕入先からの購入がないかを請求書と照合します"],en:["Samples several suppliers and looks them up in the public GOTS database","Cross-checks invoices for purchases from suppliers not on the list"],zhTW:["抽選數家供應商並於 GOTS 公開資料庫查詢其驗證狀態","比對發票，確認是否有向清單外供應商採購之情形"]},sampled:!0,clauses:["2.5.4","2.5.8","2.5.9","2.5.10"],topics:["supplier_related"]},{id:"supplier.scopeCertificates",category:"supplier",title:{ja:"仕入先のスコープ証明書（SC）",en:"Supplier Scope Certificates",zhTW:"供應商範圍證書（SC）"},aka:"Scope Certificate (SC)",when:E,why:{ja:"スコープ証明書（SC）は、その会社がGOTS認証を持っていること、そして「どの製品について」持っているかを示す書類です。TCと違い、取引ごとではなく会社ごとに発行されます。認証は持っていても、貴社が買った品目が範囲外というケースが実際にあります。",en:"A Scope Certificate proves a company is GOTS certified and — just as importantly — for which products. Unlike a TC it is issued per company, not per shipment. Suppliers who are certified but whose SC does not cover the item you bought are a real and common problem.",zhTW:"SC（範圍證書）用以證明該公司持有 GOTS 驗證，並載明其涵蓋之產品範圍。與 TC 不同，SC 係按公司核發而非按交易核發。實務上常見供應商雖有驗證，但貴公司所採購之品項並不在其 SC 範圍內。"},prepare:{ja:["主要サプライヤーのSC写し（有効期限内のもの）","購入品目がSCの範囲に含まれていることの確認","期限切れの場合は更新版"],en:["Copies of supplier SCs, valid at the time of purchase","Confirmation that what you bought is listed on the SC","Renewed versions where an SC has expired"],zhTW:["主要供應商之 SC 影本（採購當時仍有效者）","確認所採購品項確實列於 SC 範圍內","如已逾期，請提供換發之新版"]},auditorChecks:{ja:["購入日とSCの有効期間が重なっているかを確認します","SCに記載された製品カテゴリと、実際に購入した品目を照合します"],en:["Checks that the purchase date falls inside the SC validity period","Compares the product categories on the SC with what was actually bought"],zhTW:["確認採購日期落於 SC 有效期間內","比對 SC 所列產品類別與實際採購品項"]},sampled:!0,clauses:["2.5.4"],topics:["supplier_related","incoming_tc_related"]},{id:"supplier.contracts",category:"supplier",title:{ja:"サプライヤーとのGOTS契約書・宣言書",en:"Supplier GOTS agreements and declarations",zhTW:"與供應商之 GOTS 合約與聲明"},when:E,why:{ja:"サプライヤーがGOTSの条件を守ることに合意していることを示す書面です。口頭の了解では、混入や仕様変更が起きたときに責任の所在を示せません。",en:"Written agreement that the supplier will meet GOTS conditions. A verbal understanding leaves you with nothing to point at when material turns up wrong.",zhTW:"書面證明供應商同意遵守 GOTS 條件。若僅為口頭共識，當發生混料或規格變更時將無從釐清責任。"},prepare:{ja:["GOTS条件を含む取引契約書または覚書","サプライヤーからの宣言書","附属品サプライヤーからの素材証明"],en:["Supply agreement or memorandum that includes GOTS conditions","Declarations from suppliers","Material declarations from accessory suppliers"],zhTW:["含 GOTS 條件之交易合約或備忘錄","供應商出具之聲明書","附屬品供應商之材質證明"]},auditorChecks:{ja:["契約にGOTS遵守の条項が実際に入っているかを読みます","署名日と取引開始時期の整合を確認します"],en:["Reads the contract to check it really contains a clause on meeting GOTS conditions","Checks signature dates against when trading actually started"],zhTW:["檢閱合約內是否確實載有 GOTS 遵循條款","確認簽署日期與實際開始交易之時點是否相符"]},clauses:["2.5.9","2.5.10"],topics:["supplier_related"]},{id:"purchasing.orders",periodScoped:!0,category:"purchasing",title:{ja:"発注書（Purchase Order）",en:"Purchase orders",zhTW:"採購訂單（PO）"},when:E,why:{ja:"発注の時点でGOTS製品として注文していることを示します。発注書にGOTSの記載があると、後続の請求書・取引証明とのつながりが確認しやすくなります。記載がない場合は、他の書類で対応関係を説明できるようにしておいてください。",en:"Shows the goods were ordered as GOTS from the outset. Stating GOTS on the order makes the link to the invoice and transaction evidence easy to follow. Where it is not stated, be ready to show the connection through other records.",zhTW:"證明下單時即以 GOTS 產品採購。訂單載明 GOTS 有助於與後續發票及交易證明相互勾稽；若未載明，請準備以其他文件說明其對應關係。"},prepare:{ja:["GOTS製品の発注書（監査対象期間分）","発注書上のGOTS表記（品名・グレード）","数量と単位"],en:["Purchase orders for GOTS goods covering the audit period","GOTS wording on the order — item name and grade","Quantity and unit"],zhTW:["稽核期間內 GOTS 產品之採購訂單","訂單上之 GOTS 標示（品名與等級）","數量與單位"]},auditorChecks:{ja:["数件を抽出し、発注書・請求書・TCの品目と数量が一致するかを照合します"],en:["Samples several orders and matches item and quantity across order, invoice and TC"],zhTW:["抽查數筆訂單，比對訂單、發票與 TC 之品項與數量是否一致"]},sampled:!0,clauses:["2.5.8"],topics:["purchasing_related","transaction_related"]},{id:"purchasing.invoices",periodScoped:!0,category:"purchasing",title:{ja:"仕入請求書・インボイス",en:"Purchase invoices",zhTW:"採購發票"},when:E,historyDependent:!0,why:{ja:"GOTS原料・製品を実際に購入したことを示す基本的な証拠です。請求書の品名にGOTSの記載があるかどうかは、通常確認の対象になります。",en:"The basic evidence that GOTS goods were actually bought. Whether the item description on the invoice states GOTS is normally checked.",zhTW:"證明確實採購 GOTS 原料或產品之基本佐證。發票品名是否載明 GOTS，通常屬查核項目。"},prepare:{ja:["GOTS製品の仕入請求書（監査対象期間分）","品名にGOTSの記載があること","ロット番号または参照番号"],en:["Purchase invoices for GOTS goods across the audit period","GOTS shown in the item description","Lot or reference number"],zhTW:["稽核期間內 GOTS 產品之採購發票","品名欄位載有 GOTS 字樣","批號或參考編號"]},auditorChecks:{ja:["請求書とIncoming TCの品目・数量・日付を突き合わせます","請求書に記載のない品目がTCに含まれていないかを見ます"],en:["Matches invoice against the Incoming TC on item, quantity and date","Looks for items on the TC that never appear on an invoice"],zhTW:["比對發票與 Incoming TC 之品項、數量與日期","檢視 TC 上是否有未見於發票之品項"]},sampled:!0,clauses:["2.5.8","2.5.6"],topics:["purchasing_related","transaction_related"]},{id:"purchasing.receiving",periodScoped:!0,category:"purchasing",title:{ja:"入荷記録・受領記録",en:"Receiving records",zhTW:"收貨紀錄"},when:{all:[E,{field:"physicalHandling",eq:"yes",reason:"na.noPhysicalHandling"}]},why:{ja:"注文したGOTS製品が、実際に届いて受け入れられたことを示します。書類上の取引と現物の動きがつながっていることを確認するための記録です。",en:"Shows the GOTS goods you ordered actually arrived and were accepted — the link between the paperwork and the physical movement.",zhTW:"證明所訂購之 GOTS 產品確實到貨並完成驗收，是書面交易與實體流動之間的連結。"},prepare:{ja:["入荷記録または検収記録","納品書・運送書類","受入時のGOTS表示確認の記録"],en:["Goods receipt or inspection record","Delivery notes and transport documents","Record of the GOTS marking check on arrival"],zhTW:["收貨或驗收紀錄","送貨單與運送文件","到貨時 GOTS 標示查核之紀錄"]},auditorChecks:{ja:["入荷日と請求書・TCの日付の整合を確認します","受入時に何を確認しているかを担当者に質問します"],en:["Checks receipt dates against invoice and TC dates","Asks the person receiving goods what they actually check"],zhTW:["確認收貨日期與發票、TC 日期之一致性","詢問收貨人員實際查核之項目"]},sampled:!0,clauses:["2.6.1.4","2.5.6"],topics:["purchasing_related","physical_handling_related"]},{id:"tc.incoming",periodScoped:!0,conditionNote:"note.tcStructureVaries",category:"incoming_tc",title:{ja:"Incoming TC（仕入れ時の取引証明書）",en:"Incoming Transaction Certificate",zhTW:"Incoming TC（進貨交易證明）"},aka:"Transaction Certificate (TC)",when:E,historyDependent:!0,why:{ja:"TC（Transaction Certificate）は、特定の出荷についてGOTS認証製品であることを認証機関が証明する書類です。SCが会社単位の認証を示すのに対し、TCは取引単位の証明です。GOTS認証品の仕入取引については、適用される取引証明要件に基づき、Incoming TC等の取引証明を確認します。実際に必要となる資料は、取引形態、認証範囲および取引状況により異なる場合があります。",en:"A Transaction Certificate is issued by a certification body for a specific shipment, confirming that those goods are GOTS certified. A Scope Certificate covers a company; a TC covers a transaction. For purchases of GOTS certified goods, transaction evidence such as Incoming TCs should be reviewed according to the applicable certification and transaction requirements. The exact evidence required may vary depending on transaction structure, certification scope and circumstances.",zhTW:"TC（交易證明）係由驗證機構針對特定出貨核發，用以確認該批貨品為 GOTS 驗證產品。SC 涵蓋的是公司，TC 涵蓋的是單筆交易。GOTS 驗證產品之採購交易，應依適用之交易證明要求確認 Incoming TC 等相關資料。實際所需證明可能依交易型態、驗證範圍及交易狀況而有所不同。"},prepare:{ja:["監査対象期間のIncoming TC（すべて）","TC番号と対応する仕入請求書","TC記載の数量と実際の入荷数量"],en:["All Incoming TCs for the audit period","TC numbers matched to the corresponding purchase invoices","Quantity on the TC against quantity actually received"],zhTW:["稽核期間內全部之 Incoming TC","TC 編號與對應之採購發票","TC 所載數量與實際收貨數量"]},auditorChecks:{ja:["監査期間内の取引から複数件を抽出し、TCと請求書の情報を照合します","TCの発行者が、その製品について有効な認証機関かを確認します","TCの数量を超えてGOTSとして販売していないかを、マスバランスで確認します"],en:["Samples several transactions and compares TC details against the invoice","Checks that the issuing body was accredited for that product","Uses the mass balance to check you did not sell more as GOTS than the TCs cover"],zhTW:["自稽核期間之交易中抽選數筆，比對 TC 與發票資訊","確認核發 TC 之機構就該產品具備有效認可資格","透過質量平衡查核，確認以 GOTS 名義銷售之數量未超出 TC 涵蓋範圍"]},sampled:!0,clauses:["2.5.4","3.1.1","2.7.2"],topics:["incoming_tc_related","transaction_related"]},{id:"tc.reconciliation",periodScoped:!0,category:"incoming_tc",title:{ja:"TCと仕入書類の照合記録",en:"TC-to-purchase reconciliation record",zhTW:"TC 與採購文件之勾稽紀錄"},when:E,why:{ja:"TCが届いたとき、社内で誰が何を確認しているかを示す記録です。「TCはファイルしている」だけでは、内容を確認したことになりません。",en:"Shows who checks what when a TC arrives. Simply filing TCs does not demonstrate that anyone read them.",zhTW:"說明 TC 到達時，由何人查核哪些項目。僅將 TC 歸檔，並不足以證明曾實際查核其內容。"},prepare:{ja:["TC受領時の確認記録（チェックリスト等）","確認者と確認日","不一致があった場合の対応記録"],en:["Check record or checklist completed when a TC is received","Who checked it and when","What was done when something did not match"],zhTW:["收到 TC 時之查核紀錄（如檢查表）","查核人員與查核日期","如有不符時之處理紀錄"]},auditorChecks:{ja:["照合記録と実際のTCを突き合わせ、記録が後付けでないかを見ます"],en:["Compares the reconciliation record against the TCs to see whether it was filled in afterwards"],zhTW:["比對勾稽紀錄與實際 TC，確認紀錄非事後補作"]},clauses:["2.5.4","2.5.6"],topics:["incoming_tc_related"]},{id:"sales.invoices",periodScoped:!0,category:"sales",title:{ja:"売上請求書・インボイス",en:"Sales invoices",zhTW:"銷貨發票"},when:ae,historyDependent:!0,why:{ja:"GOTS製品として販売した取引の記録です。請求書にGOTSと明記しているか、そしてその数量が仕入と釣り合っているかが確認されます。",en:"The record of what you sold as GOTS. The auditor checks that GOTS is stated on the invoice and that the quantities balance against what you bought.",zhTW:"以 GOTS 名義銷售之交易紀錄。稽核員會確認發票上是否載明 GOTS，且其數量與進貨是否平衡。"},prepare:{ja:["GOTS製品の売上請求書（監査対象期間分）","品名にGOTSグレードの記載があること","販売先の一覧"],en:["Sales invoices for GOTS goods across the audit period","GOTS grade stated in the item description","List of customers"],zhTW:["稽核期間內 GOTS 產品之銷貨發票","品名載明 GOTS 等級","客戶清單"]},auditorChecks:{ja:["販売数量の合計と、仕入・在庫の数量が矛盾しないかを確認します","請求書の表現がGOTSの表示ルールに沿っているかを見ます"],en:["Checks total quantity sold against purchases and stock for consistency","Reads the wording on the invoice against the GOTS labelling rules"],zhTW:["核對銷售總量與進貨、庫存數量是否相符","檢視發票用語是否符合 GOTS 標示規範"]},sampled:!0,clauses:["2.5.6","2.6.1.4"],topics:["transaction_related"]},{id:"sales.delivery",periodScoped:!0,category:"sales",title:{ja:"出荷・納品記録",en:"Delivery and shipping records",zhTW:"出貨與交貨紀錄"},when:ae,why:{ja:"販売したGOTS製品が、いつ・どこへ・どれだけ出荷されたかを示す記録です。出荷単位でGOTS製品が識別されていることが求められます。",en:"Shows when, where and how much GOTS product actually shipped. Each shipment must be identifiable as GOTS.",zhTW:"記錄所銷售之 GOTS 產品於何時、出貨至何處、數量多少。每一批出貨均須可辨識為 GOTS 產品。"},prepare:{ja:["納品書・出荷指示書","運送書類（B/L、送り状、トラック受領書等）","梱包単位でのGOTS識別方法"],en:["Delivery notes and shipping instructions","Transport documents: B/L, waybill, truck receipt","How GOTS is identified at package level"],zhTW:["送貨單與出貨指示單","運送文件：提單、託運單、貨車簽收單等","包裝單位之 GOTS 辨識方式"]},auditorChecks:{ja:["出荷記録と請求書・TCの日付と数量を照合します","梱包にGOTSの識別表示があるかを現物で確認します"],en:["Matches shipping records against invoice and TC on date and quantity","Looks at actual packaging for GOTS identification"],zhTW:["比對出貨紀錄與發票、TC 之日期與數量","以實品確認包裝上是否有 GOTS 辨識標示"]},sampled:!0,clauses:["2.6.1.4","2.6.1.5"],topics:["transaction_related","physical_handling_related"]},{id:"tc.outgoing",periodScoped:!0,conditionNote:"note.tcStructureVaries",category:"outgoing_tc",title:{ja:"Outgoing TC（販売時の取引証明書）の申請記録",en:"Outgoing Transaction Certificate applications",zhTW:"Outgoing TC（出貨交易證明）申請紀錄"},aka:"Transaction Certificate (TC)",when:ae,historyDependent:!0,why:{ja:"販売先がGOTS製品として扱うために、貴社側からの取引証明が求められる場合があります。TCは認証機関が発行し、その申請根拠となる取引データを貴社が用意します。発行できる数量は、実際に受け入れた認証原料・製品の数量に裏付けられている必要があります。適用される要件は取引形態および認証範囲により異なる場合があります。",en:"Where your customer needs the goods handled as GOTS certified, transaction evidence from your side is normally required. The certification body issues the TC; you supply the transaction data behind the application. The quantity covered needs to be supported by the certified input you actually received. The applicable requirements may vary with transaction structure and certification scope.",zhTW:"若客戶需將貨品視為 GOTS 驗證產品，通常會要求貴公司提供交易證明。TC 由驗證機構核發，申請依據之交易資料由貴公司提供；所涵蓋之數量須有實際收受之驗證原料或產品作為佐證。適用要求可能依交易型態與驗證範圍而有所不同。"},prepare:{ja:["TC申請時に提出した取引一覧","発行済みOutgoing TCの写し","対応する仕入TC番号（原料の出所）"],en:["The transaction list submitted with each TC application","Copies of the Outgoing TCs issued","The corresponding Incoming TC numbers showing where the material came from"],zhTW:["申請 TC 時所提交之交易明細","已核發之 Outgoing TC 影本","對應之 Incoming TC 編號（原料來源）"]},auditorChecks:{ja:["発行したTCの数量合計が、仕入TCの数量を超えていないかを確認します","TC申請時の取引データと、実際の請求書・出荷記録を照合します"],en:["Checks that the total quantity on TCs issued does not exceed what your incoming TCs cover","Compares the data used in the application with the actual invoices and shipping records"],zhTW:["確認所核發 TC 之總數量未超出進貨 TC 涵蓋範圍","比對申請時所用之交易資料與實際發票、出貨紀錄"]},sampled:!0,clauses:["2.5.6","3.1.1"],topics:["outgoing_tc_related","transaction_related"]},{id:"tc.unsureGuide",category:"outgoing_tc",title:{ja:"取引証明書（TC）の適用範囲の確認",en:"Clarify how Transaction Certificates apply to you",zhTW:"確認交易證明（TC）之適用方式"},when:{field:"tcHandling",eq:"unsure",reason:"na.tcUnderstood"},priority:"conditional",why:{ja:"取引証明（TC）について確認が必要と回答されました。TCは取引単位の証明で、GOTS認証品を売買する多くの事業者に関係します。実際に必要となる資料は、取引形態、認証範囲および取引状況により異なるため、監査前にIDFL担当者と、貴社が発行する側か受け取る側か、あるいはその両方かをご確認いただくことをおすすめします。",en:"You indicated that Transaction Certificates need confirming. A TC certifies one transaction and is relevant to most operations buying or selling GOTS certified goods. Because the evidence that actually applies depends on transaction structure, certification scope and circumstances, it is worth confirming with your IDFL contact before the audit whether you issue TCs, receive them, or both.",zhTW:"貴公司表示交易證明（TC）尚需確認。TC 係針對單筆交易之證明，與多數買賣 GOTS 驗證產品之業者相關。由於實際適用之證明會依交易型態、驗證範圍及交易狀況而異，建議於稽核前與 IDFL 窗口確認貴公司係開立方、接收方或兩者兼具。"},prepare:{ja:["監査対象期間の仕入・販売の一覧（GOTS品目）","サプライヤーからTCを受け取っているかの確認","販売先からTCを求められているかの確認"],en:["A list of GOTS purchases and sales for the audit period","Whether your suppliers provide TCs","Whether your customers ask you for TCs"],zhTW:["稽核期間內 GOTS 品項之進、銷貨清單","確認供應商是否提供 TC","確認客戶是否要求提供 TC"]},auditorChecks:{ja:["実際の取引形態から、適用される取引証明の範囲を確認します","想定される取引証明が見当たらない場合、その経緯を確認します"],en:["Establishes from your actual transactions which transaction evidence applies","Asks about the circumstances where expected evidence is not present"],zhTW:["依實際交易型態確認適用之交易證明範圍","若預期之證明未見留存，將了解其原因"]},clauses:["2.5.4","2.5.6"],topics:["transaction_related"]},{id:"trace.exercise",periodScoped:!0,category:"traceability",title:{ja:"トレーサビリティ演習の記録",en:"Traceability exercise record",zhTW:"可追溯性演練紀錄"},when:{any:[E,ae]},why:{ja:"出荷した製品1件を選び、それが「どの仕入から来たか」を書類だけで遡って示す練習です。監査では実際の取引をサンプルとして選定し、遡って確認する場合があります。事前に一度練習しておくことで、資料の不足やつながりの切れている箇所を確認できます。",en:"Pick one shipment and trace it back on paper to the purchase it came from. During the audit the auditor may select an actual transaction and trace it this way. Practising one in advance helps you find missing records or broken links beforehand.",zhTW:"選定一筆出貨，僅以文件回溯至其來源進貨之演練。稽核時可能抽樣一筆實際交易並以此方式追溯；事前演練一筆，有助於事先發現文件缺漏或追溯鏈結中斷之處。"},prepare:{ja:["出荷1件を選び、遡った書類一式（出荷→請求書→在庫→入荷→仕入TC）","各書類をつなぐ番号（ロット・受注番号等）","所要時間のメモ"],en:["One shipment traced back with the full document set: shipment → invoice → stock → receipt → incoming TC","The numbers that link them: lot, order reference","A note of how long it took"],zhTW:["選定一筆出貨並備妥完整回溯文件：出貨→發票→庫存→收貨→進貨 TC","各文件之串接編號（批號、訂單號等）","記錄所耗費之時間"]},auditorChecks:{ja:["監査員が任意の1件を指定し、その場で遡ることを求めます","書類間で数量や日付がつながっているかを確認します","追跡に時間がかかりすぎる場合、記録の仕組み自体が指摘対象になります"],en:["Picks a shipment at random and asks you to trace it there and then","Checks that quantities and dates connect across the documents","If it takes too long, the record-keeping system itself becomes the finding"],zhTW:["由稽核員隨機指定一筆，要求當場回溯","確認各文件間之數量與日期可相互串接","若追溯耗時過久，紀錄制度本身即可能成為不符合事項"]},sampled:!0,clauses:["2.5.1","2.5.3","2.5.6"],topics:["traceability_related"]},{id:"trace.lotControl",category:"traceability",title:{ja:"ロット・バッチ管理記録",en:"Lot and batch control records",zhTW:"批號管理紀錄"},when:{field:"physicalHandling",eq:"yes",reason:"na.noPhysicalHandling"},why:{ja:"GOTS製品を、他の製品と区別できる番号で管理していることを示します。ロット番号がないと、同じ品番の中でGOTS品と非GOTS品を区別できません。",en:"Shows that GOTS goods carry an identifier that separates them from everything else. Without lot numbers, GOTS and non-GOTS units of the same article are indistinguishable.",zhTW:"證明 GOTS 產品以可與其他產品區別之編號進行管理。若無批號，同一品號下之 GOTS 與非 GOTS 產品將無法區分。"},prepare:{ja:["ロット番号の付与ルール","ロット単位の在庫・移動記録","ロットと仕入TCの対応表"],en:["The rule for how lot numbers are assigned","Stock and movement records at lot level","A table linking lots to incoming TCs"],zhTW:["批號編碼規則","以批號為單位之庫存與異動紀錄","批號與進貨 TC 之對照表"]},auditorChecks:{ja:["現場の在庫からロット番号を1つ選び、記録上で追跡します","同じ品番でGOTS品と非GOTS品がある場合、その区別方法を確認します"],en:["Picks a lot number off the shelf and follows it through the records","Where the same article exists as both GOTS and non-GOTS, checks how they are told apart"],zhTW:["自現場庫存抽選一組批號，於紀錄中進行追蹤","若同一品號同時存在 GOTS 與非 GOTS 產品，確認其區分方式"]},sampled:!0,siteVerification:!0,clauses:["2.5.3","2.6.1.1","2.6.1.2"],topics:["traceability_related","physical_handling_related"]},{id:"inventory.records",periodScoped:!0,category:"inventory",title:{ja:"GOTS製品の在庫記録",en:"GOTS inventory records",zhTW:"GOTS 產品庫存紀錄"},when:ca,why:{ja:"GOTS製品と非GOTS製品を、数量として別々に把握していることを示します。在庫が数字で説明できないと、マスバランスも成立しません。",en:"Shows that GOTS and non-GOTS stock are tracked as separate figures. If stock cannot be stated in numbers, the mass balance cannot work either.",zhTW:"證明 GOTS 與非 GOTS 產品之庫存係分別以數量掌握。若庫存無法以數字說明，質量平衡亦無從成立。"},prepare:{ja:["GOTS区分のある在庫一覧（監査日時点）","期首・期末在庫の数量","在庫管理システムの画面または帳票"],en:["Stock list with a GOTS flag, as at the audit date","Opening and closing stock quantities","A screen or report from your stock system"],zhTW:["具 GOTS 區分之庫存清單（稽核日當時）","期初與期末庫存數量","庫存管理系統畫面或報表"]},auditorChecks:{ja:["帳簿上の在庫数量と、倉庫の現物数量を数件抽出して照合します","在庫がマイナスや不自然な増減になっていないかを見ます"],en:["Counts a few items in the warehouse and compares with the book figure","Looks for negative stock or movements that make no sense"],zhTW:["抽點倉庫實際數量並與帳面數量比對","檢視是否存在負庫存或異常增減"]},sampled:!0,siteVerification:!0,clauses:["2.5.6","2.5.3"],topics:["traceability_related"]},{id:"inventory.stocktake",periodScoped:!0,category:"inventory",title:{ja:"棚卸記録",en:"Stocktake records",zhTW:"盤點紀錄"},when:ca,why:{ja:"帳簿の在庫と現物の在庫が合っているかを、定期的に確認していることを示します。差異が出たときにどう処理したかも記録が必要です。",en:"Shows you regularly check book stock against physical stock — and, just as importantly, what you did when they did not match.",zhTW:"證明定期核對帳面庫存與實際庫存；同樣重要的是，差異發生時之處理方式亦須留有紀錄。"},prepare:{ja:["直近の棚卸記録","差異が出た場合の原因と処理","棚卸の実施頻度が分かるもの"],en:["Most recent stocktake record","Cause and treatment of any differences found","Evidence of how often stocktakes happen"],zhTW:["最近一次盤點紀錄","如有差異，其原因與處理方式","可佐證盤點頻率之資料"]},auditorChecks:{ja:["棚卸の差異が繰り返し発生していないかを見ます","差異の処理が説明できるかを質問します"],en:["Looks for the same discrepancy recurring","Asks whether the adjustments can be explained"],zhTW:["檢視是否重複出現相同差異","詢問差異調整之說明是否合理"]},clauses:["2.5.6"],topics:["traceability_related"]},{id:"massbalance.sheet",periodScoped:!0,category:"mass_balance",title:{ja:"物質収支シート（マスバランス）",en:"Mass balance / volume reconciliation sheet",zhTW:"質量平衡表（Mass Balance）"},systemUpload:4,when:{any:[E,ae]},historyDependent:!0,why:{ja:"「仕入れた量」「在庫の量」「販売した量」の三つが数字として整合していることを示す表です。GOTS監査で重点的に確認される資料のひとつです。説明のつかない差異があると、認証原料以外のものが混入していないかを含め、より詳しく確認されることになります。",en:"The sheet showing that quantity purchased, quantity held and quantity sold reconcile. It is one of the documents examined most closely in a GOTS audit. A difference that cannot be explained is normally followed up in detail, since it can indicate input that was not certified.",zhTW:"用以呈現「進貨量」「庫存量」「銷貨量」三者數字相互勾稽之表格，為 GOTS 稽核重點查核文件之一。若存在無法說明之差異，通常會進一步詳查，因其可能顯示混入未經驗證之投入物。"},prepare:{ja:["監査対象期間の物質収支シート（IDFL様式または自社様式）","期首在庫・仕入・販売・期末在庫の数量","単位の統一（kg または m など）","差異がある場合はその説明"],en:["Mass balance sheet for the audit period, IDFL form or your own","Opening stock, purchases, sales, closing stock — as quantities","Consistent units throughout (kg or metres)","An explanation for any difference"],zhTW:["稽核期間之質量平衡表（IDFL 表格或公司自有格式）","期初庫存、進貨、銷貨、期末庫存之數量","全表單位一致（如 kg 或 m）","如有差異，請附說明"]},auditorChecks:{ja:["シートの数字を、請求書・TC・在庫記録から抽出して裏付けを取ります","販売量が仕入量とTCの範囲を超えていないかを計算します","ロスや歩留まりの数字が業界水準として妥当かを見ます"],en:["Backs the figures on the sheet up against invoices, TCs and stock records","Calculates whether the quantity sold exceeds what was purchased and TC-covered","Judges whether loss and yield figures are plausible for the industry"],zhTW:["以發票、TC 與庫存紀錄佐證表上數字","計算銷貨量是否超出進貨量與 TC 涵蓋範圍","評估損耗與得率數字就產業水準而言是否合理"]},sampled:!0,clauses:["2.5.6","2.5.3","3.1.1"],topics:["mass_balance_related","traceability_related"]},{id:"massbalance.reconciliation",periodScoped:!0,category:"mass_balance",title:{ja:"投入・産出の照合記録",en:"Input/output reconciliation",zhTW:"投入與產出對帳紀錄"},when:{field:"doesProcessing",eq:"yes",reason:"na.noProcessing"},why:{ja:"加工を行う場合、投入した材料の量と、出てきた製品・端材・ロスの量を説明できる状態にしておく必要があります。歩留まりの説明がつかない場合は、材料の取り違えがなかったかを含めて詳しく確認されます。",en:"If you process, be ready to account for material in versus product, offcuts and loss out. A yield that cannot be explained is normally examined in more detail, including whether material was substituted.",zhTW:"若有加工作業，應能說明投入材料量與產出成品、下腳料及損耗之對應關係。良率無法說明時，通常會進一步詳查，包含是否有材料替換之情形。"},prepare:{ja:["工程ごとの投入量・産出量の記録","歩留まり率と、その根拠","端材・不良品の処理記録"],en:["Input and output quantities per process step","Yield rate and the basis for it","What happens to offcuts and rejects"],zhTW:["各製程之投入量與產出量紀錄","良率及其計算依據","下腳料與不良品之處理紀錄"]},auditorChecks:{ja:["1ロットを選び、投入から産出までの数量を追跡します","歩留まりが他社と比べて不自然に高い・低い場合、理由を質問します"],en:["Follows one lot from input to output by quantity","Questions a yield that is unusually high or low compared with peers"],zhTW:["選定一批次，依數量追蹤自投入至產出之流程","若良率相較同業異常偏高或偏低，將詢問其原因"]},sampled:!0,clauses:["2.5.6"],topics:["mass_balance_related","processing_related"]}];var ha={field:"warehouse",in:["own","external","both"],reason:"na.noStorage"},pa={field:"warehouse",in:["external","both"],reason:"na.noExternalWarehouse"},N={field:"doesProcessing",eq:"yes",reason:"na.noProcessing"},ga={any:[{field:"doesProcessing",eq:"yes"},{field:"outsources",eq:"yes"}],reason:"na.noProcessing"},Oe={all:[ga,{field:"chemicalUse",eq:"yes",reason:"na.noChemical"}]},ua={all:[ga,{field:"chemicalUse",in:["yes","outsourced"],reason:"na.noChemical"}]},ve={field:"outsources",eq:"yes",reason:"na.noOutsourcing"},jt={field:"usesClaims",eq:"yes",reason:"na.noClaims"},ma=[{id:"warehouse.layout",category:"warehouse",title:{ja:"保管区域のレイアウト図",en:"Storage area layout drawing",zhTW:"保管區域配置圖"},systemUpload:17,when:ha,why:{ja:"GOTS製品をどこに置いているかを図で示します。監査員はこの図を持って倉庫を歩き、図のとおりに分けられているかを確認します。手描きでも構いません。",en:"A drawing of where GOTS goods sit. The auditor walks the warehouse with it and checks that the separation on paper exists in reality. Hand-drawn is fine.",zhTW:"以圖面標示 GOTS 產品之存放位置。稽核員會持該圖實地走訪倉庫，確認圖上之分區於現場確實存在。手繪亦可。"},prepare:{ja:["保管区域の平面図（GOTS区画を明示）","入荷・保管・出荷の動線","表示・ラベルの掲示位置"],en:["Floor plan with the GOTS area marked","The route goods take: receiving, storage, dispatch","Where signage and labels are displayed"],zhTW:["保管區域平面圖（標示 GOTS 專區）","進貨、保管、出貨之動線","標示與標籤之張貼位置"]},auditorChecks:{ja:["図と現場を照合しながら倉庫内を歩きます","GOTS区画に非GOTS製品が置かれていないかを目視で確認します","表示が実際に掲示されているかを見ます"],en:["Walks the warehouse comparing the drawing with what is there","Looks for non-GOTS goods sitting inside the GOTS area","Checks that the signage is actually up"],zhTW:["持圖面於倉庫內實地走訪比對","目視確認 GOTS 專區內是否放置非 GOTS 產品","確認標示是否確實張貼於現場"]},siteVerification:!0,clauses:["2.6.1.1","2.6.1.2","2.6.2.1"],topics:["warehouse_related"]},{id:"warehouse.segregation",category:"warehouse",title:{ja:"分別・識別の手順",en:"Segregation and identification procedure",zhTW:"分隔與辨識程序"},when:ha,why:{ja:"GOTS製品が非GOTS製品と混ざらないようにする方法を文書で定めます。同じ倉庫を使うこと自体は問題ありませんが、「どう分けているか」を説明できる必要があります。",en:"The written method for keeping GOTS and non-GOTS goods apart. Sharing a warehouse is not a problem — being unable to explain how they are kept apart is.",zhTW:"以文件訂定避免 GOTS 與非 GOTS 產品混淆之方法。共用倉庫本身並無問題，無法說明如何區分才是問題。"},prepare:{ja:["分別保管の手順書","識別表示の方法（ラベル・区画表示・棚札等）","担当者への周知記録"],en:["Written segregation procedure","How goods are identified: labels, floor marking, rack signs","Record that staff were briefed on it"],zhTW:["分隔保管程序書","辨識方式：標籤、地面標線、料架標示等","人員宣導紀錄"]},auditorChecks:{ja:["倉庫担当者に、GOTS製品の見分け方を直接質問します","実際の棚とパレットの表示状況を確認します"],en:["Asks warehouse staff directly how they tell GOTS goods apart","Inspects actual racking and pallet marking"],zhTW:["直接詢問倉管人員如何辨識 GOTS 產品","查看實際料架與棧板之標示情形"]},siteVerification:!0,interviewVerification:!0,clauses:["2.6.1.1","2.6.1.2","2.6.1.3"],topics:["warehouse_related"]},{id:"warehouse.externalList",category:"warehouse",title:{ja:"外部倉庫の一覧",en:"List of external warehouses",zhTW:"外部倉庫清單"},when:pa,why:{ja:"外部倉庫もGOTSの認証範囲の一部として扱われます。監査員が訪問する可能性があるため、名称と所在地を事前に申告しておく必要があります。",en:"An external warehouse is part of the certified scope. It may be visited, so its name and location must be declared in advance.",zhTW:"外部倉庫亦屬驗證範圍之一部分。稽核員可能前往查訪，故須事先申報其名稱與所在地。"},prepare:{ja:["外部倉庫の名称・所在地・担当者連絡先","保管している製品の種類","GOTS製品と非GOTS製品を同じ場所に置いているかの申告"],en:["Name, address and contact for each external warehouse","What is stored there","Whether GOTS and non-GOTS goods share the space"],zhTW:["各外部倉庫之名稱、地址與聯絡窗口","所存放之產品類別","是否與非 GOTS 產品共用空間之申報"]},auditor lassic point where what is in the box and what is on the box stop matching. You need a record of who changed which label.",zhTW:"重新包裝與換標是產品內容與標示最容易產生落差之環節，須留存由何人更換何種標示之紀錄。"},prepare:{ja:["再包装・再ラベリングの作業手順書","作業記録（日付・数量・担当者）","使用したラベルの見本","旧ラベルの処分方法"],en:["Written procedure for repacking and relabelling","Work records: date, quantity, operator","Samples of the labels applied","How the old labels are disposed of"],zhTW:["重新包裝與換標之作業程序書","作業紀錄（日期、數量、作業人員）","所使用標籤之樣本","舊標籤之銷毀方式"]},auditorChecks:{ja:["作業記録と在庫の動きを照合します","貼り替え前後の製品情報が一致しているかを確認します","使用済みラベルが管理されているかを見ます"],en:["Matches work records against stock movements","Checks the product details before and after relabelling agree","Looks at how unused and removed labels are controlled"],zhTW:["比對作業紀錄與庫存異動","確認換標前後之產品資訊一致","查核已使用與撤除標籤之管控情形"]},sampled:!0,clauses:["2.6.1.3","2.7.2","2.7.7"],topics:["warehouse_related","label_related"]},{id:"outsourcing.list",category:"outsourcing",title:{ja:"外注先の一覧",en:"List of subcontractors",zhTW:"委外廠商清單"},when:ve,why:{ja:"外注した工程も、貴社の認証範囲の一部として扱われます。どの工程をどこに出しているかを一覧にしておく必要があります。",en:"Outsourced steps remain part of your certified scope. You need a list of which step goes to whom.",zhTW:"委外之製程仍屬貴公司驗證範圍之一部分，須列明各製程之委外對象。"},prepare:{ja:["外注先の名称・所在地・委託工程","各社がGOTS認証を持っているかどうか","委託を開始した時期"],en:["Name, location and outsourced step for each subcontractor","Whether each holds GOTS certification","When the arrangement started"],zhTW:["各委外廠商之名稱、所在地與委託製程","各廠商是否持有 GOTS 驗證","委外關係開始之時點"]},auditorChecks:{ja:["申告されていない外注先がないかを、請求書や納品書から確認します","認証が必要な工程を、無認証の会社に出していないかを判断します"],en:["Looks through invoices and delivery notes for subcontractors that were not declared","Judges whether a step needing certification went to an uncertified company"],zhTW:["自發票與送貨單查核是否有未申報之委外廠商","判定須具驗證之製程是否委由未驗證廠商執行"]},clauses:["2.5.1","2.5.9"],topics:["subcontractor_related"]},{id:"outsourcing.contracts",category:"outsourcing",title:{ja:"外注契約書・宣言書",en:"Subcontractor agreements and declarations",zhTW:"委外合約與聲明書"},when:ve,why:{ja: 學品管理系統（CMS）"},aka:"Chemical Management System (CMS)",systemUpload:7,when:Oe,why:{ja:"使用する薬剤をどう選び、どう保管し、どう記録するかを定めた仕組みです。GOTSでは化学品の「使ってよいもの」が厳格に決まっているため、承認された薬剤だけが現場に入る仕組みが必要です。",en:"The system for selecting, storing and recording the chemicals you use. GOTS restricts inputs tightly, so you need a mechanism that keeps unapproved chemicals off the floor.",zhTW:"訂定藥劑之選用、儲存與紀錄方式之管理制度。GOTS 對化學品投入之限制嚴格，故須建立可確保僅核准藥劑進入現場之機制。"},prepare:{ja:["化学品管理システムの手順書","薬剤の承認手続き（誰が承認するか）","未承認薬剤が現場に入らない仕組みの説明"],en:["Written CMS procedure","The approval route for a new chemical — who signs it off","How unapproved chemicals are prevented from reaching the floor"],zhTW:["化學品管理系統程序書","藥劑核准流程（由何人核准）","說明如何防止未核准藥劑進入現場"]},auditorChecks:{ja:["現場にある薬剤の容器を実際に見て、リストと照合します","未承認の薬剤が置かれていないかを倉庫・作業場で確認します"],en:["Looks at the actual containers on the floor and compares with the list","Checks stores and work areas for chemicals that were never approved"],zhTW:["實地檢視現場藥劑容器並與清單比對","於倉庫與作業區查核是否存在未核准之藥劑"]},siteVerification:!0,clauses:["4.2.1.1","4.2.1.2","4.3.1.4"],topics:["chemical_related"]},{id:"chemical.inventory",periodScoped:!0,category:"chemical",title:{ja:"使用化学品リスト",en:"Chemical inventory list",zhTW:"化學品使用清單"},when:ua,why:{ja:"現在使用しているすべての薬剤・助剤・染料の一覧です。GOTS製品に使うものと、それ以外に使うものを区別しておく必要があります。",en:"Everything currently in use — dyes, auxiliaries, detergents. It must distinguish what is used on GOTS goods from what is not.",zhTW:"目前所使用之全部藥劑、助劑與染料清單，須區分用於 GOTS 產品者與非用於 GOTS 產品者。"},prepare:{ja:["化学品の一覧（商品名・メーカー・用途）","GOTS製品への使用可否の区分","承認番号または承認書の参照"],en:["Chemical list: trade name, manufacturer, purpose","Marked as approved for GOTS use or not","Approval reference for each"],zhTW:["化學品清單（商品名、製造商、用途）","標示是否核准用於 GOTS 產品","各項之核准編號或核准文件參照"]},auditorChecks:{ja:["リストと現場の在庫を照合します","GOTS工程で未承認薬剤が使われていないかを、生産記録から確認します"],en:["Compares the list with what is physically in stock","Checks production records for unapproved chemicals used on GOTS runs"],zhTW:["比對清單與現場實際庫存","自生產紀錄查核 GOTS 製程是否使用未核准藥劑"]},sampled:!0,siteVerifi
