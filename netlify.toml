# redeploy trigger: pick up access-control env vars (CUSTOMER/STAFF/SESSION_SECRET)
[build]
  publish = "."
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Protected HTML presentations are mounted as a directory so the deck's own
# relative links (styles/main.css, scripts/deck.js, assets/...) resolve the way
# the author wrote them. The function re-checks the session on EVERY asset:
# this path is a rewrite, not a public directory.
#
# :mode is "v" (plain view) or "f-<nonce>" (feedback mode). It lives in the
# path rather than the query string so nothing depends on query pass-through,
# and so the deck's own ?lang=... links cannot disturb it.
# Placeholders are substituted in the target PATH, not in a query string, so the
# segments are passed as path segments and the function reads them from its own
# path. (Writing them as ?id=:id sends the function the literal ":id".)
[[redirects]]
  from = "/media/:id/:token/:mode/*"
  to = "/.netlify/functions/protected-media-asset/:id/:token/:mode/:splat"
  status = 200
  force = true

# publish = "." ships the whole repository, so the function sources are
# otherwise readable at /netlify/functions/*.js. They hold no secrets — they
# read process.env — but they do spell out the auth logic, the rate limits and
# the store names, which is not something to hand out. The functions themselves
# are invoked at /.netlify/functions/* (leading dot) and are unaffected.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# QA tooling for /application/gots-te/ ships in git but is not part of the site.
# Serve nothing from /tests/ — force=true so it wins over the static files.
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
