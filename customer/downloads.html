<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>お客様専用ダウンロード | IDFL JAPAN</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--accent:#1255A0;--accent2:#0d4383;--ink:#17171b;--muted:#6b7280;--line:#e5e7eb;--bg:#f4f7fc;
        --staff:#b91c1c;--staff-bg:#fee2e2;--cust:#166534;--cust-bg:#dcfce7;--link:#155e75;--link-bg:#cffafe;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Zen Kaku Gothic New",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);}
  .hd{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  .hd img{height:30px}.hd .nm{font-weight:900;letter-spacing:.14em;font-size:13px}.hd .grow{flex:1}
  .badge{font-size:11px;font-weight:900;padding:4px 12px;border-radius:999px}
  .badge.staff{background:var(--staff-bg);color:var(--staff)}.badge.cust{background:var(--cust-bg);color:var(--cust)}
  .btn{border:none;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;min-height:40px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent2)}
  .btn-o{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
  .btn-g{background:#eef1f5;color:#374151}
  .wrap{max-width:960px;margin:0 auto;padding:26px 18px 60px}
  h1{font-size:clamp(22px,3vw,30px);margin:0 0 6px;color:#0f2c4d}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px;line-height:1.8}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 6px 18px rgba(15,58,99,.05)}
  .fitem{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .fitem .ico{width:42px;height:42px;border-radius:10px;background:#eef4fb;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .fitem .main{flex:1;min-width:180px}
  .fitem .t{font-weight:700;font-size:14.5px}
  .fitem .m{font-size:11.5px;color:var(--muted);margin-top:3px;word-break:break-all}
  .chip{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:6px}
  .chip.cust{background:var(--cust-bg);color:var(--cust)}.chip.staff{background:var(--staff-bg);color:var(--staff)}.chip.link{background:var(--link-bg);color:var(--link)}
  .group-title{font-size:15px;font-weight:900;color:#0f2c4d;margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid #dbe7f3}
  .sec-title{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800;margin:26px 0 10px}
  .searchbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 6px}
  .searchbar input{flex:1;min-width:200px;padding:10px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit}
  .empty{color:var(--muted);font-size:13.5px;padding:12px 2px}
  .center{text-align:center;padding:60px 0;color:var(--muted)}
</style>
</head>
<body>
  <div class="hd">
    <a href="/"><img src="/IDFL-Logo.png" alt="IDFL JAPAN"></a>
    <span class="nm">IDFL JAPAN</span><div class="grow"></div>
    <span class="badge" id="roleBadge" style="display:none"></span>
    <button class="btn btn-g" id="logoutBtn" style="display:none" onclick="doLogout()">ログアウト</button>
  </div>
  <div class="wrap">
    <div id="loading" class="center">認証を確認しています…</div>
    <div id="app" style="display:none">
      <h1>お客様専用ダウンロード</h1>
      <p class="sub">IDFLのお客様・認証企業・セミナー参加者向けの限定資料です。ファイルはIDFLのサーバー内でのみ保護保管され、権限のある方だけがアクセスできます。</p>

      <div class="searchbar">
        <input type="text" id="search" placeholder="🔍 タイトル・グループ・ファイル名で検索" oninput="renderList()">
      </div>
      <div class="sec-title">ダウンロードできる資料</div>
      <div id="list"></div>
    </div>
  </div>
<script>
(function(){
  var ROLE='PUBLIC'; var FILES=[];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}
  function go(){ location.replace('/login.html?role=customer&next='+encodeURIComponent('/customer/downloads.html')); }

  fetch('/.netlify/functions/auth-status',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    ROLE=(j&&j.role)||'PUBLIC';
    if(ROLE!=='CUSTOMER'&&ROLE!=='STAFF'){ go(); return; }
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
    var badge=document.getElementById('roleBadge'); badge.style.display='inline-block';
    if(ROLE==='STAFF'){ badge.textContent='IDFL STAFF'; badge.className='badge staff'; }
    else { badge.textContent='お客様専用'; badge.className='badge cust'; }
    document.getElementById('logoutBtn').style.display='inline-block';
    loadList();
  }).catch(go);

  function loadList(){
    var list=document.getElementById('list'); list.innerHTML='<div class="empty">読み込み中…</div>';
    fetch('/.netlify/functions/protected-list',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
      FILES=(j&&j.files)||[];
      renderList();
    }).catch(function(){ list.innerHTML='<div class="card empty">読み込みに失敗しました。</div>'; });
  }

  window.renderList=function(){
    var list=document.getElementById('list');
    var q=(document.getElementById('search').value||'').trim().toLowerCase();
    var files=FILES.filter(function(f){
      if(!q) return true;
      return [f.title,f.name,f.group].some(function(v){return String(v||'').toLowerCase().indexOf(q)>=0;});
    });
    if(!files.length){ list.innerHTML='<div class="card empty">'+(q?'検索条件に一致する資料はありません。':'現在ダウンロードできる資料はありません。')+'</div>'; return; }
    var groups={}; var order=[];
    files.forEach(function(f){ var g=f.group||'その他'; if(!groups[g]){groups[g]=[];order.push(g);} groups[g].push(f); });
    var html='';
    order.forEach(function(g){
      html+='<div class="group-title">'+esc(g)+'</div>';
      html+=groups[g].map(function(f){
        var roleChip=f.role==='staff'?'<span class="chip staff">STAFF専用</span>':'<span class="chip cust">お客様</span>';
        var isLink=f.kind==='link';
        var linkChip=isLink?'<span class="chip link">外部リンク</span>':'';
        var action = isLink
          ? '<a class="btn btn-o" href="/.netlify/functions/protected-file?id='+encodeURIComponent(f.id)+'" target="_blank" rel="noopener">開く ↗</a>'
          : '<a class="btn btn-p" href="/.netlify/functions/protected-file?id='+encodeURIComponent(f.id)+'" download>ダウンロード</a>';
        var meta = isLink ? '外部リンク　'+esc(f.uploadedAt?f.uploadedAt.slice(0,10):'') : (esc(f.name||'')+'　'+esc(f.sizeLabel||'')+'　'+esc(f.uploadedAt?f.uploadedAt.slice(0,10):''));
        return '<div class="card fitem"><div class="ico">'+(isLink?'🔗':'📄')+'</div>'+
          '<div class="main"><div class="t">'+esc(f.title||f.name)+roleChip+linkChip+'</div><div class="m">'+meta+'</div></div>'+
          action+'</div>';
      }).join('');
    });
    list.innerHTML=html;
  };

  window.doLogout=function(){ fetch('/.netlify/functions/auth-logout',{method:'POST'}).then(function(){location.replace('/');}); };
})();
</script>
</body>
</html>
