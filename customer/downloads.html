<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>お客様専用ダウンロード | IDFL JAPAN</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--accent:#1255A0;--accent2:#0d4383;--ink:#17171b;--muted:#6b7280;--line:#e5e7eb;--bg:#f4f7fc;
        --staff:#b91c1c;--staff-bg:#fee2e2;--cust:#166534;--cust-bg:#dcfce7;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Zen Kaku Gothic New",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);}
  .hd{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  .hd img{height:30px}
  .hd .nm{font-weight:900;letter-spacing:.14em;font-size:13px}
  .hd .grow{flex:1}
  .badge{font-size:11px;font-weight:900;padding:4px 12px;border-radius:999px}
  .badge.staff{background:var(--staff-bg);color:var(--staff)}
  .badge.cust{background:var(--cust-bg);color:var(--cust)}
  .btn{border:none;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;min-height:40px}
  .btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent2)}
  .btn-g{background:#eef1f5;color:#374151}
  .btn-d{background:#fee2e2;color:#b91c1c}
  .wrap{max-width:960px;margin:0 auto;padding:26px 18px 60px}
  h1{font-size:clamp(22px,3vw,30px);margin:0 0 6px;color:#0f2c4d}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px;line-height:1.8}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 6px 18px rgba(15,58,99,.05)}
  .fitem{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .fitem .ico{width:42px;height:42px;border-radius:10px;background:#eef4fb;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .fitem .main{flex:1;min-width:180px}
  .fitem .t{font-weight:700;font-size:14.5px}
  .fitem .m{font-size:11.5px;color:var(--muted);margin-top:3px;word-break:break-all}
  .chip{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:6px}
  .chip.cust{background:var(--cust-bg);color:var(--cust)}.chip.staff{background:var(--staff-bg);color:var(--staff)}
  .sec-title{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800;margin:26px 0 10px}
  label.f{display:block;font-size:12.5px;font-weight:700;color:#374151;margin-bottom:10px}
  input[type=text],select{width:100%;margin-top:5px;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
  .drop{border:2px dashed var(--accent);border-radius:12px;padding:20px;text-align:center;background:#f0f6fc;cursor:pointer;margin:8px 0}
  .drop.drag{background:#dbe9f8}
  .prog{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:10px;display:none}
  .prog.show{display:block}.prog .bar{height:100%;width:0;background:var(--accent);transition:width .2s}
  .status{font-size:12px;color:var(--muted);margin-top:6px;min-height:15px}
  .note{font-size:11.5px;color:#3f6b34;background:#eef8ee;border:1px solid #cfe8cf;border-radius:8px;padding:8px 11px;margin-top:10px;line-height:1.7}
  .empty{color:var(--muted);font-size:13.5px;padding:12px 2px}
  .center{text-align:center;padding:60px 0;color:var(--muted)}
</style>
</head>
<body>
  <div class="hd">
    <a href="/"><img src="/IDFL-Logo.png" alt="IDFL JAPAN"></a>
    <span class="nm">IDFL JAPAN</span>
    <div class="grow"></div>
    <span class="badge" id="roleBadge" style="display:none"></span>
    <button class="btn btn-g" id="logoutBtn" style="display:none" onclick="doLogout()">ログアウト</button>
  </div>
  <div class="wrap">
    <div id="loading" class="center">認証を確認しています…</div>
    <div id="app" style="display:none">
      <h1>お客様専用ダウンロード</h1>
      <p class="sub">IDFLのお客様・認証企業・セミナー参加者向けの限定資料です。ファイルはIDFLのサーバー内でのみ保護保管され、権限のある方だけがダウンロードできます。</p>

      <div id="staffPanel" style="display:none">
        <div class="sec-title">スタッフ用：保護ファイルのアップロード</div>
        <div class="card">
          <label class="f">タイトル（表示名）<input type="text" id="upTitle" placeholder="例：GOTS 研修教材 2026"></label>
          <label class="f">公開区分
            <select id="upRole">
              <option value="customer">お客様専用（CUSTOMER）</option>
              <option value="staff">IDFLスタッフ専用（STAFF）</option>
            </select>
          </label>
          <div class="drop" id="drop" tabindex="0" role="button">ここにファイルをドラッグ＆ドロップ／クリックして選択</div>
          <input type="file" id="file" style="display:none">
          <div class="prog" id="prog"><div class="bar" id="bar"></div></div>
          <div class="status" id="upStatus"></div>
          <div class="note">対応形式: <span id="allowed">PDF/DOC/DOCX/XLS/XLSX/PPT/PPTX/ZIP/JPG/PNG</span>　最大 <span id="maxlabel">4.0 MB</span>。ファイルは公開リポジトリには保存されません（Netlify Blobs）。</div>
        </div>
      </div>

      <div class="sec-title">ダウンロードできる資料</div>
      <div id="list"></div>
    </div>
  </div>
<script>
(function(){
  var ROLE='PUBLIC';
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}
  function go(){ location.replace('/login.html?role=customer&next='+encodeURIComponent('/customer/downloads.html')); }

  fetch('/.netlify/functions/auth-status',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    ROLE=(j&&j.role)||'PUBLIC';
    if(ROLE!=='CUSTOMER' && ROLE!=='STAFF'){ go(); return; }
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
    var badge=document.getElementById('roleBadge');
    badge.style.display='inline-block';
    if(ROLE==='STAFF'){ badge.textContent='IDFL STAFF ONLY'; badge.className='badge staff'; document.getElementById('staffPanel').style.display='block'; setupUpload(); }
    else { badge.textContent='お客様専用'; badge.className='badge cust'; }
    document.getElementById('logoutBtn').style.display='inline-block';
    loadList();
  }).catch(function(){ go(); });

  function loadList(){
    var list=document.getElementById('list');
    list.innerHTML='<div class="empty">読み込み中…</div>';
    fetch('/.netlify/functions/protected-list',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
      var files=(j&&j.files)||[];
      if(!files.length){ list.innerHTML='<div class="card empty">現在ダウンロードできる資料はありません。</div>'; return; }
      list.innerHTML=files.map(function(f){
        var roleChip = f.role==='staff' ? '<span class="chip staff">STAFF専用</span>' : '<span class="chip cust">お客様</span>';
        var del = (ROLE==='STAFF') ? '<button class="btn btn-d" onclick="delFile(\''+esc(f.id)+'\',this)">削除</button>' : '';
        return '<div class="card fitem">'+
          '<div class="ico">📄</div>'+
          '<div class="main"><div class="t">'+esc(f.title||f.name)+roleChip+'</div>'+
          '<div class="m">'+esc(f.name||'')+'　'+esc(f.sizeLabel||'')+'　'+esc(f.uploadedAt? f.uploadedAt.slice(0,10):'')+'</div></div>'+
          '<a class="btn btn-p" href="/.netlify/functions/protected-file?id='+encodeURIComponent(f.id)+'" download>ダウンロード</a>'+del+
        '</div>';
      }).join('');
    }).catch(function(){ list.innerHTML='<div class="card empty">読み込みに失敗しました。</div>'; });
  }
  window.delFile=function(id,btn){
    if(!confirm('この保護ファイルを削除しますか？')) return; btn.disabled=true;
    fetch('/.netlify/functions/protected-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})})
      .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){ setTimeout(loadList,800);} else { alert('削除に失敗しました'); btn.disabled=false; } })
      .catch(function(){ alert('通信エラー'); btn.disabled=false; });
  };
  window.doLogout=function(){ fetch('/.netlify/functions/auth-logout',{method:'POST'}).then(function(){ location.replace('/'); }); };

  var CFG={allowedExt:['pdf','doc','docx','xls','xlsx','ppt','pptx','zip','jpg','jpeg','png'],maxBytes:4*1024*1024,maxLabel:'4.0 MB'};
  function setupUpload(){
    fetch('/.netlify/functions/file-manager?action=config').then(function(r){return r.json();}).then(function(j){ if(j&&j.ok){CFG=j; document.getElementById('allowed').textContent=j.allowedExt.join('/').toUpperCase(); document.getElementById('maxlabel').textContent=j.maxLabel;} }).catch(function(){});
    var drop=document.getElementById('drop'), file=document.getElementById('file');
    drop.addEventListener('click',function(){file.click();});
    drop.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click();}});
    drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('drag');});
    drop.addEventListener('dragleave',function(){drop.classList.remove('drag');});
    drop.addEventListener('drop',function(e){e.preventDefault();drop.classList.remove('drag');if(e.dataTransfer.files[0])upload(e.dataTransfer.files[0]);});
    file.addEventListener('change',function(){if(file.files[0])upload(file.files[0]);file.value='';});
  }
  function extOf(n){return (String(n).split('.').pop()||'').toLowerCase();}
  function upload(f){
    var st=document.getElementById('upStatus'), prog=document.getElementById('prog'), bar=document.getElementById('bar');
    st.style.color='#6b7280';
    if(CFG.allowedExt.indexOf(extOf(f.name))<0){ st.style.color='#b91c1c'; st.textContent='対応形式ではありません'; return; }
    if(f.size>CFG.maxBytes){ st.style.color='#b91c1c'; st.textContent='サイズが上限（'+CFG.maxLabel+'）を超えています'; return; }
    var reader=new FileReader();
    reader.onload=function(){
      var b64=String(reader.result).split(',')[1];
      var payload=JSON.stringify({filename:f.name,contentBase64:b64,role:document.getElementById('upRole').value,title:document.getElementById('upTitle').value||f.name});
      var xhr=new XMLHttpRequest(); xhr.open('POST','/.netlify/functions/protected-upload'); xhr.setRequestHeader('Content-Type','application/json');
      prog.classList.add('show'); st.textContent='アップロード中…';
      xhr.upload.onprogress=function(e){if(e.lengthComputable){bar.style.width=Math.round(e.loaded/e.total*100)+'%';}};
      xhr.onload=function(){var j={};try{j=JSON.parse(xhr.responseText);}catch(e){} if(xhr.status===200&&j.ok){ st.style.color='#166534'; st.textContent='✓ アップロードしました'; bar.style.width='100%'; document.getElementById('upTitle').value=''; setTimeout(function(){prog.classList.remove('show');bar.style.width='0';loadList();},900);} else { st.style.color='#b91c1c'; st.textContent='失敗: '+(j.error||('HTTP '+xhr.status)); } };
      xhr.onerror=function(){st.style.color='#b91c1c';st.textContent='通信エラー';};
      xhr.send(payload);
    };
    reader.readAsDataURL(f);
  }
})();
</script>
</body>
</html>
