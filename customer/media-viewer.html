<!DOCTYPE html>
<html lang="ja">
<head>

<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<body>

<div class="lib-app" id="libApp">

  <nav class="lib-rail" id="libRail" aria-label="メディアライブラリ ナビゲーション">
    <a class="lib-rail__brand" href="/">
      <span class="lib-rail__logo"><img src="/IDFL-Logo.png" alt="" width="90" height="28"></span>
      <span class="lib-rail__names">
        <span class="lib-rail__name">IDFL JAPAN</span>
        <span class="lib-rail__sub">Customer Portal</span>
      </span>
    </a>

    <div class="lib-rail__head">
      <h2 class="lib-rail__label">Media Library</h2>
      <div class="lib-search" id="libSearchWrap">
        <svg class="lib-i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <label class="lib-sr-only" for="libSearch">タイトル・説明で検索</label>
        <input type="search" id="libSearch" placeholder="タイトル・説明で検索" autocomplete="off" spellcheck="false">
        <button type="button" class="lib-search__clear" id="libSearchClear" aria-label="検索条件を消す">
          <svg class="lib-i lib-i-sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <div class="lib-rail__scroll lib-scroll">
      <ul class="lib-types" id="libTypes" aria-label="資料の種類でしぼり込む"></ul>
      <div class="lib-rail__rule" role="presentation"></div>
      <h2 class="lib-rail__label" id="libCollLabel" style="padding:0 12px">Collections</h2>
      <ul class="lib-tree" id="libTree" aria-label="コレクション"></ul>
    </div>

    <div class="lib-rail__foot">
      <b>
        <svg class="lib-i lib-i-sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.2 5 6v5.4c0 4 2.9 7.6 7 9.4 4.1-1.8 7-5.4 7-9.4V6z"/><path d="m9.2 12.1 2 2 3.6-3.9"/></svg>
        Secure Workspace
      </b>
      <span>権限のある方のみ閲覧できます</span>
    </div>
  </nav>

  <div class="lib-work lib-work--viewer" id="libWork">

    <header class="lib-bar">
      <button type="button" class="lib-btn lib-btn--quiet lib-btn--icon lib-railtoggle" id="libRailToggle"
              aria-expanded="false" aria-controls="libRail" aria-label="ナビゲーションを開く">
        <svg class="lib-i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <nav aria-label="パンくずリスト">
        <ol class="lib-crumb" id="libCrumb">
          <li><a href="/customer/media.html">Media Library</a></li>
        </ol>
      </nav>

      <span class="lib-bar__grow"></span>

      <div class="lib-bar__acts">
        <span class="lib-pill" id="libRole" hidden></span>
        <button type="button" class="lib-btn lib-btn--secondary" id="fbToggle" hidden aria-expanded="false" aria-controls="drawer" aria-label="フィードバック">
          <svg class="lib-i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 13.5a2.5 2.5 0 0 1-2.5 2.5H9l-4.5 3.4V6.5A2.5 2.5 0 0 1 7 4h10.5A2.5 2.5 0 0 1 20 6.5z"/></svg>
          <span class="lib-btn__t">フィードバック</span>
        </button>
        <a class="lib-btn lib-btn--secondary" href="/customer/downloads.html" aria-label="ダウンロード一覧"><svg class="lib-i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4.5 19.5h15"/></svg><span class="lib-btn__t">ダウンロード一覧</span></a>
        <button type="button" class="lib-btn lib-btn--secondary" id="libFs" aria-pressed="false" aria-label="全画面表示">
          <svg class="lib-i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5"/></svg>
          <span class="lib-fs-t">全画面表示</span>
        </button>
        <button type="button" class="lib-btn lib-btn--secondary" id="libLogout" hidden aria-label="ログアウト"><svg class="lib-i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6.5a2 2 0 0 0 2-2v-2"/><path d="M20 12H9.5"/><path d="m16.8 8.8 3.2 3.2-3.2 3.2"/></svg><span class="lib-btn__t">ログアウト</span></button>
        <button type="button" class="lib-avatar" id="libUser" hidden aria-label="ログイン中のアカウント">
          <svg class="lib-i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8.4" r="3.7"/><path d="M4.8 20a7.4 7.4 0 0 1 14.4 0"/></svg>
        </button>
      </div>

    <section class="lib-vhead" aria-labelledby="mTitle">

    <div class="lib-vbody">

      </div>

      <aside class="lib-fb" id="drawer" hidden aria-label="この資料へのフィードバック">
        <div class="lib-fb__head">
          <svg class="lib-i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 13.5a2.5 2.5 0 0 1-2.5 2.5H9l-4.5 3.4V6.5A2.5 2.5 0 0 1 7 4h10.5A2.5 2.5 0 0 1 20 6.5z"/></svg>
          フィードバック
          <span class="lib-bar__grow"></span>
          <button type="button" class="lib-btn lib-btn--quiet lib-btn--icon" id="fbClose" aria-label="フィードバックを閉じる">
            <svg class="lib-i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="lib-fb__body lib-scroll" id="fbList"><div class="lib-fbempty">読み込み中…</div></div>
        <div class="lib-fb__foot">
          <button type="button" class="lib-btn lib-btn--primary" id="addBtn" style="width:100%">コメントを追加</button>
          <p class="lib-fbitem__where" id="pickHint" style="margin:9px 0 0">資料の中でコメントしたい箇所をクリックすると、その位置にコメントを残せます。</p>
        </div>
      </aside>
    </div>

  </div>
</div>

<div class="lib-scrim" id="libScrim"></div>
<div class="lib-toast" id="libToast" role="status" aria-live="polite"></div>

<div class="lib-ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="lib-modal">
    <h2 id="ovTitle">フィードバックを送る</h2>
    <p class="lib-modal__lead" id="ovLead"></p>
    <div id="ovBody"></div>
    <div class="lib-err" id="ovErr" role="alert"></div>
    <div class="lib-modal__acts">
      <button type="button" class="lib-btn lib-btn--secondary" id="ovCancel">キャンセル</button>
      <button type="button" class="lib-btn lib-btn--primary" id="ovSend">送信する</button>
    </div>
  </div>
</div>

<script src="/js/library-shell.js"></script>
<script>
(function(){
  'use strict';
  var L = window.IDFLLib;
  var esc = L.esc, icon = L.icon;

  var ROLE='PUBLIC', MEDIA=null, ITEMS=[], NONCE='', FRAME=null, PICKING=false, PENDING=null, DRAWER=false;
  var TOKEN_KEY='idflFbToken', CONTACT_KEY='idflFbContact';
  var TAG='__idflfb';
  var TYPE_LABEL={question:'質問',comment:'コメント・補足',correction:'修正依頼'};

  var qs=new URLSearchParams(location.search);
  var MEDIA_ID=String(qs.get('id')||'');
  // Optional deep link from the admin console: open straight at one comment.
  var FOCUS_ID=String(qs.get('fb')||'');
  var SELF='/customer/media-viewer.html?id='+encodeURIComponent(MEDIA_ID)+(FOCUS_ID?('&fb='+encodeURIComponent(FOCUS_ID)):'');

  function el(id){return document.getElementById(id);}
  function go(){ location.replace('/login.html?role=customer&next='+encodeURIComponent(SELF)); }

  function stageMsg(iconName, title, body, action, danger){
    el('stage').className='lib-stage lib-stage--scroll lib-scroll';
    el('stage').innerHTML='<div class="lib-msg'+(danger?' lib-msg--danger':'')+'">'+icon(iconName)
      +(title?'<h2>'+title+'</h2>':'')
      +(body?'<p>'+body+'</p>':'')
      +(action||'')+'</div>';
  }

  // Stable per-browser handle so a customer can see their own feedback again
  // later. Random, not derived from the e-mail address, and never in a URL.
  function myToken(){
    var t='';
    try{ t=localStorage.getItem(TOKEN_KEY)||''; }catch(e){}
    if(!/^[A-Za-z0-9_-]{16,64}$/.test(t)){
      var a=new Uint8Array(24);
      (window.crypto||window.msCrypto).getRandomValues(a);
      t=btoa(String.fromCharCode.apply(null,a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      try{ localStorage.setItem(TOKEN_KEY,t); }catch(e){}
    }
    return t;
  }
  // Contact details are kept for this browser session only, as a convenience.
  function savedContact(){ try{ return JSON.parse(sessionStorage.getItem(CONTACT_KEY)||'{}')||{}; }catch(e){ return {}; } }
  function saveContact(c){ try{ sessionStorage.setItem(CONTACT_KEY, JSON.stringify(c)); }catch(e){} }

  function randNonce(){
    var a=new Uint8Array(12);
    (window.crypto||window.msCrypto).getRandomValues(a);
    return btoa(String.fromCharCode.apply(null,a)).replace(/[^A-Za-z0-9]/g,'').slice(0,16);
  }

  // ------------------------------------------------------------- bootstrap
  if(!/^[A-Za-z0-9_-]{1,64}$/.test(MEDIA_ID)){
    stageMsg('alert','資料が指定されていません','アドレスに資料の指定が含まれていません。左の一覧から資料をお選びください。',
      '<a class="lib-btn lib-btn--secondary" href="/customer/media.html">メディアライブラリへ</a>', true);
  }

  L.boot({
    activeId: MEDIA_ID,
    next: SELF,
    ownsInspector: true,
    // The viewer shows one record, so a filter here means "show me the library
    // narrowed like this" rather than a control that does nothing.
    filtersGoTo: '/customer/media.html',
    onReady: function(ctx){
      ROLE=ctx.role;
      if(!/^[A-Za-z0-9_-]{1,64}$/.test(MEDIA_ID)) return;
      if(!ctx.active){
        el('mTitle').textContent='資料が見つかりません';
        stageMsg('lock','この資料は表示できません',
          '削除されたか、閲覧権限がない可能性があります。左の一覧から他の資料をお選びください。',
          '<a class="lib-btn lib-btn--secondary" href="/customer/media.html">メディアライブラリへ</a>', true);
        return;
      }
      MEDIA=ctx.active;
      renderHead();
      el('fbToggle').hidden=false;
      if(MEDIA.mediaType==='html') mountHtml(); else mountFile();
      loadFeedback();
    },
    onListFail: function(){
      stageMsg('alert','読み込みに失敗しました','通信が不安定な可能性があります。ページを再読み込みしてください。',
        '<button type="button" class="lib-btn lib-btn--secondary" onclick="location.reload()">再読み込み</button>', true);
    }
  });

  // ------------------------------------------------------------ the header
  function renderHead(){
    var t=MEDIA.title||MEDIA.name||'資料';
    document.title=t+' | IDFL JAPAN カスタマーポータル';
    el('mTitle').textContent=t;

    var g=L.groupOf(MEDIA);
    el('libCrumb').innerHTML=
       '<li><a href="/customer/media.html">Media Library</a></li>'
      +'<li><span class="lib-crumb__sep" aria-hidden="true">/</span><span>'+esc(g)+'</span></li>'
      +'<li><span class="lib-crumb__sep" aria-hidden="true">/</span><span aria-current="page">'+esc(t)+'</span></li>';

    var k=L.typeOf(MEDIA);
    var staffOnly = MEDIA.role==='staff';
    var tags='<span class="lib-badge lib-badge--type">'+icon(L.typeIcon(k),'lib-i-sm')+esc(L.typeLabel(k))+'</span>'
      + (staffOnly
          ? '<span class="lib-badge lib-badge--staff">'+icon('lock','lib-i-sm')+'IDFL STAFF ONLY</span>'
          : '<span class="lib-badge lib-badge--customer">お客様専用</span>')
      + (MEDIA.status==='draft' ? '<span class="lib-badge lib-badge--draft">下書き</span>' : '')
      + (MEDIA.version ? '<span class="lib-badge lib-badge--version lib-num" id="mVer">Version '+esc(MEDIA.version)+'</span>' : '')
      + (L.day(MEDIA) ? '<span class="lib-badge lib-badge--type lib-num">更新 '+esc(L.dot(L.day(MEDIA)))+'</span>' : '')
      + (MEDIA.sizeLabel ? '<span class="lib-badge lib-badge--type lib-num">'+esc(MEDIA.sizeLabel)+'</span>' : '');
    el('vwTags').innerHTML=tags;

    if(MEDIA.description){ el('vwDesc').textContent=MEDIA.description; el('vwDesc').hidden=false; }
  }

  // ------------------------------------------------------------ presentation
  // Unchanged: a one-time nonce, a grant scoped to this record, and a frame
  // with no allow-same-origin. Only the surrounding markup moved.
  function mountHtml(){
    NONCE=randNonce();
    fetch('/.netlify/functions/media-grant?id='+encodeURIComponent(MEDIA_ID),{cache:'no-store'})
      .then(function(r){ return r.json().then(function(j){ return {s:r.status,j:j}; }); })
      .then(function(o){
        if(o.s!==200||!o.j.ok){
          if(o.s===401){ go(); return; }
          stageMsg('alert','資料を開けませんでした',esc((o.j&&o.j.error)||'もう一度お試しください。'),'',true);
          return;
        }
        var base='/media/'+encodeURIComponent(MEDIA_ID)+'/'+encodeURIComponent(o.j.token)+'/f-'+NONCE+'/';
        var f=document.createElement('iframe');
        f.id='frame';
        f.className='lib-frame';
        f.title=MEDIA.title||'資料';
        f.src=base+o.j.entry;
        // No allow-same-origin: the presentation gets an opaque origin and can
        // reach neither this page's DOM nor the session cookie. The response
        // itself also carries a CSP sandbox directive.
        f.setAttribute('sandbox','allow-scripts allow-popups allow-popups-to-escape-sandbox allow-modals allow-forms allow-downloads');
        // fullscreen, and autoplay so a package that carries narration can turn
        // sound on from its own controls. A cross-origin frame holds no autoplay
        // permission of its own, and a package's clips live in a nested frame of
        // their own again - without this delegation the user's click on the
        // package's sound button never reaches the frame that owns the <video>,
        // and Chrome refuses to unmute. Delegating autoplay does not widen what
        // the package can reach: the sandbox still withholds allow-same-origin,
        // so it still has an opaque origin, no session cookie and no access to
        // this page.
        f.setAttribute('allow','fullscreen; autoplay');
        f.setAttribute('referrerpolicy','no-referrer');
        var stage=el('stage');
        stage.className='lib-stage';
        stage.innerHTML='';
        stage.appendChild(f);
        FRAME=f;
      })
      .catch(function(){ stageMsg('alert','資料を開けませんでした','通信が不安定な可能性があります。ページを再読み込みしてください。','',true); });
  }

  // ---------------------------------------------------- everything else
  function mountFile(){
    var url=L.fileUrl(MEDIA_ID);
    var k=L.typeOf(MEDIA);
    var stage=el('stage');
    stage.className='lib-stage lib-stage--scroll lib-scroll';

    if(k==='image'){
      stage.innerHTML='<div class="lib-pad">'
        + '<p style="display:flex;gap:9px;flex-wrap:wrap;margin:0 0 16px">'
        +   '<button type="button" class="lib-btn lib-btn--primary" data-dl="'+esc(MEDIA_ID)+'">'+icon('download')+'ダウンロード</button>'
        + '</p>'
        + '<div class="lib-box"><img class="lib-shot" src="'+esc(url)+'&inline=1" alt="'+esc(MEDIA.title||MEDIA.name||'画像')+'"></div>'
        + '</div>';
    } else if(k==='pdf'){
      stage.innerHTML='<div class="lib-pad">'
        + '<p style="display:flex;gap:9px;flex-wrap:wrap;margin:0 0 16px">'
        +   '<button type="button" class="lib-btn lib-btn--primary" data-dl="'+esc(MEDIA_ID)+'">'+icon('download')+'ダウンロード</button>'
        +   '<a class="lib-btn lib-btn--secondary" href="'+esc(url)+'&inline=1" target="_blank" rel="noopener noreferrer">'+icon('external')+'別のタブで開く</a>'
        + '</p>'
        + '<div class="lib-box"><iframe class="lib-pdf" src="'+esc(url)+'&inline=1" title="'+esc(MEDIA.title||MEDIA.name||'PDF')+'"></iframe></div>'
        + '<p class="lib-guard" style="margin-top:16px">'+icon('info')+'<span>プレビューが表示されない場合は、上の「ダウンロード」からご覧ください。</span></p>'
        + '</div>';
    } else if(k==='external'){
      stage.innerHTML='<div class="lib-pad"><div class="lib-box"><div class="lib-box__body">'
        + '<h2 style="margin:0 0 8px;font-size:var(--fs-lg);color:var(--ink-navy)">外部サイトの資料です</h2>'
        + '<p style="margin:0 0 18px;color:var(--ink-2)">この項目はIDFL以外のサイトで公開されています。新しいタブで開きます。</p>'
        + '<a class="lib-btn lib-btn--primary" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+icon('external')+'開く</a>'
        + '</div></div></div>';
    } else {
      stage.innerHTML='<div class="lib-pad"><div class="lib-box"><div class="lib-box__body">'
        + '<h2 style="margin:0 0 8px;font-size:var(--fs-lg);color:var(--ink-navy)">ダウンロードしてご覧ください</h2>'
        + '<p style="margin:0 0 18px;color:var(--ink-2)">ブラウザー内での表示に対応していない形式です。</p>'
        + '<button type="button" class="lib-btn lib-btn--primary" data-dl="'+esc(MEDIA_ID)+'">'+icon('download')+'ダウンロード</button>'
        + '</div></div></div>';
    }

    stage.addEventListener('click', function(e){
      var d=e.target.closest('[data-dl]');
      if(d) L.download(d.getAttribute('data-dl'), d);
    });
  }

  // ---------------------------------------------------------- iframe bridge
  function send(msg){
    if(!FRAME||!FRAME.contentWindow) return;
    msg[TAG]=1; msg.nonce=NONCE;
    // The frame has an opaque origin, so '*' is the only usable target.
    // Nothing confidential is ever put in these messages.
    FRAME.contentWindow.postMessage(msg,'*');
  }

  window.addEventListener('message',function(ev){
    if(!FRAME||ev.source!==FRAME.contentWindow) return;      // only our frame
    var m=ev.data;
    if(!m||m[TAG]!==1||m.nonce!==NONCE) return;              // and only with our nonce
    if(m.evt==='ready'){ pushPins(); }
    else if(m.evt==='picked'){ PICKING=false; setPickUi(false); openForm(m.anchor); }
    else if(m.evt==='cancel'){ PICKING=false; setPickUi(false); }
    else if(m.evt==='pinClick'){ focusItem(m.n); }
    else if(m.evt==='pinState'){ markUnresolved(m.unresolved||[]); }
  },false);

  function pushPins(){
    var pins=[];
    ITEMS.forEach(function(it,i){ if(it.anchor) pins.push({n:i+1, anchor:it.anchor}); });
    send({cmd:'setPins', pins:pins});
  }

  function markUnresolved(list){
    var set={}; list.forEach(function(n){set[n]=1;});
    ITEMS.forEach(function(it,i){ it._unresolved = it.anchor ? !!set[i+1] : true; });
    renderFeedback(true);
  }

  // ------------------------------------------------------------- feedback
  // Netlify Blobs listing is eventually consistent: a record that was just
  // written is readable by key but can take ~20s to show up in a prefix list.
  // Without this, a customer submits feedback and the drawer comes back empty,
  // which reads as "it failed". So keep what we just submitted locally until
  // the server list catches up.
  var JUST_SENT=[];

  function mergeFeedback(serverItems){
    var seen={}; var out=[];
    (serverItems||[]).forEach(function(it){ if(it&&it.id&&!seen[it.id]){ seen[it.id]=1; out.push(it); } });
    JUST_SENT=JUST_SENT.filter(function(it){ return !seen[it.id]; });   // the list caught up
    JUST_SENT.forEach(function(it){ out.push(it); });
    out.sort(function(a,b){ return String(a.createdAt||'').localeCompare(String(b.createdAt||'')); });
    return out;
  }

  function loadFeedback(){
    var u='/.netlify/functions/feedback-list?mediaId='+encodeURIComponent(MEDIA_ID)+'&token='+encodeURIComponent(myToken());
    fetch(u,{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
      ITEMS=mergeFeedback(j&&j.items);
      renderFeedback(); pushPins();
      if(JUST_SENT.length) setTimeout(loadFeedback, 6000);            // reconcile shortly
      if(FOCUS_ID){
        for(var i=0;i<ITEMS.length;i++) if(ITEMS[i].id===FOCUS_ID){ if(!DRAWER) toggleDrawer(); setTimeout(function(n){return function(){ send({cmd:'focusPin',n:n}); };}(i+1), 900); break; }
        FOCUS_ID='';
      }
    }).catch(function(){
      if(!ITEMS.length) el('fbList').innerHTML='<div class="lib-fbempty">フィードバックを読み込めませんでした。</div>';
    });
  }

  function renderFeedback(keepScroll){
    var box=el('fbList');
    var top=keepScroll?box.scrollTop:0;
    if(!ITEMS.length){
      box.innerHTML='<div class="lib-fbempty">まだフィードバックはありません。<br>「コメントを追加」から、資料の気になる箇所についてご質問・ご意見をお送りいただけます。<br><br>ここには、お客様ご自身が送信された内容と、IDFLが共有として公開した内容のみが表示されます。</div>';
      return;
    }
    box.innerHTML=ITEMS.map(function(it,i){
      var n=i+1;
      var old = MEDIA && MEDIA.version && it.mediaVersion && it.mediaVersion!==MEDIA.version;
      return '<button type="button" class="lib-fbitem" data-n="'+n+'">'
        + '<span class="lib-fbitem__top"><span class="lib-fbitem__n'+(it._unresolved?' is-stale':'')+'">'+n+'</span>'
        + '<span class="lib-fbtag lib-fbtag--'+esc(it.type)+'">'+esc(it.typeLabel||TYPE_LABEL[it.type]||it.type)+'</span>'
        + '<span class="lib-fbtag lib-fbtag--status">'+esc(it.statusLabel||'受付済み')+'</span>'
        + (old?'<span class="lib-fbtag lib-fbtag--stale">Version '+esc(it.mediaVersion)+' へのコメント</span>':'')
        + '</span>'
        + '<span class="lib-fbitem__msg">'+esc(it.message)+'</span>'
        + (it.anchor&&(it.anchor.section||it.anchor.textQuote)
            ? '<span class="lib-fbitem__where">対象箇所: '+esc((it.anchor.section?it.anchor.section+' / ':'')+String(it.anchor.textQuote||'').slice(0,70))+'</span>' : '')
        + (it._unresolved&&it.anchor?'<span class="lib-fbitem__where">※ 資料が更新されたため、この位置は表示できません。</span>':'')
        + (it.staffReply?'<span class="lib-fbitem__reply"><b>IDFLからの回答</b>'+esc(it.staffReply)+'</span>':'')
        + '</button>';
    }).join('');
    box.scrollTop=top;
  }

  el('fbList').addEventListener('click',function(e){
    var b=e.target.closest('.lib-fbitem');
    if(b) focusItem(parseInt(b.dataset.n,10));
  });

  function focusItem(n){
    if(!DRAWER) toggleDrawer();
    send({cmd:'focusPin', n:n});
  }
  window.focusItem=focusItem;

  function toggleDrawer(){
    DRAWER=!DRAWER;
    el('drawer').hidden=!DRAWER;
    el('fbToggle').classList.toggle('is-on',DRAWER);
    el('fbToggle').setAttribute('aria-expanded',DRAWER?'true':'false');
    if(!DRAWER) el('fbToggle').focus();
  }
  window.toggleDrawer=toggleDrawer;
  el('fbToggle').addEventListener('click',toggleDrawer);
  el('fbClose').addEventListener('click',toggleDrawer);

  function setPickUi(on){
    el('addBtn').textContent = on ? 'クリック待ち…（中止するにはもう一度押す）' : 'コメントを追加';
    el('addBtn').classList.toggle('is-on',on);
    el('pickHint').textContent = on
      ? '資料内のコメントしたい箇所をクリックしてください。Esc または上のボタンで中止できます。'
      : '資料の中でコメントしたい箇所をクリックすると、その位置にコメントを残せます。';
  }

  function startPick(){
    if(!MEDIA) return;
    if(MEDIA.mediaType!=='html'||!FRAME){ openForm(null); return; }   // no anchor: general feedback
    PICKING=!PICKING;
    setPickUi(PICKING);
    send({cmd:'pickMode', on:PICKING});
  }
  window.startPick=startPick;
  el('addBtn').addEventListener('click',startPick);

  // ----------------------------------------------------------------- form
  var lastModalFocus=null;
  function openForm(anchor){
    PENDING={anchor:anchor||null};
    lastModalFocus=document.activeElement;
    var c=savedContact();
    var where = anchor ? [anchor.section, String(anchor.textQuote||'').slice(0,80)].filter(Boolean).join(' / ') : '';
    el('ovLead').textContent = where ? ('対象箇所: '+where) : '資料全体へのフィードバックとして送信します。';
    el('ovBody').innerHTML=
       '<label class="lib-field">フィードバックの種類<span class="lib-req">*</span>'
      +'<select id="fType"><option value="question">質問</option><option value="comment">コメント・補足</option><option value="correction">修正依頼</option></select></label>'
      +'<label class="lib-field">フィードバック内容<span class="lib-req">*</span>'
      +'<textarea id="fMsg" maxlength="4000" placeholder="ご質問・ご意見・修正のご依頼をご記入ください。"></textarea></label>'
      +'<div class="lib-privacy">ご入力いただいた情報は、本資料に関するご質問・ご連絡への対応のために使用します。<br>お名前・メールアドレス・電話番号が他のお客様に表示されることはありません。</div>'
      +'<label class="lib-field">お名前<span class="lib-req">*</span><input type="text" id="fName" maxlength="100" autocomplete="name" value="'+esc(c.name||'')+'"></label>'
      +'<label class="lib-field">メールアドレス<span class="lib-req">*</span><input type="email" id="fEmail" maxlength="200" autocomplete="email" value="'+esc(c.email||'')+'"></label>'
      +'<label class="lib-field">電話番号<span class="lib-req">*</span><input type="tel" id="fPhone" maxlength="40" autocomplete="tel" placeholder="06-1234-5678" value="'+esc(c.phone||'')+'"></label>';
    el('ovErr').textContent='';
    el('ovSend').disabled=false; el('ovSend').textContent='送信する';
    el('ov').classList.add('is-open');
    setTimeout(function(){ el('fMsg').focus(); },40);
  }

  function closeModal(){
    el('ov').classList.remove('is-open');
    PENDING=null;
    if(lastModalFocus&&lastModalFocus.focus) lastModalFocus.focus();
    lastModalFocus=null;
  }
  window.closeModal=closeModal;
  el('ovCancel').addEventListener('click',closeModal);
  el('ov').addEventListener('mousedown',function(e){ if(e.target===el('ov')) closeModal(); });

  function emailOk(v){ return /^[^\s@]{1,64}@[A-Za-z0-9][A-Za-z0-9.-]*\.[A-Za-z]{2,}$/.test(v); }
  function phoneOk(v){ return /^[0-9+\-() .]+$/.test(v) && v.replace(/[^0-9]/g,'').length>=9; }

  function submitFeedback(){
    if(!PENDING) return;
    var err=el('ovErr'); err.textContent='';
    var type=el('fType').value;
    var msg=(el('fMsg').value||'').trim();
    var name=(el('fName').value||'').trim();
    var email=(el('fEmail').value||'').trim();
    var phone=(el('fPhone').value||'').trim();
    if(msg.length<2){ err.textContent='フィードバック内容をご記入ください。'; return; }
    if(!name){ err.textContent='お名前をご記入ください。'; return; }
    if(!emailOk(email)){ err.textContent='メールアドレスの形式をご確認ください。'; return; }
    if(!phoneOk(phone)){ err.textContent='電話番号の形式をご確認ください（数字9桁以上）。'; return; }

    var btn=el('ovSend'); btn.disabled=true; btn.textContent='送信中…';
    saveContact({name:name,email:email,phone:phone});

    fetch('/.netlify/functions/feedback-submit',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        mediaId:MEDIA_ID, mediaVersion:MEDIA.version||1, type:type, message:msg,
        anchor:PENDING.anchor, token:myToken(), customer:{name:name,email:email,phone:phone}
      })
    }).then(function(r){ return r.json().then(function(j){ return {s:r.status,j:j}; }); })
      .then(function(o){
        if(o.s===200&&o.j.ok){
          closeModal();
          L.toast(o.j.notificationSent ? 'フィードバックを送信しました。' : 'フィードバックを受け付けました。');
          if(!DRAWER) toggleDrawer();
          // Show it straight away from the server's own reply; the listing may
          // not include it yet (see mergeFeedback).
          if(o.j.feedback && o.j.feedback.id){
            JUST_SENT.push(o.j.feedback);
            ITEMS=mergeFeedback(ITEMS);
            renderFeedback(); pushPins();
          }
          loadFeedback();
          return;
        }
        if(o.s===401){ err.textContent='セッションが切れています。再度ログインしてください。'; setTimeout(go,1400); }
        else err.textContent=(o.j&&o.j.error)||('送信に失敗しました（'+o.s+'）');
        btn.disabled=false; btn.textContent='送信する';
      })
      .catch(function(){ err.textContent='通信エラーが発生しました。'; btn.disabled=false; btn.textContent='送信する'; });
  }
  window.submitFeedback=submitFeedback;
  el('ovSend').addEventListener('click',submitFeedback);

  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    if(el('ov').classList.contains('is-open')){ closeModal(); return; }
    if(PICKING){ PICKING=false; setPickUi(false); send({cmd:'pickMode',on:false}); return; }
    if(DRAWER && window.matchMedia('(max-width:1099px)').matches){ toggleDrawer(); }
  });
})();
</script>
</body>
</html>
