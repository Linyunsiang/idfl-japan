<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>メディアライブラリ | IDFL JAPAN お客様ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/library.css">
</head>
<body>

<div class="lib-app">

  <header class="lib-head" id="libHeadBar">
    <button type="button" class="lib-btn lib-btn--quiet lib-railtoggle" id="libRailToggle"
            aria-expanded="false" aria-controls="libRail">
      <svg class="lib-i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      資料一覧
    </button>

    <a class="lib-head__brand" href="/">
      <img src="/IDFL-Logo.png" alt="IDFL JAPAN" width="88" height="26">
      <span class="lib-head__wordmark">IDFL JAPAN</span>
    </a>
    <span class="lib-head__sep" aria-hidden="true"></span>
    <span class="lib-head__portal">お客様ポータル</span>

    <span class="lib-head__grow"></span>

    <div class="lib-head__actions">
      <span class="lib-badge" id="libRole" hidden></span>
      <a class="lib-btn lib-btn--quiet" href="/customer/downloads.html">ダウンロード一覧</a>
      <button type="button" class="lib-btn lib-btn--quiet" id="libLogout" hidden>ログアウト</button>
    </div>
  </header>

  <div class="lib-body">

    <!-- ------------------------------------------------------------- rail -->
    <aside class="lib-rail" id="libRail" aria-label="資料の一覧">
      <div class="lib-rail__head">
        <h2 class="lib-rail__title">
          メディアライブラリ
          <span class="lib-head__grow"></span>
          <button type="button" class="lib-btn lib-btn--quiet lib-btn--icon lib-rail__close" id="libRailClose" aria-label="資料一覧を閉じる">
            <svg class="lib-i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </h2>

        <div class="lib-search" id="libSearchWrap">
          <svg class="lib-i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <label class="lib-sr-only" for="libSearch">資料を検索</label>
          <input type="search" id="libSearch" placeholder="タイトル・説明で検索" autocomplete="off" spellcheck="false">
          <button type="button" class="lib-search__clear" id="libSearchClear" aria-label="検索条件を消す">
            <svg class="lib-i lib-i-sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <ul class="lib-types" id="libTypes" aria-label="資料の種類でしぼり込む"></ul>

      <div class="lib-rail__scroll lib-scroll">
        <p class="lib-scope" id="libScope" role="status" aria-live="polite"></p>
        <nav id="libList" aria-label="資料"></nav>
      </div>

      <p class="lib-rail__foot">IDFLのお客様専用の保護領域です。第三者への再配布はご遠慮ください。</p>
    </aside>

    <!-- ---------------------------------------------------------- content -->
    <main class="lib-main" id="libMain">
      <div class="lib-pane lib-scroll" id="libPane">
        <div class="lib-inner" id="libInner">
          <div class="lib-msg"><p>認証を確認しています…</p></div>
        </div>
      </div>
    </main>

  </div>
</div>

<div class="lib-scrim" id="libScrim"></div>

<script src="/js/library-shell.js"></script>
<script>
(function(){
  'use strict';
  var L = window.IDFLLib, esc = L.esc, icon = L.icon;

  // An id in the address bar belongs to the viewer; keep old deep links alive.
  var qs = new URLSearchParams(location.search);
  var deep = String(qs.get('id') || '');
  if (/^[A-Za-z0-9_-]{1,64}$/.test(deep)) {
    location.replace(L.viewerUrl(deep) + L.railParams());
    return;
  }

  function inner(html){ document.getElementById('libInner').innerHTML = html; }

  function overview(items){
    var counts = {};
    items.forEach(function(f){ var k = L.typeOf(f); counts[k] = (counts[k]||0)+1; });

    var kinds = L.TYPES.filter(function(t){ return t.key !== 'all'; }).map(function(t){
      var n = counts[t.key] || 0;
      return '<li><button type="button" data-type="' + esc(t.key) + '"'
        + (n ? '' : ' disabled aria-disabled="true"') + '>'
        + icon(t.icon) + '<span>' + esc(t.label) + '</span><b class="lib-num">' + n + '</b></button></li>';
    }).join('');

    var recent = items.slice().sort(function(a,b){
      return String(L.day(b)).localeCompare(String(L.day(a)));
    }).slice(0,5).map(function(f){
      var k = L.typeOf(f);
      return '<li><a href="' + L.viewerUrl(f.id) + L.railParams() + '">'
        + icon(L.typeIcon(k))
        + '<span><span class="lib-recent__t">' + esc(f.title || f.name || '(無題)') + '</span>'
        + '<span class="lib-recent__m lib-num">' + esc(L.typeLabel(k))
        + (L.day(f) ? ' · 更新 ' + esc(L.day(f)) : '') + '</span></span></a></li>';
    }).join('');

    inner(
      '<h1 class="lib-h1">メディアライブラリ</h1>'
      + '<p class="lib-lede">IDFLのお客様向けにご用意した、セミナー資料・認証ガイド・操作マニュアル・解説コンテンツをまとめています。'
      + 'すべての資料はIDFLのサーバー内に保護保管され、権限のある方だけが閲覧できます。</p>'
      + '<p class="lib-lede" style="margin-bottom:26px">左の一覧から資料を選ぶと、この場所に内容が表示されます。</p>'

      + '<div class="lib-overview__grid">'
      +   '<section class="lib-panel">'
      +     '<h2 class="lib-panel__head">' + icon('all','lib-i-sm') + '資料の種類</h2>'
      +     '<ul class="lib-kinds" id="ovKinds">' + kinds + '</ul>'
      +   '</section>'
      +   '<section class="lib-panel">'
      +     '<h2 class="lib-panel__head">' + icon('clock','lib-i-sm') + '最近更新された資料</h2>'
      +     (recent ? '<ul class="lib-recent">' + recent + '</ul>'
                    : '<div class="lib-panel__body"><p style="margin:0;color:var(--lib-ink-3);font-size:var(--lib-fs-md)">まだ資料がありません。</p></div>')
      +   '</section>'
      + '</div>'

      + '<p class="lib-note">' + icon('shield')
      + '<span>この領域の資料は、ログインされたお客様のみが閲覧できます。ファイルの直接URLは発行されず、'
      + 'アクセスのたびに権限を確認しています。第三者への再配布はご遠慮ください。<br>'
      + 'ご不明な点は担当者までお問い合わせください。</span></p>'
    );

    var box = document.getElementById('ovKinds');
    if (box) box.addEventListener('click', function(e){
      var b = e.target.closest('button[data-type]');
      if (!b || b.disabled) return;
      L.setType(b.dataset.type);
      if (window.matchMedia('(max-width:1024px)').matches) {
        document.getElementById('libRailToggle').click();
      } else {
        var first = document.querySelector('#libList .lib-item');
        if (first) first.focus();
      }
    });
  }

  function skeleton(){
    inner('<div class="lib-sk lib-sk--line" style="width:38%;height:22px;margin-bottom:18px"></div>'
      + '<div class="lib-sk lib-sk--line" style="width:76%"></div>'
      + '<div class="lib-sk lib-sk--line" style="width:64%;margin-bottom:26px"></div>'
      + '<div class="lib-sk" style="height:190px;border-radius:12px"></div>');
  }
  skeleton();

  L.boot({
    next: '/customer/media.html',
    onReady: function(ctx){ overview(ctx.items); },
    onListFail: function(){
      inner('<div class="lib-msg">' + icon('alert')
        + '<h2>資料を読み込めませんでした</h2>'
        + '<p>通信が不安定な可能性があります。しばらくしてからページを再読み込みしてください。</p>'
        + '<button type="button" class="lib-btn lib-btn--secondary" onclick="location.reload()">再読み込み</button></div>');
    }
  });
})();
</script>
</body>
</html>
